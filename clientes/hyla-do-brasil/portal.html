certas (52,9% landing page + 39,7% home) e parecia ser o sinal certo — mas em teste ao vivo, repetido em 2 landing pages com Google Tag Assistant e GA4 DebugView, **nenhum dos 3 eventos disparou no momento do envio bem-sucedido do formulário** (só `form_start` e engajamento genérico são registrados). A hipótese mais provável para `contact` é que esteja amarrado ao clique no botão flutuante de WhatsApp, não ao formulário — não confirmado com o time de dev.","impact":"O Google Ads está otimizando o lance automático (Smart Bidding) sem nenhum sinal confiável de lead real há pelo menos os 6 meses cobertos por este diagnóstico. Isso explica, de forma mais direta que qualquer hipótese anterior, por que dobrar o orçamento de mídia no passado não dobrou o resultado (relatado no kick-off) — o algoritmo nunca teve o dado certo para otimizar. Nenhuma decisão de aumento de investimento em Google Ads deve ser tomada antes de implementar e validar um evento dedicado ao pedido de demonstração."},{"problem":"O budget de busca do Google está concentrado no território errado: 'aspirador de pó' genérico, não 'saúde respiratória' — o oposto do que ee-s2-posicionamento acabou de definir como território de marca.","data_evidence":"No agrupamento de termos de busca reais (Pesquisa tradicional + insights da PMAX), o cluster genérico (aspirador de pó, vassoura elétrica, purificador de ar) concentrou R$4.320 e 1.729 cliques — mais de 10x o cluster de saúde/alergia (asma, rinite, bronquite, ácaros: R$407 e 88 cliques). A campanha PMAX (63% do budget do Google) usa um único grupo de recursos com mais de 60 temas de pesquisa misturando saúde, concorrentes e limpeza genérica, sem nenhuma segmentação.","impact":"A Hyla está pagando para competir no espaço genérico de aspiradores domésticos, onde tem menos diferenciação frente a concorrentes e marketplaces (Amazon, Mercado Livre, Shopee aparecem com parcela de impressão relevante no Auction Insights), em vez do espaço de saúde onde tem o argumento técnico mais forte (separador autolimpante patenteado) e que a própria pesquisa de mercado (ee-s2-pesquisa-mercado) já validou como território maior e menos disputado."},{"problem":"82,5% do investimento em Google Ads vai para dispositivos móveis — o dispositivo onde a experiência do site já é reconhecida internamente como instável.","data_evidence":"R$22.807 de R$27.647 (82,5%) do investimento total em Google Ads foi em celular, contra 16,9% em desktop. O CTR mobile (4,55%) é mais que o dobro do desktop (1,96%) — o anúncio funciona bem em mobile. Mas o site (WordPress + Elementor) já foi classificado no diagnóstico de maturidade como tendo problemas de navegador em mobile, relatados pelo próprio time.","impact":"Tráfego caro e relativamente qualificado (CTR alto) está sendo entregue à pior versão técnica do funil de conversão. Esse é um ponto de intersecção direta com ee-s2-diagnostico-cro — nenhuma melhora de mídia paga compensa perder o lead na própria página de destino."}],"action_plan":[{"rank":1,"action":"Implementar um evento de conversão dedicado ao envio do formulário de demonstração (ex.: `lead_demonstracao`), disparado só nesse formulário — separado de carrinho, recuperação de senha, checkout de acessório e WhatsApp","priority":"P1","expected_impact":"Sem isso, nenhuma métrica de lead do Google (CPL, CPA, volume) é mensurável — pré-requisito para qualquer otimização de mídia no Google Ads","deadline":"Até 15/07"},{"rank":2,"action":"Validar o novo evento ao vivo (Tag Assistant + GA4 DebugView) em pelo menos 2 landing pages antes de configurá-lo como meta de conversão no Google Ads","priority":"P1","expected_impact":"Evita repetir o mesmo erro (evento configurado mas não disparando de fato)","deadline":"Junto com item 1"},{"rank":3,"action":"Confirmar com o time de dev/GTM se `contact` está de fato amarrado ao clique do botão de WhatsApp (hipótese não confirmada) — se sim, mantê-lo como métrica de engajamento, não como meta de lead","priority":"P2","expected_impact":"Evita reaproveitar por engano um evento que não mede o formulário","deadline":"15 dias"},{"rank":4,"action":"Após o novo evento validado, rebaixar as metas 'Compra', 'Adicionar ao carrinho' e 'Contato' de 'Ação principal' para 'Secundária' no Google Ads, deixando só o evento de lead correto como Principal","priority":"P1","expected_impact":"Realinha o Smart Bidding para otimizar por lead real, não por engajamento genérico","deadline":"Logo após item 2"},{"rank":5,"action":"Adicionar lista de palavras-chave negativas nas campanhas de Pesquisa tradicional cobrindo os termos de zero engajamento já identificados (ex.: 'site de eletrodomésticos', 'melhor produto limpar vidro', 'colchão casal', 'maquinas')","priority":"P2","expected_impact":"Recupera parte dos R$3.901 (28% do gasto em Pesquisa tradicional) hoje desperdiçados em termos irrelevantes","deadline":"15 dias"},{"rank":6,"action":"Pausar ou realocar a campanha 'Instagram | Conversão WPP' (CPL R$321) — começando pelos 2 anúncios do adset RS/SC/ES/MS/MG/AL/PE com R$1.268 gastos e zero leads — para o adset Bairros Nobres SP (CPL R$34,63)","priority":"P2","expected_impact":"Reduz CPL blended do Meta e concentra verba no segmento já comprovadamente mais alinhado ao ICP","deadline":"15 dias"},{"rank":7,"action":"Criar um grupo de recursos (ou campanha de Pesquisa dedicada) só para o cluster de saúde/alergia, com criativos focados em asma/rinite/ácaros/bronquite, separado do grupo genérico atual da PMAX","priority":"P2","expected_impact":"Testa se existe demanda de busca real no território de saúde e realinha mídia com o posicionamento definido em ee-s2-posicionamento","deadline":"30 dias"},{"rank":8,"action":"Testar 2-3 variações de criativo com o ângulo 'PRATICIDADE' (melhor CPL do período, R$21) em outras praças além de Bairros Nobres SP, já que o ângulo parece importar mais que a segmentação geográfica dentro do Meta","priority":"P3","expected_impact":"Pode reduzir CPL em praças hoje mais caras (Curitiba, Brasília, Goiânia) replicando o ângulo vencedor","deadline":"30 dias"},{"rank":9,"action":"Rodar um teste de cliente oculto em São Paulo (mesmo formato do teste já feito em Londrina) antes de comprometer o budget na reestruturação de duas frentes — hoje toda a evidência de campo do handoff quebrado (ver ee-s4-diagnostico-comercial) vem de praça sem cobertura ativa","priority":"P1","expected_impact":"Se o handoff funcionar em SP, confirma a tese de concentração geográfica. Se quebrar também, o problema é de processo/CRM, não de geografia — muda a prioridade do investimento","deadline":"Antes da reunião de 17/07, se possível"},{"rank":10,"action":"Estruturar uma campanha de recrutamento de associadas separada da campanha de consumo (público-alvo, criativo e CTA distintos), com alcance nacional priorizando praças com alguma estrutura de suporte já existente — testar o formato 'embaixadora digital' (Bélgica/França) via @hyladobrasilbusiness","priority":"P2","expected_impact":"Ataca o gargalo real (capacidade de atendimento) em vez de continuar comprando lead de consumo que a operação não consegue converter em demonstração agendada","deadline":"30 dias"}],"budget_reallocation_scenarios":{"description":"Os cenários abaixo tratam Google e Meta de forma assimétrica: o Meta tem métrica de lead confiável (objetivo nativo 'Leads') e pode ser projetado com confiança; o Google não pode ser projetado em leads/CPL até o evento de conversão dedicado (ação P1 do plano) ser implementado e validado — por isso os cenários A e B mantêm o budget de Google como 'ações de higiene sem meta numérica de leads', e só o Cenário C (que já pressupõe o evento corrigido) projeta um número combinado, com confiança baixa. CAMADA ADICIONAL (validada com o operador em 16/07): a partir do Cenário B, o budget de consumo (leads de demonstração) deve se concentrar geograficamente em São Paulo — onde já funciona e onde a cobertura de associada é mais densa — em vez de pulverizar entre praças com pouca capacidade de atendimento. O que hoje é gasto em praças de baixa cobertura (ex.: a campanha WPP) é redirecionado para uma campanha de RECRUTAMENTO de associadas, separada da campanha de consumo (público, criativo e CTA diferentes), com alcance nacional — essa frente não compete por budget novo, é uma realocação do que já era desperdício. Pré-requisito antes de comprometer essa reestruturação: validar com um teste de cliente oculto em SP se o handoff que quebrou em Londrina (ver ee-s4-diagnostico-comercial) também quebra numa praça com cobertura densa — se sim, o problema é de processo/CRM, não só de geografia, e a concentração geográfica sozinha não resolve.","scenario_a_conservative":{"name":"Conservador — implementar o evento, sem mexer em budget","total_budget_monthly":12306,"expected_leads_monthly":195,"expected_cpl":40,"google_split":4489,"meta_split":7817,"effort_weeks":1,"confidence":"Alta (para o número, que é só a projeção do Meta — Google segue sem meta numérica)","changes":["Implementar e validar ao vivo o evento de conversão dedicado ao formulário (itens 1-2 do plano de ação)","Adicionar negativas nas campanhas de Pesquisa tradicional (item 5)"],"prerequisites":["Nenhum — pode começar imediatamente"],"risk_assessment":"Baixo — mudanças de higiene e instrumentação, sem realocação estrutural. 'Leads/mês' e 'CPL' desta linha refletem só o Meta; o Google segue sem meta numérica até o evento ser validado."},"scenario_b_realistic":{"name":"Realista — evento validado + realocar dentro do budget atual","total_budget_monthly":12306,"expected_leads_monthly":220,"expected_cpl":34,"google_split":4489,"meta_split":7817,"effort_weeks":4,"confidence":"Média (Meta) / não aplicável ainda (Google)","changes":["Tudo do Cenário A","Concentrar o budget de consumo (leads de demonstração) em São Paulo — Bairros Nobres SP e praças com o ângulo PRATICIDADE — em vez de pulverizar entre praças de baixa cobertura de associada","Cortar a campanha WPP (R$321/lead, zero cobertura de associada consistente) e redirecionar esse valor para uma campanha de RECRUTAMENTO de associadas, separada da campanha de consumo (público-alvo, criativo e CTA distintos: 'vire associada', não 'agende demonstração')","Rebaixar metas de conversão não-lead para Secundária no Google Ads, uma vez o evento certo validado","Criar grupo de recursos dedicado ao cluster de saúde/alergia na PMAX"],"prerequisites":["Evento de conversão do Google implementado e validado ao vivo (item 1-2)","Teste de cliente oculto em São Paulo confirmando que o handoff funciona em praça de cobertura densa (ação P1 do plano, item 9)"],"risk_assessment":"Médio — 'Leads/mês' e 'CPL' desta linha ainda refletem só o Meta (melhorado pela realocação); o volume real do Google só poderá ser somado depois de 2-3 semanas de dados limpos com o evento novo. A concentração geográfica em SP só deve ser levada adiante se o teste de cliente oculto em SP confirmar que o handoff funciona lá — caso contrário, o problema é de processo (CRM/follow-up), e concentrar geografia sozinho não resolve."},"scenario_c_aggressive":{"name":"Agressivo — +30% de budget, Google já mensurável","total_budget_monthly":16000,"expected_leads_monthly":290,"expected_cpl":37,"google_split":5800,"meta_split":10200,"delta_leads":"Estimativa combinada (Google + Meta) — primeira vez que o Google entra na conta, depois do evento validado por pelo menos 1 ciclo","effort_weeks":8,"confidence":"Baixa — depende de dados de Google ainda inexistentes no momento deste diagnóstico","changes":["Tudo do Cenário B","Aumento de 30% no budget combinado, concentrado nos segmentos já validados (Bairros Nobres SP, cluster de saúde se validado, e o que o Google mostrar como eficiente depois do evento corrigido)"],"prerequisites":["Cenário B validado por pelo menos 1 ciclo completo (4 semanas) com o evento de conversão do Google já funcionando"],"risk_assessment":"Alto — mais leads sem resolver a capacidade de demonstração (35-50 associados ativos, SWOT Fr3) tende a inflar a fila de leads não atendidos a tempo, piorando a taxa real de conversão de lead para demonstração e potencialmente o CAC final, mesmo com CPL de mídia baixo. Soma-se o risco de que o volume real do Google, uma vez mensurável, seja muito diferente do estimado aqui."},"recommendation":"Recomendo o Cenário A imediatamente (implementar e validar o evento — é pré-requisito, não escolha) e o Cenário B assim que o evento estiver validado, antes de cogitar qualquer aumento de investimento. Escalar (Cenário C) antes de resolver o gargalo de capacidade de demonstração dos associados — já apontado como alavanca prioritária na SWOT e agora confirmado com prova de campo no diagnóstico comercial (ee-s4-diagnostico-comercial) — arrisca gerar leads que a operação não consegue atender a tempo, e pior: hoje seria decidido sem saber quantos leads o Google realmente gera. Dentro do Cenário B, a reestruturação em duas frentes (consumo concentrado em SP + recrutamento nacional separado) é a mudança de maior potencial deste diagnóstico — não pede budget novo, só realoca o que já estava identificado como desperdício (WPP). Único porém: validar primeiro, com um cliente oculto em SP, se o handoff que quebrou em Londrina é específico de praça sem cobertura ou é um problema de processo que se repete mesmo onde há associada disponível — a resposta muda a prioridade entre 'concentrar geografia' e 'consertar o CRM/follow-up' primeiro."},"realistic_goal_90d":{"target_cpl":34,"target_leads_month":220,"target_agendamentos_month":32,"premissas":["Meta é a única plataforma com meta numérica de leads/CPL neste diagnóstico — baseline usa a média mensal pré-anomalia (fev-mai/2026, ~85-130 leads/mês) com melhora esperada pela realocação da campanha WPP, e NÃO usa os números de jun/jul, ainda sob suspeita de mudança de tracking no site","Google não tem meta numérica de leads/CPL até o evento de conversão dedicado ao formulário ser implementado e validado ao vivo — pré-requisito P1 do plano de ação, não uma opção","Agendamentos seguem limitados pela capacidade de demonstração (35-50 associados ativos, SWOT Fr3), independente do volume de leads — meta conservadora mesmo com mídia funcionando melhor"]},"key_insight":{"headline":"O caminho de maior alavancagem agora não é aumentar budget — é implementar um evento de conversão que realmente meça o pedido de demonstração.","context":"Depois de testar ao vivo os 3 candidatos possíveis (form_submit, ads_conversion, contact) em duas landing pages com duas ferramentas diferentes, nenhum captura o envio do formulário. Isso significa que todo o Google Ads — 37% do investimento total em mídia da Hyla — está sendo otimizado sem nenhum dado de lead real há pelo menos 6 meses. Nenhuma decisão de budget para o Google (aumentar, realocar entre campanhas, ou mesmo confiar no CPL relatado) é segura até esse evento existir e ser validado.","numbered_reasons":["Sem um evento dedicado, o Smart Bidding do Google nunca teve o dado certo para otimizar — isso explica, de forma mais direta que qualquer hipótese anterior, por que dobrar o orçamento no passado não dobrou o resultado","O Meta já mostra o caminho: com métrica de lead confiável (objetivo nativo 'Leads'), dá para identificar e agir hoje mesmo — cortar a campanha WPP (R$321/lead) e realocar para Bairros Nobres SP (R$34,63/lead) é uma decisão de baixo risco, possível imediatamente","O cluster de saúde/alergia (território definido em ee-s2-posicionamento) recebeu mais de 10x menos investimento de busca que o cluster genérico — vale testar isso em paralelo à correção do evento, já que não depende dela"],"discussion_anchor":"Vale alinhar com Davi/Fábio que, até o evento de conversão do Google ser corrigido e validado, qualquer leitura de CPL ou volume de leads do Google neste ou em relatórios anteriores deve ser tratada como não confiável — inclusive o CAC de ~R$900/venda estimado no kick-off, que provavelmente usava esses mesmos números."},"honesty_alert":"Este diagnóstico usa exports manuais de CSV (Google Ads e Meta Ads) e acesso direto ao GA4, não o conector V4MOS (ainda bloqueado por erro 403, já escalado). O achado central mudou ao longo da investigação e a versão final é esta: nenhum dos 3 eventos GA4 candidatos a sinal de lead do Google (`form_submit`, `ads_conversion`, `contact`) dispara no envio do formulário de demonstração, confirmado em teste ao vivo repetido em 2 landing pages com Google Tag Assistant e GA4 DebugView. Por isso, todo número de leads, CPL ou CPA do Google Ads reportado neste relatório (e em diagnósticos anteriores, como o CAC de ~R$900/venda estimado no kick-off) deve ser tratado como não confiável até um evento dedicado ser implementado e validado. Pontos que seguem em aberto: (1) a hipótese de que `contact` está amarrado ao clique do botão de WhatsApp (não ao formulário) não foi confirmada com o time de dev/GTM; (2) o crescimento acelerado do evento `contact` a partir de meados de junho (visível no gráfico de tendência do GA4) coincide com o salto de leads do Meta em 17/06 e com a alta de CPM do Meta no mesmo período — pode ser o mesmo evento causador (ex.: uma mudança de GTM/tag no site), ainda não identificado; (3) o salto de conversões do Google em maio (342 via form_submit, ~5x a média dos meses vizinhos) perde relevância como métrica agora que sabemos que form_submit não mede lead real, mas o padrão temporal permanece sem explicação; (4) a PMAX concentra 63% do budget do Google mas os insights de categoria de pesquisa cobrem só ~10% do volume real de cliques da campanha — a real distribuição entre território de saúde e genérico pode ser diferente da amostra visível.","alimenta_skills":["ee-s2-diagnostico-cro","ee-s3-forecast-midia","ee-s2-diagnostico-organico-ig","ee-s4-diagnostico-comercial","ee-revisao-semanal"]},"ee-s2-diagnostico-organico-ig":{"client_name":"Hyla do Brasil","skill":"ee-s2-diagnostico-organico-ig","generated_at":"2026-07-08","data_source":"Apresentação de design de Natália Terciotti (S3, 08/07/2026) + complemento de social media de Geovanna Mohr (mesma reunião) + transcrição ao vivo + client.json (pesquisas ad-hoc de concorrentes já realizadas: ad-hoc-pesquisa-concorrente-rainbow, ad-hoc-pesquisa-concorrente-vivenso). Sem acesso à Instagram Graph API (business_discovery) nesta rodada — métricas quantitativas (seguidores exatos, posts/90d, engajamento por post, distribuição de formato) marcadas como indisponíveis onde não há dado real.","summary":"O Instagram oficial da Hyla (@hyladobrasiloficial) já tem os dois ativos mais difíceis de construir — fotografia de boa qualidade com luz natural e um hábito consistente de responder comentários (bom para o algoritmo do Meta) — mas carece de um sistema de identidade visual que amarre tudo: sem o logotipo, é difícil identificar rapidamente que um post é da Hyla. Destaques desatualizados, excesso de influenciadores nos stories, e identidade que desaparece em datas comemorativas são os pontos de ajuste mais rápidos. Rainbow (~19 mil seguidores) e Vivenso (~25 mil) estão abaixo da Hyla (~47-49 mil) em audiência, mas nenhum dos três executa ainda a linguagem 'quiet luxury' que a Hyla Internacional acabou de validar — janela de diferenciação aberta.","summary_headline":"Hyla já lidera em audiência e tem ativos fortes (fotografia, resposta a comentários) — falta o sistema visual que transforma isso em identidade reconhecível.","summary_highlights":[{"category":"posicao","label":"Seguidores @hyladobrasiloficial","value":"~47-49 mil","subtext":"Maior audiência entre os 3 concorrentes diretos analisados","tone":"green"},{"category":"competicao","label":"Rainbow (@gruporainbowbrasil)","value":"~19 mil","subtext":"Menor audiência apesar de 30 anos de mercado — presença fragmentada em vários perfis regionais","tone":"blue"},{"category":"competicao","label":"Vivenso","value":"~25 mil","subtext":"Entre Rainbow e Hyla","tone":"blue"},{"category":"risco","label":"Reconhecimento sem logo","value":"Baixo","subtext":"Sem o logotipo, difícil identificar que um post é da Hyla — falta sistema visual unificador","tone":"red"},{"category":"maturidade","label":"Dados quantitativos de engajamento","value":"Indisponível","subtext":"Requer Instagram Graph API ou export de Insights — não coletado nesta rodada","tone":"gray"}],"summary_key_findings":[{"category":"vantagem","text":"A Hyla já tem a maior audiência entre os concorrentes diretos analisados (~47-49 mil vs ~19-25 mil), fotografias avaliadas como diferencial (luz natural, ambientes reais) e um hábito consistente de responder comentários — sinal positivo para a distribuição orgânica no algoritmo do Meta."},{"category":"ameaca","text":"Sem um sistema visual (tipografia, paleta, composição) que una as peças, o reconhecimento da marca depende quase inteiramente do logotipo — o oposto do objetivo da nova identidade internacional."},{"category":"contexto","text":"O Instagram está migrando para uma experiência 'vídeo-primeiro' (já em teste beta em algumas contas, abrindo direto nos Reels) — reforça a recomendação de priorizar vídeo sobre posts estáticos, mantendo estáticos para conteúdo institucional/educativo com frequência maior para não se perderem no feed."},{"category":"acao","text":"Ajustes rápidos e de baixo esforço: atualizar destaques desatualizados, reduzir para no máximo 2 vídeos por influenciador nos destaques (hoje excesso de conteúdo torna a navegação cansativa), e usar capas de vídeo como ferramenta de identidade visual, já que aplicar a identidade dentro do próprio vídeo é mais difícil."}],"client_account":{"username":"hyladobrasiloficial","followers_count":48000,"followers_count_estimated":true,"posts_90d":null,"unavailable_reason":"Contagem exata de seguidores, posts no período e métricas de engajamento por post requerem Instagram Graph API (business_discovery) ou export manual do Instagram Insights — não coletado nesta rodada. Seguidores usam a faixa já estabelecida no briefing (47-49 mil), não reverificada nesta sessão."},"competitor_accounts":[{"name":"Grupo Rainbow","username_note":"Maior conta identificada na pesquisa ad-hoc: @gruporainbowbrasil (handle não reverificado nesta sessão)","followers_count":19000,"followers_count_estimated":true,"posts_90d":null,"source_note":"Número de ad-hoc-pesquisa-concorrente-rainbow (client.json history) — presença fragmentada em 5+ contas regionais, esta é a maior."},{"name":"Vivenso (Pro-Aqua)","username_note":"Handle exato não confirmado nesta sessão","followers_count":25000,"followers_count_estimated":true,"posts_90d":null,"source_note":"Número de ad-hoc-pesquisa-concorrente-vivenso (client.json history)."}],"format_distribution":{"by_account":[],"unavailable_reason":"Distribuição por formato (estático/carrossel/Reels/vídeo) requer acesso à API do Instagram — não coletado nesta rodada.","insight":"Qualitativamente, o time já confirmou que estáticos performam mal hoje ('a pessoa acaba passando ali, nem curtiu') e que a demanda é predominantemente por vídeo — inclusive pela facilidade de reaproveitar conteúdo gerado por associados."},"cadence":{"by_account":[],"unavailable_reason":"Cadência de publicação (posts/semana, dia e horário preferidos) requer acesso à API do Instagram — não coletado nesta rodada.","insight":"Postagens diárias já confirmadas como prática atual do time (Geovanna: 'muito bom isso para manter o engajamento de forma padrão')."},"engagement_benchmark":{"by_account":[],"unavailable_reason":"Likes médios, comentários médios e taxa de engajamento requerem acesso à API do Instagram — não coletado nesta rodada."},"client_winning_patterns":[{"pattern":"Fotografia com luz natural e ambientes reais","seen_in_count":null,"recommendation":"Manter e ampliar — avaliado como diferencial frente a Rainbow (que usa muita imagem gerada por IA com aspecto artificial) e Vivenso."},{"pattern":"Resposta consistente a comentários","seen_in_count":null,"recommendation":"Manter — sinal positivo para o algoritmo do Meta (Instagram e Facebook), que entende isso como perfil engajado com a audiência."},{"pattern":"Bio clara e bem estruturada, já diferenciando conta oficial de perfis de associados","seen_in_count":null,"recommendation":"Manter — Geovanna destacou como ponto raramente elogiado em diagnósticos ('normalmente é o ponto que eu mais trago críticas')."},{"pattern":"Volume alto de vídeos gerados por associados (demonstrações reais)","seen_in_count":null,"recommendation":"Ativo competitivo único — nenhum concorrente tem uma rede de associados gerando esse volume de conteúdo autêntico. Ampliar incentivo para associados postarem, já que gera resultado comercial direto relatado (leads chegando diretamente para a associada que postou)."}],"competitor_patterns_missing":[{"pattern":"Linguagem visual 'quiet luxury' consistente (espaço negativo, fotografia editorial, uma mensagem por peça)","seen_in_count":null,"seen_in_competitors":[],"why_works":"Nenhum concorrente direto (Rainbow, Vivenso) executa essa linguagem hoje — ambos ainda comunicam por excesso de informação e repetição de cor/produto, não por sistema visual. A referência real está na Hyla Internacional, não nos concorrentes locais.","how_to_apply":"Adotar o conceito antes mesmo do manual oficial chegar (13/08): menos elementos gráficos, mais espaço negativo, uma ideia central por post — ver ee-s3-identidade-visual."}],"next_actions":[{"priority":1,"action":"Atualizar destaques do perfil (muitos são muito antigos) e reduzir para no máximo 2 vídeos por influenciador nos destaques de recomendação","impact":"alto","effort":"baixo"},{"priority":2,"action":"Selecionar influenciadores mais atuais/relevantes — os hoje presentes nos destaques têm baixa relevância atual nas redes","impact":"medio","effort":"medio"},{"priority":3,"action":"Priorizar Reels/vídeo sobre posts estáticos, acompanhando a mudança do Instagram para experiência 'vídeo-primeiro' (já em teste beta)","impact":"alto","effort":"medio"},{"priority":4,"action":"Manter posts estáticos institucionais e educativos (quebram objeções), mas aumentar a frequência para não se perderem entre os vídeos","impact":"medio","effort":"baixo"},{"priority":5,"action":"Aplicar identidade visual via capa dos vídeos (já que aplicar dentro do vídeo em si é mais difícil — depende do ambiente/cenário de cada demonstração)","impact":"medio","effort":"baixo"},{"priority":6,"action":"Manter identidade visual presente mesmo em posts de datas comemorativas — hoje a identidade desaparece completamente nesses posts","impact":"medio","effort":"baixo"},{"priority":7,"action":"Cuidado com conteúdo viral genérico (trends) que atrai lead curioso fora do ICP (ex.: público jovem/recém-casado financiando apartamento) em vez da persona real da Hyla","impact":"medio","effort":"baixo"}],"honesty_alert":"Este diagnóstico é qualitativo, baseado na análise da designer (Natália) e da gestora de social media (Geovanna) apresentada ao cliente em 08/07/2026 — não em dados quantitativos extraídos via API do Instagram. Seguidores da Hyla e dos 2 concorrentes usam números já estabelecidos em pesquisas anteriores deste projeto (marcados estimated:true), não reverificados nesta sessão. Métricas de engajamento, distribuição de formato, cadência de publicação e posts individuais (top/bottom por engajamento) não estão disponíveis — para completar esse diagnóstico com dados quantitativos reais, seria necessário acesso à Instagram Graph API (business_discovery) ou um export manual do Instagram Insights, similar ao que o operador já forneceu para o diagnóstico de mídia paga (Google Ads/Meta Ads) e para o GA4.","alimenta_skills":["ee-s3-identidade-visual","ee-s3-brandbook","ee-s3-criativos-anuncios","ee-revisao-semanal"]},"ee-s2-pesquisa-mercado":{"client_name":"Hyla do Brasil","skill":"ee-s2-pesquisa-mercado","generated_at":"2026-06-22","versao":3,"data_source":"v3 (26/06): PLANO_DE_NEGOCIOS_HYLA_2026.md (seção 4, framing de mercado do próprio cliente, verificado com fontes externas) + ABEVD 2024/2025, ABEP Critério Brasil 2024, IBGE população 2024, ASBAI, Global Wellness Institute, ABIPLA/Euromonitor + briefing + ee-s1-persona-icp + ee-s1-swot","nota_metodologica_v3":"A pedido do operador, esta versão caminha pelo mesmo framing de mercado já usado no material interno da Hyla (3 segmentos: Wellness, Alergias/Saúde Respiratória, Higiene/Limpeza) — mas verifica cada número com fonte externa e acrescenta a segmentação por classe de renda (já construída na v1/v2) como camada complementar de triangulação. Os 3 segmentos do plano interno são contexto de mercado adjacente (números enormes, mas não são o TAM direto da Hyla — incluem categorias como cosméticos, detergentes, etc. que a Hyla não vende). O TAM real continua sendo a base populacional (classe A/B × prevalência de alergia), agora cruzada com gasto per capita desses 3 mercados para checar se o ticket da Hyla é plausível dentro do que essa população já gasta.","summary":"A Hyla vende dentro de um canal grande e maduro (venda direta no Brasil: R$50 bilhões/ano, 7º maior do mundo) e toca três mercados adjacentes gigantes (wellness, saúde respiratória, limpeza doméstica) — mas seu mercado endereçável real, pessoas de classe A/B com motivação de saúde/alergia, é uma fração específica disso: 15-21 milhões de pessoas no Brasil. Como a rede de associados já cobre o Brasil todo (não só SP), o SAM é, na prática, igual ao TAM nacional — e mesmo assim a penetração atual é microscópica: a Hyla pode crescer significativamente sem precisar abrir mercado novo, só atendendo melhor a demanda que já existe onde já tem presença.","summary_headline":"A Hyla vende para menos de 0,01% do próprio mercado endereçável nacional — o gargalo não é geografia, é capacidade de atender a demanda que já existe.","summary_highlights":[{"category":"oportunidade","label":"Wellness Brasil","value":"US$96 bi/ano","subtext":"5% do PIB · #1 da América Latina, 12º do mundo (Global Wellness Institute)","tone":"green"},{"category":"oportunidade","label":"Limpeza doméstica BR","value":"R$38,1 bi/ano","subtext":"4º maior mercado mundial (ABIPLA/Euromonitor 2024)","tone":"green"},{"category":"oportunidade","label":"TAM/SAM — pessoas-alvo","value":"15-21 milhões","subtext":"Classe A/B com alergia respiratória — alcance nacional, convergente com estimativa do cliente","tone":"green"},{"category":"posicao","label":"SOM atual","value":"~R$11,9 milhões/ano","subtext":"70-80 máquinas/mês × ticket médio (estimado)","tone":"blue"},{"category":"janela","label":"Penetração no SAM","value":"~0,005%/ano","subtext":"Espaço de crescimento real sem expansão geográfica","tone":"green"},{"category":"risco","label":"Dado não verificado","value":"Campinas +87,8%","subtext":"Estatística do plano interno não localizada em nenhuma fonte pública — não usar até confirmar","tone":"red"}],"summary_key_findings":[{"category":"vantagem","text":"O mercado de venda direta no Brasil está em transformação digital ativa (ABEVD: 'mais digital, mais jovem, mais feminina') — favorece exatamente quem investir em recrutamento e funil digital de associadas, como a SWOT já recomendou."},{"category":"contexto","text":"A estimativa do próprio cliente (21 milhões de pessoas, 10% da população) está na mesma ordem de grandeza de uma estimativa construída com dados públicos (15,75 milhões: classe A+B × prevalência de alergia respiratória) — o tamanho de mercado percebido pela Hyla é realista, não inflado."},{"category":"vantagem","text":"Os 3 segmentos de mercado citados no Plano de Negócios da Hyla (Wellness, Alergias, Limpeza) são majoritariamente verificáveis com fonte externa: Brasil é de fato #1 da América Latina em wellness (US$96 bi/ano, Global Wellness Institute) e 4º maior mercado mundial de limpeza doméstica (ABIPLA). O material de recrutamento da empresa não está inflando a realidade nesses dois pontos."},{"category":"ameaca","text":"Um dado específico do Plano de Negócios não pôde ser verificado: 'em Campinas, os atendimentos [por alergia] cresceram 87,8% no início de 2025'. Busca extensiva só encontrou dados de Campinas sobre doenças respiratórias EM GERAL em 2026 (+60,6% sintomas respiratórios, +250% SRAG) — números de outra natureza e outro período. Recomendado não usar essa estatística específica em material voltado ao mercado até confirmar a fonte original com o cliente."},{"category":"oportunidade","text":"Triangulação nova: o gasto médio per capita em wellness no Brasil (~R$2.480/ano) é compatível com o ticket parcelado da Hyla (~R$4.000-4.800/ano em 36x) — não é um gasto fora da curva para quem já investe em bem-estar. Já o gasto per capita em limpeza doméstica (~R$179/ano) é 67-81x menor que o ticket da Hyla — confirma numericamente que a Hyla não compete na categoria 'limpeza', e sim em uma categoria de bem-estar/saúde de ticket muito mais alto (reforça o território definido em ee-s2-posicionamento)."},{"category":"oportunidade","text":"Como a rede de associados já cobre o Brasil todo, o SAM não deve ser restrito a São Paulo — é, na prática, o mesmo TAM nacional. Isso torna a penetração atual ainda mais baixa (~0,005% ao ano): o espaço de crescimento sem precisar abrir mercado novo é maior do que a primeira versão desta pesquisa estimava."},{"category":"ameaca","text":"A Rainbow, concorrente histórico, tem ao menos 6 domínios diferentes se apresentando como 'oficial' — sinal de rede de distribuidores fragmentada digitalmente. É uma vulnerabilidade explorável: a Hyla, mesmo com um site tecnicamente fraco, tem mais coerência de marca online do que a líder histórica do segmento."},{"category":"contexto","text":"O concorrente citado pelo cliente como 'Vivenzo' é, no registro público, 'Vivenso Smartcleaner' (fabricante Pro-Aqua), com preço real de R$6.500-9.990 — mais barato do que os ~R$12.000 estimados inicialmente."}],"contexto_macroeconomico":{"wellness_brasil":{"label":"Segmento 1 do Plano de Negócios da Hyla: Saúde Preventiva & Bem-Estar","mercado_brasil_usd":"US$96 bilhões/ano","percentual_pib_brasil":"5%","ranking_brasil":"#1 da América Latina e Caribe (entre 46 países medidos pelo GWI), 12º maior mercado de wellness do mundo","mercado_global_usd_atual":"US$6,8 trilhões (2024), com projeção de US$7,3 trilhões em 2025 e US$9,8 trilhões até 2029 (+7,6%/ano)","correcao_vs_plano_interno":"O Plano de Negócios da Hyla cita US$6,3 trilhões para a economia global de wellness — esse número já foi superado; a cifra mais recente confirmada é US$6,8 trilhões (2024). Vale atualizar essa referência em qualquer material novo.","fonte":"Global Wellness Institute"},"alergia_respiratoria_global_e_brasil":{"label":"Segmento 2 do Plano de Negócios da Hyla: Alergias & Doenças Respiratórias","atual_global_pct":"~30% da população mundial já tem algum tipo de alergia (~1 bilhão de pessoas)","projecao_oms_2050":"OMS prevê que a metade da população mundial (~4 bilhões de pessoas) terá algum tipo de alergia até 2050, por conta das mudanças climáticas — confirmado em múltiplas fontes de saúde","brasil_asma":"Mais de 20 milhões de asmáticos (Ministério da Saúde)","brasil_rinite":"Mais de 1/3 da população com rinite","brasil_alergia_respiratoria_geral":"~30% dos brasileiros (ASBAI) — mesma proporção da média global","alerta_dado_nao_verificado":"O Plano de Negócios da Hyla cita que 'em Campinas (SP), os atendimentos cresceram 87,8% no início de 2025' — NÃO localizei essa estatística específica em nenhuma fonte pública após busca extensiva. Encontrei dados de Campinas sobre doenças respiratórias em geral (não especificamente alergia) referentes a 2026: +60,6% em atendimentos por sintomas respiratórios na Atenção Básica em 6 semanas, +250% em casos de SRAG entre jan-mai. São números de natureza diferente (provável surto viral sazonal) e de outro período. RECOMENDAÇÃO: não usar o '87,8%' em nenhum material voltado ao mercado até o cliente confirmar a fonte original.","fonte":"OMS (via veículos de saúde brasileiros) + Ministério da Saúde + ASBAI"},"limpeza_domestica_brasil":{"label":"Segmento 3 do Plano de Negócios da Hyla: Higiene & Limpeza Doméstica","faturamento_2024_confirmado":"R$38,1 bilhões (+2,1% vs 2023) — Euromonitor International, via ABRE","faturamento_alternativo_abipla":"ABIPLA reporta 'mais de R$35 bilhões/ano' (metodologia/escopo diferente)","projecao_2029":"R$50,1 bilhões (+31,3% sobre 2024)","ranking_mundial":"4º maior mercado de produtos de limpeza do mundo","nota_vs_plano_interno":"O Plano de Negócios da Hyla cita R$39,6 bilhões para 2025 — não encontrei essa cifra exata publicada, mas está dentro da faixa plausível entre o valor confirmado de 2024 (R$38,1bi) e a tendência de crescimento do setor. Tratar como plausível, não como confirmado.","fonte":"ABIPLA Anuário 2025, Euromonitor/ABRE"},"venda_direta_brasil":{"faturamento_2024":"R$50 bilhões","crescimento_2024":"+6,3%","revendedores_ativos":"3,1 milhões","posicao_mundial":"7º maior mercado de venda direta do mundo, maior da América Latina","tendencia":"Setor descrito pela própria ABEVD como 'mais digital, mais jovem e cada vez mais feminino'","nota":"Mercado dominado por cosméticos/bem-estar/nutricionais (Avon, Natura, Herbalife, etc.) — não é o TAM específico da Hyla, mas contextualiza o canal de vendas: grande, maduro, em transformação digital ativa.","fonte":"ABEVD 2024/2025"},"classes_economicas_brasil":{"label":"Camada complementar (não está no Plano de Negócios da Hyla) — segmentação por renda, construída nas versões anteriores desta pesquisa","populacao_brasil_2024":212600000,"classe_a_pct":2.9,"classe_b_pct":21.8,"classe_a_mais_b_pct":24.7,"classe_a_mais_b_pessoas":"~52,5 milhões","fonte":"ABEP Critério Brasil 2024 + IBGE população 2024"}},"tam_sam_som":{"metodologia":"v3: combina o framing de mercado do próprio Plano de Negócios da Hyla (3 segmentos macro: Wellness, Alergias, Limpeza — ver contexto_macroeconomico) com a base bottom-up por população endereçável (classe A/B com motivação de saúde/alergia, já usada nas versões anteriores). Os 3 segmentos macro são mercados adjacentes (cosméticos, detergentes, etc. que a Hyla não vende) — não são o TAM direto, mas servem para triangular se o ticket da Hyla é plausível dentro do que a população-alvo já gasta nessas categorias (ver triangulacao_gasto abaixo). Mercado de durável de alto ticket vendido por demonstração — não há dado público de mercado específico para 'aspirador antialérgico premium' no Brasil, por isso a base direta continua sendo populacional, não um TAM em R$/ano direto.","tam":{"label":"TAM — pessoas em classe A/B no Brasil com alguma alergia respiratória (perfil de motivação de compra)","populacao_estimada":"15,75 a 21 milhões de pessoas","calculo":"Classe A (2,9%) + Classe B (21,8%) = 24,7% dos 212,6 milhões de habitantes do Brasil = ~52,5 milhões de pessoas [ABEP 2024 + IBGE 2024]. Aplicando ~30% de prevalência de alergia respiratória [ASBAI] = ~15,75 milhões. A própria Hyla estima 21 milhões (10% da população, citado no kick-off) — as duas estimativas convergem na mesma ordem de grandeza, o que valida a percepção do cliente.","estimated":true,"fontes":["ABEP Critério Brasil 2024","IBGE população 2024","ASBAI"]},"sam":{"label":"SAM — mesmo perfil nacional do TAM, já que a rede de associados da Hyla cobre o Brasil todo (não está restrita a São Paulo)","populacao_estimada":"15,75 a 21 milhões de pessoas (mesma faixa do TAM)","calculo":"Corrigido em 26/06 a partir de feedback do operador: a versão anterior recortava o SAM para a Grande São Paulo (3,2-4,5M), usando a concentração atual de vendas (70% em SP) como proxy de alcance do modelo de negócio. Isso confundia execução com capacidade de alcance — a Hyla tem associados cadastrados em todo o território nacional (incluindo equipe nova começando em Brasília, citada no kick-off), então o modelo de venda direta por demonstração não tem uma barreira estrutural que justifique restringir o SAM a uma região. SAM ≈ TAM.","nota":"A concentração de 70% das vendas em SP reflete densidade de associados ATIVOS hoje (problema de execução — Fr3 na SWOT, capacidade de demonstração), não limite de alcance do modelo. Tratar como questão de SOM/execução, não de SAM/endereçabilidade.","estimated":true},"som_atual":{"vendas_mes":"70-80 máquinas","ticket_medio_usado":13250,"faturamento_mensal_estimado":993750,"faturamento_anual_estimado":11925000,"penetracao_no_sam_anual_pct":"~0,005%","nota":"Faturamento estimado a partir do briefing (volume de vendas relatado pelos sócios) — não é dado financeiro confirmado pela empresa. Penetração recalculada com SAM nacional (15,75-21M) em vez do SAM restrito a SP usado na versão anterior — fica ainda mais baixa, reforçando que o limite é operacional, não geográfico.","estimated":true},"som_meta":{"vendas_mes":"100-150 máquinas (meta já definida pelo próprio cliente)","faturamento_mensal_estimado":"R$1,325 a R$1,99 milhão","faturamento_anual_estimado":"R$15,9 a R$23,9 milhões","penetracao_no_sam_anual_pct":"~0,01%","alerta":"Mesmo na meta mais otimista (150/mês) e usando o SAM nacional (maior denominador), a penetração continua abaixo de 0,01% ao ano — o limite não é o tamanho do mercado nem a geografia, é a capacidade de demonstração (ver ee-s1-swot, Fr3).","estimated":true},"triangulacao_gasto_wellness":{"label":"Nova camada v3 — o ticket da Hyla é plausível dentro do gasto em wellness que a população-alvo já tem?","gasto_per_capita_wellness_brasil_ano":"US$96 bilhões ÷ 212,6 milhões de habitantes ≈ US$451/pessoa/ano (≈ R$2.480/ano, câmbio de referência R$5,50)","ticket_hyla_parcelado_ano":"R$12.000-14.500 financiado em até 36x ≈ R$333-403/mês ≈ R$4.000-4.800/ano","conclusao":"O ticket parcelado da Hyla equivale a ~1,6-1,9x o gasto médio per capita em wellness no Brasil — é um produto premium dentro da categoria, não um gasto absurdamente fora da curva para quem já reserva orçamento para bem-estar. Reforça que o financiamento/parcelamento (já oferecido) é a peça-chave de comunicação, não o preço cheio.","estimated":true},"triangulacao_gasto_limpeza":{"label":"Nova camada v3 — comparação com o gasto médio em limpeza doméstica convencional","gasto_per_capita_limpeza_brasil_ano":"R$38,1 bilhões ÷ 212,6 milhões de habitantes ≈ R$179/pessoa/ano","ticket_hyla":"R$12.000-14.500","conclusao":"O ticket da Hyla é ~67-81x o gasto médio anual per capita em produtos de limpeza convencionais. Confirma numericamente, não só por intuição, que a Hyla não compete na categoria 'limpeza doméstica' — compete em uma categoria de bem-estar/saúde de ticket muito mais alto. Reforça diretamente o território de marca já definido em ee-s2-posicionamento ('saúde respiratória', não 'limpeza').","estimated":true}},"analise_concorrentes":[{"nome":"Rainbow (Grupo Rainbow / Rainbow Brasil / Rainbow Oficial)","posicionamento":"Concorrente histórico, ~30 anos no Brasil, ticket ~R$21.000 (acima da Hyla)","presenca_digital":"Fragmentada — 6+ domínios diferentes se autodeclarando 'oficial' e 5 contas de Instagram regionais distintas (maior delas, @gruporainbowbrasil, com 19 mil seguidores — menos que a conta única da Hyla, 47-49K), refletindo uma rede de distribuidores sem unidade de marca online","diferencial_hyla":"Vendedores Rainbow descritos pela própria Hyla como 'agressivos' e que falam mal da concorrência — confirmado externamente por padrão consistente de reclamação sobre venda agressiva, ligações insistentes e manutenção cara (Reclame Aqui, Fórum da Casa, Portal da Queixa Portugal). A fragmentação digital da Rainbow é uma vulnerabilidade — a Hyla, mesmo com site tecnicamente fraco, tem mais consistência de marca única online e maior audiência. Análise completa em outputs/concorrente-rainbow-analise.md","ameaca":"alta (comportamento de venda e prestígio histórico, não preço ou digital)"},{"nome":"Vivenso Smartcleaner (fabricante Pro-Aqua)","nota_correcao":"Citado pelo cliente como 'Vivenzo' — nome correto verificado em registro público é 'Vivenso'. Preço também corrigido: confirmado externamente em R$6.500-9.990 (Magazine Stroebel + site institucional), não os ~R$12.000 estimados no kick-off.","posicionamento":"Aspirador a água/extratora/purificador, tecnologia alemã, montagem em Curitiba. Ticket real R$6.500-9.990 — 30-45% mais barato que a Hyla (R$12.000-14.500), gap maior do que a estimativa interna sugeria. Opera como 'franquia de baixo investimento', não associado independente.","presenca_digital":"Instagram com 25 mil seguidores (@vivensobrasiloficial) — entre a Hyla (47-49K) e a Rainbow (19K na maior conta). Múltiplos sites de revenda/distribuição (pro-aqua.com.br, lojas parceiras) — presença pulverizada, embora menos caótica do que a Rainbow","diferencial_hyla":"Qualidade percebida inferior segundo a Hyla, preço genuinamente mais baixo, e reputação pública mais limpa que a Rainbow (sem padrão de reclamação de venda agressiva) — concorre por valor percebido, não por prestígio ou comportamento de venda. Análise completa em outputs/concorrente-vivenso-analise.md","ameaca":"media-alta"},{"nome":"Hyla Plus","posicionamento":"Fundada pelo ex-sócio (cunhado de Davi/Fábio) após cisão societária em 2025/2026 — importa a mesma máquina","presenca_digital":"Ainda descrita como 'trabalho tímido' pela própria Hyla do Brasil, mas com tendência de crescimento ao longo do tempo","diferencial_hyla":"Mesmo produto — a diferenciação tem que vir de marca, atendimento e rede de associados, não de tecnologia (que é idêntica)","ameaca":"alta (crescente)"},{"nome":"Concorrentes indiretos (Kirby, Hoover, marcas chinesas, Electrolux/Arno)","posicionamento":"Kirby usa sistema de venda similar (porta a porta); marcas chinesas investem pesado em marketing de influenciador (ex: parceria com Cristiano Ronaldo); Electrolux/Arno não competem diretamente mas aparecem em buscas pelo nome 'Hyla' usado por terceiros para SEO","ameaca":"media-baixa — públicos parcialmente diferentes, mas competem por atenção e por palavras-chave de busca"}],"tendencias_setor":[{"tendencia":"Transformação digital do canal de venda direta no Brasil","impacto_hyla":"ABEVD descreve o setor como 'mais digital, mais jovem e cada vez mais feminino' — alinhado diretamente com a oportunidade já identificada na SWOT de estruturar o recrutamento de associadas como funil digital, não só employer branding esporádico","prazo":"Em andamento"},{"tendencia":"Buscas comparativas de produto via IA generativa (ChatGPT/Gemini)","impacto_hyla":"Usuários já pesquisam 'qual aspirador é melhor, Rainbow ou Hyla' antes de decidir — quem ocupar esse espaço de conteúdo/SEO primeiro garante vantagem duradoura. Já identificado como fraqueza (Fr5) na SWOT.","prazo":"Curto prazo — janela de 1-2 anos antes de virar prática padrão"},{"tendencia":"Crescimento da preocupação com qualidade do ar interno e saúde respiratória","impacto_hyla":"Mais de 20 milhões de asmáticos e ~30% dos brasileiros com alguma alergia respiratória sustentam a demanda de longo prazo pelo eixo de saúde — o pilar mais forte e mais diferenciado da comunicação da Hyla (F7 na SWOT)","prazo":"Estrutural, longo prazo"},{"tendencia":"Fragmentação digital dos concorrentes diretos (Rainbow)","impacto_hyla":"Janela de oportunidade para a Hyla se posicionar como a marca com presença online mais coerente do segmento, mesmo operando uma rede de associados igualmente pulverizada","prazo":"Imediata"}],"diferenciais_reais":["Tecnologia patenteada exclusiva (separador de partículas autolimpante) — verificável, não aspiracional","Garantia de até 15 anos / vitalícia — compromisso concreto, não promessa genérica","17 anos de marca consolidada e líder de segmento no Brasil — histórico real, não posicionamento construído","Comissionamento de associados acima da média do setor (até ~30% + 50% vitalício em recompra) — retém quem já está dentro, vantagem estrutural de rede"],"key_leverage_point":{"headline":"Considerando o alcance nacional real da rede de associados, a penetração de mercado da Hyla é inferior a 0,01% ao ano — o limite de crescimento não é geográfico, é operacional.","context":"A Hyla já tem associados espalhados pelo Brasil, não só em SP — então o SAM correto é o mesmo TAM nacional (15-21 milhões de pessoas), não um recorte regional. Com esse denominador maior, mesmo na meta mais otimista do próprio cliente (150 máquinas/mês) a penetração continuaria abaixo de 0,01% ao ano. Isso confirma, com dados de mercado, o que a SWOT já tinha apontado a partir do relato da própria equipe: o gargalo da Hyla não é falta de demanda, nem de mercado disponível, nem de alcance geográfico — é a capacidade de atender a demanda que já existe onde a empresa já tem presença (ainda que desigual, concentrada em SP por densidade de associados ativos).","numbered_reasons":["TAM e SAM convergem no mesmo número (15-21 milhões de pessoas) porque o modelo de venda direta por demonstração já tem associados no Brasil todo — não há barreira estrutural de alcance que justifique um SAM menor","A penetração atual extremamente baixa (~0,005%, recalculada com o SAM nacional) não é sintoma de mercado saturado — é sintoma de capacidade de demonstração limitada, exatamente o gargalo identificado na SWOT (Fr3)","A concentração de 70% das vendas em SP é uma questão de densidade de associados ATIVOS ali, não de incapacidade de vender em outros estados — recrutar e ativar associados fora de SP é crescimento dentro do próprio SAM, não expansão para mercado novo"],"discussion_anchor":"Antes de discutir expansão para mercados realmente novos (ex: outros países da América Latina), vale alinhar com o cliente: o problema é ativar e capacitar a rede que já existe no Brasil todo, não descobrir onde vender. Isso muda a prioridade de investimento — de pesquisa de novos mercados para recrutamento e capacidade de demonstração na base nacional já instalada (mesma alavanca prioritária da SWOT)."},"honesty_alert":"Não existe dado público específico de tamanho do mercado de 'aspiradores antialérgicos premium' no Brasil — a estimativa de TAM/SAM aqui é construída cruzando dados demográficos e de saúde reais (IBGE, ABEP, ASBAI, Global Wellness Institute, ABIPLA) com a estimativa informal do próprio cliente, não com uma fonte de mercado direta. Os valores de SOM (faturamento atual e meta) também são estimados a partir do briefing, sem confirmação financeira da empresa. ADICIONAL (v3): dos números do Plano de Negócios da Hyla usados como referência de mercado, um não pôde ser verificado externamente (Campinas +87,8% em atendimentos por alergia) — não usar esse número específico até confirmação do cliente. Os demais (wellness Brasil US$96bi/#1 América Latina, limpeza doméstica R$38,1bi/4º maior mercado mundial, projeção OMS de alergia até 2050) foram confirmados com fonte externa independente. Tratar o conjunto como ordem de grandeza para decisão estratégica, não como número definitivo para plano financeiro.","alimenta_skills":["ee-s2-posicionamento","ee-s1-swot","ee-s3-brandbook"]},"ee-s2-posicionamento":{"client_name":"Hyla do Brasil","skill":"ee-s2-posicionamento","generated_at":"2026-06-22","data_source":"ee-s1-persona-icp + ee-s1-swot + ee-s2-pesquisa-mercado + briefing/transcrições","nota_metodologica":"Negócio de dois lados: PUV e mensagens estão desdobradas para consumidor final E candidata a associada, espelhando a estrutura de ICPs já mapeada. O território de marca, porém, é único — saúde respiratória doméstica — e serve aos dois públicos.","summary":"A Hyla hoje se comunica como 'mais um aspirador caro' quando na verdade tem o argumento mais forte do segmento: tecnologia patenteada que ataca a causa da alergia, não só a poeira, num país com mais de 20 milhões de asmáticos. O território de marca certo é 'a marca da saúde respiratória doméstica' — não 'limpeza' — e isso vale tanto para vender o produto quanto para recrutar associadas.","summary_headline":"A Hyla vende um aspirador, mas o argumento real é saúde — e ninguém mais no segmento está dizendo isso com essa força.","summary_highlights":[{"category":"posicao","label":"Território de marca","value":"Saúde respiratória","subtext":"Não 'limpeza' — eixo ainda pouco ocupado pelos concorrentes diretos","tone":"green"},{"category":"posicao","label":"PUV consumidor","value":"Testa antes de crer","subtext":"Demonstração gratuita elimina o risco do ticket alto","tone":"blue"},{"category":"posicao","label":"PUV associada","value":"Renda recorrente","subtext":"Comissão vitalícia em recompra — argumento ainda subcomunicado","tone":"blue"},{"category":"competicao","label":"Vs. Rainbow/Vivenso","value":"Meio do ticket","subtext":"Não compete por preço mínimo nem máximo — ancora em saúde+atendimento","tone":"blue"},{"category":"risco","label":"Alerta operacional","value":"Demonstração é gargalo","subtext":"Não prometer mais demonstração do que a capacidade de associados sustenta","tone":"yellow"},{"category":"oportunidade","label":"Janela de mercado","value":"Saúde ainda livre","subtext":"20M+ asmáticos no Brasil, eixo pouco ocupado pela concorrência direta","tone":"green"}],"summary_key_findings":[{"category":"vantagem","text":"A tecnologia patenteada (separador autolimpante) não é um detalhe técnico — é a prova de que a Hyla ataca a causa da alergia (ácaros, poeira fina), não só o sintoma visível. Nenhum concorrente direto tem esse argumento disponível."},{"category":"ameaca","text":"Se a comunicação continuar ancorada em 'limpeza profunda' genérica, a Hyla compete pelo mesmo território que Rainbow e Vivenso já ocupam há anos — e perde a única vantagem que tem de verdade."},{"category":"contexto","text":"O comprador de ticket alto (R$12-14,5k) decide por confiança, não por especificação técnica. A demonstração gratuita já cumpre esse papel na prática — falta a comunicação dizer isso com a mesma clareza com que diz 'aspirador antialérgico'."},{"category":"acao","text":"O posicionamento de recrutamento de associadas precisa de uma PUV própria, hoje inexistente: a candidata não compra o produto, ela compra a oportunidade de transformar uma experiência boa em renda recorrente — esse argumento nunca foi formalizado."}],"puv":{"consumidor_final":{"versao_completa":"O único aspirador a água com tecnologia patenteada que ataca a causa da sua alergia em casa — não só a poeira que você vê. Demonstração gratuita na sua casa, garantia vitalícia, e 17 anos de resultado comprovado.","versao_curta":"O aspirador que você testa em casa antes de decidir — e que cuida da causa da sua alergia, não só da limpeza.","versao_headline":"Sua casa pode estar limpa e você continuar com alergia. O Hyla ataca a causa — não só a poeira que dá pra ver.","justificativa":"A decisora (Márcia) já desconfia de aspiradores caros e desconhecidos, e a objeção universal é preço. A PUV ataca isso com dois argumentos: (1) prova antes de pagar — a demonstração já existe na operação, só falta comunicar com força; (2) o produto resolve um problema mais profundo (causa da alergia) do que qualquer concorrente comunica."},"candidata_associada":{"versao_completa":"Transforme a satisfação que você já teve como cliente Hyla em uma renda recorrente: comissão de até 30% em cada venda e 50% vitalício em toda recompra de quem você indicar — sem precisar saber vender, com treinamento e suporte completos.","versao_curta":"Você já confia no Hyla. Agora pode ganhar com ele também.","versao_headline":"Já é cliente Hyla? Você pode ganhar comissão vitalícia só por indicar quem você já indicaria de qualquer jeito.","justificativa":"Beatriz (candidata a associada) não busca 'ser vendedora' — busca renda extra com baixa barreira. A PUV ataca a objeção 'eu não sei vender' ao ancorar na prova social de já ser cliente satisfeita, não em habilidade comercial."}},"posicionamento":{"modelo":"Especialista em saúde respiratória doméstica que vende por demonstração — não é 'mais um aspirador premium', é a solução para um problema de saúde que a família sente todos os dias.","territorio":"Saúde antes de limpeza. Confiança antes de tecnologia. Prova antes de promessa.","antitese":"O oposto de aspirador genérico vendido por especificação técnica (potência, voltagem, capacidade do reservatório). O oposto da Rainbow, que aposta em vendedores agressivos e discurso de urgência. A Hyla fala de causa, não de sintoma — e prova antes de vender.","eixos":[{"eixo":"Saúde × Limpeza genérica","posicao":"Hyla é a marca da saúde respiratória em casa — limpeza é consequência, não o argumento principal"},{"eixo":"Risco × Segurança","posicao":"Demonstração gratuita elimina o risco de testar um produto de R$12-14,5k desconhecido — a confiança vem antes do pagamento"},{"eixo":"Vendedora × Parceira de renda","posicao":"Associada não é 'vendedora agressiva' (como a percepção sobre a Rainbow) — é uma cliente satisfeita que compartilha algo que já confia"},{"eixo":"Genérico × Especializado","posicao":"Foco em conforto + higiene + saúde — não tenta ser 'o aspirador para tudo'"}]},"canvas_4p":{"produto":{"principal":"Aspirador Hyla a água com separador de partículas autolimpante patenteado","outros":["Aera (equalizador/purificador de ambientes)","Nimbus (lavadora, R$3.000)","Kit limpa-vidros","Air Odorizer (R$149, item de recompra recorrente)","Miniescova elétrica GST"],"servicos_associados":["Demonstração presencial gratuita e sem compromisso","Treinamento de uso vitalício, incluindo a funcionária doméstica que vai operar","Revisão anual preventiva (R$600-700)","Garantia de até 15 anos / vitalícia"],"nao_faz":["Venda sem demonstração prévia (vai contra o próprio modelo que mais converte)","Concorrência por especificação técnica pura (potência, voltagem) — não é o argumento central"],"diferenciais_produto":["Separador de partículas autolimpante — exclusivo, nenhum concorrente direto tem","Ataca ácaros e poeira fina (causa de alergia), não só sujeira visível","Garantia vitalícia / 15 anos — motor com vida útil praticamente eterna","17 anos de mercado e liderança no segmento no Brasil"]},"preco":{"ticket_medio":"R$12.000-14.500","posicionamento_vs_concorrencia":"Acima do Vivenso (~R$12.000), abaixo da Rainbow (~R$21.000) — no meio do mercado, ancorado em saúde + atendimento + garantia, não no menor preço","formas_de_pagamento":["Até 36x financiamento Santander","Até 20x direto com a empresa","Até 21x cartão","Até 84x consignado (baixa adesão)"],"filosofia":"Não competir pelo preço mais baixo (Vivenso ganha aí) nem pelo prestígio do mais caro (Rainbow ganha aí) — competir pela combinação saúde + prova (demonstração) + garantia, que nenhum dos dois comunica com a mesma força","comissionamento_associada":"Até ~30% por venda + 50% vitalício em toda recompra do cliente indicado — acima da média do setor, argumento de retenção de rede"},"praca":{"fisico":"Venda direta nacional via rede de associados independentes (+100 cadastrados, ~35-50 ativos), concentração de 70% das vendas em São Paulo","raio_prioritario":"Grande São Paulo (onde já há densidade de associados) antes de qualquer expansão geográfica — conforme achado de ee-s2-pesquisa-mercado (penetração no SAM ainda muito baixa onde já opera)","digital":{"atual":"Instagram oficial (pago + orgânico), Google Ads + YouTube Pmax, site/e-commerce (WordPress+WooCommerce+Elementor, tecnicamente fraco), Instagram Business para associadas (subutilizado)","a_construir":["Funil estruturado de recrutamento em @hyladobrasilbusiness","CRM de pós-venda e nutrição (ee-s3-crm-setup)","Conteúdo de SEO/IA generativa ancorado em saúde respiratória"]},"canais_de_venda":["Demonstração presencial via associada (principal canal de fechamento)","Demonstração online quando não há associada na região","Indicação/cashback (canal mais rentável historicamente)","Lead de mídia paga → distribuído via C2S → demonstração"]},"promocao":{"tom":"Saúde antes de limpeza. Direto, sem exagero, ancorado em prova (demonstração, garantia, anos de mercado) — não em urgência ou pressão de venda.","o_que_faz":["Conteúdo e anúncios ancorados nos 3 pilares (conforto, higiene, saúde), com saúde em primeiro plano","Formulário restrito de demonstração (já em uso, manter)","Programa de indicação/cashback como argumento de prova social","Conteúdo educativo sobre alergia/asma/qualidade do ar — aproveitando a tendência de busca via IA generativa"],"o_que_nao_faz":["Comunicação que compete só por preço ou especificação técnica","Tom agressivo de vendedor (associado a Rainbow na percepção do próprio cliente)","Tratar recrutamento de associada como conteúdo genérico de 'oportunidade de negócio' sem ancorar em prova social real (cliente satisfeita)"],"canais_priorizados":[{"canal":"Instagram oficial","objetivo":"Construir território de saúde com conteúdo + sustentar mídia paga de demonstração"},{"canal":"Instagram Business (recrutamento)","objetivo":"Funil estruturado de candidatas a associada, ancorado em depoimento de cliente satisfeita"},{"canal":"Google Ads / YouTube Pmax","objetivo":"Capturar busca ativa por solução de alergia/qualidade do ar, não só 'aspirador'"},{"canal":"SEO de conteúdo / IA generativa","objetivo":"Ocupar o espaço de busca comparativa ('qual aspirador é melhor para alergia') antes da concorrência"}]}},"mensagens_por_segmento":{"consumidor_final":{"headline_lp":"Sua casa pode estar limpa e você continuar com alergia. O Hyla ataca a causa.","subheadline":"Demonstração gratuita na sua casa. Garantia vitalícia. 17 anos cuidando da saúde respiratória das famílias brasileiras.","argumento_central":"Você não precisa confiar antes de testar. Agende uma demonstração gratuita e veja o resultado no seu próprio colchão.","objecoes_derrubadas":{"e_muito_caro":"Veja o resultado antes de decidir — a demonstração é gratuita e sem compromisso, e o pagamento pode ser parcelado em até 36x","ja_tenho_aspirador":"Aspirador comum tira a poeira que você vê. O Hyla ataca os ácaros e partículas que causam a alergia","nunca_ouvi_falar":"17 anos de mercado, garantia vitalícia, e milhares de famílias atendidas — peça a demonstração e veja com seus próprios olhos"},"cta":"Quero minha demonstração gratuita","tom":"Direto, sem exagero, focado em prova e em saúde — não em urgência de venda"},"candidata_associada":{"headline_lp":"Você já confia no Hyla. Agora pode ganhar com ele também.","subheadline":"Comissão de até 30% por venda + 50% vitalício em toda recompra de quem você indicar. Sem precisar saber vender.","argumento_central":"Se você já é cliente satisfeita (ou conhece uma), já tem o argumento mais forte de vendas que existe: sua própria experiência.","objecoes_derrubadas":{"nao_sei_vender":"Você não precisa vender — precisa compartilhar uma experiência que já teve. Treinamento e suporte completos inclusos.","nao_tenho_tempo":"Modelo flexível, compatível com a rotina de casa — você decide quanto tempo dedicar","e_se_eu_nao_vender_nada":"Suporte de um grupo de associadas e material de apoio prontos desde o primeiro dia"},"cta":"Quero saber como ser associada","formulario_campos":["Nome","Telefone","Cidade/Estado","Já é cliente Hyla? (sim/não)"],"tom":"Acolhedor, ancorado em prova social real (depoimentos de associadas e clientes), não em promessa de ganho fácil"}},"narrativa_de_marca":{"historia":"Davi começou a vender aspiradores a água aos 16 anos, revendendo a concorrente americana Rainbow. Anos depois, fundou a Hyla do Brasil fazendo deliberadamente o oposto do que os concorrentes faziam: onde eles eram agressivos, a Hyla apostou em atendimento de excelência; onde eles vendiam genérico, a Hyla focou em saúde respiratória. Resultado: 17 anos depois, é referência do segmento no Brasil.","heroi":"A mãe/decisora que quer proteger a saúde da família em casa — e a associada que quer transformar uma boa experiência em renda própria.","vilao":"A causa invisível da alergia que nenhum aspirador comum resolve — e a desconfiança natural de pagar caro por algo que nunca se viu funcionar.","transformacao":"De 'sofro com alergia e não sei por quê' para 'eu vi funcionar na minha própria casa, antes de pagar um centavo'."},"key_leverage_point":{"headline":"A frase que ainda não foi dita com força em nenhum canal da Hyla: 'a causa da sua alergia não é a poeira que você vê.' Quando essa frase virar a headline, a comunicação para de competir por 'mais um aspirador' e passa a competir por saúde — território onde a Hyla não tem concorrente direto.","context":"Hoje a comunicação da Hyla mistura conforto, higiene e saúde sem hierarquia clara. A pesquisa de mercado confirmou que saúde respiratória é uma motivação de massa (20M+ asmáticos, 30% com alergia respiratória) e que nenhum concorrente direto ocupa esse território com a mesma força que a tecnologia patenteada da Hyla permite. Reposicionar a comunicação — do produto às redes sociais, dos criativos à landing page — para liderar com saúde, não com limpeza, é a mudança que conecta todos os diagnósticos já feitos.","numbered_reasons":["A tecnologia patenteada (separador autolimpante) é a prova técnica de que a Hyla ataca causa, não sintoma — argumento que nenhum concorrente direto pode copiar instantaneamente","A demonstração gratuita já existe operacionalmente e já converte bem (50-60% via indicação) — falta só comunicá-la como parte central da prova de saúde, não como mero passo de venda","O mesmo território de saúde serve para recrutar associadas: quem já viveu a transformação de saúde em casa é a candidata mais natural a comunicar isso para outras pessoas"],"discussion_anchor":"Antes de produzir qualquer criativo ou brandbook novo, validar com o cliente: a comunicação vai liderar com saúde respiratória (não com limpeza ou conforto) em todos os canais? Essa decisão de hierarquia entre os 3 pilares precisa ser tomada agora, antes da Semana 3."},"alerta_operacional":"Reforçar a demonstração gratuita como argumento central de marketing só é seguro se a capacidade de demonstração acompanhar — e ee-s1-swot já identificou isso como o gargalo atual (Fr3: só 35-50 associados ativos). Posicionar fortemente em torno de algo que a operação ainda não sustenta na escala da demanda pode aumentar o tempo de espera por demonstração e prejudicar exatamente a experiência que sustenta o posicionamento. Recomenda-se sequenciar: reforçar recrutamento de associadas (já recomendado desde a SWOT) antes ou junto com qualquer campanha que aumente a demanda por demonstração."},"ee-s3-identidade-visual":{"client_name":"Hyla do Brasil","skill":"ee-s3-identidade-visual","generated_at":"2026-07-08","data_source":"Apresentação de design de Natália Terciotti (S3, 08/07/2026) — análise da nova identidade internacional da Hyla + transcrição da reunião ao vivo. Cruzado com ee-s2-posicionamento (território de marca: saúde respiratória doméstica).","summary":"A Hyla Internacional redefiniu seu posicionamento global após a conferência da matriz na Alemanha (17-24/06/2026): de uma comunicação centrada no produto para uma linguagem de lifestyle e bem-estar, inspirada em 'quiet luxury' — luxo discreto comunicado por simplicidade, espaço negativo e fotografia editorial, não por excesso de elementos. Este documento organiza esse conceito em diretrizes aplicáveis desde já pela Hyla Brasil, ANTES da chegada do manual oficial (workshop de lançamento confirmado para 13/08/2026 na reunião do dia 08/07). Paleta de cores exata, tipografia oficial e logotipo NÃO são definidos aqui — vêm da matriz e devem substituir este documento assim que chegarem.","creative_concept":"A Hyla está migrando de 'veja como limpar' para 'veja a vida que você pode viver'. O produto deixa de ser o protagonista da comunicação — o foco passa a ser a experiência que ele proporciona: conforto, saúde, qualidade de vida. A linguagem visual é 'quiet luxury': luxo discreto, sofisticação através de simplicidade, uso do espaço, fotografia de alta qualidade, materiais naturais e identidade visual consistente — sem parecer extravagante. Referências de tom citadas pela designer: Bang & Olufsen (lifestyle + direção de arte impecável, produto integrado organicamente ao ambiente), Aesop (produto inserido no cotidiano de forma não-promocional), Gaggenau (minimalismo, produto tratado como objeto de design). Frases-guia do novo site internacional: 'Luxury lives in clean air' e 'The art of cleaning' — nenhuma menciona potência, filtragem ou especificação técnica; ambas vendem uma sensação. Aplicado ao território de marca já definido em ee-s2-posicionamento (saúde respiratória doméstica), a tradução para a Hyla Brasil é: comunicar a mesma qualidade de vida e bem-estar, mas ancorada no argumento técnico real (separador autolimpante patenteado) que a concorrência não tem.","shape_guidelines":{"shapes":"Orgânicas e naturais — evitar geometria rígida ou elementos gráficos chamativos","borders":"Sutis a inexistentes — sem bordas grossas ou frames chamativos disputando atenção com a fotografia","density":"Baixa — muito espaço negativo (é a regra central do 'quiet luxury'), uma ideia/mensagem principal por peça ou seção, nunca vídeo + produto + ambiente + texto competindo ao mesmo tempo","icon_style":"Não abordado na análise da designer — a definir com o manual oficial (13/08/2026)."},"dos_and_donts":{"dos":["Fotografia editorial com luz natural e ambientes reais — já um diferencial da Hyla frente à concorrência (Rainbow, Vivenso); manter e ampliar","Uma ideia/mensagem principal por peça, com os demais elementos em segundo plano (título → benefício → produto, não os três competindo)","Espaço negativo generoso para transmitir exclusividade, mesmo que pareça 'vazio demais' à primeira vista","Foco no resultado/experiência (bem-estar, respirar fundo, conforto) em vez do problema (espirro, nariz entupido) ou do ato de limpar em si","Identidade visual presente mesmo em datas comemorativas — tipografia, paleta e composição não podem mudar completamente para Dia das Mães, Natal etc.","CTA explícito em todo criativo de tráfego pago","Trilha sonora instrumental e suave em vídeos (piano, jazz leve, bossa nova) — não músicas intensas ou agitadas","Vídeos gravados organicamente pela equipe e associados, sem uso de IA em demonstração de produto","Vinheta de fechamento com logo em vídeos, reforçando a marca sem competir com a demonstração"],"donts":["Uso de IA em vídeos de demonstração de produto — proibido pela matriz internacional e ativamente monitorado (o Instagram da Hyla Brasil já foi fiscalizado por isso)","Antecipar elementos específicos da nova marca (fontes, paleta oficial) sem autorização — o time já recebeu um aviso da matriz por um post que seguiu tendências antes da liberação oficial de 13/08","Variação de tipografia entre posts e capas — manter a fonte atual de forma consistente até o manual oficial chegar","Elementos gráficos genéricos, estilo 'template pronto' — reduz a percepção de produto premium","Imagens focando no problema/desconforto — a nova linguagem internacional evita mostrar pessoas com sintomas de alergia, foca no resultado","Trends populares genéricas desalinhadas com um produto premium de ticket alto (R$12.000-14.500)","Banners/telas com muitos elementos disputando atenção ao mesmo tempo (produto + selo + título + subtítulo + textos + menu + botão)"]},"key_insight":{"headline":"O maior ganho não vem de reinventar a marca — vem de aplicar, com disciplina, um sistema visual consistente que já foi validado globalmente pela própria Hyla Internacional.","context":"A Hyla Brasil não precisa criar uma identidade do zero: a matriz já validou a direção (quiet luxury, lifestyle, fotografia editorial) em mercados maduros. O trabalho da V4 até 13/08 é traduzir esse conceito para o Brasil com o que já está disponível — fotografia, hierarquia de mensagem, CTA, trilha sonora — sem esperar pelo manual oficial para começar.","numbered_reasons":["A Hyla já tem o ativo mais difícil de replicar (fotografia real, ambientes bons) — falta só o sistema que amarre tudo, e isso não depende de receber fontes/cores oficiais da matriz","Nenhum concorrente direto (Rainbow, Vivenso) executa essa linguagem — a janela de diferenciação está aberta e não é disputada localmente","O prazo de 13/08 é real e conhecido — dá para planejar a transição em vez de reagir a ela, mas também é um limite firme: nada de antecipar elementos específicos da marca nova antes disso"],"discussion_anchor":"Vale alinhar com Davi/Fábio o intervalo entre agora e 13/08: quais ajustes (fotografia, hierarquia, CTA, áudio) começam já, e quais esperam o manual oficial (paleta, tipografia, logo) — para não repetir o incidente do post retirado a pedido da matriz."},"honesty_alert":"Este documento é um conceito PRELIMINAR, construído a partir da análise própria da designer da V4 sobre o site internacional já publicado pela Hyla — não é o manual oficial da marca. Paleta de cores (hex), tipografia oficial (família, pesos, tamanhos) e logotipo NÃO estão definidos aqui porque não existe fonte confiável para esses valores exatos ainda — a matriz confirmou, na reunião de 08/07, que vai entregar esses ativos (incluindo arquivos de fonte própria da Hyla) em workshop de lançamento oficial no Brasil em 13/08/2026. Este documento deve ser revisado e complementado assim que o manual oficial chegar. Enquanto isso, o time já foi alertado pela matriz para não antecipar elementos específicos da nova marca em posts públicos.","alimenta_skills":["ee-s3-brandbook","ee-s3-landing-page","ee-s3-criativos-anuncios","ee-revisao-semanal"]},"ee-s4-cliente-oculto":{"client_name":"Hyla do Brasil","skill":"ee-s4-cliente-oculto","generated_at":"2026-07-16","data_source":"2 transcrições reais de WhatsApp: (1) base-de-conhecimento/chat-whatsapp-hyla-do-brasil-cliente-oculto-01.txt, 22/06/2026, Lucas atuando como cliente oculto em Londrina/PR, atendido pela triagem central (Cleiton); (2) base-de-conhecimento/cliente-oculto-nicolas-02.md, 12/06 a 05/07/2026, Nicolas atuando como cliente oculto em Londrina/PR, atendido diretamente por uma associada (Simone, baseada em Curitiba). Complementado por relato do operador sobre testes adicionais (outros números na mesma região + 1 teste cego em região distinta, sem transcrição própria disponível).","summary":"Dois testes reais, mesma região (Londrina/PR), dois caminhos de entrada diferentes — e o mesmo resultado final: nenhuma demonstração agendada. No Caso 1, o processo confirma tudo certo (contato rápido, endereço coletado, associada disponível) e então simplesmente para, sem follow-up, no momento em que perguntaria 'qual dia e horário' — 23+ dias de silêncio. No Caso 2, o oposto acontece no meio do caminho: uma associada engajada (Simone) volta a contatar o lead por conta própria em 3 momentos ao longo de 3 semanas — mas mesmo assim a visita nunca é agendada, porque a negociação de data fica sempre em promessas vagas ('estarei na sua região nas próximas semanas'), nunca uma data e horário travados. Isso muda o diagnóstico: o problema não é só 'ninguém faz follow-up' — é que falta handoff consistente E falta um mecanismo estruturado de agendamento, mesmo quando o follow-up humano funciona bem.","buyer_profile":{"name":"Simulação — 2 casos reais, mesma região (Londrina/PR), caminhos de entrada diferentes","situation":"Caso 1 (Lucas, 22/06): preencheu o formulário no site às 11:17, indicando 'Quero uma demonstração HYLA'. Forneceu endereço completo quando solicitado. Postura de cliente real: não fez follow-up ativo, só esperou contato. Caso 2 (Nicolas, 12/06): contato inicial já atendido diretamente por uma associada (Simone), que se identificou e perguntou como podia ajudar. Nicolas relatou conhecer o produto só por vídeo, perguntou como funcionava a demonstração presencial — e, como no Caso 1, não cobrou follow-up ativamente depois ('vou verificar a disponibilidade e já te retorno', sem retornar).","urgency":"medium","main_objection":"Em nenhum dos 2 casos uma objeção real de venda chegou a ser testada — nenhum avançou até uma etapa de negociação. A única 'objeção' registrada (Caso 2: 'eu conheço o produto só por vídeo') foi bem contornada pela associada, que reforçou o valor da demonstração presencial."},"simulation_metadata":{"total_duration_minutes":null,"note":"Caso 1: 192 minutos de progresso ativo (11:17 às 14:29, mesmo dia 22/06/2026), seguidos de 23+ dias de silêncio total, sem desfecho até a data deste diagnóstico. Caso 2: conversa iniciada em 12/06/2026, com contatos adicionais da associada em 18/06, 04/07 e 05/07 — quase 3 semanas de follow-up espaçado e proativo — mas também sem uma data de demonstração jamais confirmada, e sem desfecho até a data deste diagnóstico. Nenhum dos dois casos é um teste 'concluído' — são dois testes que nunca tiveram desfecho, por motivos diferentes."},"evaluation":{"overall_score":3.6,"classification":"critical","criteria_scores":[{"criterion":"Velocidade do 1º contato humano","score":7,"observation":"Caso 1: mensagem automática instantânea (11:17) + Cleiton pessoalmente às 11:23 (6 min). Caso 2: Simone respondeu no mesmo dia (sem timestamp exato disponível na transcrição). Funciona bem nos dois caminhos de entrada."},{"criterion":"Coleta de informações / qualificação","score":7,"observation":"Caso 1: endereço completo coletado com clareza, explicando o motivo. Caso 2: Simone entendeu rapidamente a necessidade (Nicolas só conhecia por vídeo) e direcionou pra demonstração presencial."},{"criterion":"Consistência do handoff entre canais de entrada","score":3,"observation":"NOVO — depende inteiramente de qual caminho o lead entra. Via triagem central (Cleiton): confirma interesse e some. Via contato direto com associada engajada (Simone): segue e persiste. Não há padronização entre os dois caminhos — o resultado do lead depende de sorte de roteamento, não de processo."},{"criterion":"Follow-up / persistência (quando a associada está engajada)","score":7,"observation":"Caso 2: Simone recontatou o lead por conta própria em 3 momentos ao longo de 3 semanas (18/06, 04/07, 05/07), sem nenhuma cobrança de Nicolas — inclusive avisando 'estarei na sua região nas próximas semanas'. Prova que follow-up genuíno acontece quando a pessoa certa está no lead."},{"criterion":"Follow-up / persistência (via triagem central)","score":0,"observation":"Caso 1: nenhuma tentativa de reengajamento em 23+ dias, mesmo com o lead já qualificado (endereço fornecido, disponibilidade confirmada). Um lead 'quente' foi tratado como se tivesse esfriado sozinho."},{"criterion":"Agendamento efetivo da demonstração","score":0,"observation":"CRÍTICO nos 2 casos. Caso 1: pergunta de dia/horário sem resposta nem follow-up. Caso 2: follow-up ativo por 3 semanas, mas sempre com promessas vagas de disponibilidade futura — nunca uma data e horário efetivamente travados. O produto final que o cliente precisa (visita marcada) não aconteceu em nenhum dos dois."}],"strengths":["Resposta inicial rápida nos dois caminhos testados — não é um problema de velocidade","Coleta de informações sem fricção, com explicação clara do motivo","Quando a associada está genuinamente engajada, ela persiste por conta própria (3 contatos em 3 semanas, sem cobrança do lead) — mostra que a cultura de atendimento não é ruim de forma generalizada","Associada revelou, sem ser perguntada, uma limitação real de cobertura (representante local em treinamento) — sinal de transparência, não de encobrimento"],"critical_improvements":["Handoff inconsistente: o resultado do lead depende de qual canal o recebe primeiro (triagem central vs. associada direta), sem padronização entre os dois","Mesmo com follow-up ativo e genuíno, a demonstração não é agendada — falta um mecanismo estruturado de marcação (horário específico + confirmação), não só boa vontade humana","Zero follow-up quando o lead passa pela triagem central antes de chegar numa associada — o lead morre nesse handoff, não depois","Cobertura de Londrina depende de deslocamento de associada de outra cidade (Curitiba) + uma representante local ainda em treinamento — risco real de overpromise se a confirmação de disponibilidade não refletir essa limitação"],"sdr_impact_per_improvement":[{"improvement":"Follow-up automático pós-confirmação (via triagem central)","sdr_solution":"SDR IA monitora o m
