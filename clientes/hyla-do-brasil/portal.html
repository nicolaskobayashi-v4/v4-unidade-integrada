30-50 anos em condomínio em SP, decisão pesada em saúde/alergia; mas o segundo ICP que precisa de atenção de marketing é a candidata a associada.","summary_headline":"A Hyla não tem um problema de demanda — tem um problema de capacidade de demonstração. Recrutar associados pode valer mais que dobrar a mídia.","summary_highlights":[{"category":"posicao","label":"ICPs mapeados","value":"4 perfis","subtext":"Decisora doméstica, funcionária/governanta, candidata a associada, PJ","tone":"blue"},{"category":"maturidade","label":"Conversão por canal","value":"50-60% vs 33%","subtext":"Demonstração por indicação converte 50-60%; lead frio de mídia, 1 em 3","tone":"yellow"},{"category":"oportunidade","label":"Alavanca de equipe","value":"50→100 associados","subtext":"Dobrar associados ativos dobra a venda (estimativa do próprio Fábio)","tone":"green"},{"category":"risco","label":"Objeção dominante","value":"Preço","subtext":"Praticamente toda objeção verbalizada esconde resistência ao ticket de R$12-14,5k","tone":"yellow"},{"category":"competicao","label":"Decisor de compra","value":"70% p/ funcionária","subtext":"70% compra para uso de empregada doméstica, 30% uso próprio — funcionária raramente decide","tone":"blue"},{"category":"janela","label":"Ciclo de decisão","value":"Imediato a 3 meses","subtext":"PF decide na demonstração; recrutamento de associado pode levar mais tempo","tone":"blue"}],"summary_key_findings":[{"category":"vantagem","text":"A demonstração presencial é uma máquina de conversão absurda quando o lead vem de indicação (50-60%) — o problema não é o produto nem o pitch, é o volume de demonstrações que a operação consegue gerar."},{"category":"ameaca","text":"Sem CRM de pós-venda nem controle real sobre o funil dos associados (dados com ~70-75% de precisão), qualquer aumento de investimento em mídia vai gerar leads que competem por uma capacidade de demonstração que já está no limite hoje (~35-50 associados ativos)."},{"category":"contexto","text":"O público feminino domina os dois lados do negócio: 90% dos associados são mulheres vendendo para mulheres (90% de mulher para mulher), e o ICP de consumidora principal também é mulher classe A 30-50 anos. Isso simplifica a comunicação — uma única linguagem/tom serve para recrutamento e para venda."},{"category":"acao","text":"A conta Instagram 'Hyla do Brasil Business' (recrutamento) está subaproveitada como canal de marketing — hoje é tratada como employer branding secundário, mas pelo cálculo do próprio cliente é a alavanca de maior impacto no negócio. Vale uma campanha de recrutamento tão estruturada quanto a de venda."},{"category":"acao","text":"A funcionária doméstica/governanta é uma persona influenciadora negativa em potencial ('breaker') na maioria dos casos — mas quando a Hyla consegue treiná-la diretamente (oferecendo o treinamento de uso), ela vira aliada. Vale formalizar esse treinamento como parte do processo de venda, não como pós-venda opcional."}],"icps":[{"id":"icp-1-decisora-domestica","nome":"Decisora Doméstica (consumidora final)","descricao":"Mulher, classe A, 30-50 anos (também relevante 50+), mora em condomínio (vertical ou horizontal) em região nobre — principalmente São Paulo capital (70% das vendas vêm de SP). Decide sozinha ou junto com o casal.","motivacao_dominante":"Saúde (alergia, asma, rinite, qualidade do ar) > conforto > qualidade de vida — saúde pesa mais na decisão","uso_do_produto":"70% compra para uso da funcionária doméstica, 30% para uso próprio","canal_entrada":"Instagram (anúncio/orgânico) ou indicação → demonstração presencial","ticket":"R$12.000-14.500","prioridade":"principal","ameaca":"média — público pequeno em volume absoluto, mas alto ticket e alta recorrência (5 anos de manutenção)"},{"id":"icp-2-funcionaria-domestica","nome":"Funcionária Doméstica / Governanta","descricao":"Usuária do equipamento, raramente decisora. Em alguns casos influencia negativamente a venda ('é pesado', 'dá trabalho') e em outros, quando treinada diretamente pela Hyla, se torna aliada da recompra e indicação.","motivacao_dominante":"Reduzir esforço/carga de trabalho — só se torna favorável ao produto depois de entender que ele facilita, não complica, a rotina","uso_do_produto":"Operadora do equipamento no dia a dia","canal_entrada":"Presente na demonstração feita para a contratante; raramente é o alvo direto de mídia","prioridade":"secundario — influenciadora, não compradora","ameaca":"baixa diretamente, mas pode neutralizar uma venda já avançada se não for endereçada"},{"id":"icp-3-candidata-associada","nome":"Candidata a Associada/Representante (recrutamento)","descricao":"Mulher (90% dos associados são mulheres vendendo para mulheres), perfil empreendedor informal — muitas vezes já é cliente satisfeita ou conhece alguém que é. Busca renda extra ou negócio próprio com baixo investimento inicial.","motivacao_dominante":"Renda extra/autonomia financeira com baixa barreira de entrada — comissão de até 30% por venda, mais 50% vitalício em recompra do cliente que ela trouxe","canal_entrada":"Instagram 'Hyla do Brasil Business', indicação de outras associadas, eventos/feiras","prioridade":"alta — identificada pelo próprio cliente como a maior alavanca de crescimento (dobrar associados ativos dobra a venda)","ameaca":"alta volatilidade — associadas saem e voltam por motivos pessoais (separação, mudança de cidade, maternidade)","nota":"Hoje tratada como employer branding secundário; pelo peso estratégico real, merece tratamento de funil de aquisição tão estruturado quanto o funil de venda do produto."},{"id":"icp-4-pj","nome":"Pessoa Jurídica (hotéis, teatros, empresas de limpeza)","descricao":"Hotéis, teatros, restaurantes, salas de evento e empresas de limpeza/higienização profissional (parceria homologada CASEC)","uso_do_produto":"Equipamento profissional para limpeza/higienização em escala — compram conforme demanda da equipe (1 máquina por funcionário de limpeza, em média)","canal_entrada":"Indicação, parcerias B2B, homologação CASEC","prioridade":"terciario — apenas 5% do volume de vendas","ameaca":"baixa — segmento pequeno mas estável"}],"personas":[{"id":"marcia","nome":"Márcia","idade":44,"icp":"icp-1-decisora-domestica","frase":"Eu não quero só limpar a casa — quero parar de espirrar quando chego do trabalho.","perfil":"Mora em apartamento em condomínio fechado na Zona Sul de São Paulo. Classe A, trabalha ou administra a casa em tempo integral. Tem funcionária doméstica fixa. Já tentou resolver alergia/poeira com produtos de limpeza comuns sem sucesso.","jtbd":{"funcional":"Eliminar a fonte de alergia/poeira de casa (colchão, estofado, tapete) sem depender de produtos químicos","emocional":"Parar de se sentir mal dentro da própria casa — recuperar a sensação de ambiente seguro","social":"Ser vista como alguém que cuida bem da casa e da família, inclusive na saúde"},"dores":["Alergia/rinite recorrente sem causa resolvida","Desconfiança de que produtos de limpeza tradicionais não 'realmente' limpam (colchão, estofado)","Já ouviu falar de aspiradores caros mas nunca viu funcionando de fato","Não confia em comprar algo de R$12-14k sem ver"],"medos":["Gastar um valor alto e não sentir diferença real","Comprar de empresa desconhecida e não ter suporte depois","A funcionária reclamar que o equipamento é pesado/difícil de usar"],"objecoes":["'É muito caro para um aspirador'","'Eu já tenho um aspirador normal'","'Preciso pensar e falar com meu marido'","'Nunca vi a marca na TV/grandes mídias'"],"gatilho_de_compra":"Crise de alergia/asma na família, mudança de casa, indicação de amiga que já tem, ou simplesmente ver a demonstração ao vivo","como_descobre":"Instagram (anúncio ou conteúdo orgânico) → preenche formulário (#agendedemonstração) → C2S distribui para associada da região → demonstração presencial","mensagem_que_converte":"Demonstração gratuita e sem compromisso na sua casa — você vê o equipamento limpar seu próprio colchão e sente a diferença na hora. Garantia de até 15 anos. Pagamento facilitado.","canal_preferencial":"Instagram para descoberta, WhatsApp/telefone para agendamento e fechamento","willingness_to_pay":"R$12.000-14.500, com forte sensibilidade ao parcelamento (até 36x financiamento Santander, até 21x cartão) — preço fechado é menos importante que a percepção de parcela acessível"},{"id":"regina","nome":"Regina","idade":38,"icp":"icp-2-funcionaria-domestica","frase":"Se for mais um equipamento pesado pra eu carregar e a patroa não usar, prefiro nem mexer.","perfil":"Funcionária doméstica fixa há vários anos na casa da família decisora. Não decide a compra, mas está presente na demonstração e opera o equipamento no dia a dia.","jtbd":{"funcional":"Realizar a limpeza da casa de forma eficiente sem aumentar sua carga de trabalho","emocional":"Não querer ser responsabilizada se o equipamento for difícil ou quebrar","social":null},"dores":["Equipamentos novos que a patroa compra e depois cobra resultado sem explicar o uso","Medo de estragar algo caro e ser responsabilizada"],"medos":["Ser cobrada por não saber operar o equipamento corretamente","Esforço físico extra sem reconhecimento"],"objecoes":["'É pesado'","'Dá trabalho guardar/limpar depois'","'Prefiro o jeito que já faço'"],"gatilho_de_compra":"Não aplicável — não é decisora; o gatilho relevante é o treinamento bem feito no momento da venda","como_descobre":"Apresentada ao produto durante a demonstração feita para a contratante","mensagem_que_converte":"Treinamento completo e vitalício incluído — sempre que precisar relembrar o uso ou treinar outra pessoa, a Hyla oferece de novo, sem custo.","canal_preferencial":"Presencial, durante a demonstração e o treinamento pós-venda","nota":"Persona de influência, não de decisão. Tratar bem essa pessoa na demonstração reduz risco de objeção tardia e aumenta chance de recompra/indicação."},{"id":"beatriz","nome":"Beatriz","idade":35,"icp":"icp-3-candidata-associada","frase":"Comprei o aspirador, amei, e descobri que dava pra ganhar dinheiro vendendo pras minhas amigas também.","perfil":"Ex-cliente satisfeita ou conhecida de associada atual. Quer renda extra sem deixar a rotina de casa, tem rede de contatos (amigas, vizinhas, grupos de WhatsApp/Instagram). Pode ter filhos pequenos ou estar em transição de carreira.","jtbd":{"funcional":"Conseguir uma fonte de renda extra flexível, compatível com a rotina doméstica","emocional":"Sentir autonomia financeira e orgulho de ter um 'negócio próprio' sem grande investimento","social":"Ser vista como alguém empreendedora, não 'só dona de casa'"},"dores":["Falta de opções de renda extra flexíveis e sem CNPJ/burocracia","Medo de não saber vender ou não ter talento comercial","Não saber se vai conseguir conciliar com a rotina de casa/filhos"],"medos":["Investir tempo e não vender nada","Não ter suporte da empresa depois de começar","Ficar 'isolada' sem o grupo de outras associadas"],"objecoes":["'Eu não sei vender'","'Não tenho tempo'","'E se eu não vender nada no primeiro mês?'"],"gatilho_de_compra":"Ser cliente satisfeita e ver o quanto a vendedora ganhou, indicação direta de uma associada amiga, ou conteúdo de recrutamento no Instagram Business mostrando ganhos reais","como_descobre":"Instagram 'Hyla do Brasil Business' (employer branding), indicação de associada, eventos/feiras onde a Hyla está presente","mensagem_que_converte":"Comece vendendo pra quem você já conhece. Comissão de até 30% por venda + 50% vitalício em toda recompra dos seus clientes. Suporte e treinamento completo da Hyla.","canal_preferencial":"Instagram (descoberta) → WhatsApp em grupo de associadas (onboarding e suporte contínuo)","willingness_to_pay":"N/A — não é compradora, é parceira comercial. O 'custo' dela é tempo/esforço; o retorno esperado é comissão recorrente.","nota":"Persona estrategicamente mais importante do que o volume de mídia hoje dedicado a ela sugere. Vale campanha de recrutamento dedicada, não apenas posts orgânicos esporádicos."}],"jornada_de_compra":[{"estagio":"1. Conscientização","descricao":"Vê anúncio no Instagram/Google, conteúdo orgânico, ou recebe indicação de amiga/vendedora associada","duracao_tipica":"Imediato a algumas semanas"},{"estagio":"2. Interesse","descricao":"Clica no anúncio, acessa a landing page (hyladobrasil.com.br/aspirador-hyla-do-brasil), preenche formulário com nome/telefone/estado/cidade","duracao_tipica":"Minutos"},{"estagio":"3. Distribuição e primeiro contato","descricao":"Lead cai no sistema C2S, distribuído por fila regionalizada para associada; cadência de tentativa de contato (até 10 dias úteis, ligação + WhatsApp + mensagem)","duracao_tipica":"1 a 10 dias úteis"},{"estagio":"4. Agendamento da demonstração","descricao":"Associada agenda visita presencial (ou demonstração online se não há associada na região)","duracao_tipica":"Dias a poucas semanas"},{"estagio":"5. Demonstração (momento decisivo)","descricao":"Associada demonstra o equipamento ao vivo na casa do cliente — limpeza de colchão/estofado com resultado visível. É o verdadeiro canal de venda: 50-60% converte se veio de indicação, ~33% (1 em 3) se veio de lead frio de mídia","duracao_tipica":"1 visita, ~1 hora"},{"estagio":"6. Decisão e pós-venda","descricao":"Negociação de forma de pagamento (até 36x financiamento, até 21x cartão), treinamento de uso incluído, e início do relacionamento de recompra (revisão anual, acessórios, indicação)","duracao_tipica":"Fechamento no mesmo dia da demonstração na maioria dos casos; recompra ao longo de ~5 anos"}],"willingness_to_pay":{"ticket_medio":"R$12.000-14.500","formas_de_pagamento":["Até 36x financiamento Santander (mediante aprovação)","Até 20x direto com a empresa","Até 21x cartão","Até 84x consignado (baixa adesão)"],"sensibilidade_de_preco":"Alta — preço é a objeção universal, mas a sensibilidade é mais à parcela mensal do que ao valor total. Parcelamento longo e facilitado destrava decisões que o valor cheio bloquearia.","ltv_recompra":"Revisão anual (R$600-700, dos quais R$320 é mão de obra) por ~5 anos, mais recompra de acessórios recorrentes (Air Odorizer R$149). ~10% dos clientes mantém recompra alta e renova a máquina."},"biblioteca_de_objecoes":[{"objecao":"É muito caro","contexto":"A objeção real na quase totalidade dos casos, mesmo quando disfarçada de outra coisa","resposta_validada":"Demonstração gratuita primeiro — o cliente vê o resultado antes de qualquer conversa de preço. Parcelamento facilitado (até 36x) reduz a barreira psicológica do valor total."},{"objecao":"Já tenho um aspirador normal / não preciso","contexto":"Cliente não entende a diferença entre aspirador comum e o sistema de purificação/desacarização da Hyla","resposta_validada":"Ancorar em saúde, não em limpeza: 'não é sobre limpar mais, é sobre tirar da sua casa o que causa sua alergia' — reforçado com a demonstração ao vivo"},{"objecao":"Nunca ouvi falar da marca / não vejo na TV","contexto":"Produto não é divulgado em grandes mídias — gera desconfiança em compra de ticket alto","resposta_validada":"17 anos de mercado, garantia vitalícia/15 anos, e prova social local (clientes da região, depoimentos, associada que já atende ali)"},{"objecao":"Preciso falar com meu marido/cônjuge primeiro","contexto":"Decisão de compra de ticket alto frequentemente não é solo — especialmente fora do público de alta renda solteira","resposta_validada":"Convidar o cônjuge para a demonstração desde o agendamento, quando possível — decisão em conjunto reduz desistência pós-visita"},{"objecao":"(Funcionária) é pesado / dá trabalho","contexto":"Objeção indireta vinda da pessoa que vai operar o equipamento, não da decisora — pode travar a venda mesmo com a decisora convencida","resposta_validada":"Treinamento de uso incluído na demonstração, direcionado também para a funcionária, não só para a contratante"}],"canais":{"aquisicao_consumidor":["Instagram (pago + orgânico)","Google Ads + YouTube Pmax","Indicação (canal mais rentável, mas não escalável por mídia)"],"aquisicao_associada":["Instagram 'Hyla do Brasil Business'","Indicação direta de associadas atuais","Feiras e eventos"],"fechamento":["Demonstração presencial (principal)","Demonstração online (quando não há associada na região)","WhatsApp/telefone para agendamento e negociação"],"pos_venda":["SAC por telefone/WhatsApp (revisão anual)","Sem e-mail marketing ou CRM automatizado hoje — oportunidade clara"]},"icp_nao_ideal":["Pessoa física com restrição financeira severa — ticket de R$12-14,5k é inviável mesmo parcelado","Regiões sem associada ativa e sem opção viável de demonstração online (reduz drasticamente a conversão)","Empresas de limpeza de baixo orçamento que buscam equipamento genérico, não o diferencial de saúde/purificação","Pessoas que decidem 100% por preço mais baixo sem valorizar demonstração — concorrentes como Vivenzo competem melhor nesse segmento"],"key_leverage_point":{"headline":"O funil da Hyla não está limitado por demanda — está limitado por capacidade de demonstração. Investir em recrutar associadas pode valer mais do que investir em mais mídia.","context":"O próprio Fábio fez a conta no kick-off: a equipe tem ~35-50 associados ativos de mais de 100 cadastrados, e dobrar isso para 100 ativos dobraria a venda — um efeito maior do que o já testado (e fracassado) de simplesmente dobrar o orçamento de mídia. Mesmo assim, hoje o recrutamento de associadas é tratado como employer branding secundário (posts esporádicos na conta 'Hyla do Brasil Business'), enquanto a aquisição de clientes recebe toda a estrutura de campanha, formulário e funil C2S.","numbered_reasons":["Cada lead de mídia paga ainda depende de uma demonstração presencial para converter — sem associada disponível na região, o lead simplesmente não vira venda, independente de quanto se investe em anúncio","90% dos associados são mulheres vendendo para mulheres — o mesmo ICP de consumidora (Márcia) é, em essência, o público de onde vêm as melhores candidatas a associada (Beatriz): cliente satisfeita é a candidata ideal","O comissionamento recorrente (50% vitalício em recompra) já é um argumento de recrutamento forte que hoje não está sendo comunicado com a mesma força que os argumentos de venda do produto"],"discussion_anchor":"Vale propor ao cliente dividir parte do orçamento/atenção de marketing entre aquisição de clientes E aquisição de associadas — tratando 'Hyla do Brasil Business' com o mesmo rigor de funil que a conta principal, antes de simplesmente escalar mídia para o consumidor final."},"honesty_alert":"Os dados de funil (taxa de conversão lead→demonstração, demonstração→venda) vêm de estimativas verbais dos próprios sócios no kick-off, sem CRM ou BI confiável por trás (a própria equipe reconhece ter só ~70-75% de precisão nos dados). Qualquer meta de crescimento baseada nesses números precisa de validação com dados reais antes de virar compromisso — e a falta de CRM de pós-venda/nutrição é uma fragilidade estrutural que vai limitar o ROI de qualquer campanha nova até ser corrigida (ver ee-s3-crm-setup).","alimenta_skills":["ee-s1-auditoria-comunicacao","ee-s1-swot","ee-s2-posicionamento","ee-s2-diagnostico-midia","ee-s3-brandbook","ee-s3-copy-anuncios","ee-s3-crm-setup"]},"ee-s1-swot":{"skill":"ee-s1-swot","cliente":"Hyla do Brasil","gerado_em":"2026-06-22","nota":"Cruzamento de ee-s1-diagnostico-maturidade + ee-s1-persona-icp + briefing/transcrições (kick-off + reuniões comerciais). Sem dados V4MOS (API bloqueada por 403, escalado) — itens de mídia/CAC vêm de estimativa verbal dos sócios. Atualizado em 26/06 com 3 pesquisas ad-hoc: benchmark do canal de associados da Hyla França (outputs/canal-associados-benchmark-franca.md), análise do concorrente Rainbow (outputs/concorrente-rainbow-analise.md) e análise do concorrente Vivenso/Pro-Aqua (outputs/concorrente-vivenso-analise.md).","manchete":"A Hyla tem a tecnologia, a marca e a demonstração que converte — mas decide no escuro e está estrangulada pela própria capacidade de demonstrar o produto, não pela demanda.","forcas":[{"id":"F1","descricao":"Tecnologia patenteada exclusiva — separador de partículas autolimpante, nenhum concorrente direto tem","comunicavel":true,"impacto":"alto"},{"id":"F2","descricao":"Atendimento 'VIP' e garantia de até 15 anos/vitalícia — troca/conserto rápido, sem burocracia","comunicavel":true,"impacto":"alto"},{"id":"F3","descricao":"Marca consolidada há 17 anos, líder do segmento no Brasil","comunicavel":true,"impacto":"alto"},{"id":"F4","descricao":"Demonstração presencial converte fortemente quando o lead vem de indicação (50-60%)","comunicavel":true,"impacto":"alto"},{"id":"F5","descricao":"Audiência real e engajada no Instagram (~47-49 mil seguidores)","comunicavel":true,"impacto":"medio-alto"},{"id":"F6","descricao":"Comissionamento forte para associados (até ~30% por venda + 50% vitalício em recompra do cliente indicado) — retém quem já está dentro","comunicavel":false,"impacto":"alto"},{"id":"F7","descricao":"Posicionamento de saúde (alergia, asma, rinite, purificação do ar) — diferencial real frente a concorrentes que só vendem 'limpeza'","comunicavel":true,"impacto":"alto"},{"id":"F8","descricao":"Programa de indicação/cashback já estruturado, gerando recompra e novos clientes de forma orgânica","comunicavel":true,"impacto":"medio"},{"id":"F9","descricao":"Maior audiência digital própria entre os 3 concorrentes diretos confirmada externamente — Hyla 47-49 mil seguidores vs. Vivenso 25 mil vs. maior conta da Rainbow 19 mil — mesmo com a Rainbow tendo 30 anos de mercado","comunicavel":true,"impacto":"medio-alto"},{"id":"F10","descricao":"Plano de carreira de associados já é sofisticado no papel (5 níveis, Fast Track, Acelerador de Produção, comissionamento em rede, cashback em pontos) — competitivo ou superior ao benchmark internacional conhecido publicamente; o problema não é o desenho do incentivo","comunicavel":false,"impacto":"medio"}],"fraquezas":[{"id":"Fr1","descricao":"CRM inexistente de fato — o C2S distribui leads (emprestado do setor imobiliário) mas não gerencia funil nem nutre","urgencia":"critica"},{"id":"Fr2","descricao":"Dados de funil com só ~70-75% de precisão reconhecida pela própria equipe — decisões por estimativa, não por dashboard","urgencia":"critica"},{"id":"Fr3","descricao":"Capacidade de demonstração limitada — só ~35-50 associados ativos de mais de 100 cadastrados — é o gargalo físico da conversão, não o produto ou a oferta","urgencia":"critica"},{"id":"Fr4","descricao":"Site/e-commerce tecnicamente fraco (WordPress + WooCommerce + Elementor, avaliado como 'cheio de gambiarras' pelo próprio operador V4)","urgencia":"alta"},{"id":"Fr5","descricao":"SEO fraco — reconhecido pela própria equipe, risco crescente com buscas comparativas via IA generativa","urgencia":"alta"},{"id":"Fr6","descricao":"Recrutamento de associadas tratado como employer branding secundário (posts esporádicos), não como funil estruturado de aquisição","urgencia":"alta"},{"id":"Fr7","descricao":"Sem pós-venda/nutrição automatizada — recompra e revisão dependem de SAC manual, não escalável","urgencia":"media"},{"id":"Fr8","descricao":"Já testaram dobrar o orçamento de mídia sem ganho proporcional, sem ter diagnosticado a causa","urgencia":"media"},{"id":"Fr9","descricao":"Infraestrutura de suporte ao associado muito mais fraca que o benchmark internacional da própria marca: zero piso de renda nos primeiros meses, nenhuma mensagem explícita de que recrutar não tira nada do recrutado, sem cadência formal de treinamento/reunião, sem cargo de entrada 100% remoto, sem página/código de afiliado rastreável no e-commerce — a Hyla França tem as cinco coisas (ver outputs/canal-associados-benchmark-franca.md)","urgencia":"alta"}],"oportunidades":[{"id":"O1","descricao":"Recrutar associadas a partir da própria base de clientes satisfeitas — ICP de candidata a associada é, em essência, o mesmo ICP de consumidora (mulher classe A, mesma rede de indicação)","janela":"imediata","impacto":"alto"},{"id":"O2","descricao":"Posicionamento de saúde (alergia/asma/rinite) ainda pouco ocupado pelos concorrentes diretos — janela para ser 'a marca da saúde', não 'a marca da limpeza'","janela":"imediata","impacto":"alto"},{"id":"O3","descricao":"Mercado nacional pouco explorado — potencial estimado de até 21 milhões de pessoas (10% dos 210 milhões de brasileiros), hoje servido por poucas marcas sérias","janela":"medio prazo","impacto":"alto"},{"id":"O4","descricao":"Benchmark Hyla França — modelo híbrido tradicional+digital saiu de ~100-150/mês para 1.000+/mês investindo em time de associados, caminho já validado dentro da própria marca global","janela":"medio prazo","impacto":"alto"},{"id":"O5","descricao":"SEO e buscas comparativas via IA generativa (ChatGPT/Gemini) — usuários já pesquisam 'qual aspirador é melhor' antes de decidir; quem ocupar esse espaço primeiro ganha vantagem duradoura","janela":"curto prazo","impacto":"medio-alto"},{"id":"O6","descricao":"Digitalizar reativação de associadas inativas (alta volatilidade hoje tratada de forma informal) e comissionamento — ganho rápido sem depender de recrutar gente nova","janela":"imediata","impacto":"medio-alto"},{"id":"O7","descricao":"CRM de pós-venda/recompra de acessórios — recorrência de até 5 anos já comprovada na prática, mas sem sistematização","janela":"curto prazo","impacto":"medio"},{"id":"O8","descricao":"Parcerias com influenciadores e veículos editoriais de saúde/bem-estar — já tiveram cobertura gratuita na pandemia (Exame, Gazeta do Povo), espaço para repetir de forma deliberada","janela":"medio prazo","impacto":"medio"},{"id":"O9","descricao":"Nenhum dos 3 concorrentes diretos (Hyla, Rainbow, Vivenso) tem locação oficial do equipamento — existe demanda latente confirmada por mercados paralelos de terceiros (Bricolib/Kiwiiz na França, LOCLAV no Brasil para a Vivenso) que nenhuma marca capturou ainda. Ser a primeira a oferecer oficialmente reduz a fricção de preço sem precisar baixar o ticket da venda","janela":"medio prazo","impacto":"medio"},{"id":"O10","descricao":"Adotar mecanismos concretos já validados pela Hyla França no programa de associados: piso de renda nos primeiros meses, regra explícita de que recrutar não tira nada do recrutado, cadência fixa de treinamento/suporte (semanal + mensal), cargo de entrada 100% remoto ('associada digital'), e página/código de afiliado rastreável no e-commerce. Não depende de redesenhar a comissão (F10) — depende de construir a infraestrutura em volta dela","janela":"curto prazo","impacto":"alto"}],"ameacas":[{"id":"A1","descricao":"Hyla Plus (fundada pelo ex-sócio/cunhado após a cisão societária) é concorrente direto interno, importa a mesma máquina e ganha relevância digital com o tempo","probabilidade":"alta","impacto":"alto"},{"id":"A2","descricao":"Alta volatilidade da equipe de associadas (saem e voltam por motivos pessoais) ameaça justamente o recurso que já é o gargalo da operação (capacidade de demonstração)","probabilidade":"alta","impacto":"alto"},{"id":"A3","descricao":"Conferência da matriz na Alemanha (17-24/06, em andamento) pode definir rebranding visual global que invalida materiais de marca/criativos já planejados no curto prazo","probabilidade":"alta","impacto":"medio"},{"id":"A4","descricao":"Rainbow disputa a mesma demonstração na casa do cliente, com vendedores falando mal da Hyla diretamente (relatado pelo próprio time) — confirmado externamente por padrão consistente de reclamação sobre venda agressiva (Reclame Aqui, Fórum da Casa, Portal da Queixa Portugal). Ameaça de comportamento de venda e prestígio histórico de marca (30 anos), não de preço ou presença digital — nesses dois pontos a Hyla já está na frente (ver F9 e outputs/concorrente-rainbow-analise.md)","probabilidade":"alta","impacto":"medio"},{"id":"A7","descricao":"Vivenso (Pro-Aqua) é concorrente de preço genuíno — confirmado externamente em R$6.500-9.990, 30-45% mais barato que a Hyla (R$12.000-14.500), gap maior do que a estimativa interna de ~15% sugeria. Reputação pública mais limpa que a Rainbow — não há vulnerabilidade de comportamento de venda pra explorar, a disputa é só de valor percebido (ver outputs/concorrente-vivenso-analise.md)","probabilidade":"media-alta","impacto":"medio-alto"},{"id":"A8","descricao":"Exposição cambial/política de importação — produto importado, sujeito a variação de custo fora do controle da empresa","probabilidade":"media","impacto":"alto se ocorrer"},{"id":"A9","descricao":"Pequenos concorrentes oportunistas entram e saem do mercado, capturando vendas pontuais por preço","probabilidade":"media","impacto":"baixo-medio"}],"combinacoes_estrategicas":{"forca_oportunidade":[{"combo":"F4+F6 × O1","descricao":"A demonstração que já converte bem (F4) e o comissionamento forte (F6) são, juntos, o argumento de recrutamento pronto — falta só direcioná-lo às clientes satisfeitas certas, em vez de tratá-lo como conteúdo orgânico esporádico."},{"combo":"F1+F7 × O2","descricao":"Tecnologia patenteada + pilares de saúde = posicionamento autêntico e defensável como 'a marca da saúde', diferente de qualquer concorrente que vende só 'limpeza'."},{"combo":"F5 × O5","descricao":"A audiência de 47-49 mil seguidores já existe e pode ser direcionada para conteúdo de SEO/IA generativa sobre saúde e alergia, capturando demanda de quem pesquisa comparativos antes de decidir."},{"combo":"F3+F2 × O8","descricao":"17 anos de marca + garantia vitalícia são prova de solidez que facilita parcerias editoriais/influenciadores de saúde e bem-estar."},{"combo":"F9 × O10","descricao":"A maior audiência digital entre os 3 concorrentes diretos (F9) já dá à Hyla a base de candidatas/clientes satisfeitas necessária pra fazer o cargo de 'associada digital' (O10) decolar rápido — a audiência existe, falta só o cargo e a infraestrutura."},{"combo":"F10 × O10","descricao":"O plano de carreira já é competitivo (F10) — não precisa ser redesenhado, precisa ganhar a infraestrutura de suporte que falta (O10): piso de renda, regra anti-conflito comunicada, cadência de treinamento, cargo remoto."}],"fraqueza_oportunidade":[{"combo":"Fr1+Fr2 × O7","descricao":"Implementar CRM antes de escalar qualquer mídia — cada venda nova entra num sistema de recompra desde o início, em vez de depender de SAC manual."},{"combo":"Fr3+Fr6 × O1+O4","descricao":"O gargalo de capacidade de demonstração (Fr3) e o recrutamento subaproveitado (Fr6) são o mesmo problema visto de dois ângulos — tratar recrutamento com a mesma estrutura de funil do consumidor final resolve os dois de uma vez, seguindo o caminho já validado pela Hyla França."},{"combo":"Fr5 × O5","descricao":"SEO fraco hoje é justamente a fraqueza que a oportunidade de buscas via IA generativa torna mais urgente de corrigir — quem corrigir primeiro ocupa o espaço."},{"combo":"Fr9 × O10","descricao":"A infraestrutura de suporte ao associado que falta (Fr9) tem solução concreta e testada — não é hipótese, é o que a própria Hyla França já roda (O10). É a fraqueza com o caminho de correção mais claro de toda a SWOT."}],"fraqueza_ameaca":[{"combo":"Fr3 × A2","descricao":"Capacidade de demonstração já é gargalo E a equipe que demonstra é volátil — sem uma ação deliberada de recrutamento e retenção, qualquer crescimento de demanda esbarra duas vezes no mesmo limite."},{"combo":"Fr4+Fr5 × A1","descricao":"Site fraco e SEO fraco, justamente enquanto a concorrente interna (Hyla Plus) ganha espaço digital — risco de perder posição online exatamente onde a Hyla do Brasil está mais vulnerável."},{"combo":"Fr2 × A3","descricao":"Decisões sem dados confiáveis (Fr2) tornam mais arriscado reagir rápido a uma eventual mudança de identidade visual global (A3) — sem saber o que funciona hoje, fica mais difícil saber o que vale a pena refazer depois da conferência."},{"combo":"Fr3 × A7","descricao":"Quando o cliente compara com a Vivenso, a objeção é preço — e se a Hyla não tiver associada disponível pra demonstrar rápido e justificar o valor mais alto (Fr3), a venda vai pro concorrente mais barato por falta de prova, não por falta de argumento."}]},"alavanca_prioritaria":{"descricao":"A Hyla tem dois problemas que parecem separados mas são o mesmo: não sabe medir o que funciona (Fr1+Fr2) e não consegue demonstrar o produto na escala que a demanda pediria (Fr3). Resolver recrutamento de associadas com a mesma estrutura de funil/CRM do consumidor final ataca os dois de uma vez — e usa exatamente a audiência (clientes satisfeitas) que a empresa já tem. O benchmark da Hyla França (O10) tira isso do campo da hipótese: não é 'recrutar mais', é replicar 5 mecanismos concretos que a própria marca já roda em outro país — piso de renda inicial, regra explícita de que recrutar não tira nada do recrutado, cadência fixa de treinamento/suporte, cargo de entrada 100% remoto, e página de afiliado rastreável no e-commerce. O plano de carreira em si (F10) já está pronto — o que falta é a infraestrutura em volta dele.","objecoes_e_respostas":[{"objecao":"Não sabemos se vale investir mais em mídia","resposta":"CRM real antes de escalar — sem isso, qualquer aumento de orçamento repete o erro já cometido (dobrar budget sem dobrar resultado)"},{"objecao":"Capacidade de demonstração é o gargalo, não a demanda","resposta":"Tratar recrutamento de associadas ('Hyla do Brasil Business') com o mesmo rigor de campanha, formulário e funil que a aquisição de clientes já tem — usando os 5 mecanismos já validados pela Hyla França (O10), não um programa novo do zero"},{"objecao":"A Hyla Plus (concorrente interno) está ganhando espaço digital","resposta":"Ocupar agora o posicionamento de saúde/autoridade (F1+F7) antes que a concorrente o faça — é um território ainda livre"},{"objecao":"A Vivenso é mais barata, por que pagar mais pela Hyla?","resposta":"Demonstração rápida e disponível é a prova que justifica o preço — sem associada disponível na hora, a objeção de preço vence por falta de prova, não por falta de argumento (Fr3 × A7)"}],"meta_referencial":"Se a Hyla sair de ~50 para ~70-100 associadas ativas nos próximos meses (sem necessariamente aumentar o orçamento de mídia), a venda mensal sobe proporcionalmente — de 70-80 para a faixa de 100-150 máquinas que o próprio cliente já definiu como meta. Complemento de menor escopo: oferecer locação oficial (O9) seria a primeira marca do segmento a fazer isso — nenhum dos 3 concorrentes diretos tem programa próprio, só mercados paralelos de terceiros confirmando a demanda."},"alimenta_skills":["ee-s2-posicionamento","ee-s1-auditoria-comunicacao","ee-s3-crm-setup","ee-s3-brandbook"]},"ee-s2-diagnostico-criativos":{"client_name":"Hyla do Brasil","skill":"ee-s2-diagnostico-criativos","generated_at":"2026-07-08","data_source":"Apresentação de design 'HYLA DO BRASIL - DPMV - DESIGN.pptx' (Natália Terciotti, designer V4/SCN&Co) + narração completa (TEXTO HYLA DIAGNOSTICO DESIGN.md) + transcrição da reunião ao vivo [S3] de 08/07/2026 (Anotações do Gemini), todos em base-de-conhecimento/. Cruzado com ee-s1-auditoria-comunicacao, ee-s1-persona-icp, ee-s2-posicionamento e ee-s2-diagnostico-midia.","summary":"As fotografias da Hyla já são um diferencial real — avaliadas como superiores à concorrência direta (Rainbow, Vivenso) — mas falta um sistema de identidade visual (tipografia, paleta, composição consistentes) que amarre isso em algo reconhecível sem depender do logo. Nos 2 criativos de tráfego pago avaliados em detalhe, o problema é o mesmo dos dois: falta CTA explícito e a marca aparece discreta demais. A nova identidade internacional da Hyla (lançamento oficial confirmado para 13/08/2026) aponta a direção: menos elementos, mais espaço negativo, fotografia editorial, mensagem de 'estilo de vida' em vez de 'como limpar'.","summary_headline":"Hyla já tem o ativo mais difícil de construir (fotografia real, ambientes bons) — falta o sistema que transforma isso em identidade reconhecível sem depender do logo.","summary_highlights":[{"category":"maturidade","label":"Criativos de tráfego pago avaliados","value":"2 (detalhado)","subtext":"Ambos com veredito 'otimizar' — score médio 16,5/25","tone":"yellow"},{"category":"oportunidade","label":"Diferencial já existente","value":"Fotografia","subtext":"Avaliada como superior à Rainbow e Vivenso pela própria designer","tone":"green"},{"category":"risco","label":"CTA em criativos pagos","value":"Ausente","subtext":"Nos 2 criativos analisados, nenhum tem chamada para ação explícita","tone":"red"},{"category":"competicao","label":"Concorrentes (Rainbow, Vivenso)","value":"Mesmo patamar","subtext":"Nenhum executa a linguagem 'quiet luxury' que a Hyla Internacional já validou","tone":"blue"},{"category":"janela","label":"Lançamento oficial da nova marca","value":"13/08/2026","subtext":"Workshop confirmado na reunião — manual, fontes e diretrizes chegam nessa data","tone":"blue"}],"summary_key_findings":[{"category":"vantagem","text":"As fotografias da Hyla já são um diferencial real (avaliadas por Natália como superiores à concorrência) — o problema não é o material bruto, é a falta de um sistema (tipografia, paleta, composição) que una as peças em identidade reconhecível."},{"category":"ameaca","text":"Rainbow usa imagens geradas por IA com aspecto artificial e muda a identidade visual completamente em datas comemorativas; Vivenso tem baixa diferenciação sem o logo. Nenhum dos dois executa a linguagem 'quiet luxury' da nova Hyla Internacional — mas a Hyla Brasil também ainda não. A janela está aberta para os dois lados."},{"category":"acao","text":"Os 2 criativos de tráfego pago avaliados compartilham o mesmo problema: ausência de CTA explícito e marca pouco presente. São ajustes rápidos ('o designer não vai levar 10, 15 minutos', nas palavras da Natália) e não dependem da chegada do manual oficial (13/08) para serem testados."},{"category":"contexto","text":"A reunião revelou dois problemas técnicos fora do escopo de design que impactam diretamente a mídia paga: o site foi hackeado recentemente (conteúdo de apostas/cassino injetado, chegou a bloquear as campanhas do Google — já resolvido) e as tags de rastreamento não estão centralizadas no GTM (Analytics isolado). Na própria reunião, o coordenador da V4 (Lucas Calefi) já repassou ao vivo para o cliente o achado de ee-s2-diagnostico-midia sobre conversões mal configuradas — inclusive citando o mesmo exemplo (page_view sendo contado como 'conversão boa') — mostrando que o diagnóstico de mídia já está sendo operacionalizado na conversa com o cliente."}],"total_creatives_analyzed":2,"average_score":16.5,"counts":{"keep_count":0,"optimize_count":2,"eliminate_count":0},"creative_matrix_note":"Natália avaliou qualitativamente (não em escala numérica) — os scores hook/clareza/ICP/CTA/visual abaixo são uma tradução interpretativa dessa avaliação qualitativa para o formato padrão da skill, marcados estimated:true. A amostra é pequena (2 criativos detalhados na apresentação, não um lote completo de biblioteca de anúncios) — recomenda-se uma rodada futura avaliando o restante da conta de anúncios ativa.","creative_matrix":[{"creative_name":"Anúncio estático — 'Livre das alergias' (benefícios + produto)","type":"Estático","format":"Imagem única","verdict":"otimizar","estimated":true,"hook_score":4,"clarity_score":4,"icp_coherence_score":3,"cta_score":2,"visual_score":3,"total_score":16,"main_issue":"Sem CTA explícito no criativo (só o botão automático da plataforma) e baixo contraste em textos secundários — especialmente 'livre das alergias' — prejudicando a leitura no celular, onde a maioria vê o anúncio.","preview":{"source":"unavailable","note":"Referenciado na apresentação de design (PPT), sem link/arquivo de imagem individual disponível neste momento."}},{"creative_name":"Vídeo — Antes/depois (sujeira acumulada)","type":"Vídeo","format":"Reels/Feed","verdict":"otimizar","estimated":true,"hook_score":5,"clarity_score":4,"icp_coherence_score":3,"cta_score":2,"visual_score":3,"total_score":17,"main_issue":"Hook forte (antes/depois desperta curiosidade e prende atenção nos primeiros segundos — ponto mais elogiado da análise), mas sem CTA de fechamento, marca pouco presente (sem vinheta/logo no encerramento), e testado com trilha sonora em versão desalinhada ao posicionamento (a versão com a música 'Lula Young', mais intensa/tensa, performou pior; a versão vencedora real já usa uma música instrumental alegre, mais leve).","preview":{"source":"unavailable","note":"Referenciado na apresentação de design (PPT), sem link/arquivo de vídeo individual disponível neste momento."}}],"competitor_analysis":[{"name":"Vivenso Brasil","strategy_observed":"Feed organizado, paleta de cores consistente entre publicações, uso forte de fotografias reais de pessoas utilizando o produto em ambientes do dia a dia — gera naturalidade e credibilidade.","hook_pattern":"Fotografias reais de uso do produto no cotidiano (não apenas produto em fundo neutro).","what_to_avoid":"Falta de elementos visuais exclusivos — sem o logotipo, difícil identificar que o conteúdo é da Vivenso. Diagramação irregular em posts com muito texto (elementos grudados ou espaço excessivo). Elementos gráficos genéricos, estilo 'template pronto', que reduzem a percepção de produto premium.","gap_para_cliente":false,"note":"Análise de presença orgânica no Instagram (não confirmada como biblioteca de anúncios pagos ativos). Segundo Natália, Vivenso e Rainbow estão em nível visual semelhante entre si — evoluir a identidade da Hyla não exige um esforço desproporcional para superá-los."},{"name":"Grupo Rainbow","strategy_observed":"Feed organizado e bem produzido, transmite profissionalismo, mas o reconhecimento da marca depende muito da repetição da cor azul e da presença constante do produto em destaque — não de um sistema de identidade próprio.","what_to_avoid":"Falta de padronização tipográfica (mistura fonte manuscrita, serifada e sem serifa entre posts). Uso frequente de imagens geradas por IA com aspecto artificial (cores muito saturadas, iluminação exagerada, cenários pouco naturais) — reduz a percepção de sofisticação. Identidade visual muda completamente em campanhas temáticas/comemorativas, desconectando esses posts do restante do feed.","gap_para_cliente":false,"note":"Análise de presença orgânica no Instagram (não confirmada como biblioteca de anúncios pagos ativos)."}],"patterns_identified":[{"pattern":"Falta de sistema de identidade visual unificador","example":"Se o logotipo é retirado de vários posts do Instagram da Hyla, fica difícil identificar rapidamente que o conteúdo é da marca — falta consistência de tipografia, fotografia e composição que una as peças."},{"pattern":"Posts estáticos institucionais bem construídos, mas isolados no feed","example":"Existe um intervalo muito grande entre um post estático e outro por causa do alto volume de vídeos — a linguagem visual que já existe (boa) se perde por falta de repetição/frequência, não por qualidade."},{"pattern":"Identidade visual desaparece em datas comemorativas","example":"Tipografia, paleta e diagramação mudam completamente em posts de Dia das Mães/Natal — o usuário entende que é um post de data comemorativa, mas não que é da Hyla especificamente."},{"pattern":"Excesso de informação disputando atenção no site institucional","example":"O banner principal do site comunica produto, selo, título grande, subtítulo, vários textos, menu e botão de ação simultaneamente, sem hierarquia clara — diferente da referência internacional, que foca em uma ideia principal por vez."}],"production_briefing":{"hook_direction":"Focar na experiência e no resultado (bem-estar, qualidade de vida, conforto), não no ato de limpar em si ou em especificações técnicas — a mudança de mensagem é de 'veja como limpar' para 'veja a vida que você pode viver'.","priority_format":"Vídeo (Reels/Stories) com fotografia editorial e iluminação natural consistente, gravado organicamente (a matriz internacional proíbe uso de IA em vídeos de demonstração — já fiscalizado ativamente). Manter posts estáticos institucionais para datas comemorativas e conteúdo educativo, mas com frequência maior para não se perderem entre os vídeos.","visual_elements":["Espaço negativo generoso (linguagem 'quiet luxury')","Tipografia serifada para peças editoriais/institucionais, combinada com a fonte sans atual para o dia a dia","Paleta com tons mais escuros/elegantes para criar contraste em datas comemorativas e campanhas","CTA explícito em todo criativo de tráfego pago ('Agende uma demonstração', 'Saiba mais', 'Conheça a Hyla')","Vinheta de fechamento com logotipo em vídeos (preferível a vinheta de abertura)","Trilha sonora instrumental e suave (piano, jazz leve, bossa nova contemporânea) em vez de músicas intensas ou agitadas","Elementos principais dentro da margem de segurança, posicionados mais para cima na tela (o olhar do usuário começa pela parte superior)"],"avoid_elements":["Imagens focando no problema (pessoas espirrando, nariz entupido, incômodo) — focar no resultado/solução (respirar fundo, bem-estar)","Trends populares genéricas desalinhadas com um produto premium de ticket alto","Uso de IA em vídeos de demonstração de produto — proibido pela matriz internacional e ativamente monitorado no Instagram da Hyla Brasil","Variação de tipografia entre posts e capas de vídeo","Mudança completa de identidade visual em campanhas comemorativas — a identidade deve continuar presente mesmo com o tema sazonal","Imagens de baixa qualidade ou com aspecto de montagem em posições de destaque (ex.: seção final da landing page, hoje avaliada como pixelada)"]},"key_insight":{"headline":"O maior ganho não é mudar peça por peça — é seguir o exemplo da própria Hyla Internacional: fazer o cliente reconhecer a marca pela fotografia, tipografia e direção de arte, mesmo sem ver o logo.","context":"A conclusão da própria análise de design resume bem: o desafio da Hyla não está no produto, que já é excelente, nem na fotografia, que já é um diferencial — está em construir um sistema visual consistente o suficiente para que qualquer peça, em qualquer canal, seja reconhecida como Hyla antes mesmo de aparecer o logotipo.","numbered_reasons":["A Hyla já tem o ativo mais difícil de construir: fotografias com boa iluminação natural e ambientes reais, avaliadas como diferencial frente aos concorrentes diretos (Rainbow usa muita imagem gerada por IA com aspecto artificial) — falta só o sistema que amarre tudo.","Rainbow e Vivenso estão no mesmo patamar visual entre si, e nenhum dos dois executa a linguagem 'quiet luxury' que a Hyla Internacional já validou globalmente — a janela de diferenciação está aberta, e superá-los não exige um esforço desproporcional.","O lançamento oficial da nova identidade (workshop confirmado para 13/08/2026) dá um prazo real para consolidar o manual — mas os ajustes de criativos de tráfego pago (CTA, trilha sonora, vinheta de fechamento) são rápidos e não dependem de esperar a marca oficial para começar a ser testados."],"discussion_anchor":"Vale validar com Davi/Fábio se a produção de criativos de tráfego pago (CTA, áudio, vinheta) pode começar a ser testada já, em paralelo à espera do manual oficial de 13/08 — são ajustes que, segundo a própria Natália, um designer resolve em poucos minutos e não dependem da identidade visual nova para funcionar."},"honesty_alert":"Este output cobre especificamente a seção de 'Análise de Criativos para Tráfego Pago' da apresentação de design da Natália — a apresentação completa é bem mais ampla (identidade visual orgânica no Instagram, análise de concorrentes, site institucional, landing page) e alimenta outras skills que ainda não foram atualizadas com esse material: ee-s2-diagnostico-organico-ig (posts/feed), ee-s2-diagnostico-cro (site e landing page) e possivelmente ee-s3-identidade-visual, que estava marcada como bloqueada até a definição da conferência da matriz — a reunião confirmou que a definição já aconteceu e o lançamento oficial está marcado para 13/08/2026, o que pode desbloquear essa skill. Os scores do creative_matrix (hook/clareza/ICP/CTA/visual) são interpretação própria da análise qualitativa da Natália, não notas numéricas atribuídas por ela — marcados estimated:true. Apenas 2 criativos de tráfego pago foram detalhados na apresentação (não uma varredura completa da biblioteca de anúncios ativa da conta).","alimenta_skills":["ee-s2-diagnostico-organico-ig","ee-s2-diagnostico-cro","ee-s3-identidade-visual","ee-s3-brandbook","ee-revisao-semanal"]},"ee-s2-diagnostico-cro":{"client_name":"Hyla do Brasil","skill":"ee-s2-diagnostico-cro","generated_at":"2026-07-08","data_source":"PageSpeed Insights (relatórios completos em PDF, lab + campo, mobile + desktop) para a home (hyladobrasil.com.br) e para a landing page de anúncios (aspirador-hyla-do-brasil/) — fornecidos pelo operador. Export do GA4 'Páginas e telas' (período completo 1/jan-7/jul e últimos 90 dias) — fornecido pelo operador. Estrutura/copy da landing page extraída diretamente do HTML (WebFetch + curl) pelo assistente. Headers de segurança verificados via curl -I. Cruzado com ee-s2-diagnostico-criativos (análise de design da Natália sobre a mesma landing page) e ee-s2-diagnostico-midia (achado de tracking).","summary":"A landing page de anúncios (score PageSpeed 43-44/100) está tecnicamente melhor que a home institucional (score 20-22/100, LCP de laboratório de 21,1 segundos em mobile), mas ainda reprovada nas Core Web Vitals reais de usuário (LCP 4,1s, 'reprovado'). O tempo médio de engajamento na LP é de apenas ~4 segundos — extremamente baixo, consistente com abandono antes do carregamento completo, especialmente em mobile (82,5% do tráfego pago vem daí, ver ee-s2-diagnostico-midia). Achado mais grave, fora do escopo técnico usual: centenas de URLs de spam (`/3ytn/...`) aparecem no relatório de tráfego do GA4, com títulos completamente alheios ao negócio — resíduo do hackeamento do site (conteúdo de apostas/cassino) mencionado pelo próprio time na reunião de 08/07. Copy e estrutura da LP já foram bem avaliadas por Natália (ee-s2-diagnostico-criativos); este diagnóstico foca no que é técnico e quantificável.","summary_headline":"A landing page carrega 2,18MB de JavaScript não usado e reprova nas Core Web Vitals reais — e o site ainda carrega resíduo de spam do hackeamento recente.","summary_highlights":[{"category":"risco","label":"Performance mobile (LP)","value":"43/100","subtext":"LCP real 4,1s (reprovado) — LCP de laboratório 6,5s","tone":"red"},{"category":"risco","label":"Performance mobile (home)","value":"20/100","subtext":"LCP de laboratório 21,1s(!), CLS 0,183 — pior que a LP","tone":"red"},{"category":"risco","label":"JS não utilizado (LP)","value":"2,18 MB","subtext":"Maior oportunidade de otimização técnica identificada","tone":"red"},{"category":"maturidade","label":"Tempo médio de engajamento (LP)","value":"~4 segundos","subtext":"GA4, período completo e últimos 90 dias — muito baixo","tone":"red"},{"category":"risco","label":"Segurança — spam residual","value":"150+ URLs","subtext":"Páginas de spam indexadas, resíduo do hackeamento do site","tone":"red"},{"category":"oportunidade","label":"SEO on-page","value":"100/100","subtext":"Title, meta description, alt em imagens, schema.org — todos ok na LP","tone":"green"}],"summary_key_findings":[{"category":"ameaca","text":"A landing page reprova nas Core Web Vitals de usuário real: LCP de 4,1s (o limite 'bom' é 2,5s). O teste de laboratório mostra a causa raiz: 2,18MB de JavaScript não utilizado e 670-930ms de Total Blocking Time."},{"category":"ameaca","text":"A home institucional está em situação ainda pior — LCP de laboratório de 21,1 segundos em mobile e CLS de 0,586 (o limite 'bom' é 0,1, ou seja, a página 'pula' muito durante o carregamento). Isso reforça o achado já registrado em ee-s1-diagnostico-maturidade sobre a stack WordPress + Elementor."},{"category":"ameaca","text":"Centenas de URLs de spam (pasta /3ytn/, títulos sem qualquer relação com o negócio, ,"desktop":null,"divergences":[]},"security_headers":{"https":true,"hsts":false,"csp":false,"x_frame_options":false,"x_content_type_options":null,"referrer_policy":null,"permissions_policy":null,"score":2,"issues":["Header HSTS presente mas com max-age=0 — efetivamente DESATIVADO (provável erro de configuração, não ausência intencional)","Sem Content-Security-Policy (CSP) — sem proteção contra XSS","Sem X-Frame-Options — página vulnerável a clickjacking","22-23 solicitações HTTP não seguras (mixed content) detectadas pelo PageSpeed em ambas as páginas testadas","4 cookies de terceiros detectados na landing page"]},"technical_diagnosis":{"pagespeed_mobile":43,"pagespeed_desktop":44,"lcp":6.5,"critical_issues":["LCP mobile real de usuários é 4,1s (reprovado pelo Core Web Vitals) e sobe para 6,5s no teste de laboratório — a landing page está lenta o suficiente para perder usuários antes da oferta carregar.","2,18MB de JavaScript não utilizado carregado na página (2.174-2.182 KiB, mobile e desktop) — provável causa raiz da lentidão.","Tempo médio de engajamento na landing page é de apenas ~4 segundos (GA4) — extremamente baixo, consistente com abandono antes do carregamento completo.","HTTPS mal implementado: 22-23 solicitações inseguras, HSTS com max-age=0 (efetivamente desativado) — Best Practices cai para 54/100 na LP.","A home institucional está em situação pior que a landing page: Performance 20/100 mobile, LCP de laboratório de 21,1 segundos(!), CLS de 0,586 — o site institucional está tecnicamente mais quebrado que a página de anúncios.","Centenas de URLs de spam (pasta /3ytn/) aparecem no tráfego do GA4 — resíduo do hackeamento do site já confirmado pelo time (conteúdo de apostas/cassino que chegou a bloquear campanhas do Google)."],"estimated_conversion_loss":"Não é possível estimar em taxa de conversão porque nenhum evento de lead está mensurável hoje (ver ee-s2-diagnostico-midia). Mas o tempo de engajamento de ~4s na LP é um proxy forte de abandono precoce — e 82,5% do tráfego pago do Google vem de mobile, exatamente o dispositivo com a pior performance (score 43, LCP reprovado)."},"current_conversion_rate":null,"current_bounce_rate":null,"avg_time_on_page":4.0,"unavailable_reason":"current_conversion_rate e current_bounce_rate não estão disponíveis: nenhum evento de conversão confiável existe hoje no GA4 (ver ee-s2-diagnostico-midia, achado #1) e o novo GA4 não expõe 'taxa de rejeição' diretamente no relatório fornecido — usou-se 'tempo médio de engajamento por usuário ativo' como proxy disponível (4,02s no período completo, 4,35s nos últimos 90 dias, ambos na landing page).","security_incident_finding":{"headline":"Resíduo do hackeamento do site ainda aparece no tráfego do GA4 — centenas de URLs de spam indexadas","evidence":"No export completo de páginas do GA4 (1/jan a 7/jul/2026), mais de 150 URLs distintas sob o caminho /3ytn/ recebem tráfego (1-2 visualizações cada), com títulos de página totalmente alheios ao negócio da Hyla — temas aleatórios em inglês (leetcode, carros, imóveis) e, em alguns casos, conteúdo adulto explícito. Isso é consistente com o relato do próprio time na reunião de 08/07: o site foi hackeado com conteúdo de apostas/cassino injetado via WordPress, o que chegou a bloquear as campanhas do Google Ads. O time já reportou a correção do bloqueio das campanhas, mas essas URLs de spam continuando a receber tráfego (mesmo que baixo) sugerem que a limpeza pode não ter sido completa — ou que o Google ainda tem essas páginas indexadas e residualmente enviando tráfego orgânico/direto.","impact":"Risco de reputação de domínio (o Google pode penalizar ou até remover o site inteiro do índice se identificar conteúdo malicioso ativo), desperdício de 'crawl budget' do Googlebot em páginas irrelevantes, e risco reputacional caso um usuário real caia em uma dessas páginas.","recommended_action":"Prioridade máxima, antes de qualquer otimização de CRO: (1) confirmar com o time de dev/hosting que a limpeza do hack foi completa (não só o bloqueio de campanhas resolvido), (2) rodar uma varredura de malware no servidor, (3) submeter as URLs de spam para remoção no Google Search Console, (4) verificar se há mais pastas suspeitas além de /3ytn/."},"copy_audit":{"url_tested":"https://hyladobrasil.com.br/aspirador-hyla-do-brasil/","above_the_fold":{"headline":"HYLA do Brasil: O aspirador de pó que vai além da limpeza","subheadline":"O ar dentro da sua casa pode ser até 5 vezes mais poluído do que o ar externo — poeira, ácaros e fungos se acumulam em colchões, sofás, tapetes e no ar","cta_text":"Agendar uma demonstração","assessment":"Headline e subheadline já refletem o território de saúde respiratória definido em ee-s2-posicionamento — ponto positivo. Consistente com o achado de Natália (ee-s2-diagnostico-criativos) de que o formulário só aparece no final; a primeira dobra hoje é só mensagem, sem captura de dados."},"sections_in_order":["Hero com promessa do produto","Benefícios centrais (limpeza profunda, aliado da saúde, líder de mercado, sustentabilidade)","Onde você pode usar o HYLA (aplicações)","Depoimentos de clientes (8 avaliações nomeadas)","Processo em 3 passos","FAQ (11 perguntas)","Selos de confiança/certificações","Formulário de captação de lead","Rodapé com contato"],"lead_form_fields":["Nome","E-mail","Telefone","Estado (dropdown)","Cidade","Assunto","Checkbox: Quero uma demonstração HYLA"],"issues":["Formulário só aparece no final da página (já sinalizado por Natália) — usuários com intenção de conversão imediata precisam rolar toda a página","7 campos no formulário (incluindo Assunto e checkbox) — mais atrito que o necessário para o topo do funil; poderia haver uma versão curta na primeira dobra (nome + telefone) e a versão completa mantida no final","Meta description (158 caracteres) está no limite superior do ideal para SERP — risco de truncamento em alguns dispositivos"]},"trust_analysis":{"signals_present":["Certificação INMETRO","Certificação SIMA","Certificação ZPMED","Certificação ISO 9001","Aprovação de tecnologia alemã","\"Presente em mais de 80 países\"","8 depoimentos de clientes nomeados"],"gaps":["Selos de confiança aparecem só perto do formulário, no fim da página — um usuário que abandona antes disso nunca os vê","Nenhum selo de segurança do site (cadeado/certificado SSL destacado) visível — relevante dado que o Chrome pode exibir aviso de 'site não totalmente seguro' por causa do HSTS desativado e conteúdo misto"],"security_trust_issue":"O problema de segurança técnica (HSTS desabilitado, sem CSP, conteúdo misto) é visto pelo navegador ANTES de qualquer selo de confiança do rodapé — em navegadores mais rigorosos, isso pode gerar avisos visuais que minam a confiança antes mesmo do usuário ler a primeira palavra da headline."},"test_hypotheses":[{"id":1,"hypothesis":"Resolver o carregamento de 2,18MB de JS não usado e as solicitações que bloqueiam a renderização deve reduzir o LCP mobile de 6,5s (lab) / 4,1s (campo) para abaixo de 2,5s, aumentando o tempo de engajamento (hoje ~4s) e reduzindo abandono antes da primeira dobra carregar.","priority":"alta","effort":"médio-alto — depende de otimização da stack WordPress/Elementor ou replatforming (já recomendado em ee-s1-diagnostico-maturidade)","expected_impact":"alto"},{"id":2,"hypothesis":"Investigar e limpar a infestação de páginas de spam (pasta /3ytn/, 150+ URLs) deve reduzir risco de penalização/desindexação pelo Google e liberar crawl budget para as páginas reais do negócio.","priority":"alta (segurança, não é opcional)","effort":"médio","expected_impact":"defensivo — evita perda catastrófica, mais que ganho incremental"},{"id":3,"hypothesis":"Ativar HSTS com max-age adequado e eliminar conteúdo misto (HTTP) deve remover avisos de segurança do navegador, aumentando a confiança percebida antes mesmo do usuário rolar a página.","priority":"alta (baixo esforço, alto risco se ignorado)","effort":"baixo","expected_impact":"médio"},{"id":4,"hypothesis":"Mover uma versão curta do formulário (nome + telefone) para a primeira dobra, mantendo o formulário completo no final (sugestão já validada por Natália), deve reduzir o atrito para quem já chega com intenção de conversão.","priority":"média — só testável de forma confiável depois de implementar o evento de conversão dedicado (ver ee-s2-diagnostico-midia, ação P1)","effort":"baixo","expected_impact":"não mensurável ainda, mas plausível"},{"id":5,"hypothesis":"Substituir a imagem de baixa qualidade na seção final da landing page (já identificada por Natália como pixelada/tipo montagem) deve reforçar a percepção de marca premium na última impressão antes da decisão.","priority":"média","effort":"baixo","expected_impact":"médio"}],"wireframe_improvements":["Formulário curto (nome + telefone + cidade) logo na primeira dobra, além do formulário completo já existente no final","Resolver o peso técnico (JS/CSS não usado, cache, render-blocking) antes de qualquer redesenho visual — não faz sentido aplicar a nova identidade (ee-s3-identidade-visual) sobre uma base tecnicamente quebrada","Selo de confiança/certificação visível já na primeira dobra, não só perto do formulário","Substituir a imagem final por fotografia em maior resolução, seguindo o briefing de produção de ee-s2-diagnostico-criativos","Aplicar a nova direção de arte (ee-s3-identidade-visual) só depois do manual oficial chegar (13/08) — evitar redesenhar a página duas vezes seguidas"],"key_insight":{"headline":"A landing page não precisa de mais copy nem de redesign agora — precisa parar de perder gente antes de carregar.","context":"Com LCP real de 4,1s (reprovado) e tempo médio de engajamento de só ~4 segundos, o gargalo hoje é técnico, não de mensagem. A análise de design da Natália já mapeou bem o que fazer visualmente; este diagnóstico mostra que boa parte disso corre risco de não converter enquanto a base técnica (JS não usado, cache, HTTPS mal configurado) continuar quebrada — e o achado de spam residual do hackeamento é ainda mais urgente, por ser risco de penalização, não só de conversão.","numbered_reasons":["82,5% do tráfego pago do Google vem de mobile (ee-s2-diagnostico-midia) — exatamente o dispositivo com performance 43/100 e LCP reprovado","2,18MB de JS não usado é o maior item de oportunidade técnica encontrado — resolver isso tem efeito cascata em LCP, TBT e Speed Index ao mesmo tempo","O resíduo de spam do hackeamento (150+ URLs) é um risco de penalização do Google, não só um problema de conversão — precisa ser tratado com prioridade máxima, antes de qualquer teste de CRO"],"discussion_anchor":"Vale alinhar com Davi/Fábio que a sequência certa é: (1) confirmar limpeza completa do hack e segurança, (2) resolver performance técnica, (3) só depois testar mudanças de copy/layout — na ordem errada, qualquer ganho de mensagem é mascarado pela lentidão e pelo risco de segurança."},"honesty_alert":"Este diagnóstico usa PageSpeed Insights (PDFs completos fornecidos pelo operador, lab + campo) e um export do GA4 'Páginas e telas' (também fornecido pelo operador) — dados reais e confiáveis. Pontos que seguem abertos: (1) current_conversion_rate e current_bounce_rate não estão disponíveis — não existe evento de lead confiável hoje (ver ee-s2-diagnostico-midia) e o export do GA4 fornecido não trouxe taxa de rejeição explícita, usou-se tempo médio de engajamento como proxy; (2) a contagem de 150+ URLs de spam é uma estimativa baseada na amostra visível do export — o número real pode ser maior, e não foi feita uma auditoria completa de todas as pastas do site; (3) lang, favicon, contagem de links internos/externos e response_time_ms não foram verificados nesta rodada; (4) screenshots em alta resolução da página não foram capturados — as miniaturas dos PDFs do PageSpeed têm resolução baixa; (5) os selos de confiança (INMETRO, ISO 9001 etc.) foram identificados pela extração de conteúdo mas não foram verificados quanto à autenticidade/vigência.","alimenta_skills":["ee-s3-landing-page","ee-s3-forecast-midia","ee-revisao-semanal"]},"ee-s2-diagnostico-midia":{"client_name":"Hyla do Brasil","skill":"ee-s2-diagnostico-midia","generated_at":"2026-07-08","data_source":"Google Ads (Performance da campanha, Canais, Conversões, Informações do leilão, Públicos-alvo, Performance dos anúncios, Palavra-chave de pesquisa, Termos de pesquisa, Relatório de grupos de recursos, Relatório de insights sobre termos de pesquisa, Relatório por dispositivos) + Meta Ads (relatório de campanhas/conjuntos/anúncios) — período 1/jan a 6-7/jul/2026, exportados pelo operador para base-de-conhecimento/dados-midia-paga. Complementado por teste ao vivo do operador (Meta Pixel Helper, Google Tag Assistant, GA4 DebugView) e outputs anteriores (ee-s1-persona-icp, ee-s1-swot, ee-s2-posicionamento). client.json.connectors segue sem acesso V4MOS (bloqueio 403 já escalado) — este diagnóstico usa export manual, não conector automático. Revisado em 16/07/2026 incorporando outputs/benchmark-internacional-associados-e-midia.md (Alemanha, Bélgica, EUA, França) e ee-s4-diagnostico-comercial (teste real de cliente oculto) — motivou a reestruturação de budget em duas frentes (consumo concentrado em SP + recrutamento nacional).","data_period":"1 de janeiro a 6-7 de julho de 2026","data_period_months":6,"summary":"A mídia paga da Hyla tem um problema mais grave do que custo de lead: hoje não existe nenhum evento no site que capture, de fato, o envio do formulário de pedido de demonstração. Testamos ao vivo os 3 candidatos possíveis no GA4 (`form_submit`, `ads_conversion`, `contact`) em duas landing pages, com duas ferramentas diferentes (Tag Assistant e GA4 DebugView) — nenhum disparou no momento do envio bem-sucedido. O Google Ads está, portanto, otimizando o lance automático sem nenhum sinal confiável de lead real, e 63% do orçamento de busca vai para o termo genérico 'aspirador de pó' em vez do território de saúde respiratória que a Hyla acabou de definir como posicionamento. O lado Meta está em situação melhor — otimiza corretamente para o objetivo nativo 'Leads' — mas o CPL do Google, reportado em versões anteriores deste diagnóstico, precisa ser tratado como não mensurável até um evento dedicado ser implementado e validado.","summary_headline":"Não é possível medir hoje quantos leads reais o Google Ads gera — nenhum dos 3 eventos candidatos (form_submit, ads_conversion, contact) dispara no envio do formulário de demonstração.","summary_highlights":[{"category":"posicao","label":"Investimento 6 meses","value":"R$75.550","subtext":"R$27.647 Google + R$47.903 Meta — Meta é 63% do total","tone":"blue"},{"category":"risco","label":"Leads reais do Google","value":"não mensurável","subtext":"3 eventos testados ao vivo (form_submit, ads_conversion, contact) — nenhum dispara no envio","tone":"red"},{"category":"risco","label":"Metas de conversão Google","value":"4 categorias 'Principal'","subtext":"Compra + Carrinho + Lead + Contato competem pelo mesmo lance automático, todas sem sinal confiável","tone":"red"},{"category":"risco","label":"Budget Google em mobile","value":"82,5%","subtext":"Site com instabilidade mobile já reconhecida pela equipe","tone":"red"},{"category":"oportunidade","label":"Leads Meta (confiável)","value":"CPL R$34,63","subtext":"Adset Bairros Nobres SP — 61% do budget Meta, alinhado ao ICP, métrica nativa validada","tone":"green"},{"category":"competicao","label":"Cluster saúde vs genérico (busca)","value":"10x menos","subtext":"R$407 em termos de saúde/alergia vs R$4.320 em 'aspirador de pó' genérico","tone":"yellow"},{"category":"oportunidade","label":"Brasil vs França (Instagram)","value":"47-49k > 14k","subtext":"Brasil já tem mais seguidores que a França — mas vende 1/3 por associada. Não é problema de alcance.","tone":"blue"}],"summary_key_findings":[{"category":"ameaca","text":"Teste ao vivo, repetido em 2 landing pages com 2 ferramentas (Google Tag Assistant e GA4 DebugView), confirma que nenhum dos 3 eventos candidatos a 'lead' (`form_submit`, `ads_conversion`, `contact`) dispara no momento em que o formulário de demonstração é enviado com sucesso. `contact` parece estar amarrado a outra ação (provavelmente o clique no botão flutuante de WhatsApp, hipótese ainda não confirmada com o time de dev), não ao formulário."},{"category":"contexto","text":"Investigação por eliminação: `form_submit` (75 eventos/28d) é um evento genérico que dispara em qualquer formulário do site — só 2,7% vêm da landing page principal, o resto é recuperação de senha, carrinho e checkout de acessórios. `ads_conversion` tem o mesmo padrão. `contact` concentra 92,6% dos eventos nas páginas certas (landing page + home) mas não disparou no teste ao vivo — mais provável ser o widget de WhatsApp do que o formulário."},{"category":"ameaca","text":"As metas de conversão do Google Ads (Compra, Adicionar ao carrinho, Enviar formulário de lead, Contato) estão todas marcadas como 'Ação principal' ao mesmo tempo — e nenhuma delas mede, de fato, o pedido de demonstração. O Smart Bidding está operando sem nenhum sinal confiável de lead, o que pode explicar por que dobrar o orçamento no passado não dobrou o resultado (mencionado no kick-off)."},{"category":"ameaca","text":"82,5% do investimento em Google Ads é direcionado a dispositivos móveis — mas o próprio time já classificou a experiência mobile do site (WordPress + Elementor) como instável dependendo do navegador. Tráfego caro sendo entregue à pior versão técnica de um funil que, agora sabemos, também não está sendo medido corretamente no fim."},{"category":"acao","text":"O Meta está em situação melhor (otimiza corretamente para o objetivo nativo 'Leads') e já mostra onde realocar: a campanha 'Instagram | Conversão WPP' custa 10x mais por lead (R$321,27) que 'Instagram | Conversão 2026' (R$30,81), com dois anúncios que gastaram R$1.268 juntos sem gerar nenhum lead — candidata natural a corte imediato."},{"category":"acao","text":"Validado com o operador: o gargalo da Hyla não é volume de lead de consumidor final — é capacidade de atendê-los. O achado do diagnóstico comercial (ee-s4-diagnostico-comercial) reforça isso com prova de campo: mesmo um lead com associada confirmada disponível morre antes de virar demonstração agendada. Recomendação de mídia revisada: concentrar o funil de consumidor final em São Paulo (onde já funciona — Bairros Nobres CPL R$34,63) e abrir uma frente separada e nacional de recrutamento de associadas, financiada redirecionando o que já era desperdício identificado (campanha WPP, parte da PMAX genérica) — não com aumento de investimento. Ver budget_reallocation_scenarios."}],"current_metrics":{"leads_per_month":"Google: não mensurável hoje (nenhum evento dedicado ao pedido de demonstração — ver top_problems #1). Meta: ~195/mês via métrica nativa Leads, confiável, exceto jun-jul/2026 sob suspeita de mudança de tracking no site.","cpl_estimated":null,"conversion_rate":null,"cac":"900 (estimativa verbal do kick-off, não recalculada nesta skill — depende de dados de vendas atribuídas por associado, fora do escopo de mídia paga)","unavailable_reason":"CPL/CAC do Google não podem ser calculados com confiança: os 3 eventos GA4 candidatos a sinal de lead (form_submit, ads_conversion, contact) foram testados ao vivo e nenhum dispara no envio do formulário de demonstração."},"google_ads":{"budget_monthly":4489,"active_campaigns":2,"total_campaigns":4,"total_spend_90d":14514.1,"total_clicks_90d":22987,"total_impressions_90d":741996,"avg_ctr":3.1,"avg_cpa":null,"total_conversions_90d":null,"conversions_unavailable_reason":"Os 3 eventos GA4 candidatos a sinal de lead (form_submit, ads_conversion, contact) foram testados ao vivo em 2 landing pages com 2 ferramentas (Tag Assistant, GA4 DebugView) e nenhum dispara no envio do formulário de demonstração — ver top_problems #1. Valores de CPA/conversões calculados em versões anteriores deste diagnóstico usando form_submit foram removidos por não representarem leads reais.","budget_monthly_actual":4489,"strategic_diagnosis":"O achado mais importante do lado Google não é de mídia, é de mensuração: nenhum dos 3 eventos GA4 configurados como meta de conversão (`form_submit`, `ads_conversion`, `contact`) dispara quando o formulário de demonstração é enviado com sucesso — confirmado em teste ao vivo repetido em 2 landing pages com 2 ferramentas diferentes. Por eliminação: `form_submit` e `ads_conversion` são eventos genéricos que disparam em qualquer formulário do site (recuperação de senha, carrinho, checkout de acessório) — só ~2,7% dos disparos de cada um vêm da landing page principal. `contact` concentra 92,6% dos disparos nas páginas certas (landing page + home), mas não disparou no teste ao vivo — a hipótese mais provável é que esteja amarrado ao clique no botão flutuante de WhatsApp, não ao formulário (não confirmado com o time de dev). Com isso, as 4 metas de conversão da conta (Compra, Carrinho, Lead, Contato, todas como 'Ação principal') competem pelo mesmo lance automático sem nenhuma delas medir o que importa. Separado desse problema: 63% do budget do Google (R$17.550 de R$27.647) está na campanha PMAX, que usa um único grupo de recursos ('Performance max', qualidade 'Excelente') com mais de 60 temas de pesquisa misturando saúde (asma, rinite, bronquite, ácaros), concorrentes (Rainbow, Vivenso, Kirby) e limpeza genérica (estofados, sofá, tapete) — sem segmentação por intenção. Pelos insights de categoria de pesquisa disponíveis (~10% do volume de cliques da PMAX, o resto fica oculto pela plataforma), o cluster genérico de 'aspirador de pó' consome mais que 10x o volume do cluster de saúde/alergia — o oposto do território definido em ee-s2-posicionamento. As campanhas de Pesquisa tradicional (Branding-SP ativa, Branding-BR pausada) somam só R$10.096 mas têm rastreamento real de termo de busca: nelas, R$3.901 (28% do gasto) foi para termos com zero engajamento, e 82,5% de todo o budget do Google vai para celular, dispositivo onde o sit 0,"total_reach_90d":3193023,"avg_ctr":4.85,"avg_cpm":7.51,"strategic_diagnosis":"As campanhas Meta estão corretamente otimizadas para o objetivo 'Leads' (confirmado pelo operador) — diferente do Google, aqui o alvo do algoritmo está certo, mesmo com outros eventos (Contatos, Compras) aparecendo nos relatórios sem serem o alvo de otimização. O adset '[SP] BAIRROS NOBRES' concentra 61% do budget Meta com CPL R$34,63, alinhado ao ICP primário (região nobre de SP). No outro extremo, a campanha 'Instagram | Conversão WPP' custa 10x mais por lead (R$321,27) e tem dois anúncios ('Imagem Benefícios' e 'Novo vídeo Nimbus', ambos no adset RS/SC/ES/MS/MG/AL/PE) que juntos gastaram R$1.268 sem gerar nenhum lead. Dentro do próprio melhor adset, a variação de CPL por criativo é grande: 'PRATICIDADE' R$21,00/lead vs 'Nimbus Tapete' R$175,14/lead — mesma audiência, ângulo de mensagem é o que mais varia o resultado. O salto de leads a partir de 17/06 (CPL caindo de ~R$95 para R$5,21) não corresponde a nenhuma alteração de campanha no histórico do gerenciador — hipótese do operador é mudança de tracking no site, ainda não confirmada; os números de junho/julho não devem ser tratados como novo patamar de eficiência até essa validação. Achado estratégico validado com o operador (16/07): o gargalo atual não é volume de lead, é capacidade de atendê-lo — a Hyla já tem mais seguidores no Instagram oficial (~47-49 mil) que a própria Hyla França (~14 mil), que vende o triplo por associada. Recomendação: concentrar o budget de consumo (leads de demonstração) no que já funciona — Bairros Nobres SP — e não escalar para novas praças até a capacidade de atendimento acompanhar. Em paralelo, abrir uma campanha de RECRUTAMENTO separada (público, criativo e CTA distintos — 'vire associada', não 'agende demonstração'), com alcance nacional, priorizando praças com alguma estrutura de suporte já existente (não uniformemente todo o Brasil). Benchmark de 4 países (Alemanha, Bélgica, EUA, França — ver outputs/benchmark-internacional-associados-e-midia.md) confirma múltiplos pontos de entrada de recrutamento simultâneos e, em 2 de 4 países (Bélgica e França), um papel formal de 'embaixadora digital/redes sociais' sem demonstração presencial — candidato natural a testar no @hyladobrasilbusiness, hoje subutilizado (grade D+ na auditoria de comunicação). Essa campanha de recrutamento pode ser financiada redirecionando o budget hoje desperdiçado na campanha WPP (R$321/lead) — sem pedir aumento de investimento.","monthly_evolution":[{"month":"2026-01","spend":5574.2,"impressions":1158263,"clicks":45496,"reach":1029318,"cpm":4.81,"ctr":3.93},{"month":"2026-02","spend":6987.56,"impressions":1543245,"clicks":58223,"reach":1360965,"cpm":4.53,"ctr":3.77},{"month":"2026-03","spend":7818.28,"impressions":1432516,"clicks":67024,"reach":1372937,"cpm":5.46,"ctr":4.68},{"month":"2026-04","spend":8056.36,"impressions":1567618,"clicks":82486,"reach":1512401,"cpm":5.14,"ctr":5.26},{"month":"2026-05","spend":8789.47,"impressions":1569160,"clicks":77670,"reach":1477138,"cpm":5.6,"ctr":4.95},{"month":"2026-06","spend":8946.58,"impressions":587967,"clicks":22826,"reach":504658,"cpm":15.22,"ctr":3.88},{"month":"2026-07","spend":1730.55,"impressions":57018,"clicks":3197,"reach":53678,"cpm":30.35,"ctr":5.61}],"critical_issues":["Campanha 'Instagram | Conversão WPP': CPL R$321,27, 10x o da melhor campanha (R$30,81) — nome sugere otimização para conversa de WhatsApp, o que contradiz a decisão já tomada pelo time de remover o botão direto de WhatsApp dos anúncios para elevar qualificação (nota do briefing).","Dois anúncios do adset 'RS SC ES MS MG AL PE - WPP' ('[Imagem] Benefícios' R$720,31 e '[Vídeo] Novo vídeo Nimbus' R$547,94) somam R$1.268,25 gastos com ZERO leads.","CPM subiu de ~R$5 (jan-mai) para R$15,22 (jun) e R$30,35 (jul) com queda de impressões — coincide com o período do salto de leads não explicado por mudança de campanha; recomenda-se não tratar como novo patamar até validar a hipótese de mudança de tracking no site."],"metrics_vs_benchmark":[{"metric":"CPM (Meta, blended)","atual":"R$7,51 (90d) / R$6,05 (6 meses)","benchmark":"~R$22 (Brasil, Tier 3, referência global 2026) [E]","gap":"abaixo do benchmark","status":"ok"},{"metric":"CTR (Meta, blended)","atual":"4,85% (90d)","benchmark":"2,92% (Home & Decor, referência EUA 2026) [E]","gap":"acima do benchmark","status":"ok"},{"metric":"CPL (Lead Gen, Meta)","atual":"R$27,08 (90d, sob suspeita) / R$40,87 (6 meses, mais confiável)","benchmark":"US$23-28 ≈ R$122-150 (Lead Gen, referência EUA 2025/2026) [E]","gap":"abaixo do benchmark","status":"ok"}],"best_historical":[{"name":"[Vídeo] PRATICIDADE — Bairros Nobres SP","cpm":"7,71","impressions":869546,"note":"CPL R$21,00 — melhor custo por lead do período, mesma audiência do restante do adset"},{"name":"[Vídeo] Trend Viral — Bairros nobres SP","cpm":"8,03","impressions":599406,"note":"CPL R$27,06 — segundo melhor criativo do melhor adset"},{"name":"[Vídeo] - Extratora HYLA — Goiânia 26","cpm":"30,70","impressions":18763,"note":"CPL R$10,11 — melhor CPL absoluto do período, mas em praça pequena (Goiânia, baixo volume)"}]},"top_problems":[{"problem":"Não existe hoje nenhum evento de conversão que capture, de fato, o pedido de demonstração — confirmado ao testar ao vivo os 3 candidatos possíveis no GA4.","data_evidence":"Investigação em 3 etapas: (1) `form_submit` (590 no período de 6 meses) é um evento genérico do GA4 — no relatório de páginas dos últimos 28 dias, só 2 dos 75 disparos vieram da landing page principal (/aspirador-hyla-do-brasil/, 70,75% do tráfego do site); o resto é recuperação de senha (/minha-conta/senha-perdida/), carrinho e checkout de acessórios (Air Odorizer). (2) `ads_conversion` (448 no período), embora corretamente classificado como 'Enviar formulário de lead' no Google Ads, tem exatamente o mesmo padrão — só 2 de 57 disparos na landing page. (3) `contact` (378 no período completo) concentra 92,6% dos disparos nas páginas
