ampaign":"Google Search - Territorial condomínios","platform":"Google Ads","budget_monthly":600,"objective":"Captura territorial"},{"campaign":"Google Search - Marca","platform":"Google Ads","budget_monthly":300,"objective":"Captura de marca"},{"campaign":"Meta Ads - Topo (awareness + lookalike)","platform":"Meta Ads","budget_monthly":800,"objective":"Alcance qualificado"},{"campaign":"Meta Ads - Meio (nutrição)","platform":"Meta Ads","budget_monthly":500,"objective":"Nutrição de quem já viu conteúdo"},{"campaign":"Meta Ads - Remarketing","platform":"Meta Ads","budget_monthly":300,"objective":"Remarketing"}]},"scenario_c_aggressive":{"name":"Agressivo","total_budget_monthly":6000,"google_split":3200,"meta_split":2800,"expected_leads_monthly":8,"expected_cpl":75,"expected_roas":null,"risk_assessment":"Maior exposição financeira antes de validar o canal na prática — recomendado só depois que o Cenário B comprovar CPL e qualidade de lead, dado que a capacidade operacional já é limitada a 8 obras simultâneas (gerar demanda além disso não converte em crescimento real).","delta_leads":"+5 vs. Cenário A","effort_weeks":4,"confidence":"low","campaigns_structure":[{"campaign":"Google Search - Fundo de funil turnkey","platform":"Google Ads","budget_monthly":1800,"objective":"Leads qualificados"},{"campaign":"Google Search - Territorial condomínios","platform":"Google Ads","budget_monthly":900,"objective":"Captura territorial"},{"campaign":"Google Search - Marca","platform":"Google Ads","budget_monthly":500,"objective":"Captura de marca"},{"campaign":"Meta Ads - Topo (awareness + lookalike)","platform":"Meta Ads","budget_monthly":1400,"objective":"Alcance qualificado"},{"campaign":"Meta Ads - Meio (nutrição)","platform":"Meta Ads","budget_monthly":900,"objective":"Nutrição"},{"campaign":"Meta Ads - Remarketing","platform":"Meta Ads","budget_monthly":500,"objective":"Remarketing"}]},"recommendation":"Cenário B (Realista) é o recomendado — está alinhado ao orçamento já discutido com a Amanda na reunião de diagnóstico (R$3.200-4.200/mês) e evita tanto o sub-teste do Cenário A quanto o risco de escalar demanda além da capacidade operacional (8 obras simultâneas) do Cenário C."},"creative_testing_hypotheses":{"description":"5 hipóteses de teste A/B para os primeiros criativos de mídia paga, cobrindo os ângulos técnico, emocional e territorial já mapeados no posicionamento.","hypotheses":[{"id":"H1","hypothesis":"Se o anúncio abrir com a Amanda explicando o conceito do processo de acompanhamento financeiro (sem expor dados internos), então o CTR será maior entre o público 35-60 do ICP, porque o job funcional de controle pesa tanto quanto o emocional.","angle":"Técnico/controle","format":"Reels","hook":"Você sabe pra onde vai cada real da sua obra?","body":"Amanda explica o conceito do processo de acompanhamento financeiro (etapas, prestação de contas), sem expor a planilha real ou fornecedores.","cta":"Agende uma conversa","target_audience":"Lookalike 1% de clientes atuais + interesse em construção residencial, 35-60 anos, Jundiaí/RMC","success_criteria":"CTR > 1,0% E CPL < R$100","testing_budget":400,"testing_duration_days":14},{"id":"H2","hypothesis":"Se o anúncio usar a mensagem emocional já validada ('Você vive sua vida. Nós vivemos a obra.') com imagem de entrega de obra, então gera mais alcance de topo de funil, porque é o território que o setor inteiro já reconhece como aspiracional.","angle":"Emocional","format":"Imagem única + carrossel","hook":"Você vive sua vida. Nós vivemos a obra.","body":"Foto de entrega de obra + breve texto sobre o modelo turnkey completo.","cta":"Saiba como funciona","target_audience":"Público segmentado por geolocalização de condomínios de alto padrão em Jundiaí/RMC","success_criteria":"CTR > 0,8% E CPM < R$40","testing_budget":300,"testing_duration_days":14},{"id":"H3","hypothesis":"Se o anúncio for direcionado a quem está pesquisando terreno (não arquiteto), então captura o cliente antes da concorrência, porque a própria Amanda já validou essa estratégia no kickoff como diferencial.","angle":"Territorial / antecipação","format":"Single image","hook":"Comprou terreno em condomínio de alto padrão em Jundiaí?","body":"Convite para conversar sobre o projeto antes mesmo de fechar com um arquiteto.","cta":"Fale com a gente","target_audience":"Interesse em terrenos/lotes em condomínios de Jundiaí/RMC, 30-60 anos","success_criteria":"CTR > 1,2% E CPL < R$80","testing_budget":350,"testing_duration_days":14},{"id":"H4","hypothesis":"Se o anúncio de Search usar copy que ataca diretamente a objeção 'turnkey deve custar mais caro', então converte melhor no fundo de funil do que copy genérica de 'arquiteta de alto padrão', porque resolve a objeção mais recorrente do ICP.","angle":"Quebra de objeção","format":"Search ad (texto)","hook":"Turnkey custa mais? Faça as contas com a gente.","body":"Um único contrato substitui comissão oculta de fornecedor + retrabalho técnico por transparência real.","cta":"Agende uma conversa","target_audience":"Busca ativa por 'arquiteto turnkey residencial' e 'arquiteto alto padrão jundiaí'","success_criteria":"CTR > 4% (Search) E CPA < R$100","testing_budget":300,"testing_duration_days":14},{"id":"H5","hypothesis":"Se o criativo mostrar closeups de detalhes de acabamento em vez do ambiente inteiro, então gera mais engajamento entre o público de altíssimo padrão, porque quem compra nesse nível compra detalhes, não só a planta — já validado na análise de identidade visual da própria marca.","angle":"Estético/detalhe","format":"Reels","hook":"(sem fala — closeup com trilha instrumental)","body":"Sequência de closeups de detalhes de acabamento de uma obra já entregue.","cta":"Ver o projeto completo","target_audience":"Interesse em decoração/arquitetura de luxo, lookalike de seguidores engajados","success_criteria":"Taxa de retenção > 50% E CTR > 0,9%","testing_budget":300,"testing_duration_days":14}],"testing_budget_total_week_1":1650},"daypart_optimization":{"description":"Ajustes de lance por janela de dia/hora baseados no comitê de decisão do casal (ela escolhe pela confiança, ele valida pela planilha) e no padrão de disponibilidade desse público.","adjustments":[{"day_time":"Segunda a sexta, 9h-12h","bid_adjustment_pct":15,"rationale":"Horário comercial em que o comitê de decisão costuma ter janelas livres entre compromissos para pesquisar e responder mensagens."},{"day_time":"Segunda a sexta, 19h-22h","bid_adjustment_pct":20,"rationale":"Casal decide junto à noite, após o expediente — janela em que ambos costumam estar disponíveis simultaneamente para uma decisão de alto envolvimento."},{"day_time":"Sábado 10h-18h","bid_adjustment_pct":10,"rationale":"Momento em que famílias de alto padrão costumam visitar/passear pelos condomínios de interesse, aumentando a relevância contextual do anúncio territorial."},{"day_time":"Domingo","bid_adjustment_pct":-30,"rationale":"Menor disponibilidade para decisões de alto investimento; reduzir lance para não desperdiçar budget em cliques de baixa intenção."},{"day_time":"Segunda-feira antes das 9h","bid_adjustment_pct":-20,"rationale":"Início de semana, foco em resolver pendências profissionais — menor probabilidade de engajamento com decisão pessoal de longo prazo."}]},"key_insight":{"headline":"O Cenário B (R$3.600/mês) recupera o orçamento já discutido com a cliente — mas só funciona se vier DEPOIS do CRM, não em paralelo.","context":"A tentação natural é lançar mídia e CRM ao mesmo tempo para 'ganhar tempo'. Mas a última tentativa prova que, sem triagem básica, o orçamento se perde em contatos irrelevantes sem que ninguém perceba a tempo de corrigir.","numbered_reasons":["A última campanha gastou R$1.200 sem que ninguém soubesse, em tempo real, que 100% dos contatos eram fornecedores — só descobriram depois, olhando para trás.","O Cenário B já está dimensionado dentro do range que a própria V4 discutiu com a Amanda na reunião de diagnóstico (R$3.200-4.200/mês) — não é uma proposta nova, é a execução do que já foi validado com ela.","Lançar mídia sem CRM significa repetir o mesmo erro em escala maior — o upside real do Cenário B só se realiza se o CRM estiver rodando primeiro."],"discussion_anchor":"Vale travar com a Amanda: o lançamento de mídia (Cenário B) só começa depois que o CRM mínimo estiver de fato funcional — não em paralelo, por mais que pareça mais rápido no papel."},"honesty_alert":"Este é um plano de LANÇAMENTO, não um diagnóstico de performance — a cliente não tem dados granulares de campanha ativa (sem V4MOS conectado, sem exportação manual), apenas o relato qualitativo de uma tentativa anterior malsucedida. Todos os benchmarks aqui são adaptados da categoria mais próxima disponível (Imobiliárias/Construtoras), ajustados para cima dado o ticket muito acima da média do setor — trate os números de CPL/budget como direção estratégica, não previsão precisa. Fundamental: este plano só deve ser executado DEPOIS que o CRM mínimo estiver funcional (ação 1 do plano) — caso contrário, mesmo um plano bem estruturado vai gerar dados que ninguém consegue medir corretamente, repetindo o padrão já visto na campanha anterior."},"ee-s2-pesquisa-mercado":{"client_name":"Amanda Ferraz Arquitetura e Construção","segment":"Arquitetura residencial de alto padrão (turnkey: projeto + interiores + gestão de obra)","region":"Jundiaí-SP e Região Metropolitana de Campinas (Vinhedo, Valinhos, Itupeva), com demanda pontual de São Paulo capital via indicação","summary":"Amanda Ferraz atua num SAM regional estimado em ~R$251 milhões/ano (arquitetura + gestão de obra de alto padrão em Jundiaí/RMC), mas fatura ~R$1 milhão/ano (~0,4% do SAM). O gap não é falta de mercado — o segmento de médio-alto padrão cresceu 20% em 2025 no Brasil — é capacidade operacional (limite deliberado de 8 obras simultâneas) e comunicação de um diferencial real (controle financeiro transparente, zero comissionamento) que nenhum dos 5 concorrentes mapeados reivindica.","summary_headline":"Amanda Ferraz tem 0,4% de um SAM regional de R$251M/ano — o gap não é falta de mercado, é capacidade (8 obras) e um diferencial real ainda não comunicado.","summary_highlights":[{"category":"posicao","label":"Fatia atual do SAM","value":"~0,4%","subtext":"R$1M de ~R$251M regional estimado","tone":"red"},{"category":"oportunidade","label":"SOM de mercado","value":"R$23M/ano","subtext":"Teto se capacidade e comunicação forem resolvidas","tone":"green"},{"category":"competicao","label":"Concorrentes diretos mapeados","value":"5","subtext":"Nenhum comunica controle financeiro real","tone":"yellow"},{"category":"janela","label":"Condomínios emergentes","value":"2 sem 'dono' ainda","subtext":"Almarias e Quinta da Primavera","tone":"yellow"},{"category":"risco","label":"Financiamento imobiliário","value":"-17% em 2025","subtext":"Selic a 15% pressiona quem depende de crédito","tone":"red"}],"summary_key_findings":[{"category":"vantagem","text":"Amanda tem 2 diferenciais reais confirmados (projeto sem retrabalho, zero comissionamento de fornecedores) que nenhum dos 5 concorrentes mapeados comunica com a mesma força."},{"category":"contexto","text":"O segmento de médio-alto padrão brasileiro cresceu 20% em 2025 (R$30 bilhões em VGV lançado), mais rápido que o mercado imobiliário geral (projeção de 10% para 2026, segundo a CBIC)."},{"category":"ameaca","text":"Queda de 17% nos financiamentos imobiliários em 2025 (Selic a 15%) pressiona justamente o público que depende de crédito para viabilizar a obra."},{"category":"ameaca","text":"Nenhum dos 5 concorrentes mapeados tem estrutura madura de comunicação sobre controle financeiro — mas o mercado já move R$30 bilhões/ano e a janela de diferenciação não é permanente."},{"category":"acao","text":"O gap entre faturamento atual (R$1M) e o SOM de mercado (R$23M) exige resolver capacidade operacional (hoje limitada a 8 obras) e comunicação (hoje 99% indicação) simultaneamente — não é problema de falta de demanda."}],"tam_sam_som":{"methodology":"mixed","tam":{"value_brl":30000000000,"description":"Mercado brasileiro de lançamentos residenciais de médio e alto padrão (VGV), que fechou 2025 com R$30 bilhões, crescimento de 20% sobre os R$25 bilhões de 2024. Serve como teto macro de referência para o apetite do segmento de alto padrão no Brasil — nota: esse dado é predominantemente de lançamentos de incorporadoras (apartamentos/condomínios em bloco), não de construções sob encomenda em terreno próprio (o modelo real da Amanda), mas é o proxy público mais próximo e defensável disponível."},"sam":{"value_brl":251000000,"description":"Mercado de arquitetura residencial de alto padrão (honorários de projeto + interiores + gestão de obra) na região de Jundiaí e RMC (Vinhedo, Valinhos, Itupeva), incluindo demanda pontual de São Paulo capital via indicação. Calculado bottom-up: estimativa de 180-220 obras de alto padrão iniciadas por ano na região [E] (baseado nos condomínios ativos identificados: Terras da Alvorada, Atenas, Almarias, Quinta da Primavera, Alphaville Jundiaí, Reserva da Ermida), com ticket médio de projeto+interiores de R$475 mil (ponto médio da faixa R$450-500 mil confirmada pela cliente) e gestão de obra de 12% sobre uma obra média de R$6,5 milhões (R$780 mil) — usando 200 obras/ano como ponto médio: 200 × (R$475 mil + R$780 mil) = R$251 milhões/ano.","filters":["Região geográfica: Jundiaí + RMC (Vinhedo, Valinhos, Itupeva) + demanda pontual de São Paulo capital via indicação","Obras residenciais de alto padrão (investimento de obra de R$5-10 milhões+)","Modelo de negócio: projeto + interiores + gestão de obra (exclui construção popular, reforma simples e serviços avulsos)","Apenas honorários de arquitetura/gestão — exclui o valor bruto da obra (material e mão de obra), que vai para fornecedores/construtoras"]},"som":{"value_brl":23000000,"description":"SOM de mercado (teto tangível de captura, independente de capacidade interna e sem horizonte temporal fixo): triangulado por 3 métodos independentes. Método 1 (capacidade operacional atual, R$5,02M) ficou bem abaixo dos Métodos 2 e 3 — isso é esperado e reflete uma restrição INTERNA de capacidade (8 obras simultâneas por decisão deliberada da Amanda), não uma limitação do mercado. O SOM de mercado usa a convergência dos Métodos 2 e 3 (~R$22-25M), não o Método 1. Este número NÃO é a meta comercial da cliente (registrada separadamente em `market_share`) nem está limitado pela capacidade atual (registrada em `operational_ceiling_note`).","assumptions":["Método 1 — Capacidade operacional plenamente madura: 8 obras simultâneas ÷ ciclo médio de 2 anos = ~4 novas obras fechadas/ano × (R$475 mil projeto + R$780 mil gestão de obra) = R$5,02 milhões/ano.","Método 2 — Market share top-down: Amanda já é referência estabelecida em 1 condomínio (Terras da Alvorada, 40+ projetos em ~11 anos). Aplicando benchmark de 'líder de quadrante de nicho' (8-12% do SAM) a um SAM de R$251M: 10% × R$251M = R$25,1 milhões.","Método 3 — Segmento por nicho: dentro do SAM, ~50% corresponde a clientes que buscam o modelo turnkey completo (a 'camada endereçável' de R$125,5M — ver `market_share.enderecavel_value_brl`). Amanda, como uma das poucas que oferece esse modelo genuinamente, capturando 15-20% desse nicho quando plenamente madura: 17,5% × R$125,5M ≈ R$22 milhões.","Convergência: Método 2 (R$25,1M) e Método 3 (R$22M) convergem numa faixa de R$22-25M — usado o ponto médio arredondado (R$23M) como SOM. Método 1 (R$5,02M) diverge por ser limitado pela capacidade interna, não pelo mercado — registrado separadamente."],"operational_ceiling_note":"Capacidade operacional atual (8 obras simultâneas, decisão deliberada da Amanda após reduzir de 20 obras em 2019-2020) topa em ~R$5,02 milhões/ano em regime de agenda cheia. O gap de R$17,98 milhões entre a capacidade atual e o SOM de mercado (R$23M) exige expansão futura (contratação de mais gestores de obra, possível segunda equipe) — não é um problema de demanda, é de estrutura interna.","related_but_separate":{"client_annual_revenue_goal_brl_v4mos":null,"client_annual_revenue_goal_source_v4mos":null,"client_monthly_revenue_goal_kickoff":"R$500.000/mês = R$6.000.000/ano — meta verbal registrada no kickoff (2026-06-08): 'minha meta é fechar 10 projetos grandes e faturar no mínimo R$500.000 por mês'","note":"Cliente sem workspace V4MOS conectado, então não há meta registrada nesse formulário. A única meta documentada vem do kickoff presencial (R$6M/ano), que representa ~26% do SOM de mercado calculado (R$23M) — uma meta de curto/médio prazo bem mais conservadora que o teto de mercado, o que é saudável dado que ainda depende de resolver CRM e capacidade operacional antes de crescer."}},"sources":[{"name":"Papo Imobiliário — Mercado imobiliário de médio e alto padrão cresce 20% em 2025","url":"https://www.papoimobiliario.com/mercado-imobiliario-de-medio-e-alto-padrao-cresce-20-em-2025-e-supera-r30-bilhoes-em-lancamentos/","year":2025},{"name":"CBIC — projeção de crescimento do mercado imobiliário brasileiro para 2026","url":"https://portas.com.br/noticias/mercado-imobiliario-projeta-crescimento-de-10-em-2026/","year":2026},{"name":"CAU/SP — número de arquitetos e empresas registradas em São Paulo","url":"https://www.instagram.com/p/CMKJmRps7lL/","year":2026},{"name":"Chenquer & Camargo Imóveis — Mercado Imobiliário de Jundiaí Aquecido em 2025/2026","url":"https://chenquerecamargo.com.br/artigo/9349/mercado-imobiliario-de-jundiai-aquecido-em-2025","year":2026},{"name":"Lar Pontual Engenharia — Tabela de Honorários de Arquitetura 2026","url":"https://larpontual.com.br/portal/quanto-cobra-arquiteto","year":2026},{"name":"Reunião de kickoff (2026-06-08) — dados verbais confirmados pela própria cliente sobre ticket, obra e capacidade","url":"clientes/amanda-ferraz-arquitetura-e-construcao/base-de-conhecimento/2026-06-08-reuniao-kickoff.md","year":2026}]},"market_share":{"current_revenue_brl":1000000,"current_share_of_sam_pct":0.4,"target_share_of_sam_pct":9.2,"gap_to_som_brl":22000000,"gap_to_som_pct":2200,"commentary":"Amanda captura hoje uma fatia mínima (~0,4%) do SAM regional estimado. O gap percentual até o SOM (2.200%) parece extremo, mas reflete o teto de mercado PLENAMENTE MADURO — não uma meta de curto prazo. Atingi-lo exigiria resolver, em paralelo: (1) capacidade operacional (hoje limitada a 8 obras simultâneas, teto de ~R$5M/ano mesmo em regime cheio); e (2) comunicação do diferencial real (hoje 99% da carteira vem de indicação, sem motor de aquisição digital próprio). A meta declarada pela cliente (R$6M/ano) é um passo intermediário muito mais realista no curto prazo.","client_annual_revenue_goal_brl":6000000,"client_annual_revenue_goal_source":"Kickoff V4 (2026-06-08) — meta verbal da cliente: 'minha meta é fechar 10 projetos grandes e faturar no mínimo R$500.000 por mês'","client_goal_vs_som_note":"A meta declarada pela cliente no kickoff (R$6M/ano) representa ~26% do SOM de mercado calculado (R$23M) — uma meta de curto/médio prazo bem mais conservadora que o teto de mercado, o que é saudável dado que ainda depende de resolver CRM e capacidade operacional. Não há uma segunda meta registrada em outra fonte (cliente sem workspace V4MOS conectado).","enderecavel_value_brl":125500000,"enderecavel_composition":"50% do SAM estimado (R$251M) corresponde a clientes que buscam o modelo turnkey completo (projeto + interiores + gestão de obra) = R$125,5M. Os outros 50% correspondem a clientes que buscam apenas parte do serviço (só projeto arquitetônico, ou só execução de obra com projeto de terceiros).","enderecavel_note":"O SAM de R$251M/ano inclui clientes que querem contratar só uma parte do serviço — perfil que Amanda recusa por decisão estratégica deliberada (ela só fecha o pacote completo, conforme registrado no ICP e na SWOT). O Mercado Endereçável real dela é a metade do SAM que busca esse modelo turnkey integrado, hoje raro na região. Dentro desse endereçável, o SOM de R$23M representa ~18,3% de captura — nível de líder de nicho consolidado, não de player marginal. A razão SOM/SAM (9,2%) parece baixa isoladamente, mas a razão SOM/Endereçável (18,3%) mostra que, dentro do que ela de fato persegue, o potencial de liderança é real."},"competitors":[{"name":"Eduardo Muzi","positioning":"Projetos com forte apelo estético de alto padrão, com posicionamento editorial no site — 'parece um editorial de arquitetura', segundo a própria auditoria de design feita para Amanda.","channels":["Instagram","site próprio (editorial)","indicação"],"strengths":["Melhor direção de arte de site entre os concorrentes diretos mapeados (muito espaço em branco, fotografia protagonista)","Forte apelo estético/visual, reconhecido inclusive pela concorrência"],"weaknesses":["Projeto executivo tecnicamente fraco — já gerou retrabalho documentado em obra que a Amanda precisou assumir e redesenhar (vigas do projeto estrutural não batiam com o arquitetônico)","Site sem nenhuma prova social/depoimento","Instagram mistura vida pessoal com projetos, reduzindo a percepção de padrão premium","Vídeos em formato horizontal, não otimizados para consumo mobile"],"estimated_pricing":"Não divulgado publicamente (padrão do setor) — estimado na mesma faixa da Amanda dado o mesmo território de clientes, R$400-550 mil em honorários de projeto+interiores [E]","digital_score":6,"digital_details":{"website":"Melhor direção de arte do grupo, mas zero prova social","instagram":"Mistura vida pessoal com projetos; capas de vídeo pixeladas em alguns posts","google":"Não auditado nesta rodada","active_ads":"Não identificados nesta pesquisa"}},{"name":"Ricardo Gaspari","positioning":"Referência consolidada no condomínio Atenas (Jundiaí), atuação do projeto à execução final — modelo de negócio quase idêntico ao da Amanda, mas sem investimento equivalente em comunicação digital.","channels":["Indicação local dentro do condomínio Atenas","site institucional","pouca presença em Instagram/publicidade"],"strengths":["Dominância territorial estabelecida e de longa data no condomínio Atenas","Tempo de mercado consolidado na região"],"weaknesses":["Site institucional datado (estilo 2015-2018), sem personalidade de marca — avaliação direta da equipe V4: 'se tirar as fotos de fundo, não dá para saber o que ele faz'","Investimento mínimo em Instagram/publicidade digital","Não constrói branding próprio, depende quase inteiramente de reputação territorial de boca a boca"],"estimated_pricing":"Não divulgado publicamente [E] — estimado em faixa semelhante à Amanda, dado o modelo de negócio quase idêntico","digital_score":3,"digital_details":{"website":"Institucional datado, sem prova social","instagram":"Presença mínima","google":"Não auditado nesta rodada","active_ads":"Nenhum identificado"}},{"name":"Guedes e Bisoli","positioning":"Organização de portfólio e prova social robusta — comunicação que se aproxima de um 'catálogo de alto padrão', com filtro visual consistente em todas as fotos do Instagram.","channels":["Instagram (feed com filtro padronizado)","site com boa organização e depoimentos","Google Ads (testado, com variação de criativos por ambiente/pessoa)"],"strengths":["Melhor uso de provas sociais e organização de portfólio entre os concorrentes diretos mapeados","Filtro visual consistente no Instagram cria reconhecimento de marca sem depender de repetir o logo","Testa criativos variados (mesmo copy, ambientes/pessoas diferentes) em mídia paga"],"weaknesses":["Direção de arte 'no meio-termo' — nem tão popular quanto Ricardo Gaspari, nem tão refinada quanto Eduardo Muzi","Amanda já ouviu críticas técnicas de terceiros sobre qualidade de projeto executivo, embora sem confirmação direta"],"estimated_pricing":"Não divulgado publicamente [E] — estimado em faixa semelhante ao mercado de alto padrão da região","digital_score":7,"digital_details":{"website":"Bem organizado, com depoimentos e clientes","instagram":"Feed com filtro consistente, parece catálogo premium","google":"Ativo em Google Ads","active_ads":"Sim — testes de ambiente/pessoa identificados na análise de tráfego"}},{"name":"Vitor Dias Arquitetura","positioning":"'Arquitetura que transforma espaços em experiências de viver' — atuação multi-praça (Jundiaí, Alphaville, Campinas) com ambição de escala nacional.","channels":["Site institucional","Instagram","indicação multi-regional"],"strengths":["Escala maior — presença em múltiplas praças","Discurso consistente de tradução da personalidade do cliente no traço arquitetônico"],"weaknesses":["Presença/território específico em Jundiaí mais diluído do que a Amanda, que domina o Terras da Alvorada","Discurso genérico, semelhante ao restante do setor ('transformar espaços em experiências')"],"estimated_pricing":"Não divulgado publicamente [E]","digital_score":6,"digital_details":{"website":"Institucional, discurso genérico do setor","instagram":"Presença regular","google":"Não auditado nesta rodada","active_ads":"Não identificado"}},{"name":"Adriana Consulin Arquitetura","positioning":"'Transforma ambientes em experiências memoráveis' — forte capital de mídia acumulado (prêmios CasaCor, aparições em TV).","channels":["TV (Bora Decorar/Band)","CasaCor e Campinas Decor","Instagram","site institucional"],"strengths":["Maior prova social midiática do grupo (20+ anos de mercado, portfólio internacional, prêmios em eventos do setor)","Participação em eventos de grande visibilidade (CasaCor)"],"weaknesses":["Sede em Campinas, não em Jundiaí — presença territorial mais diluída na região específica da Amanda","Discurso também genérico ('transformar ambientes em experiências memoráveis')"],"estimated_pricing":"Não divulgado publicamente [E] — provavelmente ticket mais alto dado o capital de mídia acumulado","digital_score":7,"digital_details":{"website":"Institucional com forte prova social midiática","instagram":"Presença consistente","google":"Não auditado nesta rodada","active_ads":"Não identificado"}}],"competitive_map":{"axis_x":"Generalista (múltiplas praças/regiões) ←→ Especialista territorial (nicho e local)","axis_y":"Estética pura (portfólio/imagem) ←→ Controle técnico-financeiro comunicado (processo e previsibilidade)","positions":[{"name":"Eduardo Muzi","quadrant":"Especialista territorial + Estética pura"},{"name":"Ricardo Gaspari","quadrant":"Especialista territorial + Estética pura (mais fraca, institucional datado)"},{"name":"Guedes e Bisoli","quadrant":"Especialista territorial + Estética pura (com boa prova social)"},{"name":"Vitor Dias Arquitetura","quadrant":"Generalista + Estética pura"},{"name":"Adriana Consulin Arquitetura","quadrant":"Generalista + Estética pura"},{"name":"Amanda Ferraz (posição sugerida)","quadrant":"Especialista territorial + Controle técnico-financeiro comunicado"}],"empty_spaces":"O quadrante 'Especialista territorial + Controle técnico-financeiro comunicado' está vazio — nenhum concorrente mapeado comunica processo, planilha ou previsibilidade financeira com a mesma força que Amanda já tem internamente, mas ainda não comunica publicamente.","crowded_spaces":"O quadrante 'Especialista territorial + Estética pura' é o mais disputado — Eduardo Muzi, Ricardo Gaspari e Guedes e Bisoli competem todos ali, brigando por sutilezas de portfólio e direção de arte, sem diferenciação real de processo."},"trends":[{"trend":"Gestão de obra com controle de cronograma e orçamento em tempo real virou expectativa básica no segmento de alto padrão, não mais diferencial.","evidence":"Fontes do setor apontam que, para 2026, 'o nível de controle precisa ser mais rigoroso, acompanhando o cronograma em tempo real... além de uma gestão financeira precisa para garantir que o orçamento seja respeitado' (Weiku, Dabus Arquitetura, tendências de arquitetura 2026)."},{"trend":"O segmento de médio-alto padrão brasileiro cresce mais rápido que o mercado imobiliário geral.","evidence":"R$30 bilhões em VGV lançado em 2025 (crescimento de 20% sobre 2024), contra projeção de apenas 10% de crescimento geral do mercado imobiliário para 2026, segundo a CBIC (fonte: Papo Imobiliário, Portas)."},{"trend":"Jundiaí se consolida como polo de crescimento para o alto padrão, com novos lançamentos e forte demanda por casas de 4 suítes entre R$1,5M e R$4M.","evidence":"Relatórios do mercado imobiliário local (Chenquer & Camargo, Roberto Appires, 2025/2026) confirmam aquecimento do segmento na região, com novos empreendimentos como Alphaville Jundiaí e Reserva da Ermida."}],"threats":[{"threat":"Queda de 17% nos financiamentos imobiliários em 2025, impulsionada pela Selic a 15%, afetando principalmente o segmento de médio e alto padrão.","potential_impact":"Clientes que dependem de financiamento (não fecham 100% à vista) podem adiar a decisão de investir nos próximos 12 meses, reduzindo o volume de novos contratos fechados — já sentido pela própria Amanda, que orienta clientes para carta de crédito como alternativa."},{"threat":"Escassez de mão de obra qualificada no setor, já relatada diretamente pela Amanda, aumentando o prazo médio de obra para ~2 anos.","potential_impact":"Prazos mais longos aumentam o risco de insatisfação do cliente (a dor mais crítica do ICP é justamente medo de obra atrasada) e reduzem a velocidade de giro do pipeline de 8 obras simultâneas nos próximos 12 meses."}],"unexploited_opportunity":{"description":"Ocupar o território 'A única arquiteta de alto padrão da região que mostra o controle financeiro real da obra — não só a planta bonita' — nenhum dos 5 concorrentes mapeados (Eduardo Muzi, Ricardo Gaspari, Guedes e Bisoli, Vitor Dias, Adriana Consulin) comunica processo, planilha ou previsibilidade financeira como diferencial público.","why_nobody_does_it":"(1) A maioria dos escritórios de arquitetura vende principalmente estética/portfólio, porque historicamente é o que gera mais engajamento em redes sociais e revistas do setor — expor processo financeiro parece 'menos bonito' e menos compartilhável. (2) Mostrar controle financeiro exige expor vulnerabilidade real (nem toda obra é perfeita), o que a maioria dos concorrentes evita por medo de parecer menos 'mágico' ou aspiracional aos olhos do público. (3) Comunicar isso de forma crível exige ter, de fato, um sistema implementado (planilha, prestação de contas, processo documentado) — a maioria dos concorrentes menores mapeados simplesmente não tem esse processo estruturado para mostrar, mesmo que quisesse copiar a estratégia.","feasibility":"alta"},"market_jtbd":{"current_solutions":"A maioria do mercado regional resolve contratando separadamente: um arquiteto para o projeto, uma construtora/empreiteiro para a execução, e às vezes um decorador para os interiores — três contratos, três responsáveis, sem garantia de compatibilização técnica entre eles.","alternatives":[{"type":"direct","description":"Contratar um concorrente direto (Eduardo Muzi, Ricardo Gaspari ou Guedes e Bisoli) que também oferece projeto+execução, mas sem o mesmo nível de controle financeiro transparente comunicado."},{"type":"indirect","description":"Contratar um arquiteto só para o projeto e uma construtora/empreiteira avulsa para a obra, aceitando o risco de incompatibilização técnica entre os dois — o cenário que a própria Amanda já viu se materializar em obras que assumiu de terceiros."},{"type":"diy","description":"O próprio cliente (geralmente o marido, no comitê de decisão do casal) assume diretamente a gestão da obra, coordenando fornecedores e empreiteiros sem apoio profissional dedicado."},{"type":"inaction","description":"Adiar a decisão de construir, mantendo o capital investido em aplicações financeiras em vez de imobilizar em construção — comportamento já observado no mercado de alto padrão em 2025/2026 devido à Selic alta e à queda nos financiamentos imobiliários."}],"cost_of_inaction":"Quem adia a decisão ou tenta o caminho DIY corre o risco real de obra atrasada, orçamento estourado e retrabalho técnico — exatamente as dores mais críticas já mapeadas no ICP da Amanda. Cada mês de atraso é capital imobilizado sem retorno, especialmente relevante no cenário atual de Selic alta, em que manter o dinheiro aplicado compete diretamente com a decisão de construir."},"real_differentials":[{"differential":"Projeto executivo tecnicamente compatibilizado, evitando retrabalho em obra","status":"confirmed","icp_relevance":"Resolve diretamente a dor mais crítica do ICP: medo de contratar alguém tecnicamente fraco e só descobrir o erro durante a execução ('não imaginei que ficaria assim')."},{"differential":"Recusa formal de comissionamento de fornecedores (RT), com o desconto repassado em nota fiscal ao cliente","status":"confirmed","icp_relevance":"Atende diretamente ao job funcional do marido no comitê de decisão (controle financeiro, transparência) — nenhum dos 5 concorrentes mapeados comunica isso publicamente."},{"differential":"Presença territorial consolidada (40+ projetos entregues no condomínio Terras da Alvorada)","status":"confirmed","icp_relevance":"Reduz o risco percebido de quem recebeu indicação — 'já rolou ali perto', segundo a própria lógica de decisão do ICP mapeada na persona."},{"differential":"Comunicação pública do controle financeiro/processo estruturado (conceito da planilha, prestação de contas periódica)","status":"potential","icp_relevance":"Resolveria a objeção mais recorrente do ICP ('turnkey deve custar mais caro') e ocuparia o único território de mensagem vazio entre os concorrentes mapeados.","action_needed":"Criar conteúdo educativo mostrando o CONCEITO do processo (não os dados internos da planilha, que são documento privado) — ação já ranqueada como prioridade 2 na SWOT e no diagnóstico de maturidade."},{"differential":"Presença dominante em condomínios emergentes (Almarias, Quinta da Primavera)","status":"aspirational","icp_relevance":"Replicaria o sucesso territorial do Terras da Alvorada em novos condomínios ainda sem 'arquiteto-referência', mas essa dominância ainda não foi conquistada — depende de execução deliberada nos próximos meses.","action_needed":"Investir em conteúdo/mídia segmentada especificamente para esses condomínios, conforme já recomendado na SWOT (estratégia SO1)."}],"honesty_alert":"Os valores de SAM e SOM regionais desta pesquisa são estimativas bottom-up [E], construídas a partir de dados públicos parciais (não existe estatística oficial granular para 'arquitetura residencial de altíssimo padrão sob encomenda' na microrregião de Jundiaí — os dados públicos disponíveis tratam do mercado imobiliário geral ou de lançamentos de incorporadoras). A ordem de grandeza é defensável (triangulada por 3 métodos que convergem), mas os números absolutos devem ser tratados como direção estratégica, não como previsão financeira precisa. O salto entre o faturamento atual (R$1M) e o SOM de mercado (R$23M) é grande porque representa o teto TOTALMENTE maduro do mercado — não uma meta de 12 meses; a meta real de curto prazo da própria cliente (R$6M/ano, ~26% do SOM) é a referência mais realista para os próximos ciclos de planejamento."},"ee-s2-posicionamento":{"client_name":"Amanda Ferraz Arquitetura e Construção","summary":"PUV definida: 'Um único contrato para projeto, obra e decoração — sem retrabalho técnico e sem comissão escondida de fornecedor, com controle financeiro que você acompanha a cada etapa.' Direção escolhida pelo operador: 'A Especialista Técnica' (funcional, não emocional), com tagline 'Projeto, obra e decoração. Um contrato. Zero surpresa.' Território de marca: Controle · Presença · Discrição — o único quadrante vazio entre os 5 concorrentes mapeados na pesquisa de mercado.","summary_headline":"Amanda Ferraz ocupa o território 'Controle + Presença + Discrição' — único quadrante vazio entre 5 concorrentes mapeados, com janela fechando nos condomínios emergentes.","summary_highlights":[{"category":"posicao","label":"Território de marca","value":"Controle · Presença · Discrição","subtext":"Quadrante vazio entre 5 concorrentes mapeados","tone":"green"},{"category":"competicao","label":"Território do concorrente #1","value":"Eduardo Muzi: estética pura","subtext":"Site editorial, sem prova de processo/controle","tone":"yellow"},{"category":"janela","label":"Condomínios emergentes","value":"2 sem 'dono' ainda","subtext":"Fecha assim que concorrente se estabelecer","tone":"yellow"},{"category":"oportunidade","label":"PUV aprovada","value":"Ticket R$450-500k + gestão 12%","subtext":"ICP: casal 35-60, patrimônio consolidado","tone":"green"},{"category":"risco","label":"Diferencial ainda não comunicado","value":"Status: potencial → confirmado","subtext":"Depende da produção da Semana 3","tone":"red"}],"summary_key_findings":[{"category":"vantagem","text":"O território 'Controle + Presença + Discrição' está vazio entre os 5 concorrentes mapeados — nenhum combina prova de processo financeiro real com presença pessoal genuína."},{"category":"contexto","text":"A mensagem-chave emocional já aprovada na persona-icp ('Você vive sua vida. Nós vivemos a obra.') se mantém como base da comunicação, agora sustentada por um território estratégico mais amplo e defensável."},{"category":"ameaca","text":"O território é hoje mais potencial que confirmado na percepção do mercado — só vira real quando a produção da Semana 3 (brandbook, landing page, criativos) comunicar o conceito com consistência."},{"category":"acao","text":"Priorizar conteúdo que prove o processo (sem expor a planilha interna em si) nos condomínios emergentes (Almarias, Quinta da Primavera) antes que um concorrente se estabeleça lá primeiro."}],"positioning_map":{"axis_x":"Especialista territorial ←→ Generalista multi-praça","axis_y":"Estética pura ←→ Controle técnico-financeiro comunicado","client_position":"Especialista territorial + Controle técnico-financeiro comunicado","justification":"É o único quadrante sem ocupação real entre os 5 concorrentes mapeados na pesquisa de mercado — Amanda já tem a prova (planilha de 25 etapas, zero comissão de fornecedor, projeto executivo sem retrabalho), só falta comunicar com a mesma consistência territorial que já construiu organicamente no condomínio Terras da Alvorada.","competitor_positions":[{"name":"Eduardo Muzi","quadrant":"Especialista territorial + Estética pura"},{"name":"Ricardo Gaspari","quadrant":"Especialista territorial + Estética pura (mais fraca, institucional datado)"},{"name":"Guedes e Bisoli","quadrant":"Especialista territorial + Estética pura (com boa prova social)"},{"name":"Vitor Dias Arquitetura","quadrant":"Generalista + Estética pura"},{"name":"Adriana Consulin Arquitetura","quadrant":"Generalista + Estética pura"}]},"positioning_statements":[{"label":"A Especialista Técnica","statement":"Para famílias de alto padrão que já ouviram histórias de obra atrasada e querem investir com segurança, Amanda Ferraz é a arquiteta que entrega projeto, obra e decoração sob um único contrato e controle financeiro real, porque prova isso com um processo estruturado de etapas e recusa formal de comissionamento de fornecedores.","justification":"Ocupa diretamente o quadrante vazio identificado na pesquisa de mercado — nenhum dos 5 concorrentes mapeados comunica controle técnico-financeiro com essa força.","bet":"Prioriza o diferencial técnico/financeiro real, o único território verdadeiramente exclusivo hoje.","risk":"Pode soar 'menos bonito' ou menos aspiracional num mercado onde todo mundo vende estética primeiro — exige educar o mercado sobre por que processo importa tanto quanto design."},{"label":"A Guardiã do Tempo","statement":"Para o casal que já comprou o terreno dos sonhos mas teme perder anos de vida numa obra sem fim, Amanda Ferraz é a arquiteta que assume a obra inteira para que a família viva sua vida, porque ela mesma está presente, resolvendo, enquanto o casal só participa das decisões que dão prazer.","justification":"Mantém a mensagem-chave emocional já aprovada e validada na skill de persona-icp — a mais reconhecível e autêntica na voz atual da marca.","bet":"Prioriza a promessa emocional (tempo, tranquilidade) já testada e aprovada pela própria cliente.","risk":"O território emocional puro ('tranquilidade', 'realizar sonhos') já é ocupado de forma genérica por todo o setor de alto padrão — sem reforço do diferencial técnico, pode se diluir entre os concorrentes."},{"label":"A Arquiteta do Bairro","statement":"Para famílias que estão comprando terreno em condomínios emergentes como Almarias e Quinta da Primavera, Amanda Ferraz é a arquiteta que já é referência consolidada na região (40+ projetos no Terras da Alvorada), porque conhece o território, os fornecedores locais e os vizinhos que vão indicá-la.","justification":"Captura diretamente a janela de oportunidade territorial identificada na SWOT (condomínios emergentes ainda sem 'arquiteto-dono').","bet":"Prioriza escala geográfica e prova social territorial, replicando o modelo que já funcionou organicamente.","risk":"Limita a mensagem a quem já está dentro desses condomínios específicos — menos escalável para São Paulo capital ou públicos fora dessas geografias."}],"chosen_statement":"Para famílias de alto padrão que já ouviram histórias de obra atrasada e querem investir com segurança, Amanda Ferraz é a arquiteta que entrega projeto, obra e decoração sob um único contrato e controle financeiro real, porque prova isso com um processo estruturado de etapas e recusa formal de comissionamento de fornecedores.","puv":"Um único contrato para projeto, obra e decoração — sem retrabalho técnico e sem comissão escondida de fornecedor, com controle financeiro que você acompanha a cada etapa.","canvas_4p":{"product":{"delivers":"Um pacote turnkey completo — projeto arquitetônico, design de interiores e gerenciamento de obra sob um único contrato e uma única responsável, com processo estruturado (planilha de etapas, prestação de contas periódica) que garante zero comissionamento oculto de fornecedores.","transformation":"Antes: família com terreno comprado, sem saber por onde começar, com medo de virar mais um caso de obra atrasada e orçamento estourado, tendo que coordenar arquiteto, empreiteiro e fornecedores sozinha. Depois: participa de apenas 10-12 encontros ao longo de ~2 anos de obra, só nas decisões que dão prazer (planta, acabamentos, 3D), recebe prestação de contas periódica, e entra numa casa pronta e decorada que reflete a identidade real da família — sem ter carregado o peso do canteiro.","doesnt_deliver":"Não atende clientes que querem contratar só uma parte do serviço (só interiores, ou só execução de obra com projeto de terceiros) — Amanda recusa esses fechamentos por decisão estratégica. Também não atende obras abaixo de ~R$4-5 milhões de investimento, nem clientes que querem microgerenciar a obra de perto. E não expõe publicamente os dados internos da planilha financeira (valores negociados, fornecedores específicos) — o que é comunicado é o CONCEITO do processo, não o documento em si."},"price":{"positioning":"premium","justification":"O ticket (R$450-500 mil em honorários de projeto+interiores, mais 12% de gestão sobre uma obra de R$5-10 milhões+) já posiciona a oferta no topo do mercado regional — a comunicação deve justificar esse valor pelo risco eliminado (zero retrabalho, zero comissão oculta), não por comparação direta de preço com concorrentes que não expõem os seus.","anchoring":"Ancorar o preço no CUSTO DE NÃO CONTRATAR o pacote completo: quem contrata separado (arquiteto + empreiteiro avulso) paga, sem saber, o comissionamento embutido (10-30% do valor da obra, prática comum no mercado local) somado ao retrabalho técnico por incompatibilização — o pacote turnkey da Amanda substitui esse custo invisível por um processo transparente."},"place":{"main_channel":"Indicação qualificada + Instagram/site como validação (não aquisição fria)","main_channel_justification":"~99% da carteira já nasce de indicação; o comportamento real do ICP é usar o digital para VALIDAR quem já foi recomendado, não para descobrir a Amanda do zero — investir pesado em aquisição fria antes de resolver CRM e portfólio (gaps já identificados na auditoria de comunicação) desperdiçaria orçamento.","support_channel":"Mídia paga segmentada (Meta + Google), com foco territorial nos condomínios emergentes (Almarias, Quinta da Primavera) e em quem está pesquisando terreno na região — a ativar assim que CRM e portfólio estiverem prontos.","avoid_channels":[{"channel":"TikTok como canal principal de aquisição","reason":"O próprio TikTok se define como rede de entretenimento, não social — o tom 'quiet luxury' da marca não combina com o consumo acelerado da plataforma; pode ser usado pontualmente, nunca como canal principal."},{"channel":"Anúncios amplos sem segmentação geográfica/de perfil","reason":"Já causou o erro documentado da última campanha (R$1.200 gastos, só contatos de fornecedores) — sem negativação e segmentação por território/perfil de renda, o canal atrai o público errado."}]},"promotion":{"tone":"Quiet luxury — editorial, contido, técnico mas caloroso. Sem emojis, sem gírias, sem urgência artificial, nunca ataca concorrentes publicamente. Amanda aparece com autoridade técnica real (não só imagem), conduzindo a narrativa sem competir com a arquitetura pelo protagonismo.","top_funnel_message":"Projeto, obra e decoração. Um contrato. Zero surpresa. (tagline aprovada, usada como hook de entrada em conteúdo de descoberta e nos condomínios emergentes)","bottom_funnel_message":"Planilha de etapas, prestação de contas periódica e recusa formal de comissionamento de fornecedores — agende uma conversa e veja o processo. (usada em CTAs de fundo de funil, apresentação comercial e landing page)"}},"brand_territory":{"three_words":["Controle","Presença","Discrição"],"description":"Amanda Ferraz ocupa o território de quem tem CONTROLE real (planilha, processo estruturado, zero comissão oculta) e mostra isso com PRESENÇA pessoal genuína na obra (não só em fotos bonitas), tudo comunicado com DISCRIÇÃO — sem disputar a amente; nunca estética 'TikTok genérico' (cortes agressivos, efeitos de trend, memes); evitar cantos arredondados e uso excessivo do vermelho (deve ser só detalhe/assinatura, nunca protagonista)."},"digital_situation":{"paid_traffic":true,"platforms":["google_ads","meta_ads"],"monthly_investment":"R$ 2.000/mês (investimento atual inicial). Plano V4 em elaboração propõe evoluir para R$3.200-4.200/mês (Meta Ads R$1.500-2.000, YouTube Ads R$800-1.200, Google Ads R$600-1.000)","current_results":"Histórico recente malsucedido: R$1.200 investidos em 2 semanas geraram apenas 10 conversas no WhatsApp, e todas eram de fornecedores — não de clientes reais. Gestor de tráfego anterior foi desligado por falta de otimização de criativos e ausência de segmentação/negativação adequada.","crm":null,"lead_sources":"Aproximadamente 99% da carteira nasce de indicação; o papel dos canais digitais (Instagram, site, GMB) é validar a indicação em minutos, não gerar lead frio.","conversion_rate":"60-65% dos contratos fechados com pagamento à vista; inadimplência praticamente zero","biggest_pain":"Centralização excessiva de processos e decisões na própria Amanda, ausência de CRM/automação (já pagou por anos por um Bitrix nunca configurado corretamente, agora estudando ClickUp), campanhas de mídia paga anteriores mal executadas, e ausência total de presença em buscas por IA."},"accesses":{"meta_business":true,"google_ads":true,"google_analytics":null,"google_search_console":null,"instagram_admin":null,"website_admin":null,"crm":false,"gmb":true,"whatsapp_business":null},"sales_module":null}};

const E = s => s == null ? '' : String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const N = n => n != null ? new Intl.NumberFormat('pt-BR').format(n) : '—';
const BRL = n => n != null ? 'R$ ' + new Intl.NumberFormat('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n) : '—';
const PCT = n => n != null ? n.toFixed(1).replace('.',',') + '%' : '—';

const CLS = {critical:'Crítico',low:'Baixo',medium:'Médio',good:'Bom',excellent:'Excelente'};
const CLC = {critical:'red',low:'danger',medium:'yellow',good:'green',excellent:'green'};
const IMP = {high:'Alto',medium:'Médio',low:'Baixo'};
const IMC = {high:'red',medium:'yellow',low:'green'};
const PRI = {high:'red',medium:'yellow',normal:'gray',P1:'red',P2:'yellow',P3:'gray'};

function tg(text, color) { return '<span class="tg tg--'+(color||'gray')+'">'+E(text)+'</span>'; }
function mt(val, label, color, tip) {
  const tipLookup = (typeof MT_TIPS !== 'undefined' && MT_TIPS) ? MT_TIPS[label] : null;
  const tipText = tip || tipLookup || '';
  const help = tipText ? '<span class="mt__help" tabindex="0" aria-label="Explicação">?<span class="mt__tip">'+E(tipText)+'</span></span>' : '';
  return '<div class="mt">'+help+'<div class="mt__val'+(color?' mt__val--'+color:'')+'">'+(typeof val==='number'?N(val):E(String(val)))+'</div><div class="mt__lbl">'+E(label)+'</div></div>';
}

  'PageSpeed Mobile': 'Score de performance mobile do Lighthouse. Google usa mobile-first indexing — o score mobile pesa mais que desktop para SEO.',
  'PageSpeed Desktop': 'Score de performance desktop. Relevante para usuarios B2B ou conteudo denso, mas ja nao e a referencia principal de ranking.',
  'LCP': 'Largest Contentful Paint: tempo ate o maior elemento visivel carregar (geralmente hero). Ideal <2.5s. Core Web Vital que impacta ranking.',
  'Conv. Atual': 'Taxa de conversao atual da pagina (visitas → leads). Benchmark: 2-5% em LP de servico; 1-2% em site institucional.',
};
function sm(text) { return '<div class="sum"><div class="sum__tag">Resumo</div><p class="sum__text">'+E(text)+'</p></div>'; }
function co(text) { return '<div class="co"><p>'+E(text)+'</p></div>'; }
function pb(val, color) { return '<div class="pb"><div class="pb__fill pb__fill--'+(color||'red')+'" style="width:'+Math.min(100,Math.max(0,val||0))+'%"></div></div>'; }

function cd(title, body, variant) {
  return '<div class="cd'+(variant?' cd--'+variant:'')+'">'
    +(title?'<div class="cd__title">'+E(title)+'</div>':'')
    +(body?'<div class="cd__body">'+body+'</div>':'')
    +'</div>';
}

function tb(heads, rows) {
  if (!rows || !rows.length) return '';
  return '<div class="tw"><table><thead><tr>'+heads.map(h=>'<th>'+E(h)+'</th>').join('')+'</tr></thead><tbody>'
    +rows.map(r=>'<tr>'+r.map(c=>'<td>'+(c!=null?String(c):'')+' </td>').join('')+'</tr>').join('')
    +'</tbody></table></div>';
}

function chatBubbles(msgs) {
  return '<div class="chat">'+msgs.map(m=>{
    const who = m.from||'sdr';
    return '<div class="chat__msg chat__msg--'+who+'"><div class="chat__who chat__who--'+who+'">'
      +E(m.name||who)+'</div>'+E(m.text)+'</div>';
  }).join('')+'</div>';
}

function checklist(items, statusKey) {
  return '<ul class="cl">'+items.map(it=>{
    const st = statusKey ? (it[statusKey]||'pending') : 'pending';
    const icons = {done:'&#10003;', pending:'&#9675;', blocked:'&#10007;', pass:'&#10003;', fail:'&#10007;', partial:'&#9679;'};
    const cls = {done:'done',pending:'pending',blocked:'blocked',pass:'done',fail:'blocked',partial:'pending'};
    return '<li><span class="cl__icon cl__icon--'+(cls[st]||'pending')+'">'+(icons[st]||'&#9675;')+'</span><span>'
      +(typeof it==='string'?E(it):E(it.item||it.test||it.action||''))+'</span></li>';
  }).join('')+'</ul>';
}

function sc(title, html) { return '<div class="sc"><h3>'+E(title)+'</h3>'+html+'</div>'; }

function renderGantt(actions) {
  if (!actions || !actions.length) return '';
  const maxWeek = Math.max(...actions.map(a => a.week_end || a.week_start || 1), 5);
  const LW = 33;
  const BW = ((100 - LW) / maxWeek).toFixed(2);
  const cols = LW + '% ' + Array(maxWeek).fill(BW + '%').join(' ');
  const IC = {alto:'var(--danger)',alto2:'var(--danger)','médio':'var(--warning)',medio:'var(--warning)',baixo:'#94a3b8'};
  const getColor = imp => IC[(imp||'baixo').toLowerCase().replace(/\u00e9/g,'e')] || '#94a3b8';

  let h = '<div style="margin-top:.25rem">';
  // Header row
  h += '<div style="display:grid;grid-template-columns:'+cols+';gap:2px;margin-bottom:.375rem">';
  h += '<div></div>';
  for (let w = 1; w <= maxWeek; w++) h += '<div style="font-size:.625rem;font-weight:700;text-align:center;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em">S'+w+'</div>';
  h += '</div>';

  // Group by track
  const tracks = [];
  actions.forEach(a => { const t = a.track || 'Geral'; if (!tracks.includes(t)) tracks.push(t); });

  tracks.forEach(track => {
    h += '<div style="font-size:.5625rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--text-muted);padding:.5rem 0 .25rem;border-top:1px solid var(--border)">'+E(track)+'</div>';
    actions.filter(a => (a.track || 'Geral') === track).forEach(a => {
      const s = Math.max(1, a.week_start || 1);
      const e = Math.min(maxWeek, a.week_end || s);
      const color = getColor(a.impact);
      h += '<div style="display:grid;grid-template-columns:'+cols+';gap:2px;margin-bottom:3px;align-items:center">';
      h += '<div style="font-size:.7rem;color:var(--text-secondary);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding-right:.375rem" title="'+E(a.action)+'">'+E(a.action)+'</div>';
      for (let w = 1; w <= maxWeek; w++) {
        if (w >= s && w <= e) {
          const br = (s===e) ? '3px' : (w===s) ? '3px 0 0 3px' : (w===e) ? '0 3px 3px 0' : '0';
          h += '<div style="height:20px;background:'+color+';border-radius:'+br+';opacity:.82" title="'+E(a.action)+' (S'+s+'–S'+e+')"></div>';
        } else {
          h += '<div style="height:20px;background:var(--surface);border-radius:3px"></div>';
        }
      }
      h += '</div>';
    });
  });

  // Legend
  h += '<div style="display:flex;gap:.75rem;align-items:center;margin-top:.625rem;padding-top:.5rem;border-top:1px solid var(--border)">';
  h += '<span style="font-size:.6875rem;color:var(--text-muted)">Impacto:</span>';
  [['Alto','var(--danger)'],['Médio','var(--warning)'],['Baixo','#94a3b8']].forEach(function(pair) {
    h += '<div style="display:flex;align-items:center;gap:.25rem"><div style="width:10px;height:10px;background:'+pair[1]+';border-radius:2px;opacity:.82"></div><span style="font-size:.6875rem;color:var(--text-secondary)">'+pair[0]+'</span></div>';
  });
  h += '</div>';

  h += '</div>';
  return h;
}

// ===== SVG CHART LIBRARY =====
// Paleta semântica consistente
const CX = {
  red:'#dc2626', danger:'#b91c1c', orange:'#f97316', yellow:'#eab308',
  green:'#16a34a', emerald:'#059669', blue:'#2563eb', purple:'#7c3aed',
  gray:'#94a3b8', muted:'#64748b', line:'#e2e8f0', bg:'#f8fafc', text:'#0f172a'
};
const chartColor = (tone) => CX[tone] || CX.gray;

// insight(): wraps a chart with an auto-insight bullet (leitura estratégica do gráfico)
function insight(chartHtml, insightText, tone) {
  const borderColor = tone==='bad' ? CX.red : tone==='good' ? CX.green : tone==='warn' ? CX.yellow : CX.blue;
  return '<div class="chart-wrap" style="margin-bottom:.75rem">'
    +'<div style="padding:.25rem 0 .5rem">'+chartHtml+'</div>'
    +(insightText ? '<div style="margin-top:.25rem;padding:.5rem .75rem;border-left:3px solid '+borderColor+';background:var(--surface);border-radius:3px;font-size:.75rem;color:var(--text-secondary);line-height:1.45"><strong style="color:'+borderColor+';font-size:.6875rem;text-transform:uppercase;letter-spacing:.08em;display:block;margin-bottom:.15rem">Leitura</strong>'+E(insightText)+'</div>' : '')
    +'</div>';
}

// chartTitle: subtítulo de gráfico
function chartTitle(t) {
  return '<div style="font-size:.6875rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);margin-bottom:.375rem">'+E(t)+'</div>';
}

// BAR HORIZONTAL: comparar valores lado a lado
// items: [{label, value, tone, subtext}]
function chartHBar(items, opts) {
  opts = opts || {};
  if (!items?.length) return '';
  const max = opts.max || Math.max(...items.map(i=>i.value||0));
  if (!max) return '';
  const fmt = opts.fmt || (v=>v);
  const lw = opts.labelWidth || 120;
  return (opts.title?chartTitle(opts.title):'')
    +'<div style="display:flex;flex-direction:column;gap:.375rem">'+items.map(it=>{
      const pct = ((it.value||0)/max*100).toFixed(1);
      const col = chartColor(it.tone||'blue');
      return '<div style="display:grid;grid-template-columns:'+lw+'px 1fr 70px;gap:.5rem;align-items:center">'
        +'<div style="font-size:.75rem;color:var(--text-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+E(it.label)+'">'+E(it.label)+'</div>'
        +'<div style="height:18px;background:var(--surface);border-radius:3px;overflow:hidden;position:relative">'
        +'<div style="height:100%;width:'+pct+'%;background:'+col+';border-radius:3px;opacity:.85"></div>'
        +(it.subtext?'<div style="position:absolute;top:50%;transform:translateY(-50%);left:8px;font-size:.6875rem;color:white;font-weight:600;text-shadow:0 1px 2px rgba(0,0,0,.4)">'+E(it.subtext)+'</div>':'')
        +'</div>'
        +'<div style="font-size:.75rem;font-weight:700;color:'+col+';text-align:right">'+E(String(fmt(it.value)))+'</div>'
        +'</div>';
    }).join('')+'</div>';
}

// DONUT: distribuição percentual
// slices: [{label, value, tone}]
function chartDonut(slices, opts) {
  opts = opts || {};
  if (!slices?.length) return '';
  const total = slices.reduce((s,x)=>s+(x.value||0),0);
  if (!total) return '';
  const size = opts.size || 160;
  const cx = size/2, cy = size/2, r = size*0.4, ir = size*0.26;
  let angle = -Math.PI/2;
  const paths = slices.map(s=>{
    const frac = (s.value||0)/total;
    const a2 = angle + frac*Math.PI*2;
    const large = frac > 0.5 ? 1 : 0;
    const x1 = cx+r*Math.cos(angle), y1 = cy+r*Math.sin(angle);
    const x2 = cx+r*Math.cos(a2),   y2 = cy+r*Math.sin(a2);
    const x3 = cx+ir*Math.cos(a2),  y3 = cy+ir*Math.sin(a2);
    const x4 = cx+ir*Math.cos(angle), y4 = cy+ir*Math.sin(angle);
    const d = 'M '+x1+' '+y1+' A '+r+' '+r+' 0 '+large+' 1 '+x2+' '+y2+' L '+x3+' '+y3+' A '+ir+' '+ir+' 0 '+large+' 0 '+x4+' '+y4+' Z';
    angle = a2;
    return '<path d="'+d+'" fill="'+chartColor(s.tone||'blue')+'" opacity=".85"><title>'+E(s.label)+': '+(frac*100).toFixed(1)+'%</title></path>';
  }).join('');
  const legend = slices.map(s=>{
    const pct = ((s.value||0)/total*100).toFixed(1);
    return '<div style="display:flex;align-items:center;gap:.375rem;font-size:.75rem;margin-bottom:.2rem">'
      +'<div style="width:10px;height:10px;background:'+chartColor(s.tone||'blue')+';border-radius:2px;flex-shrink:0"></div>'
      +'<div style="flex:1;color:var(--text-secondary)">'+E(s.label)+'</div>'
      +'<div style="font-weight:700;color:var(--text-primary)">'+pct+'%</div>'
      +'</div>';
  }).join('');
  const centerLabel = opts.center || '';
  return (opts.title?chartTitle(opts.title):'')
    +'<div style="display:grid;grid-template-columns:'+size+'px 1fr;gap:1rem;align-items:center">'
    +'<svg viewBox="0 0 '+size+' '+size+'" width="'+size+'" height="'+size+'">'+paths
    +(centerLabel?'<text x="'+cx+'" y="'+(cy-4)+'" text-anchor="middle" font-size="14" font-weight="700" fill="'+CX.text+'">'+E(centerLabel.split('|')[0])+'</text>'
      +'<text x="'+cx+'" y="'+(cy+12)+'" text-anchor="middle" font-size="9" fill="'+CX.muted+'" text-transform="uppercase">'+E(centerLabel.split('|')[1]||'')+'</text>':'')
    +'</svg>'
    +'<div>'+legend+'</div>'
    +'</div>';
}

// GAUGE: métrica vs benchmark (semicírculo)
// value: atual, benchmark: meta/média, max: teto da escala
function chartGauge(value, benchmark, max, opts) {
  opts = opts || {};
  if (value == null || max == null) return '';
  const w = opts.size || 220, h = w*0.72;
  const cx = w/2, cy = h*0.78, r = w*0.40;
  const pct = Math.min(1, Math.max(0, value/max));
  const benchPct = benchmark!=null ? Math.min(1, Math.max(0, benchmark/max)) : null;
  const angleStart = Math.PI, angleEnd = 0;
  const valAngle = angleStart + (angleEnd-angleStart)*pct;
  // Inverted logic: for CPL/CPA lower is better
  const invert = opts.invert;
  const isGood = invert ? (benchmark!=null && value <= benchmark) : (benchmark!=null && value >= benchmark);
  const tone = isGood ? 'green' : (benchmark!=null ? 'red' : 'blue');
  const col = chartColor(tone);

  const arcPath = (a1, a2, rad) => {
    const x1 = cx+rad*Math.cos(a1), y1 = cy+rad*Math.sin(a1);
    const x2 = cx+rad*Math.cos(a2), y2 = cy+rad*Math.sin(a2);
    const large = Math.abs(a2-a1) > Math.PI ? 1 : 0;
    const sweep = a2 > a1 ? 1 : 0;
    return 'M '+x1+' '+y1+' A '+rad+' '+rad+' 0 '+large+' '+sweep+' '+x2+' '+y2;
  };
  const bench = benchPct != null ? angleStart + (angleEnd-angleStart)*benchPct : null;
  const benchX = bench != null ? cx+r*Math.cos(bench) : null;
  const benchY = bench != null ? cy+r*Math.sin(bench) : null;
  const benchXi = bench != null ? cx+(r-10)*Math.cos(bench) : null;
  const benchYi = bench != null ? cy+(r-10)*Math.sin(bench) : null;

  const fmt = opts.fmt || (v=>v);
  return (opts.title?chartTitle(opts.title):'')
    +'<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'" style="max-width:'+w+'px">'
    +'<path d="'+arcPath(angleStart, angleEnd, r)+'" fill="none" stroke="'+CX.line+'" stroke-width="10" stroke-linecap="round"/>'
    +'<path d="'+arcPath(angleStart, valAngle, r)+'" fill="none" stroke="'+col+'" stroke-width="10" stroke-linecap="round" opacity=".9"/>'
    +(bench != null ? '<line x1="'+benchXi+'" y1="'+benchYi+'" x2="'+benchX+'" y2="'+benchY+'" stroke="'+CX.text+'" stroke-width="2"/><circle cx="'+benchX+'" cy="'+benchY+'" r="4" fill="'+CX.text+'"/>' : '')
    +'<text x="'+cx+'" y="'+(cy-28)+'" text-anchor="middle" font-size="9" fill="'+CX.muted+'" text-transform="uppercase" letter-spacing=".05em">'+E(opts.metricLabel||'Atual')+'</text>'
    +'<text x="'+cx+'" y="'+(cy-8)+'" text-anchor="middle" font-size="22" font-weight="800" fill="'+col+'">'+E(String(fmt(value)))+'</text>'
    +'<text x="'+(cx-r+4)+'" y="'+(cy+12)+'" text-anchor="start" font-size="8" fill="'+CX.muted+'">0</text>'
    +'<text x="'+(cx+r-4)+'" y="'+(cy+12)+'" text-anchor="end" font-size="8" fill="'+CX.muted+'">'+E(String(fmt(max)))+'</text>'
    +(benchmark != null ? '<text x="'+cx+'" y="'+(cy+28)+'" text-anchor="middle" font-size="10" fill="'+CX.muted+'">Benchmark setor: '+E(String(fmt(benchmark)))+'</text>':'')
    +'</svg>';
}

// FUNNEL: estágios com conversão entre níveis
// stages: [{label, value, tone, subtext}]
function chartFunnel(stages) {
  if (!stages?.length) return '';
  const max = stages[0].value || Math.max(...stages.map(s=>s.value||0));
  if (!max) return '';
  return '<div style="display:flex;flex-direction:column;gap:.25rem">'+stages.map((s,i)=>{
    const pct = ((s.value||0)/max*100);
    const col = chartColor(s.tone||'blue');
    const prev = i>0 ? stages[i-1].value : null;
    const drop = prev && prev > 0 ? (((prev - (s.value||0))/prev)*100).toFixed(0) : null;
    return (drop!==null ? '<div style="text-align:center;font-size:.625rem;color:'+CX.red+';margin:-.1rem 0;font-weight:700">↓ vaza '+drop+'%</div>' : '')
      +'<div style="display:grid;grid-template-columns:140px 1fr 80px;gap:.5rem;align-items:center">'
      +'<div style="font-size:.75rem;font-weight:600;color:var(--text-primary)" title="'+E(s.label)+'">'+E(s.label)+'</div>'
      +'<div style="height:28px;background:var(--surface);border-radius:3px;overflow:hidden;position:relative">'
      +'<div style="height:100%;width:'+pct.toFixed(1)+'%;background:'+col+';border-radius:3px;opacity:.85;min-width:20px"></div>'
      +'<div style="position:absolute;inset:0;display:flex;align-items:center;padding:0 .5rem;font-size:.6875rem;color:'+(pct>40?'white':'var(--text-primary)')+';font-weight:700;text-shadow:'+(pct>40?'0 1px 2px rgba(0,0,0,.4)':'none')+'">'+E(s.subtext||'')+'</div>'
      +'</div>'
      +'<div style="font-size:.8125rem;font-weight:700;text-align:right;color:'+col+'">'+(typeof s.value==='number'?N(s.value):E(String(s.value||'—')))+'</div>'
      +'</div>';
  }).join('')+'</div>';
}

// RADAR: comparar scores multi-dimensionais (ex: pilares, competitor)
// axes: [{name, value, benchmark}]
function chartRadar(axes, opts) {
  opts = opts || {};
  if (!axes?.length || axes.length < 3) return '';
  const size = opts.size || 260;
  const cx = size/2, cy = size/2, maxR = size*0.37;
  const max = opts.max || 100;
  const n = axes.length;
  const pt = (i, val) => {
    const a = -Math.PI/2 + (i/n)*Math.PI*2;
    const rad = maxR * (val/max);
    return (cx+rad*Math.cos(a))+','+(cy+rad*Math.sin(a));
  };
  const axisLine = axes.map((_,i)=>{
    const a = -Math.PI/2 + (i/n)*Math.PI*2;
    return '<line x1="'+cx+'" y1="'+cy+'" x2="'+(cx+maxR*Math.cos(a))+'" y2="'+(cy+maxR*Math.sin(a))+'" stroke="'+CX.line+'" stroke-width="1"/>';
  }).join('');
  const rings = [0.25,0.5,0.75,1].map(f=>{
    const pts = axes.map((_,i)=>{
      const a = -Math.PI/2 + (i/n)*Math.PI*2;
      return (cx+maxR*f*Math.cos(a))+','+(cy+maxR*f*Math.sin(a));
    }).join(' ');
    return '<polygon points="'+pts+'" fill="none" stroke="'+CX.line+'" stroke-width="1" opacity=".6"/>';
  }).join('');
  const valPoly = '<polygon points="'+axes.map((a,i)=>pt(i,a.value||0)).join(' ')+'" fill="'+chartColor(opts.tone||'blue')+'" fill-opacity=".28" stroke="'+chartColor(opts.tone||'blue')+'" stroke-width="2"/>';
  const benchPoly = axes[0].benchmark!=null ? '<polygon points="'+axes.map((a,i)=>pt(i,a.benchmark||0)).join(' ')+'" fill="none" stroke="'+CX.muted+'" stroke-width="1.5" stroke-dasharray="4 3"/>':'';
  const labels = axes.map((a,i)=>{
    const ang = -Math.PI/2 + (i/n)*Math.PI*2;
    const lr = maxR + 18;
    const lx = cx+lr*Math.cos(ang), ly = cy+lr*Math.sin(ang);
    const anchor = Math.cos(ang) > 0.3 ? 'start' : Math.cos(ang) < -0.3 ? 'end' : 'middle';
    return '<text x="'+lx+'" y="'+(ly+3)+'" font-size="10" font-weight="600" fill="'+CX.text+'" text-anchor="'+anchor+'">'+E(a.name)+'</text>'
      +'<text x="'+lx+'" y="'+(ly+14)+'" font-size="9" fill="'+chartColor(opts.tone||'blue')+'" font-weight="700" text-anchor="'+anchor+'">'+(a.value||0)+(a.benchmark!=null?'/'+a.benchmark:'')+'</text>';
  }).join('');
  // Padding para labels nao cortarem
  const padX = 70, padY = 28;
  const vbW = size + padX*2, vbH = size + padY*2;
  return (opts.title?chartTitle(opts.title):'')
    +'<svg viewBox="'+(-padX)+' '+(-padY)+' '+vbW+' '+vbH+'" width="100%" height="'+vbH+'" preserveAspectRatio="xMidYMid meet" style="max-width:'+vbW+'px;display:block;margin:0 auto;overflow:visible">'
    +rings+axisLine+benchPoly+valPoly+labels
    +'</svg>'
    +(axes[0].benchmark!=null?'<div style="display:flex;gap:.75rem;justify-content:center;margin-top:.25rem;font-size:.6875rem;color:var(--text-muted)"><span><span style="display:inline-block;width:10px;height:10px;background:'+chartColor(opts.tone||'blue')+';opacity:.5;margin-right:.25rem;vertical-align:middle"></span>Atual</span><span><span style="display:inline-block;width:10px;height:2px;background:'+CX.muted+';margin-right:.25rem;vertical-align:middle"></span>Benchmark</span></div>':'');
}

// EFFORT x IMPACT MATRIX: prioriza acoes em 2x2 (Quick Wins / Grandes Projetos / Preencher / Revisar)
// items: [{label, effort: 'low|medium|high', impact: 'baixo|medio|alto', rank, tooltip}]
function chartEffortImpact(items, opts) {
  opts = opts || {};
  if (!items?.length) return '';
  const w = 520, h = 420;
  const pad = {l: 64, r: 24, t: 40, b: 56};
  const iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;
  const effX = {low: 0.25, medium: 0.55, high: 0.85};
  const impY = {alto: 0.18, medio: 0.5, baixo: 0.82};
  const xCol = v => pad.l + iw * (effX[v] ?? 0.5);
  const yRow = v => pad.t + ih * (impY[v] ?? 0.5);
  // Fundo dos quadrantes
  const midX = pad.l + iw/2, midY = pad.t + ih/2;
  const quads = ''
    + '<rect x="'+pad.l+'" y="'+pad.t+'" width="'+(iw/2)+'" height="'+(ih/2)+'" fill="'+CX.green+'" opacity=".10"/>'
    + '<rect x="'+midX+'" y="'+pad.t+'" width="'+(iw/2)+'" height="'+(ih/2)+'" fill="'+CX.blue+'" opacity=".10"/>'
    + '<rect x="'+pad.l+'" y="'+midY+'" width="'+(iw/2)+'" height="'+(ih/2)+'" fill="'+CX.gray+'" opacity=".10"/>'
    + '<rect x="'+midX+'" y="'+midY+'" width="'+(iw/2)+'" height="'+(ih/2)+'" fill="'+CX.red+'" opacity=".10"/>';
  const labelsQ = ''
    + '<text x="'+(pad.l+iw/4)+'" y="'+(pad.t+14)+'" text-anchor="middle" font-size="10" font-weight="700" fill="'+CX.green+'">QUICK WINS</text>'
    + '<text x="'+(midX+iw/4)+'" y="'+(pad.t+14)+'" text-anchor="middle" font-size="10" font-weight="700" fill="'+CX.blue+'">GRANDES PROJETOS</text>'
    + '<text x="'+(pad.l+iw/4)+'" y="'+(midY+14)+'" text-anchor="middle" font-size="10" font-weight="700" fill="'+CX.muted+'">PREENCHER</text>'
    + '<text x="'+(midX+iw/4)+'" y="'+(midY+14)+'" text-anchor="middle" font-size="10" font-weight="700" fill="'+CX.red+'">REVISAR</text>';
  // Grid
  const axes = ''
    + '<line x1="'+pad.l+'" y1="'+pad.t+'" x2="'+pad.l+'" y2="'+(pad.t+ih)+'" stroke="'+CX.line+'" stroke-width="1"/>'
    + '<line x1="'+pad.l+'" y1="'+(pad.t+ih)+'" x2="'+(pad.l+iw)+'" y2="'+(pad.t+ih)+'" stroke="'+CX.line+'" stroke-width="1"/>'
    + '<line x1="'+midX+'" y1="'+pad.t+'" x2="'+midX+'" y2="'+(pad.t+ih)+'" stroke="'+CX.line+'" stroke-width="1" stroke-dasharray="4 4"/>'
    + '<line x1="'+pad.l+'" y1="'+midY+'" x2="'+(pad.l+iw)+'" y2="'+midY+'" stroke="'+CX.line+'" stroke-width="1" stroke-dasharray="4 4"/>';
  // Labels dos eixos
  const axLabels = ''
    + '<text x="'+(pad.l+iw/2)+'" y="'+(h-12)+'" text-anchor="middle" font-size="11" font-weight="700" fill="'+CX.text+'">ESFORCO (menor → maior)</text>'
    + '<text x="'+(pad.l-22)+'" y="'+(pad.t+ih/2)+'" text-anchor="middle" font-size="11" font-weight="700" fill="'+CX.text+'" transform="rotate(-90 '+(pad.l-22)+' '+(pad.t+ih/2)+')">IMPACTO (menor → maior)</text>'
    + '<text x="'+xCol('low')+'" y="'+(pad.t+ih+16)+'" text-anchor="middle" font-size="9" fill="'+CX.muted+'">Baixo</text>'
    + '<text x="'+xCol('medium')+'" y="'+(pad.t+ih+16)+'" text-anchor="middle" font-size="9" fill="'+CX.muted+'">Medio</text>'
    + '<text x="'+xCol('high')+'" y="'+(pad.t+ih+16)+'" text-anchor="middle" font-size="9" fill="'+CX.muted+'">Alto</text>'
    + '<text x="'+(pad.l-6)+'" y="'+(yRow('alto')+3)+'" text-anchor="end" font-size="9" fill="'+CX.muted+'">Alto</text>'
    + '<text x="'+(pad.l-6)+'" y="'+(yRow('medio')+3)+'" text-anchor="end" font-size="9" fill="'+CX.muted+'">Medio</text>'
    + '<text x="'+(pad.l-6)+'" y="'+(yRow('baixo')+3)+'" text-anchor="end" font-size="9" fill="'+CX.muted+'">Baixo</text>';
  // Agrupa itens na mesma celula para nao sobrepor
  const bucket = {};
  items.forEach((it, idx) => {
    const key = (it.effort||'medium')+'|'+(it.impact||'medio');
    (bucket[key] = bucket[key] || []).push({...it, _i: idx});
  });
  let dots = '';
  Object.values(bucket).forEach(group => {
    const n = group.length;
    group.forEach((it, j) => {
      const cx = xCol(it.effort||'medium');
      const cy = yRow(it.impact||'medio');
      // offset radial se houver mais de 1 no mesmo balde
      const off = n>1 ? 16 : 0;
      const ang = n>1 ? (j/n) * Math.PI*2 - Math.PI/2 : 0;
      const dx = cx + off*Math.cos(ang), dy = cy + off*Math.sin(ang);
      const isCritical = it.impact==='alto' && it.effort==='low';
      const col = isCritical ? CX.green : it.impact==='alto' ? CX.blue : it.impact==='medio' ? CX.yellow : CX.gray;
      dots += '<circle cx="'+dx+'" cy="'+dy+'" r="13" fill="'+col+'" stroke="#fff" stroke-width="2">'
        + '<title>'+E(it.tooltip||it.label||'')+'</title></circle>'
        + '<text x="'+dx+'" y="'+(dy+4)+'" text-anchor="middle" font-size="11" font-weight="800" fill="#fff" pointer-events="none">'+E(String(it.rank||(it._i+1)))+'</text>';
    });
  });
  return (opts.title?chartTitle(opts.title):'')
    + '<svg viewBox="0 0 '+w+' '+h+'" width="100%" style="max-width:'+w+'px;display:block;margin:0 auto">'
    + quads + axes + labelsQ + axLabels + dots + '</svg>';
}

// WATERFALL: cenários com entradas e saídas progressivas
// items: [{label, value, tone}] — o valor pode ser positivo ou negativo
function chartWaterfall(items, opts) {
  opts = opts || {};
  if (!items?.length) return '';
  const w = opts.width || 480, h = opts.height || 180;
  const lab = 20, right = 20, top = 20, bottom = 30;
  const cw = (w-lab-right)/items.length;
  let running = 0;
  const running_ = items.map(it=>{ const from = running; running += (it.value||0); return {from, to: running}; });
  const allVals = running_.flatMap(r=>[r.from,r.to]);
  const maxV = Math.max(...allVals, 0), minV = Math.min(...allVals, 0);
  const yScale = v => top + (h-top-bottom) * (1 - (v-minV)/Math.max(1,maxV-minV));
  const bars = items.map((it,i)=>{
    const r = running_[i];
    const col = chartColor(it.tone || (it.value>=0?'green':'red'));
    const y0 = yScale(r.from), y1 = yScale(r.to);
    const yTop = Math.min(y0,y1), hh = Math.max(2, Math.abs(y1-y0));
    const x = lab + i*cw + cw*0.15;
    const bw = cw*0.7;
    return '<rect x="'+x+'" y="'+yTop+'" width="'+bw+'" height="'+hh+'" fill="'+col+'" opacity=".85"/>'
      +'<text x="'+(x+bw/2)+'" y="'+(yTop-4)+'" text-anchor="middle" font-size="10" font-weight="700" fill="'+CX.text+'">'+(it.value>=0?'+':'')+(opts.fmt?opts.fmt(it.value):it.value)+'</text>'
      +'<text x="'+(x+bw/2)+'" y="'+(h-bottom+14)+'" text-anchor="middle" font-size="9" fill="'+CX.muted+'">'+E(it.label)+'</text>';
  }).join('');
  const baseline = '<line x1="'+lab+'" y1="'+yScale(0)+'" x2="'+(w-right)+'" y2="'+yScale(0)+'" stroke="'+CX.line+'" stroke-width="1"/>';
  return (opts.title?chartTitle(opts.title):'')
    +'<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'" preserveAspectRatio="xMidYMid meet">'
    +baseline+bars
    +'</svg>';
}

// GROUPED BARS: 2-3 series side by side (ex: cenários A/B/C em 3 métricas)
// series: [{name, tone, values:[v1,v2,...]}], categories: [label1, ...]
function chartGroupedBars(categories, series, opts) {
  opts = opts || {};
  if (!categories?.length || !series?.length) return '';
  const w = opts.width || 520, h = opts.height || 200;
  const pad = {l:40,r:20,t:30,b:40};
  const cw = (w-pad.l-pad.r)/categories.length;
  const bw = (cw*0.7)/series.length;
  const all = series.flatMap(s=>s.values);
  const max = Math.max(...all, 0);
  const yScale = v => pad.t + (h-pad.t-pad.b) * (1 - v/Math.max(1,max));
  const groups = categories.map((cat,i)=>{
    const gx = pad.l + i*cw + cw*0.15;
    return series.map((s,si)=>{
      const x = gx + si*bw;
      const val = s.values[i]||0;
      const y = yScale(val);
      const barH = (h-pad.b) - y;
      const col = chartColor(s.tone||'blue');
      return '<rect x="'+x+'" y="'+y+'" width="'+(bw-2)+'" height="'+Math.max(0,barH)+'" fill="'+col+'" opacity=".85"/>'
        +'<text x="'+(x+bw/2)+'" y="'+(y-3)+'" text-anchor="middle" font-size="9" font-weight="700" fill="'+CX.text+'">'+(opts.fmt?opts.fmt(val):val)+'</text>';
    }).join('')
    +'<text x="'+(gx+cw*0.35)+'" y="'+(h-pad.b+14)+'" text-anchor="middle" font-size="10" font-weight="600" fill="'+CX.text+'">'+E(cat)+'</text>';
  }).join('');
  const legend = '<div style="display:flex;gap:.75rem;justify-content:center;margin-top:.25rem;font-size:.6875rem">'
    +series.map(s=>'<span><span style="display:inline-block;width:10px;height:10px;background:'+chartColor(s.tone||'blue')+';opacity:.85;margin-right:.25rem;vertical-align:middle"></span>'+E(s.name)+'</span>').join('')
    +'</div>';
  const yAxis = opts.yLabel ? '<text x="8" y="'+(pad.t+(h-pad.t-pad.b)/2)+'" transform="rotate(-90 8 '+(pad.t+(h-pad.t-pad.b)/2)+')" text-anchor="middle" font-size="9" font-weight="600" fill="'+CX.muted+'" text-transform="uppercase" letter-spacing=".05em">'+E(opts.yLabel)+'</text>' : '';
  const xAxis = opts.xLabel ? '<text x="'+(pad.l+(w-pad.l-pad.r)/2)+'" y="'+(h-4)+'" text-anchor="middle" font-size="9" font-weight="600" fill="'+CX.muted+'" text-transform="uppercase" letter-spacing=".05em">'+E(opts.xLabel)+'</text>' : '';
  return (opts.title?chartTitle(opts.title):'')
    +'<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'" preserveAspectRatio="xMidYMid meet">'
    +'<line x1="'+pad.l+'" y1="'+(h-pad.b)+'" x2="'+(w-pad.r)+'" y2="'+(h-pad.b)+'" stroke="'+CX.line+'" stroke-width="1"/>'
    +'<line x1="'+pad.l+'" y1="'+pad.t+'" x2="'+pad.l+'" y2="'+(h-pad.b)+'" stroke="'+CX.line+'" stroke-width="1"/>'
    +yAxis+xAxis
    +groups
    +'</svg>'+legend;
}

// SPARKLINE: linha temporal compacta
function chartSparkline(values, opts) {
  opts = opts || {};
  if (!values?.length) return '';
  const w = opts.width||200, h = opts.height||40;
  const max = Math.max(...values), min = Math.min(...values);
  const span = max-min || 1;
  const step = (w-4)/(values.length-1||1);
  const pts = values.map((v,i)=>(2+i*step)+','+(h-2-((v-min)/span)*(h-4))).join(' ');
  const col = chartColor(opts.tone||'blue');
  const last = values[values.length-1], first = values[0];
  const trendCol = last>=first ? (opts.invert?CX.red:CX.green) : (opts.invert?CX.green:CX.red);
  return '<svg viewBox="0 0 '+w+' '+h+'" width="'+w+'" height="'+h+'">'
    +'<polyline points="'+pts+'" fill="none" stroke="'+col+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'
    +'<circle cx="'+(2+(values.length-1)*step)+'" cy="'+(h-2-((last-min)/span)*(h-4))+'" r="3" fill="'+trendCol+'"/>'
    +'</svg>';
}

// heatCell: célula colorida pra scores 0-100
function heatCell(val, opts) {
  opts = opts || {};
  if (val == null) return '<span style="color:var(--text-muted)">—</span>';
  const t = val>=70?'green':val>=50?'yellow':val>=30?'orange':'red';
  return '<span style="display:inline-block;min-width:40px;padding:.1rem .4rem;background:'+chartColor(t)+';color:white;font-size:.75rem;font-weight:700;border-radius:3px;text-align:center">'+N(val)+(opts.suffix||'')+'</span>';
}
