      enderecavelHtml = '<div style="margin-top:1rem;padding:.875rem 1rem;background:linear-gradient(180deg, rgba(99,102,241,0.04), rgba(99,102,241,0.02));border:1px solid rgba(99,102,241,0.15);border-radius:4px">'
        +'<div style="font-size:.6875rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#6366f1;margin-bottom:.5rem">Por que o SOM não é o SAM inteiro? — camada do mercado endereçável</div>'
        +(endVal
          ? '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-bottom:.625rem;font-size:.75rem">'
            +'<div style="padding:.5rem;background:rgba(245,158,11,0.08);border-left:2px solid var(--warning);border-radius:2px"><div style="font-size:.625rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.2rem">SAM total</div><div style="font-weight:700;color:var(--text-primary)">'+BRL(sam)+'</div><div style="color:var(--text-muted);font-size:.6875rem">todo o gasto vet da microrregião</div></div>'
            +'<div style="padding:.5rem;background:rgba(99,102,241,0.08);border-left:2px solid #6366f1;border-radius:2px"><div style="font-size:.625rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.2rem">Mercado endereçável</div><div style="font-weight:700;color:#6366f1">'+BRL(endVal)+(endPctSam?' <span style="font-size:.6875rem;color:var(--text-muted);font-weight:500">('+endPctSam.toFixed(0)+'% do SAM)</span>':'')+'</div><div style="color:var(--text-muted);font-size:.6875rem">fatia do SAM relevante à oferta</div></div>'
            +'<div style="padding:.5rem;background:rgba(22,163,74,0.08);border-left:2px solid var(--success);border-radius:2px"><div style="font-size:.625rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.2rem">SOM</div><div style="font-weight:700;color:var(--success)">'+BRL(som)+(somOverEnd?' <span style="font-size:.6875rem;color:var(--text-muted);font-weight:500">('+somOverEnd.toFixed(0)+'% do endereçável)</span>':'')+'</div><div style="color:var(--text-muted);font-size:.6875rem">capturável pela clínica</div></div>'
            +'</div>'
          : '')
        +'<div style="font-size:.75rem;color:var(--text-secondary);line-height:1.55">'+(ms.enderecavel_note ? E(ms.enderecavel_note) : 'O SAM inclui todo o gasto vet da microrregião — de tutores ocasionais (consulta isca R$70) até premium humanizados. A clínica <strong>não compete</strong> nos perfis de commodity/ocasional por decisão estratégica. O <strong style="color:#6366f1">Mercado endereçável</strong> é o recorte do SAM onde a oferta dela é relevante — tipicamente o segmento premium humanizado + fatia do médio que upgrade. O SOM é quanto a clínica realisticamente captura DESSE endereçável, disputando com concorrentes de perfil similar. Essa camada explica por que o SOM não é maior mesmo sendo a clínica líder do seu nicho.')+'</div>'
        +'</div>';
    }

    h += sc('Market Share: ' + E(d.client_name || 'Cliente') + ' vs Mercado',
      insight(journey + context + enderecavelHtml,
        ms.commentary || '',
        progressToSom >= 50 ? 'good' : progressToSom >= 25 ? 'warn' : 'bad'));
  }

  // ══════════════════════════════════════════════════════════
  // 3. LEITURA ESTRATÉGICA — helper canônico (mesmo visual em toda skill)
  // ══════════════════════════════════════════════════════════
  h += renderLeituraEstrategica(d, { verdictLabel: 'Veredito de Mercado' });


  if (d.competitors?.length) {
    // ── SCORECARD UNIFICADO: cada linha é um <details> expansível com análise completa ──
    const ranked = [...d.competitors]
      .filter(c=>c.digital_score!=null)
      .sort((a,b)=>b.digital_score-a.digital_score);
    const unscored = d.competitors.filter(c=>c.digital_score==null);
    const all = ranked.concat(unscored);

    if (all.length) {
      const scoreTone = s => s==null?'var(--text-muted)':s>=7?'var(--success)':s>=4?'var(--warning)':'var(--danger)';
      const scoreLabel = s => s==null?'—':s>=7?'Forte':s>=4?'Médio':'Fraco';
      const maxScore = 10;
      const avg = ranked.length ? ranked.reduce((s,x)=>s+x.digital_score,0)/ranked.length : 0;
      const strongest = ranked[0];

      const rows = all.map((c, idx) => {
        const col = scoreTone(c.digital_score);
        const barW = c.digital_score!=null ? (c.digital_score/maxScore*100).toFixed(1) : 0;
        const rank = idx + 1;
        const isLeader = strongest && c.name === strongest.name;
        const strengths = (c.strengths||[]).slice(0, 4);
        const weaknesses = (c.weaknesses||[]).slice(0, 4);
        const channels = (c.channels||[]).slice(0, 4);

        // Summary row (clicável) — mantém o scorecard visual
        const summary = '<summary style="list-style:none;cursor:pointer;padding:.625rem .75rem;border-radius:3px;transition:background .15s" onmouseover="this.style.background=\'var(--surface)\'" onmouseout="this.style.background=\'transparent\'">'
          +'<div style="display:grid;grid-template-columns:28px minmax(0,1.6fr) minmax(0,3fr) auto 18px;gap:.625rem;align-items:center">'
          +  '<div style="font-size:.75rem;font-weight:800;color:var(--text-muted);text-align:center">#'+rank+'</div>'
          +  '<div style="display:flex;align-items:center;gap:.4rem;min-width:0">'
          +    '<span style="font-size:.8125rem;font-weight:600;color:var(--text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+E(c.name)+'">'+E(c.name)+'</span>'
          +    (isLeader?'<span style="flex-shrink:0;font-size:.5rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--danger);background:rgba(220,38,38,0.1);padding:.1rem .35rem;border-radius:2px;white-space:nowrap">⚡ Líder</span>':'')
          +  '</div>'
          +  '<div style="height:18px;background:var(--surface);border:1px solid var(--border);border-radius:9px;overflow:hidden;position:relative">'
          +    (c.digital_score!=null?'<div style="height:100%;width:'+barW+'%;background:'+col+';opacity:.85;border-radius:9px"></div>':'')
          +  '</div>'
          +  '<div style="display:flex;align-items:center;gap:.4rem;min-width:110px;justify-content:flex-end">'
          +    '<span style="font-size:.625rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:'+col+'">'+scoreLabel(c.digital_score)+'</span>'
          +    '<span style="font-size:.875rem;font-weight:800;color:'+col+'">'+(c.digital_score!=null?c.digital_score:'—')+'<span style="color:var(--text-muted);font-weight:500;font-size:.75rem">/10</span></span>'
          +  '</div>'
          +  '<span class="cmp-chev" style="font-size:.75rem;color:var(--text-muted);transition:transform .2s;display:inline-block">▸</span>'
          +'</div>'
          +'</summary>';

        // Painel de detalhes (abre ao clicar)
        const panel = '<div style="padding:.875rem 1rem 1rem;margin:0 .25rem .25rem;background:var(--surface);border-radius:3px;display:flex;flex-direction:column;gap:.75rem;border-left:2px solid '+col+'">'
          + (c.positioning?'<div><div style="font-size:.5625rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);margin-bottom:.25rem">Posicionamento</div>'
              +'<div style="font-size:.8125rem;color:var(--text-secondary);line-height:1.55">'+E(c.positioning)+'</div></div>':'')
          + (c.estimated_pricing?'<div style="font-size:.75rem;color:var(--text-secondary);padding:.5rem .625rem;background:var(--bg);border-radius:3px;border-left:2px solid var(--warning);line-height:1.5">'
              +'<span style="font-size:.5625rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--warning);margin-right:.5rem">Preço</span>'+E(c.estimated_pricing)+'</div>':'')
          + (channels.length?'<div><div style="font-size:.5625rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);margin-bottom:.3rem">Canais de aquisição</div>'
              +'<div style="display:flex;flex-wrap:wrap;gap:.3rem">'
              + channels.map(ch=>'<span style="font-size:.6875rem;color:var(--text-secondary);background:var(--bg);border:1px solid var(--border);padding:.2rem .5rem;border-radius:10px" title="'+E(ch)+'">'+E(ch.length>60?ch.substring(0,58)+'…':ch)+'</span>').join('')
              +'</div></div>':'')
          + ((strengths.length||weaknesses.length)?'<div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;padding-top:.25rem">'
              +(strengths.length?'<div>'
                +'<div style="display:flex;align-items:center;gap:.35rem;font-size:.625rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--success);margin-bottom:.4rem">'
                +  '<span style="display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:50%;background:var(--success);color:white;font-size:.625rem">✓</span>'
                +  '<span>Forças</span>'
                +'</div>'
                +'<ul style="list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:.3rem">'
                + strengths.map(s=>'<li style="font-size:.75rem;color:var(--text-secondary);line-height:1.45;padding-left:.75rem;position:relative"><span style="position:absolute;left:0;color:var(--success);font-weight:700">•</span>'+E(s)+'</li>').join('')
                +'</ul></div>':'<div></div>')
              +(weaknesses.length?'<div>'
                +'<div style="display:flex;align-items:center;gap:.35rem;font-size:.625rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--danger);margin-bottom:.4rem">'
                +  '<span style="display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:50%;background:var(--danger);color:white;font-size:.625rem">!</span>'
                +  '<span>Fragilidades</span>'
                +'</div>'
                +'<ul style="list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:.3rem">'
                + weaknesses.map(w=>'<li style="font-size:.75rem;color:var(--text-secondary);line-height:1.45;padding-left:.75rem;position:relative"><span style="position:absolute;left:0;color:var(--danger);font-weight:700">•</span>'+E(w)+'</li>').join('')
                +'</ul></div>':'<div></div>')
              +'</div>':'')
          +'</div>';

        return '<details class="cmp-row" style="border-bottom:1px solid var(--border)">'+summary+panel+'</details>';
      }).join('');

      const compInsight = ranked.length >= 2
        ? 'Líder digital: '+strongest.name+' ('+strongest.digital_score+'/10). Média do grupo: '+avg.toFixed(1)+'/10. '
          +(avg<5?'Concorrência digital fraca — janela de oportunidade.':avg<7?'Competição média — diferenciação é chave.':'Concorrência forte — foco em nicho e prova social.')
        : 'Clique em cada concorrente para ver análise completa (posicionamento, preço, canais, forças e fragilidades).';

      const hint = '<div style="font-size:.6875rem;color:var(--text-muted);margin-bottom:.5rem;display:flex;align-items:center;gap:.4rem">'
        +'<span style="display:inline-block;width:14px;height:14px;border:1px solid var(--border);border-radius:50%;text-align:center;line-height:12px;font-size:.625rem;color:var(--text-muted)">▸</span>'
        +'<span>Clique em cada linha para ver posicionamento, preço, canais, forças e fragilidades</span>'
        +'</div>';

      const styleBlock = '<style>.cmp-row summary::-webkit-details-marker{display:none}.cmp-row[open] .cmp-chev{transform:rotate(90deg)}.cmp-row[open] summary{background:var(--surface)!important;border-radius:3px 3px 0 0}</style>';

      h += sc('Scorecard Digital dos Concorrentes',
        insight(styleBlock+chartTitle('Ranking por presença digital (0-10)')+hint+'<div style="display:flex;flex-direction:column">'+rows+'</div>', compInsight, avg<5?'good':avg<7?'warn':'bad'));
    }
  }
  if (d.trends?.length) {
    h += sc('Tendências', d.trends.map(t=>cd(t.trend,E(t.evidence),'green')).join(''));
  }
  if (d.unexploited_opportunity) {
    const u = d.unexploited_opportunity;
    // Deriva objeto key_insight a partir da estrutura legada de unexploited_opportunity
    // — description pode conter frase-território entre aspas (vira headline)
    // — why_nobody_does_it no formato "(1)... (2)... (3)..." vira numbered_reasons
    const descText = u.description || '';
    const quoteMatch = descText.match(/['""']([^'""']{8,})['""']/);
    const headline = quoteMatch ? quoteMatch[1] : null;
    const context = quoteMatch ? descText.replace(quoteMatch[0], '"'+quoteMatch[1]+'"') : descText;

    const why = u.why_nobody_does_it || '';
    const parts = why.split(/\s*\((\d)\)\s*/);
    const reasons = [];
    for (let i=1; i<parts.length; i+=2) {
      if (parts[i+1]) reasons.push(parts[i+1].trim());
    }
    // Se não parseou razões, usa why_nobody_does_it bruto como primeira razão
    const finalReasons = reasons.length ? reasons : (why ? [why] : []);

    h += renderKeyInsight({
      headline,
      context,
      numbered_reasons: finalReasons,
      discussion_anchor: 'este é o maior ponto de alavancagem da estratégia — discutir apetite, ritmo de adoção e comunicação proprietária.',
      feasibility: u.feasibility
    }, { title: 'Oportunidade Não Explorada' });
  }
  if (d.real_differentials?.length) {
    const sc2 = {confirmed:'green',potential:'yellow',aspirational:'gray'};
    h += sc('Diferenciais Reais', d.real_differentials.map(r=>cd(r.differential,E(r.icp_relevance)+'<div style="margin-top:.375rem">'+tg(r.status,sc2[r.status])+'</div>',sc2[r.status])).join(''));
  }
  h += renderHonestyAlert(d.honesty_alert);
  return h;
},

'ee-s2-posicionamento'(d) {
  let h = '';
  h += renderLeituraEstrategica(d, { verdictLabel: 'Veredito do Posicionamento' });

  // PUV em destaque (hero card)
  if (d.puv) {
    h += '<div style="margin:1.5rem 0;padding:1.25rem 1.5rem;background:linear-gradient(135deg,rgba(34,197,94,0.08),rgba(34,197,94,0.02));border:2px solid var(--success);border-radius:8px">'
      +'<div style="font-size:.6875rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--success);margin-bottom:.375rem">Proposta Única de Valor</div>'
      +'<p style="font-size:1.1875rem;font-style:italic;font-weight:600;margin:0;line-height:1.4;color:var(--text-primary)">"'+E(d.puv)+'"</p>'
      +(d.chosen_statement?'<div style="margin-top:.75rem;padding-top:.75rem;border-top:1px solid rgba(34,197,94,0.25);font-size:.8125rem;color:var(--text-secondary)"><strong>Declaração:</strong> '+E(d.chosen_statement)+'</div>':'')
      +'</div>';
  }

  // Mapa 2x2
  if (d.positioning_map) {
    const pm = d.positioning_map;
    // Extrai extremos dos eixos (split em "→" ou "↔" ou "-" ou "←→")
    const splitAxis = s => {
      if (!s) return ['', ''];
      const parts = String(s).split(/\s*(?:→|↔|←→|↦|->|\/)\s*/);
      if (parts.length >= 2) return [parts[0].trim(), parts[parts.length-1].trim()];
      return ['', s];
    };
    const [xLow, xHigh] = splitAxis(pm.axis_x);
    const [yLow, yHigh] = splitAxis(pm.axis_y);
    const quadrantLabels = {
      NO: (yHigh||'Y+') + ' · ' + (xLow||'X-'),
      NE: (yHigh||'Y+') + ' · ' + (xHigh||'X+'),
      SO: (yLow||'Y-') + ' · ' + (xLow||'X-'),
      SE: (yLow||'Y-') + ' · ' + (xHigh||'X+'),
    };
    const getCompetitorsInQuadrant = q => (pm.competitor_positions||[]).filter(c=>c.quadrant===q);
    const quadrantCell = q => {
      const comps = getCompetitorsInQuadrant(q);
      const isClient = pm.client_position===q;
      const bg = isClient ? 'rgba(34,197,94,0.10)' : 'var(--surface)';
      const border = isClient ? '2px solid var(--success)' : '1px solid var(--border)';

},

'ee-s2-diagnostico-midia'(d) {
  // Helper: trend arrow + % change between two values
  function trend(curr, prev, invertBad) {
    if (!prev || prev === 0) return '';
    const pct = ((curr - prev) / Math.abs(prev) * 100);
    const up = pct >= 0;
    // For CPA/CPL, going up is bad; for clicks/leads, going up is good
    const isGood = invertBad ? !up : up;
    const col = isGood ? 'var(--success)' : 'var(--danger)';
    const arrow = up ? '▲' : '▼';
    return ' <span style="color:'+col+';font-size:.6875rem;font-weight:700">'+arrow+Math.abs(pct).toFixed(0)+'%</span>';
  }

  // Helper: monthly evolution table
  function evTable(rows, cols) {
    if (!rows?.length) return '';
    const headers = ['Mês'].concat(cols.map(c=>c.label));
    const trows = rows.map((r, i) => {
      const prev = rows[i-1];
      return [E(r.month)].concat(cols.map(c => {
        const val = r[c.key];
        const prevVal = prev ? prev[c.key] : null;
        let formatted = val==null ? '—' : (c.fmt ? c.fmt(val) : String(val));
        let tr = prevVal!=null ? trend(val, prevVal, c.badUp||false) : '';
        let cls = c.colorFn ? c.colorFn(val, prev ? prev[c.key] : null) : '';
        return (cls ? tg(formatted, cls) : formatted) + tr;
      }));
    });
    return tb(headers, trows);
  }

  let h = '';

  // Period header
  if (d.data_period) {
    h += '<div style="display:inline-flex;align-items:center;gap:.5rem;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:.375rem .75rem;margin-bottom:.75rem">'
      +'<span style="font-size:.6875rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted)">Período analisado</span>'
      +'<span style="font-size:.8125rem;font-weight:700;color:var(--accent)">'+E(d.data_period)+'</span>'
      +(d.data_period_months ? '<span style="font-size:.75rem;color:var(--text-muted)">('+d.data_period_months+' meses)</span>' : '')
      +'</div>';
  }

  h += renderLeituraEstrategica(d, { verdictLabel: 'Veredito de Mídia Paga' });

  // ── GOOGLE ADS ──
  const ga = d.google_ads;
  if (ga) {
    // Divisor forte antes da seção Google Ads
    h += '<div style="margin:2rem 0 1rem;padding:1rem 1.25rem;background:linear-gradient(90deg, rgba(59,130,246,0.08), transparent);border-left:4px solid #3b82f6;border-radius:4px">'
      +'<div style="font-size:.6875rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#3b82f6;margin-bottom:.125rem">Canal 1</div>'
      +'<div style="font-size:1.25rem;font-weight:800;color:var(--text-primary);letter-spacing:-.01em">Google Ads</div>'
      +(ga.budget_monthly?'<div style="font-size:.75rem;color:var(--text-muted);margin-top:.125rem">Investimento atual: '+BRL(ga.budget_monthly)+'/mês · '+(ga.active_campaigns||0)+' campanha'+(ga.active_campaigns!==1?'s':'')+' ativa'+(ga.active_campaigns!==1?'s':'')+' de '+(ga.total_campaigns||0)+' total</div>':'')
      +'</div>';
    const gClsColor = ga.score >= 70?'success':ga.score>=40?'warning':'danger';
    let gaHead = '';

    // Resumo 90 dias — cards + diagnóstico executivo
    {
      const spend = ga.total_spend_90d;
      const monthly = ga.budget_monthly_actual!=null ? ga.budget_monthly_actual : (spend!=null?spend/3:null);
      const cards = '<div class="gr gr--4" style="margin-bottom:.75rem">'
        +(spend!=null?mt(BRL(spend),'Investido 90d',''):'')
        +(ga.avg_ctr!=null?mt(ga.avg_ctr.toFixed(2)+'%','CTR médio',ga.avg_ctr>=3?'green':ga.avg_ctr>=1.5?'yellow':'red'):'')
        +(ga.avg_cpa!=null?mt(BRL(ga.avg_cpa),'CPA médio',ga.avg_cpa<=15?'green':ga.avg_cpa<=25?'yellow':'red'):'')
        +(ga.total_conversions_90d!=null?mt(N(ga.total_conversions_90d),'Conversões 90d',''):'')
        +'</div>';
      const sub = '<div style="display:flex;gap:.75rem;flex-wrap:wrap;font-size:.75rem;color:var(--text-muted);margin-bottom:.5rem">'
        +(monthly!=null?'<span>Média mensal: <strong style="color:var(--text-secondary)">'+BRL(monthly)+'</strong></span>':'')
        +(ga.total_clicks_90d!=null?'<span>Clicks: <strong style="color:var(--text-secondary)">'+N(ga.total_clicks_90d)+'</strong></span>':'')
        +(ga.total_impressions_90d!=null?'<span>Impressões: <strong style="color:var(--text-secondary)">'+N(ga.total_impressions_90d)+'</strong></span>':'')
        +(ga.active_campaigns!=null&&ga.total_campaigns!=null?'<span>Campanhas ativas: <strong style="color:var(--text-secondary)">'+ga.active_campaigns+' de '+ga.total_campaigns+'</strong></span>':'')
        +'</div>';
      const diag = ga.strategic_diagnosis

        : '';
      gaHead = cards + sub + diag;

    // Monthly evolution table
    let gaEvol = '';

      gaEvol = evTable(ga.monthly_evolution, [

        {key:'clicks', label:'Clicks',       fmt: v=>N(v),              badUp:false, colorFn:(v,p)=>p&&v<p*0.9?'red':p&&v>p*1.1?'green':''},

        d.keyword_clusters.map(c=>[
          '<strong>'+E(c.cluster)+'</strong>'
            +(c.keywords?.length?'<div style="font-size:.6875rem;color:var(--text-muted);margin-top:.125rem">'+(c.keywords||[]).slice(0,6).map(E).join(' · ')+'</div>':''),
          c.intent?tg(c.intent,{transactional:'green',commercial:'yellow',informational:'gray',navigational:'green'}[c.intent]):'—',
          c.budget_allocation_pct!=null?tg(c.budget_allocation_pct+'%',c.budget_allocation_pct>=30?'red':c.budget_allocation_pct>=15?'yellow':'gray'):'—',
          E(c.expected_cpc_range||'—'),
          '<span style="font-size:.75rem">'+E(c.bid_strategy||'—')+'</span>',
          '<span style="font-size:.75rem;color:var(--text-muted)">'+E(c.copy_angle||'—')+'</span>',
          '<span style="font-size:.75rem;color:var(--danger)">'+E(c.risk||'—')+'</span>',
        ]));

      // Tabela de oportunidades: keywords relevantes NÃO em uso hoje
      // Fontes suportadas: d.opportunity_keywords[] OU agregação dos campos c.opportunity_keywords[] de cada cluster
      let oppRows = [];
      if (Array.isArray(d.opportunity_keywords) && d.opportunity_keywords.length) {
        oppRows = d.opportunity_keywords;
      } else {
        d.keyword_clusters.forEach(c => {
          if (Array.isArray(c.opportunity_keywords)) {
            c.opportunity_keywords.forEach(k => oppRows.push(Object.assign({cluster:c.cluster}, typeof k==='string'?{keyword:k}:k)));
          }
        });
      }
      let oppBlock = '';
      if (oppRows.length) {
        oppBlock = '<div style="margin-top:1rem"><div style="font-size:.6875rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);margin-bottom:.375rem">Keywords Relevantes Não Utilizadas Hoje — Oportunidades</div>'
          +tb(
            ['Keyword','Cluster','Intent','Volume est.','CPC est.','Por que adicionar'],
            oppRows.map(k=>[
              '<strong style="color:var(--accent)">'+E(k.keyword||'—')+'</strong>',
              k.cluster?'<span style="font-size:.75rem">'+E(k.cluster)+'</span>':'—',
              k.intent?tg(k.intent,{transactional:'green',commercial:'yellow',informational:'gray',navigational:'green'}[k.intent]||'gray'):'—',
              k.volume_estimate!=null?'<span style="font-size:.75rem">'+E(String(k.volume_estimate))+'</span>':(k.search_volume_monthly!=null?'<span style="font-size:.75rem">'+N(k.search_volume_monthly)+'/mês</span>':'—'),
              k.expected_cpc!=null?'<span style="font-size:.75rem">R$'+Number(k.expected_cpc).toFixed(2)+'</span>':(k.cpc_range?'<span style="font-size:.75rem">'+E(k.cpc_range)+'</span>':'—'),
              '<span style="font-size:.75rem;color:var(--text-muted)">'+E(k.rationale||k.why||'—')+'</span>',
            ]))
          +'</div>';
      }

      h += sc('Clusters de Keywords', donutBlock + clustersTable + oppBlock);
    }
  }

  // ── META ADS ──
  const ma = d.meta_ads;
  if (ma) {
    // Divisor forte antes da seção Meta Ads
    h += '<div style="margin:2.5rem 0 1rem;padding:1rem 1.25rem;background:linear-gradient(90deg, rgba(59,130,246,0.08), transparent);border-left:4px solid #1877f2;border-radius:4px">'
      +'<div style="font-size:.6875rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#1877f2;margin-bottom:.125rem">Canal 2</div>'
      +'<div style="font-size:1.25rem;font-weight:800;color:var(--text-primary);letter-spacing:-.01em">Meta Ads (Facebook + Instagram)</div>'
      +(ma.budget_monthly?'<div style="font-size:.75rem;color:var(--text-muted);margin-top:.125rem">Investimento atual: '+BRL(ma.budget_monthly)+'/mês · '+(ma.active_campaigns||0)+' campanha'+(ma.active_campaigns!==1?'s':'')+' ativa'+(ma.active_campaigns!==1?'s':'')+' de '+(ma.total_campaigns||0)+' total'+(ma.status==='broken'?' · ⚠ links quebrados detectados':'')+'</div>':'')
      +'</div>';
    const mClsColor = ma.score >= 40?'warning':'danger';
    let maHead = '';

    // Resumo 90 dias — cards + diagnóstico executivo
    {
      const spend = ma.total_spend_90d;
      const monthly = ma.budget_monthly_actual!=null ? ma.budget_monthly_actual : (spend!=null?spend/3:null);
      const cards = '<div class="gr gr--4" style="margin-bottom:.75rem">'
        +(spend!=null?mt(BRL(spend),'Investido 90d',''):'')
        +(ma.avg_ctr!=null?mt(ma.avg_ctr.toFixed(2)+'%','CTR médio',ma.avg_ctr>=2?'green':ma.avg_ctr>=1.2?'yellow':'red'):'')
        +(ma.avg_cpm!=null?mt(BRL(ma.avg_cpm),'CPM médio',ma.avg_cpm<=10?'green':ma.avg_cpm<=15?'yellow':'red'):'')
        +(ma.total_reach_90d!=null?mt(N(ma.total_reach_90d),'Alcance 90d',''):(ma.total_clicks_90d!=null?mt(N(ma.total_clicks_90d),'Clicks 90d',''):''))
        +'</div>';
      const sub = '<div style="display:flex;gap:.75rem;flex-wrap:wrap;font-size:.75rem;color:var(--text-muted);margin-bottom:.5rem">'
        +(monthly!=null?'<span>Média mensal: <strong style="color:var(--text-secondary)">'+BRL(monthly)+'</strong></span>':'')
        +(ma.total_clicks_90d!=null?'<span>Clicks: <strong style="color:var(--text-secondary)">'+N(ma.total_clicks_90d)+'</strong></span>':'')
        +(ma.total_impressions_90d!=null?'<span>Impressões: <strong style="color:var(--text-secondary)">'+N(ma.total_impressions_90d)+'</strong></span>':'')
        +(ma.total_ads!=null?'<span>Ads: <strong style="color:var(--text-secondary)">'+N(ma.total_ads)+'</strong></span>':'')
        +(ma.total_campaigns!=null?'<span>Campanhas: <strong style="color:var(--text-secondary)">'+N(ma.total_campaigns)+'</strong></span>':'')
        +'</div>';
      const diag = ma.strategic_diagnosis
        ? cd('Resumo Executivo', '<div style="font-size:.875rem;line-height:1.5;color:var(--text-secondary)">'+E(ma.strategic_diagnosis)+'</div>')
        : '';
      maHead = cards + sub + diag;
    }

    // Monthly evolution table for Meta
    let maEvol = '';
    if (ma.monthly_evolution?.length) {
      maEvol = evTable(ma.monthly_evolution, [
        {key:'spend',      label:'Gasto',       fmt: v=>'R$'+v.toFixed(0), badUp:true},
        {key:'impressions',label:'Impressões',   fmt: v=>N(v),              badUp:false},
        {key:'clicks',     label:'Clicks',       fmt: v=>N(v),              badUp:false},
        {key:'reach',      label:'Alcance',      fmt: v=>N(v),              badUp:false},
        {key:'cpm',        label:'CPM',          fmt: v=>'R$'+v.toFixed(2), badUp:true, colorFn:(v)=>v>15?'red':v>10?'yellow':'green'},
        {key:'ctr',        label:'CTR',          fmt: v=>v.toFixed(2)+'%',  badUp:false, colorFn:(v)=>v<1?'red':v<2?'yellow':'green'},
      ]);
    }

    let maCritical = '';
    if (ma.critical_issues?.length) {
      maCritical = ma.critical_issues.map(i=>
        '<div style="font-size:.8125rem;color:var(--danger);margin-bottom:.3rem">&#9650; '+E(i)+'</div>'
      ).join('');
    }

    let maBench = '';
    if (ma.metrics_vs_benchmark?.length) {
      maBench = tb(['Métrica','Atual','Benchmark','Status'],
        ma.metrics_vs_benchmark.map(m=>[
          E(m.metric), E(m.atual), E(m.benchmark),
          tg(m.gap, m.status==='ok'?'green':m.status==='critical'?'danger':'yellow')
        ]));
    }

    let maBest = '';
    if (ma.best_historical?.length) {
      maBest = ma.best_historical.map(c=>
        '<div style="margin-bottom:.375rem"><div style="font-size:.8125rem;font-weight:600;color:var(--text-primary)">'+E(c.name)+'</div>'
        +'<div style="font-size:.75rem;color:var(--text-muted)">CPM R$'+E(c.cpm)+' · '+N(c.impressions)+' impressões · '+E(c.note)+'</div></div>'
      ).join('');
    }

    h += sc('Meta Ads', maHead
      +(maEvol ? '<div style="margin-bottom:.75rem"><div style="font-size:.6875rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);margin-bottom:.375rem">Evolução Mensal</div>'+maEvol+'</div>' : '')
      +cd('Problemas Críticos', maCritical, 'danger')
      +(maBench ? '<div style="margin-top:.75rem">'+maBench+'</div>' : '')
      +(maBest ? cd('Histórico de Destaque', maBest) : '')
    );

    // ── Galeria de Criativos (V4MOS) ──
    if (ma.creative_gallery?.length) {
      const gs = ma.creative_gallery_summary || {};
      const verdictColor = {Manter:'var(--success)', Otimizar:'var(--warning)', Eliminar:'var(--danger)'};
      const summaryHead = '<div style="display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem;font-size:.75rem">'
        +(gs.manter!=null?'<div style="padding:.375rem .75rem;background:rgba(34,197,94,0.12);border:1px solid var(--success);border-radius:6px;color:var(--success);font-weight:700">'+gs.manter+' Manter</div>':'')
        +(gs.otimizar!=null?'<div style="padding:.375rem .75rem;background:rgba(234,179,8,0.12);border:1px solid var(--warning);border-radius:6px;color:var(--warning);font-weight:700">'+gs.otimizar+' Otimizar</div>':'')
        +(gs.eliminar!=null?'<div style="padding:.375rem .75rem;background:rgba(239,68,68,0.12);border:1px solid var(--danger);border-radius:6px;color:var(--danger);font-weight:700">'+gs.eliminar+' Eliminar</div>':'')
        +(gs.total_ads?'<div style="padding:.375rem .75rem;background:var(--surface);border:1px solid var(--border);border-radius:6px;color:var(--text-muted)">Exibindo '+gs.total_displayed+' de '+gs.total_ads+' ads</div>':'')
        +'</div>';
      const cards = ma.creative_gallery.map(g => {
        const vCol = verdictColor[g.verdict] || 'var(--text-muted)';
        const ctrCol = (g.ctr||0)>=1.5?'var(--success)':(g.ctr||0)>=0.8?'var(--warning)':'var(--danger)';
        const cpcCol = (g.cpc||99)<=1.0?'var(--success)':(g.cpc||99)<=1.8?'var(--warning)':'var(--danger)';
        const perm = g.instagram_permalink_url || '';
        // Normaliza permalink Instagram → URL de embed (.../embed/captioned/)
        const embedUrl = perm ? (perm.replace(/\/$/,'') + '/embed/captioned/') : '';
        return '<div style="background:var(--surface);border:1px solid var(--border);border-top:3px solid '+vCol+';border-radius:8px;overflow:hidden;display:flex;flex-direction:column">'
          +'<div style="padding:.5rem .75rem;display:flex;justify-content:space-between;align-items:center;gap:.5rem;border-bottom:1px solid var(--border);background:var(--bg)">'
            +'<span style="background:'+vCol+';color:#fff;padding:.25rem .625rem;border-radius:4px;font-size:.6875rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase">'+E(g.verdict)+'</span>'
            +(perm?'<a href="'+E(perm)+'" target="_blank" rel="noopener" style="font-size:.625rem;color:var(--accent);text-decoration:none">↗ Instagram</a>':'')
          +'</div>'
          +(embedUrl
            ? '<iframe src="'+E(embedUrl)+'" loading="lazy" allowfullscreen scrolling="no" frameborder="0" style="width:100%;height:480px;border:0;background:#0a0a0a;display:block"></iframe>'
            : '<div style="aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;background:#0a0a0a;color:var(--text-muted);font-size:.75rem">Sem preview disponível</div>')
          +'<div style="padding:.75rem;display:flex;flex-direction:column;gap:.5rem;border-top:1px solid var(--border)">'
            +'<div style="font-size:.75rem;font-weight:700;color:var(--text-primary);line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical">'+E(g.ad_name||'—')+'</div>'
            +'<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:.25rem;padding:.5rem 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border)">'
              +'<div style="text-align:center"><div style="font-size:1rem;font-weight:800;color:'+ctrCol+'">'+(g.ctr!=null?g.ctr.toFixed(2)+'%':'—')+'</div><div style="font-size:.5625rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em">CTR</div></div>'
              +'<div style="text-align:center"><div style="font-size:1rem;font-weight:800;color:'+cpcCol+'">'+(g.cpc!=null?'R$'+g.cpc.toFixed(2):'—')+'</div><div style="font-size:.5625rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em">CPC</div></div>'
              +'<div style="text-align:center"><div style="font-size:1rem;font-weight:800;color:var(--text-primary)">'+(g.spend!=null?'R$'+Math.round(g.spend):'—')+'</div><div style="font-size:.5625rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em">Spend</div></div>'
            +'</div>'
            +'<div style="font-size:.6875rem;color:var(--text-muted);line-height:1.4">'+E(g.verdict_reason||'')+'</div>'
          +'</div>'
        +'</div>';
      }).join('');
      h += sc('Galeria de Criativos Meta — Top 15 por Spend',
        summaryHead
        +'<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem">'+cards+'</div>'
        +(gs.note?'<p style="margin-top:.75rem;font-size:.6875rem;color:var(--text-muted);font-style:italic">'+E(gs.note)+'</p>':''));
    }

    // Creative testing hypotheses (Meta-only) — posicionado dentro da seção Meta
    if (d.creative_testing_hypotheses?.hypotheses?.length) {
      const ct = d.creative_testing_hypotheses;
      h += sc('Hipóteses de Teste de Criativos',
        ct.hypotheses.map(hy=>
          cd((hy.id?hy.id+' — ':'')+(hy.hypothesis||'—'),
            '<div style="display:grid;grid-template-columns:1fr 1fr;gap:.5rem;font-size:.75rem">'
            +(hy.angle?'<div><strong>Ângulo:</strong> '+E(hy.angle)+'</div>':'')
            +(hy.format?'<div><strong>Formato:</strong> '+E(hy.format)+'</div>':'')
            +(hy.target_audience?'<div><strong>Público:</strong> '+E(hy.target_audience)+'</div>':'')
            +(hy.cta?'<div><strong>CTA:</strong> '+E(hy.cta)+'</div>':'')
            +'</div>'
            +(hy.hook?'<div style="font-size:.8125rem;margin-top:.375rem"><strong>Hook:</strong> <em>"'+E(hy.hook)+'"</em></div>':'')
            +(hy.body?'<div style="font-size:.75rem;margin-top:.25rem;color:var(--text-secondary)">'+E(hy.body)+'</div>':'')
            +(hy.success_criteria?'<div style="font-size:.75rem;margin-top:.375rem;color:var(--success)"><strong>Sucesso:</strong> '+E(hy.success_criteria)+'</div>':'')
            +'<div style="margin-top:.375rem;display:flex;gap:.375rem">'
            +(hy.testing_budget!=null?tg(BRL(hy.testing_budget),'gray'):'')
            +(hy.testing_duration_days!=null?tg(hy.testing_duration_days+' dias','gray'):'')
            +'</div>',
            'yellow')
        ).join('')
        +(ct.testing_budget_total_week_1!=null?co('Budget total semana 1 de testes: '+BRL(ct.testing_budget_total_week_1)):''));
    }
  }

  // ── CONSOLIDADO & PLANO DE AÇÃO ──
  h += '<div style="margin:2.5rem 0 1rem;padding:1rem 1.25rem;background:linear-gradient(90deg, rgba(34,197,94,0.08), transparent);border-left:4px solid var(--success);border-radius:4px">'
    +'<div style="font-size:.6875rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--success);margin-bottom:.125rem">Síntese</div>'
    +'<div style="font-size:1.25rem;font-weight:800;color:var(--text-primary);letter-spacing:-.01em">Consolidado & Plano de Ação</div>'
    +'<div style="font-size:.75rem;color:var(--text-muted);margin-top:.125rem">Problemas priorizados · cenários de realocação · forecast · metas 90 dias</div>'
    +'</div>';

  // Top problems
  if (d.top_problems?.length) {
    h += sc('Top 3 Problemas Críticos', d.top_problems.map(p=>
      cd(p.problem,
        '<p style="margin:0 0 .375rem"><strong>Evidência:</strong> '+E(p.data_evidence)+'</p>'
        +'<p style="margin:0;color:var(--text-secondary)">'+E(p.impact)+'</p>',
        'danger')
    ).join(''));
  }

  // Action plan
  if (d.action_plan?.length) {
    h += sc('Plano de Ação — 30 dias', tb(['#','Ação','Prioridade','Impacto','Prazo'],
      d.action_plan.map(a=>[
        E(a.rank),
        E(a.action),
        tg(a.priority, {P1:'red',P2:'yellow',P3:'gray'}[a.priority]||'gray'),
        '<span style="font-size:.75rem;color:var(--text-muted)">'+E(a.expected_impact)+'</span>',
        E(a.deadline)
      ])));
  }

  // Budget reallocation scenarios
  if (d.budget_reallocation_scenarios) {
    const br = d.budget_reallocation_scenarios;
    const sumAlloc = obj => obj ? Object.values(obj).reduce((s,v)=>s+(typeof v==='number'?v:0),0) : 0;
    const scenTotal = s => (s.total_budget_monthly!=null)?s.total_budget_monthly:(sumAlloc(s.google_allocation)+sumAlloc(s.meta_allocation));
    const scenLeads = s => s.expected_leads_monthly ?? s.projected_leads_month ?? null;
    const scenCpl = s => s.expected_cpl ?? s.projected_cpl ?? null;
    const scenName = s => s.name || s.label || '—';
    const scenGoogle = s => s.google_split!=null?s.google_split:sumAlloc(s.google_allocation);
    const scenMeta = s => s.meta_split!=null?s.meta_split:sumAlloc(s.meta_allocation);

    const renderBs = (s, variant) => s ? cd(scenName(s),
      '<div class="gr gr--2" style="gap:.375rem">'
      +mt(BRL(scenTotal(s)),'Budget/mês','')
      +(scenLeads(s)!=null?mt(N(scenLeads(s)),'Leads/mês',''):'')
      +(scenCpl(s)!=null?mt(BRL(scenCpl(s)),'CPL projetado',''):'')
      +(s.expected_roas!=null?mt(s.expected_roas.toFixed(1)+'x','ROAS',''):
        s.delta_leads?mt(s.delta_leads,'Δ Leads',''):'')
      +'</div>'
      +'<div style="font-size:.75rem;color:var(--text-muted);margin-top:.25rem">'
      +(scenGoogle(s)>0?'Google: '+BRL(scenGoogle(s))+' · ':'')
      +(scenMeta(s)>0?'Meta: '+BRL(scenMeta(s)):'')
      +'</div>'
      +(s.effort_weeks!=null||s.confidence?('<div style="font-size:.75rem;color:var(--text-muted);margin-top:.25rem">'
        +(s.effort_weeks!=null?'Esforço: '+s.effort_weeks+' sem · ':'')
        +(s.confidence?'Confiança: '+E(s.confidence):'')
        +'</div>'):'')
      +(s.changes?.length?'<details style="margin-top:.375rem"><summary style="font-size:.75rem;cursor:pointer;color:var(--accent)">Mudanças ('+s.changes.length+')</summary>'
        +'<ul style="font-size:.75rem;margin:.375rem 0 0;padding-left:1rem">'+s.changes.map(c=>'<li style="margin-bottom:.2rem">'+E(c)+'</li>').join('')+'</ul></details>':'')
      +(s.campaigns_structure?.length?'<details style="margin-top:.375rem"><summary style="font-size:.75rem;cursor:pointer;color:var(--accent)">Estrutura ('+s.campaigns_structure.length+' campanhas)</summary>'
        +'<div style="font-size:.75rem;margin-top:.375rem">'+s.campaigns_structure.map(c=>
          '<div style="margin-bottom:.25rem">• <strong>'+E(c.campaign)+'</strong> ('+E(c.platform||'')+') — '+(c.budget_monthly!=null?BRL(c.budget_monthly):'—')+' — <em>'+E(c.objective||'')+'</em></div>'
        ).join('')+'</div></details>':'')
      +(s.prerequisites?.length?'<details style="margin-top:.375rem"><summary style="font-size:.75rem;cursor:pointer;color:var(--accent)">Pré-requisitos ('+s.prerequisites.length+')</summary>'
        +'<ul style="font-size:.75rem;margin:.375rem 0 0;padding-left:1rem">'+s.prerequisites.map(c=>'<li>'+E(c)+'</li>').join('')+'</ul></details>':'')
      +(s.risk_assessment?'<div style="font-size:.75rem;color:var(--text-muted);margin-top:.25rem">Risco: '+E(s.risk_assessment)+'</div>':''),
      variant) : '';
    // Scenario comparison — metrics as rows, scenarios as columns, inline bars per row
    const scArr = [br.scenario_a_conservative, br.scenario_b_realistic, br.scenario_c_aggressive].filter(Boolean);
    let scChart = '';
    if (scArr.length >= 2) {
      const recommendedIdx = 1; // realista
      const best = scArr.reduce((b,x)=>((scenLeads(x)||0)>(scenLeads(b)||0)?x:b), scArr[0]);
      const scInsightTxt = best
        ? 'Cenário "'+scenName(best).split('—')[0].trim()+'" entrega '+N(scenLeads(best)||0)+' leads/mês a CPL '+BRL(scenCpl(best)||0)+' com budget de '+BRL(scenTotal(best))+'.'
        : '';
      const shortName = s => scenName(s).split('—')[0].trim();
      // Column header
      const colHeader = '<div style="display:grid;grid-template-columns:minmax(140px,20%) repeat('+scArr.length+',1fr);gap:.75rem;align-items:end;padding:0 0 .75rem;border-bottom:2px solid var(--border)">'
        +'<div></div>'
        +scArr.map((s,i)=>{
          const isRec = i===recommendedIdx;
          return '<div style="text-align:center">'
            +(isRec?'<div style="font-size:.6875rem;font-weight:700;color:'+chartColor('green')+';text-transform:uppercase;letter-spacing:.05em;margin-bottom:.25rem">★ Recomendado</div>':'<div style="height:1rem"></div>')
            +'<div style="font-size:.875rem;font-weight:700;color:'+(isRec?chartColor('green'):'var(--text)')+'">'+E(shortName(s))+'</div>'
            +'<div style="font-size:.6875rem;color:var(--text-muted);margin-top:.15rem;line-height:1.3">'+E(scenName(s).split('—').slice(1).join('—').trim()||'')+'</div>'
            +'</div>';
        }).join('')+'</div>';
      // Metric rows with inline bars (normalized per row)
      const rows = [
        {label:'Budget/mês', invert:false, values:scArr.map(s=>scenTotal(s)), fmt:v=>BRL(v)},
        {label:'Leads projetados/mês', invert:false, values:scArr.map(s=>scenLeads(s)), fmt:v=>N(v)+' leads'},
        {label:'CPL projetado', invert:true, values:scArr.map(s=>scenCpl(s)), fmt:v=>BRL(v), note:'menor = melhor'},
        {label:'Δ vs atual', invert:false, values:scArr.map(s=>s.delta_leads||null), fmt:v=>v, isText:true},
        {label:'Esforço', invert:true, values:scArr.map(s=>s.effort_weeks), fmt:v=>v+' sem', note:'menor = melhor'},
        {label:'Confiança', invert:false, values:scArr.map(s=>s.confidence||null), fmt:v=>v, isText:true},
      ].filter(r=>r.values.some(v=>v!=null && v!==0));
      const rowsHtml = rows.map(r=>{
        const numVals = r.values.map(v=>typeof v==='number'?v:null);
        const maxV = Math.max(...numVals.filter(v=>v!=null));
        const minV = Math.min(...numVals.filter(v=>v!=null));
        const best = r.invert ? minV : maxV;
        return '<div style="display:grid;grid-template-columns:minmax(140px,20%) repeat('+scArr.length+',1fr);gap:.75rem;align-items:center;padding:.625rem 0;border-bottom:1px solid var(--border)">'
          +'<div><div style="font-size:.75rem;font-weight:600">'+E(r.label)+'</div>'
          +(r.note?'<div style="font-size:.625rem;color:var(--text-muted)">'+E(r.note)+'</div>':'')+'</div>'
          +r.values.map((v,i)=>{
            const isRec = i===recommendedIdx;
            if (v==null) return '<div style="text-align:center;font-size:.75rem;color:var(--text-muted)">—</div>';
            const isBest = typeof v==='number' && v===best && numVals.filter(x=>x===best).length<numVals.filter(x=>x!=null).length;
            const col = isBest?chartColor('green'):(isRec?chartColor('green'):'var(--text)');
            if (r.isText) {
              return '<div style="text-align:center"><div style="font-size:.8125rem;font-weight:'+(isRec?700:600)+';color:'+col+'">'+E(String(r.fmt(v)))+'</div></div>';
            }
            const pct = maxV>0 ? (v/maxV*100) : 0;
            return '<div style="text-align:center">'
              +'<div style="font-size:.8125rem;font-weight:'+(isRec||isBest?700:600)+';color:'+col+';margin-bottom:.2rem">'+E(String(r.fmt(v)))+(isBest?' <span style="font-size:.625rem">★</span>':'')+'</div>'
              +'<div style="height:6px;background:var(--surface);border-radius:2px;overflow:hidden">'
              +'<div style="height:100%;width:'+pct.toFixed(1)+'%;background:'+(isBest?chartColor('green'):isRec?chartColor('green'):CX.muted)+';opacity:'+(isBest||isRec?'.85':'.5')+';border-radius:2px"></div>'
              +'</div></div>';
          }).join('')
          +'</div>';
      }).join('');
      scChart = insight(
        chartTitle('Comparativo de Cenários — Trade-offs Lado a Lado')
        +colHeader+rowsHtml,
        scInsightTxt, 'good');
    }
    h += sc('Cenários de Realocação de Budget',
      (br.description?'<p style="font-size:.8125rem;color:var(--text-muted);margin:0 0 .75rem">'+E(br.description)+'</p>':'')
      +scChart
      +'<div class="gr gr--3">'
      +renderBs(br.scenario_a_conservative,'gray')
      +renderBs(br.scenario_b_realistic,'green')
      +renderBs(br.scenario_c_aggressive,'yellow')
      +'</div>'
      +(br.recommendation?co(br.recommendation):''));
  }

  // Daypart optimization
  if (d.daypart_optimization?.adjustments?.length) {
    h += sc('Otimização por Dia/Hora',
      tb(['Janela','Ajuste de lance','Rationale'],
        d.daypart_optimization.adjustments.map(a=>[
          '<strong>'+E(a.day_time)+'</strong>',
          a.bid_adjustment_pct!=null?tg((a.bid_adjustment_pct>=0?'+':'')+a.bid_adjustment_pct+'%',a.bid_adjustment_pct>=0?'green':'red'):'—',
          '<span style="font-size:.75rem;color:var(--text-secondary)">'+E(a.rationale||'—')+'</span>',
        ])));
  }

  // Forecast sensitivity — REMOVIDO da apresentação (mantido no JSON)
  if (false && d.forecast_sensitivity_analysis) {
    const fs = d.forecast_sensitivity_analysis;
    const bcLeads = bc => bc.leads_monthly ?? bc.leads_month_90d ?? null;
    const bcCpl = bc => bc.cpl ?? bc.cpl_90d_brl ?? null;
    const bcCac = bc => bc.cac ?? bc.cac_90d_brl ?? null;
    let bcHtml = '';
    if (fs.base_case) {
      const bc = fs.base_case;
      bcHtml = (bc.description?'<p style="font-size:.8125rem;color:var(--text-muted);margin:0 0 .5rem"><strong>Caso base:</strong> '+E(bc.description)+'</p>':'')
        +'<div class="gr gr--4">'
        +(bcLeads(bc)!=null?mt(N(bcLeads(bc)),'Leads/mês',''):'')
        +(bcCpl(bc)!=null?mt(BRL(bcCpl(bc)),'CPL',''):'')
        +(bcCac(bc)!=null?mt(BRL(bcCac(bc)),'CAC','green'):'')
        +(bc.revenue_monthly!=null?mt(BRL(bc.revenue_monthly),'Receita/mês','green'):'')
        +(bc.roas!=null?mt(bc.roas.toFixed(1)+'x','ROAS','green'):'')
        +'</div>';
    }
    let varHtml = '';
    let sensChart = '';
    if (fs.variations?.length) {
      // Support both new (delta_vs_base_pct) and old field shapes
      const parsePct = s => {
        if (s==null) return null;
        if (typeof s === 'number') return s;
        const m = String(s).match(/([+-]?\d+(?:\.\d+)?)\s*%/);
        return m ? parseFloat(m[1]) : null;
      };
      const getPct = v => (typeof v.delta_vs_base_pct === 'number' ? v.delta_vs_base_pct
        : parsePct(v.impact_on_leads) ?? parsePct(v.impact_on_revenue));
      const getName = v => v.scenario || v.scenario_name || '—';
      const getLeads = v => v.impact_on_leads_month_90d ?? v.impact_on_leads ?? null;
      const getCpl = v => v.impact_on_cpl_brl ?? v.impact_on_cpl ?? null;

      const baseLeads = fs.base_case ? bcLeads(fs.base_case) : null;
      const sorted = [...fs.variations].sort((a,b)=>(getPct(a)??0)-(getPct(b)??0));
      const maxAbs = Math.max(...sorted.map(v=>Math.abs(getPct(v)??0)), 1);
      if (sorted.length) {
        const worst = sorted[0];
        const worstPct = getPct(worst) ?? 0;
        const sensInsight = 'Cada linha é um cenário "e se" de risco aplicado sobre o caso base. Maior ameaça: "'
          +getName(worst).split('(')[0].trim()+'" derruba '+Math.abs(worstPct).toFixed(0)+'% dos leads. Monitore o gatilho e acione mitigação antes do impacto se materializar.';
        const header = '<div style="display:grid;grid-template-columns:minmax(180px,32%) minmax(90px,12%) 1fr minmax(70px,10%);gap:.75rem;align-items:end;padding:0 0 .5rem;border-bottom:1px solid var(--border);font-size:.6875rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600">'
          +'<div>Cenário de risco</div>'
          +'<div style="text-align:right">Leads/mês</div>'
          +'<div>Perda vs base'+(baseLeads!=null?' (base: '+N(baseLeads)+' leads)':'')+'</div>'
          +'<div style="text-align:right">Δ %</div></div>';
        const rows = sorted.map(v=>{
          const pct = getPct(v) ?? 0;
          const leads = getLeads(v);
          const col = pct<=-25?chartColor('red'):pct<=-10?chartColor('yellow'):chartColor('gray');
          const barPct = Math.min(100, (Math.abs(pct)/maxAbs*100));
          return '<div style="display:grid;grid-template-columns:minmax(180px,32%) minmax(90px,12%) 1fr minmax(70px,10%);gap:.75rem;align-items:center;padding:.5rem 0;border-bottom:1px solid var(--border)">'
            +'<div style="font-size:.75rem;font-weight:600;line-height:1.35">'+E(getName(v))+'</div>'
            +'<div style="text-align:right"><div style="font-size:.8125rem;font-weight:700;color:'+col+'">'+(leads!=null?N(leads):'—')+'</div>'
            +(leads!=null&&baseLeads!=null?'<div style="font-size:.625rem;color:var(--text-muted)">'+(leads-baseLeads>0?'+':'')+N(leads-baseLeads)+' vs base</div>':'')+'</div>'
            +'<div style="position:relative;height:14px;background:var(--surface);border-radius:2px;overflow:hidden">'
            +'<div style="position:absolute;left:0;top:0;height:100%;width:'+barPct.toFixed(1)+'%;background:'+col+';opacity:.8;border-radius:2px"></div>'
            +'</div>'
            +'<div style="text-align:right;font-size:.8125rem;font-weight:700;color:'+col+'">'+(pct>=0?'+':'')+pct.toFixed(0)+'%</div>'
            +'</div>';
        }).join('');
        const legend = '<div style="display:flex;gap:1.25rem;font-size:.6875rem;margin-top:.75rem;flex-wrap:wrap;color:var(--text-muted)">'
          +'<span><span style="display:inline-block;width:14px;height:10px;background:'+chartColor('red')+';opacity:.8;margin-right:.3rem;vertical-align:middle;border-radius:2px"></span>Crítico (≤-25%)</span>'
          +'<span><span style="display:inline-block;width:14px;height:10px;background:'+chartColor('yellow')+';opacity:.8;margin-right:.3rem;vertical-align:middle;border-radius:2px"></span>Moderado (-10% a -25%)</span>'
          +'<span><span style="display:inline-block;width:14px;height:10px;background:'+chartColor('gray')+';opacity:.8;margin-right:.3rem;vertical-align:middle;border-radius:2px"></span>Leve (&gt;-10%)</span>'
          +'<span>· ordenado do maior ao menor impacto</span></div>';
        sensChart = insight(
          chartTitle('O que acontece se cada risco se materializar')
          +header+rows+legend,
          sensInsight, worstPct<-15?'bad':'warn');
      }
      // Detailed table: scenario, cause, leads, cpl, delta, mitigation
      varHtml = '<div style="margin-top:.5rem;font-size:.6875rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);margin-bottom:.375rem">Cenários detalhados</div>'
        +fs.variations.map(v => {
          const pct = getPct(v);
          const toneColor = (pct??0)<-15?'danger':(pct??0)<0?'yellow':'gray';
          return cd(getName(v),
            (v.cause?'<div style="font-size:.75rem;color:var(--text-muted);margin-bottom:.375rem"><strong>Causa:</strong> '+E(v.cause)+'</div>':'')
            +'<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-bottom:.375rem">'
            +(getLeads(v)!=null?'<div><div style="font-size:.625rem;color:var(--text-muted);text-transform:uppercase">Leads/mês</div><div style="font-size:.875rem;font-weight:700">'+N(getLeads(v))+'</div></div>':'')
            +(getCpl(v)!=null?'<div><div style="font-size:.625rem;color:var(--text-muted);text-transform:uppercase">CPL</div><div style="font-size:.875rem;font-weight:700">'+BRL(getCpl(v))+'</div></div>':'')
            +(pct!=null?'<div><div style="font-size:.625rem;color:var(--text-muted);text-transform:uppercase">Δ vs base</div><div style="font-size:.875rem;font-weight:700;color:var(--'+(pct<0?'danger':'success')+')">'+(pct>=0?'+':'')+pct.toFixed(0)+'%</div></div>':'')
            +'</div>'
            +(v.impact_on_lifetime_value?'<div style="font-size:.75rem;color:var(--text-muted);margin-bottom:.25rem">LTV: '+E(v.impact_on_lifetime_value)+'</div>':'')
            +(v.mitigation?'<div style="font-size:.75rem;padding:.375rem .5rem;background:var(--surface);border-left:2px solid var(--success);border-radius:3px"><strong style="color:var(--success)">Mitigação:</strong> '+E(v.mitigation)+'</div>':''),
            toneColor);
        }).join('');
    }
    h += sc('Análise de Sensibilidade do Forecast',
      (fs.description?'<p style="font-size:.8125rem;color:var(--text-muted);margin:0 0 .75rem">'+E(fs.description)+'</p>':'')
      +bcHtml+varHtml);
  }

  // 90-day goal
  const g90 = d.realistic_goal_90d || d.realistic_goal;
  if (g90) {
    h += sc('Meta Realista — 90 Dias',
      '<div class="gr gr--4">'
      +(g90.target_cpl!=null?mt(BRL(g90.target_cpl),'CPL Alvo','green'):'')
      +(g90.target_cac!=null?mt(BRL(g90.target_cac),'CAC Alvo','green'):'')
      +(g90.target_leads_month!=null?mt(N(g90.target_leads_month),'Leads/mês Alvo','green'):'')
      +(g90.target_agendamentos_month!=null?mt(N(g90.target_agendamentos_month),'Agendamentos Alvo','green'):'')
      +'</div>'
      +(g90.premissas?.length?cd('Premissas',g90.premissas.map(p=>'<div style="font-size:.8125rem;margin-bottom:.2rem">&#9675; '+E(p)+'</div>').join('')):'')
    );
  }

  h += renderKeyInsight(d.key_insight, { title: 'Ponto de Alavancagem — Realocação + Hipótese Principal' });
  h += renderHonestyAlert(d.honesty_alert);

  return h;
},

'ee-s2-diagnostico-criativos'(d) {
  let h = '';

  // Leitura estratégica (padrão) com fallback para summary simples
  h += renderLeituraEstrategica(d, { verdictLabel: 'Veredito dos Criativos' });

  const counts = d.counts || d.summary_counts || {};
  if (d.total_creatives_analyzed || d.average_score != null) {
    h += '<div class="gr gr--3">'
      +mt(d.total_creatives_analyzed||'—','Criativos Analisados','')
      +mt(d.average_score!=null?(d.average_score+'/25'):'—','Score Médio',d.average_score>=20?'green':d.average_score>=13?'yellow':'red')
      +(counts.keep_count!=null?mt(counts.keep_count,'Manter','green'):'')
      +'</div>';
  }

  // Helper: card de criativo com preview embedado
  const previewCard = (c) => {
    const p = c.preview || {};
    const voTone = {manter:'green',otimizar:'yellow',eliminar:'red'};
    const tone = voTone[c.verdict] || 'gray';
    const igPerm = c.instagram_permalink_url || p.instagram_permalink_url || '';
    const igEmbed = igPerm ? (igPerm.replace(/\/$/,'') + '/embed/captioned/') : '';
    const hasImg = p.image_url || p.thumbnail_url;
    const hasVideo = p.video_url;
    const label = c.creative_name || c.name || ('Criativo #'+(c.number||''));
    const dateStr = p.start_date ? new Date(p.start_date).toLocaleDateString('pt-BR') : '';
    const platforms = Array.isArray(p.platforms) && p.platforms.length ? p.platforms.join(' · ') : '';
    const sourceTag = igPerm ? '<span class="tg tg--green" style="font-size:.625rem">Instagram</span>'
      : p.source === 'meta_ads_library' ? '<span class="tg tg--green" style="font-size:.625rem">Ads Library</span>'
      : p.source === 'uploaded' ? '<span class="tg tg--yellow" style="font-size:.625rem">Upload</span>'
      : '<span class="tg tg--gray" style="font-size:.625rem">Sem preview</span>';

    const mediaBlock = igEmbed
      ? '<iframe src="'+E(igEmbed)+'" loading="lazy" allowfullscreen scrolling="no" frameborder="0" style="width:100%;height:480px;border:0;background:#0a0a0a;display:block"></iframe>'
      : hasImg
      ? '<div style="position:relative;background:#000;aspect-ratio:1/1;overflow:hidden">'
        +'<img src="'+E(p.thumbnail_url||p.image_url)+'" alt="" loading="lazy" style="width:100%;height:100%;object-fit:cover;display:block" onerror="this.style.display=\'none\'">'
        +(hasVideo?'<a href="'+E(p.video_url)+'" target="_blank" rel="noopener" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.25);color:#fff;font-size:2rem;text-decoration:none">▶</a>':'')
        +'</div>'
      : '<div style="aspect-ratio:1/1;background:var(--border-light);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);font-size:.75rem;text-align:center;padding:1rem;gap:.4rem">'
        +'<div style="font-weight:600">'+(p.source==='unavailable'?'Preview indisponível':'Sem imagem')+'</div>'
        +(p.note?'<div style="font-size:.6875rem;line-height:1.3;opacity:.85">'+E(p.note)+'</div>':'')
        +'</div>';

    return '<div class="cd cd--'+tone+'" style="display:flex;flex-direction:column;padding:0;overflow:hidden">'
      +mediaBlock
      +'<div style="padding:.75rem">'
      +'<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:.4rem;margin-bottom:.3rem">'
      +'<strong style="font-size:.8125rem;line-height:1.25">'+E(label)+'</strong>'
      +tg((c.verdict||'').toUpperCase(), tone)
      +'</div>'
      +'<div style="font-size:.75rem;color:var(--muted);margin-bottom:.4rem">'
      +E(c.type||'')+(c.format?' · '+E(c.format):'')
      +'</div>'
      +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.4rem">'
      +'<span style="font-size:.75rem;color:var(--muted)">Score</span>'
      +'<strong style="font-size:.875rem">'+E(c.total_score)+'/25</strong>'
      +'</div>'
      +'<div style="display:flex;gap:.3rem;flex-wrap:wrap;font-size:.6875rem;color:var(--muted);margin-bottom:.4rem">'
      +'<span>H '+E(c.hook_score||'—')+'</span>'
      +'<span>C '+E(c.clarity_score||'—')+'</span>'
      +'<span>I '+E(c.icp_coherence_score||'—')+'</span>'
      +'<span>CTA '+E(c.cta_score||'—')+'</span>'
      +'<span>V '+E(c.visual_score||'—')+'</span>'
      +'</div>'
      +(c.main_issue?'<div style="border-left:3px solid var(--'+(tone==='green'?'success':tone==='yellow'?'warning':'danger')+');padding-left:.5rem;font-size:.75rem;margin-top:.3rem"><strong style="font-size:.6875rem;text-transform:uppercase;color:var(--muted)">Problema</strong><div>'+E(c.main_issue)+'</div></div>':'')
      +'<div style="display:flex;justify-content:space-between;align-items:center;margin-top:.5rem;gap:.4rem;flex-wrap:wrap">'
      +'<div style="font-size:.6875rem;color:var(--muted)">'+(dateStr?E(dateStr):'')+(platforms?' · '+E(platforms):'')+'</div>'
      +sourceTag
      +'</div>'
      +(igPerm?'<div style="margin-top:.4rem"><a href="'+E(igPerm)+'" target="_blank" rel="noopener" style="font-size:.6875rem">Ver no Instagram ↗</a></div>':'')
      +(p.ads_library_url?'<div style="margin-top:.4rem"><a href="'+E(p.ads_library_url)+'" target="_blank" rel="noopener" style="font-size:.6875rem">Ver na Ads Library ↗</a></div>':'')
      +'</div></div>';
  };

  if (d.creative_matrix?.length) {
    const vc = {manter:'green',otimizar:'yellow',eliminar:'danger'};
    // Donut de veredictos
    const verdictCount = {};
    d.creative_matrix.forEach(c => { verdictCount[c.verdict] = (verdictCount[c.verdict]||0) + 1; });
    const verdictLabels = {manter:'Manter',otimizar:'Otimizar',eliminar:'Eliminar'};
    const verdictTone = {manter:'green',otimizar:'yellow',eliminar:'red'};
    const donutData = Object.keys(verdictCount).map(k=>({
      label: verdictLabels[k]||k, value: verdictCount[k], tone: verdictTone[k]||'gray',
    }));
    const total = d.creative_matrix.length;
    const elimPct = Math.round(((verdictCount.eliminar||0)/total)*100);
    const manterPct = Math.round(((verdictCount.manter||0)/total)*100);
    const verdictInsight = elimPct >= 40
      ? elimPct+'% dos criativos precisam ser eliminados — revisar briefing de produção antes de nova leva.'
      : manterPct >= 60
        ? manterPct+'% dos criativos estão saudáveis — base sólida para escalar.'
        : 'Mix equilibrado: '+manterPct+'% manter, '+elimPct+'% eliminar — priorizar otimização dos intermediários.';
    h += sc('Veredicto do Pack Atual',
      insight(chartDonut(donutData, {title:'Distribuição de Veredictos'}),
        verdictInsight, elimPct>=40?'bad':manterPct>=60?'good':'warn'));

    // Grid de criativos — só mostra quando tem preview real (embed/imagem)
    const hasPreview = (c) => {
      const p = c.preview || {};
      return !!(c.instagram_permalink_url || p.instagram_permalink_url || p.image_url || p.thumbnail_url);
    };
    const order = {manter:0,otimizar:1,eliminar:2};
    const sorted = [...d.creative_matrix].filter(hasPreview).sort((a,b)=>{
      const oa = order[a.verdict]??99, ob = order[b.verdict]??99;
      if (oa !== ob) return oa-ob;
      return (b.total_score||0)-(a.total_score||0);
    });
    if (sorted.length) {
      const hidden = d.creative_matrix.length - sorted.length;
      h += sc('Galeria de Criativos do Cliente',
        '<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.75rem">'
        +sorted.map(previewCard).join('')
        +'</div>'
        +'<p style="font-size:.75rem;margin-top:.75rem;color:var(--muted)">H=Hook · C=Clareza · I=ICP · CTA · V=Visual (cada um de 0-5, total 0-25). Ordenado por veredicto (Manter → Otimizar → Eliminar).'
        +(hidden>0?' · Exibindo '+sorted.length+' de '+d.creative_matrix.length+' criativos analisados (demais sem preview disponível).':'')
        +'</p>'
      );
    }
  }

  // Concorrentes — análise + amostras de anúncios
  if (d.competitor_analysis?.length) {
    const compHtml = d.competitor_analysis.map(c => {
      const samples = Array.isArray(c.sample_ads) ? c.sample_ads : [];
      const sampleCards = samples.map(s => {
        const img = s.thumbnail_url || s.image_url;
        const link = s.ads_library_url || '';
        const media = img
          ? '<div style="aspect-ratio:1/1;background:#000;overflow:hidden"><img src="'+E(img)+'" alt="" loading="lazy" style="width:100%;height:100%;object-fit:cover;display:block" onerror="this.style.display=\'none\'"></div>'
          : '<div style="aspect-ratio:1/1;background:var(--border-light);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.625rem">sem preview</div>';
        const dateStr = s.start_date ? new Date(s.start_date).toLocaleDateString('pt-BR') : '';
        return (link?'<a href="'+E(link)+'" target="_blank" rel="noopener" style="text-decoration:none;color:inherit">':'<div>')
          +'<div style="border:1px solid var(--border-light);border-radius:6px;overflow:hidden">'
          +media
          +'<div style="padding:.3rem .4rem;font-size:.6875rem;color:var(--muted);display:flex;justify-content:space-between">'
          +'<span>'+E(dateStr||'')+'</span>'
          +(s.platforms?.length?'<span>'+E(s.platforms.slice(0,2).join('·'))+'</span>':'')
          +'</div></div>'
          +(link?'</a>':'</div>');
      }).join('');

      const cname = c.name || c.competitor || '';
      const cstrat = c.strategy_observed || c.creative_pattern;
      const chook = c.hook_pattern || c.what_works;
      return '<div class="cd cd--yellow">'
        +'<div class="cd__title" style="display:flex;justify-content:space-between;align-items:center;gap:.5rem;flex-wrap:wrap">'
        +'<span>'+E(cname)+(c.active_ads_count!=null?' <span style="color:var(--muted);font-weight:400;font-size:.75rem">('+c.active_ads_count+' ads)</span>':'')+'</span>'
        +(c.gap_para_cliente?'<span class="tg tg--red">GAP</span>':'<span class="tg tg--gray">paridade</span>')
        +'</div>'
        +'<div class="cd__body" style="font-size:.8125rem">'
        +(cstrat?'<div><strong>Estratégia:</strong> '+E(cstrat)+'</div>':'')
        +(chook?'<div style="margin-top:.3rem"><strong>O que funciona:</strong> '+E(chook)+'</div>':'')
        +(c.what_to_avoid?'<div style="margin-top:.3rem"><strong>O que evitar:</strong> '+E(c.what_to_avoid)+'</div>':'')
        +(c.replication_idea?'<div style="margin-top:.3rem"><strong>Replicar:</strong> '+E(c.replication_idea)+'</div>':'')
        +(samples.length?'<div style="margin-top:.5rem"><strong style="font-size:.6875rem;text-transform:uppercase;color:var(--muted)">Amostras ('+samples.length+')</strong>'
          +'<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:.3rem;margin-top:.3rem">'+sampleCards+'</div></div>':'')
        +(c.ads_library_url?'<div style="margin-top:.5rem"><a href="'+E(c.ads_library_url)+'" target="_blank" rel="noopener" style="font-size:.75rem">Todos os anúncios na Ads Library ↗</a></div>':'')
        +'</div></div>';
    }).join('');
    h += sc('Análise de concorrentes — anúncios rodando',
      '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:.75rem">'+compHtml+'</div>'
    );
  }

  // Padrões que faltam no cliente (alinhado com organic IG)
  if (d.competitor_patterns_missing?.length) {
    h += sc('Padrões que funcionam nos concorrentes e o cliente não usa',
      d.competitor_patterns_missing.map((p,i)=>cd(
        '#'+(i+1)+' · '+E(p.pattern)+(p.seen_in_count?' (visto em '+N(p.seen_in_count)+' anúncios)':''),
        '<div style="font-size:.8125rem">'
        +(p.seen_in_competitors?.length?'<div><strong>Concorrentes:</strong> '+p.seen_in_competitors.map(c=>E(c)).join(', ')+'</div>':'')
        +(p.why_works?'<div style="margin-top:.3rem"><strong>Por que funciona:</strong> '+E(p.why_works)+'</div>':'')
        +(p.how_to_apply?'<div style="margin-top:.3rem"><strong>Como aplicar:</strong> '+E(p.how_to_apply)+'</div>':'')
        +'</div>',
        'yellow'
      )).join('')
    );
  }

  if (d.patterns_identified?.length) {
    h += sc('Padrões Identificados', d.patterns_identified.map(p=>cd(p.pattern,E(p.example),'yellow')).join(''));
  }

  if (d.production_briefing) {
    const b = d.production_briefing;
    h += sc('Briefing de Produção', cd('Direção de Hook',E(b.hook_direction),'red')
      +'<p><strong>Formato prioritário:</strong> '+E(b.priority_format)+'</p>'
      +(b.visual_elements?'<p><strong>Incluir:</strong> '+b.visual_elements.map(v=>E(v)).join(', ')+'</p>':'')
      +(b.avoid_elements?'<p><strong>Evitar:</strong> '+b.avoid_elements.map(v=>E(v)).join(', ')+'</p>':''));
  }

  h += renderKeyInsight(d.key_insight, { title: 'Ponto de Alavancagem — Criativo Vencedor + Próxima Leva' });
  h += renderHonestyAlert(d.honesty_alert);

  return h;
},

'ee-s2-diagnostico-organico-ig'(d) {
  let h = '';
  if (d.summary) h += sm(d.summary);

  const period = d.period || {};
  const client = d.client_account || {};
  const competitors = d.competitor_accounts || [];
  const allAccounts = [client].concat(competitors);

  // Cabecalho: periodo + contas
  h += sc('Período e contas analisadas',
    '<div class="gr gr--3">'
    +mt(period.days?period.days+' dias':'—','Janela de análise','')
    +mt(N(client.followers_count),'Seguidores — '+E(client.username||''),'green')
    +mt(N(client.posts_90d),'Posts do cliente no período','')
    +'</div>'
    +'<p style="font-size:.8125rem;margin-top:.5rem;color:var(--muted)">Período: '+E(period.start||'—')+' a '+E(period.end||'—')+'. Fonte: Instagram Graph API (business_discovery). Engagement proxy = (likes + 3×comentários) / seguidores × 100.</p>'
  );

  // Cards das contas (client + competitors)
  // Usa screenshot real do header do Instagram (capturado via ig_profile_screenshot.py)
  // Fallback: avatar de iniciais quando screenshot não disponível
  const initialsAvatar = (username, tone) => {
    const u = (username||'').replace(/^@/,'');
    const m = u.match(/[a-z]/gi) || ['?'];
    const init = (m.slice(0,2).join('')).toUpperCase();
    const bg = tone==='green' ? '#00B8BD' : '#8B5CF6';
    return '<div style="width:48px;height:48px;border-radius:50%;flex:0 0 48px;background:'+bg+';display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:.9375rem;letter-spacing:.02em">'+E(init)+'</div>';
  };
  const accountCard = (a, role) => {
    const toneRole = role==='client' ? 'green' : 'yellow';
    const tagRole = role==='client' ? 'CLIENTE' : 'CONCORRENTE';
    const snap = a.profile_screenshot_data_uri || a.profile_screenshot_path || '';

    // Visual principal: screenshot real do IG (ocupa a linha inteira para leitura)
    if (snap) {
      return '<div class="cd cd--'+toneRole+'" style="padding:0;overflow:hidden;display:flex;flex-direction:column">'
        +'<div style="background:#fff;position:relative;padding:1rem 1.25rem">'
        +'<img src="'+E(snap)+'" alt="@'+E(a.username||'')+'" style="width:100%;max-width:100%;height:auto;display:block">'
        +'<span class="tg tg--'+toneRole+'" style="position:absolute;top:.75rem;right:.75rem;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.15);font-size:.75rem;padding:.35rem .7rem">'+tagRole+'</span>'
        +'</div>'
        +'<div class="cd__body" style="font-size:.875rem;padding:.75rem 1.25rem;border-top:1px solid var(--border-light);display:flex;gap:1.5rem;flex-wrap:wrap;align-items:center">'
        +'<div>Posts 90d: <strong>'+N(a.posts_90d)+'</strong></div>'
        +(a.followers_count!=null?'<div>Seguidores: <strong>'+N(a.followers_count)+'</strong></div>':'')
        +(a.website?'<div style="word-break:break-all"><a href="'+E(a.website)+'" target="_blank" rel="noopener" style="color:var(--accent)">'+E(a.website)+'</a></div>':'')
        +'</div></div>';
    }

    // Fallback sem screenshot
    return '<div class="cd cd--'+toneRole+'" style="padding:0;overflow:hidden;display:flex;flex-direction:column">'
      +'<div class="cd__title" style="display:flex;align-items:flex-start;gap:.6rem;flex-wrap:nowrap;padding:.75rem">'
      +initialsAvatar(a.username, toneRole)
      +'<div style="flex:1;min-width:0;overflow:hidden">'
      +'<div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">@'+E(a.username||'')+'</div>'
      +'<div style="font-size:.75rem;color:var(--muted);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+E(a.name||'')+'</div>'
      +'</div>'
      +'<span class="tg tg--'+toneRole+'" style="flex:0 0 auto;white-space:nowrap">'+tagRole+'</span>'
      +'</div>'
      +'<div class="cd__body" style="font-size:.8125rem;padding:.75rem">'
      +'<div>Seguidores: <strong>'+N(a.followers_count)+'</strong></div>'
      +'<div>Posts 90d: <strong>'+N(a.posts_90d)+'</strong></div>'
      +(a.website?'<div style="margin-top:.3rem;word-break:break-all;font-size:.75rem"><a href="'+E(a.website)+'" target="_blank" rel="noopener" style="color:var(--accent)">'+E(a.website)+'</a></div>':'')
      +'</div></div>';
  };
  h += sc('Contas comparadas',
    '<div style="display:grid;grid-template-columns:1fr;gap:.75rem">'
    +accountCard(client,'client')
    +competitors.map(c=>accountCard(c,'competitor')).join('')
    +'</div>'
  );

  // Distribuicao por formato
  const fd = d.format_distribution || {};
  if (fd.by_account?.length) {
    const rows = fd.by_account.map(a=>{
      const c = a.counts||{};
      const total = (c.FEED_IMAGE||0)+(c.CAROUSEL||0)+(c.REELS||0)+(c.VIDEO||0);
      const pct = v => total ? Math.round(((v||0)/total)*100)+'%' : '0%';
      return [
        '@'+E(a.username),
        (c.FEED_IMAGE||0)+' ('+pct(c.FEED_IMAGE)+')',
        (c.CAROUSEL||0)+' ('+pct(c.CAROUSEL)+')',
        (c.REELS||0)+' ('+pct(c.REELS)+')',
        (c.VIDEO||0)+' ('+pct(c.VIDEO)+')',
        '<strong>'+total+'</strong>',
      ];
    });
    h += sc('Distribuição por formato',
      tb(['Conta','Feed (imagem)','Carrossel','Reels','Vídeo','Total'], rows)
      +(fd.insight?cd('Leitura comparativa', E(fd.insight),'yellow'):'')
    );
  }

  // Cadencia
  const cad = d.cadence || {};
  if (cad.by_account?.length) {
    const rows = cad.by_account.map(a=>[
      '@'+E(a.username),
      (a.posts_per_week!=null?a.posts_per_week+'/semana':'—'),
      E(a.preferred_weekday||'—'),
      E(a.preferred_hour||'—'),
    ]);
    h += sc('Cadência', tb(['Conta','Volume','Dia preferido','Horário preferido'], rows)
      +(cad.insight?cd('Leitura comparativa', E(cad.insight),'yellow'):''));
  }

  // Engagement benchmark
  const eng = d.engagement_benchmark || {};
  if (eng.by_account?.length) {
    const rows = eng.by_account.map(a=>[
      '@'+E(a.username),
      N(a.avg_likes),
      N(a.avg_comments),
      (a.avg_engagement_proxy!=null?a.avg_engagement_proxy.toFixed(3)+'%':'—'),
      E(a.best_format_by_engagement||'—'),
    ]);
    h += sc('Benchmark de engajamento', tb(['Conta','Likes médios','Comentários médios','Eng. proxy','Melhor formato'], rows)
      +(eng.insight?cd('Leitura comparativa', E(eng.insight),'yellow'):''));
  }

  // Helper para renderizar um post com embed
  const postCard = (p, variant) => {
    const embed = p.embed_url || (p.permalink ? p.permalink.replace(/\/$/,'')+'/embed/' : '');
    const tone = variant==='bottom' ? 'red' : (p.gap_para_cliente ? 'yellow' : 'green');
    const badge = variant==='bottom' ? 'BOTTOM' : (p.gap_para_cliente?'GAP':'TOP');
    const ts = p.timestamp ? new Date(p.timestamp).toLocaleDateString('pt-BR') : '';
    return '<div class="cd cd--'+tone+'" style="display:flex;flex-direction:column;min-width:280px;max-width:360px">'
      +'<div class="cd__title" style="display:flex;align-items:center;gap:.5rem;justify-content:space-between">'
      +'<span>@'+E(p.username||'')+'</span>'
      +'<span class="tg tg--'+tone+'">'+badge+' · '+E(p.format||'')+'</span>'
      +'</div>'
      +(embed?'<div style="margin:.5rem 0;background:#000;border-radius:8px;overflow:hidden">'
        +'<iframe src="'+E(embed)+'" loading="lazy" allowtransparency="true" frameborder="0" scrolling="no" allowfullscreen="true" '
        +'style="width:100%;height:520px;border:0;display:block;background:#fff"></iframe></div>':'')
      +'<div class="cd__body" style="font-size:.8125rem">'
      +'<div style="display:flex;gap:.75rem;flex-wrap:wrap;margin-bottom:.3rem;color:var(--muted)">'
      +'<span>❤ '+N(p.like_count||0)+'</span>'
      +'<span>💬 '+N(p.comments_count||0)+'</span>'
      +'<span>⚡ '+(p.engagement_proxy!=null?p.engagement_proxy.toFixed(3)+'%':'—')+'</span>'
      +(ts?'<span>'+E(ts)+'</span>':'')
      +'</div>'
      +(p.diagnosis?'<div style="border-left:3px solid var(--'+(variant==='bottom'?'danger':'success')+');padding-left:.5rem;margin-top:.4rem"><strong style="font-size:.75rem;text-transform:uppercase;color:var(--muted)">Diagnóstico</strong><div>'+E(p.diagnosis)+'</div></div>':'')
      +(p.permalink?'<div style="margin-top:.4rem"><a href="'+E(p.permalink)+'" target="_blank" rel="noopener" style="font-size:.75rem">Ver no Instagram ↗</a></div>':'')
      +'</div></div>';
  };

  // Top posts — agrupados por conta
  if (d.top_posts?.length) {
    const byAcc = {};
    d.top_posts.forEach(p => { (byAcc[p.username] = byAcc[p.username] || []).push(p); });
    const ordered = [client.username].concat(competitors.map(c=>c.username)).filter(Boolean);
    let html = '';
    ordered.forEach(u => {
      if (!byAcc[u]) return;
      const isClient = u === client.username;
      html += '<h4 style="margin:1rem 0 .5rem 0;font-size:.875rem;color:var(--muted)">@'+E(u)+(isClient?' <span class="tg tg--green">cliente</span>':'')+'</h4>';
      html += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:.75rem">'
        +byAcc[u].map(p=>postCard(p,'top')).join('')
        +'</div>';
    });
    h += sc('Top posts por engajamento (últimos 90 dias)', html);
  }

  // Bottom posts — apenas cliente
  if (d.bottom_posts?.length) {
    h += sc('Posts do cliente com menor engajamento',
      '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:.75rem">'
      +d.bottom_posts.map(p=>postCard(p,'bottom')).join('')
      +'</div>');
  }

  // Padroes que faltam no cliente
  if (d.competitor_patterns_missing?.length) {
    h += sc('Padrões que funcionam nos concorrentes e o cliente não usa',
      d.competitor_patterns_missing.map((p,i)=>cd(
        '#'+(i+1)+' · '+E(p.pattern)+' (visto em '+N(p.seen_in_count||0)+' posts)',
        '<div style="font-size:.8125rem">'
        +(p.seen_in_competitors?.length?'<div><strong>Concorrentes:</strong> '+p.seen_in_competitors.map(c=>'@'+E(c)).join(', ')+'</div>':'')
        +'<div style="margin-top:.3rem"><strong>Por que funciona:</strong> '+E(p.why_works||'')+'</div>'
        +'<div style="margin-top:.3rem"><strong>Como aplicar:</strong> '+E(p.how_to_apply||'')+'</div>'
        +(p.example_permalinks?.length?'<div style="margin-top:.3rem;font-size:.75rem">Exemplos: '+p.example_permalinks.map(l=>'<a href="'+E(l)+'" target="_blank" rel="noopener">↗</a>').join(' · ')+'</div>':'')
        +'</div>',
        'yellow'
      )).join('')
    );
  }

  // Padroes vencedores do cliente
  if (d.client_winning_patterns?.length) {
    h += sc('Padrões vencedores do cliente — amplificar',
      d.client_winning_patterns.map((p,i)=>cd(
        '#'+(i+1)+' · '+E(p.pattern)+' (visto em '+N(p.seen_in_count||0)+' posts)',
        '<div style="font-size:.8125rem"><strong>Recomendação:</strong> '+E(p.recommendation||'')+'</div>',
        'green'
      )).join('')
    );
  }

  // Compliance
  const comp = d.instagram_compliance;
  if (comp && (comp.aspect_ratio_issues_count != null || comp.notes)) {
    h += sc('Conformidade técnica (Instagram)',
      '<div class="gr gr--2">'
      +(comp.aspect_ratio_issues_count!=null?mt(comp.aspect_ratio_issues_count,'Posts com aspect ratio fora do padrão',comp.aspect_ratio_issues_count>0?'red':'green'):'')
      +'</div>'
      +(comp.notes?cd('Notas',E(comp.notes),'yellow'):'')
    );
  }

  // Proximas acoes
  if (d.next_actions?.length) {
    const iTone = {alto:'green',medio:'yellow',baixo:'gray'};
    const eTone = {baixo:'green',medio:'yellow',alto:'red'};
    const rows = d.next_actions
      .slice()
      .sort((a,b)=>(a.priority||99)-(b.priority||99))
      .map(a=>[
        '#'+E(a.priority||''),
        E(a.action),
        tg(a.impact||'—',iTone[a.impact]||'gray'),
        tg(a.effort||'—',eTone[a.effort]||'gray'),
      ]);
    h += sc('Próximas ações priorizadas', tb(['Prio','Ação','Impacto','Esforço'], rows));
  }

  return h;
},

'ee-s2-diagnostico-cro'(d) {
  let h = '';
  if (d.summary) h += sm(d.summary);

  const scoreTone = v => v==null?'gray':v>=90?'green':v>=50?'yellow':'red';
  const cwvTone = (val, good, ni) => val==null?'gray':val<=good?'green':val<=ni?'yellow':'red';
  const cwvLabel = (val, good, ni) => val==null?'—':val<=good?'Bom':val<=ni?'A melhorar':'Ruim';
  const fmtMs = v => v==null?'—':v>=1000?(v/1000).toFixed(2)+'s':Math.round(v)+'ms';
  const fmtNum3 = v => v==null?'—':Number(v).toFixed(3);

  // Score bar 0-X: faixa gradient (vermelho→amarelo→verde) + marcador no score + label grande
  const scoreBar = (value, max, opts) => {
    opts = opts || {};
    if (value == null) return '';
    const pct = Math.max(0, Math.min(100, (value/max)*100));
    const color = value>=max*0.7 ? 'var(--success)' : value>=max*0.4 ? 'var(--warning)' : 'var(--danger)';
    return '<div class="scbar">'
      +'<div class="scbar__head">'
      +(opts.title?'<div class="scbar__title">'+E(opts.title)+'</div>':'')
      +'<div class="scbar__value" style="color:'+color+'">'+value+'<span class="scbar__max">/'+max+'</span></div>'
      +'</div>'
      +'<div class="scbar__track"><div class="scbar__fill" style="width:'+pct.toFixed(1)+'%;background:'+color+'"></div></div>'
      +'<div class="scbar__scale"><span>0</span><span style="color:var(--danger)">Ruim</span><span style="color:var(--warning)">Médio</span><span style="color:var(--success)">Bom</span><span>'+max+'</span></div>'
      +(opts.caption?'<div class="scbar__caption">'+E(opts.caption)+'</div>':'')
      +'</div>';
  };

  // Screenshots mobile + desktop lado a lado (do PSI final-screenshot)
  const audit = d.technical_audit || {};
