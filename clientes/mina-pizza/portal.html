ro engajamento apesar de conteúdo e seguidores reais","impact":"medium","effort":"medium","recommended_action":"Testar CTAs de engajamento, revisar estratégia de conteúdo","quadrant":"strategic_project"},{"rank":8,"channel":"site_proprio","gap":"Canal de delivery próprio (Neemo) nunca auditado nem divulgado estrategicamente","impact":"medium","effort":"low","recommended_action":"Auditar página Neemo e decidir se vira canal oficial","quadrant":"fill_time"},{"rank":9,"channel":"anuncios","gap":"Nenhum anúncio ativo","impact":"high","effort":"high","recommended_action":"Só rodar depois de corrigir os canais orgânicos acima","quadrant":"strategic_project"}],"executive_summary":{"overall_assessment":"A comunicação digital da Mina Pizza tem um padrão que se repete em quase todos os canais: existe mais coisa construída do que a própria empresa sabe, mas nada está sendo cuidado ativamente. GMB, iFood e Instagram têm presença real — volume de seguidores, avaliações e conteúdo — só que ninguém responde avaliação, corrige informação errada (endereço do GMB, horário do Instagram) ou trata a reclamação mais grave e recorrente de todas: atendimento ríspido, citada como motivo direto de afastamento por clientes de décadas.","top_problems":[{"problem":"GMB com endereço errado e zero resposta a avaliações — incluindo relatos graves de rispidez e um problema de higiene","evidence":"113 avaliações reais, pino fora do local certo, nenhuma resposta do lojista em nenhuma das 20 avaliações revisadas","impact":"Cliente novo é mandado pro lugar errado, e quem já está insatisfeito não vê nenhum sinal de que a empresa se importa — acelera abandono","action":"Reivindicar/corrigir endereço e responder as 20 avaliações essa semana, priorizando a queixa de higiene"},{"problem":"Atendimento ríspido (telefone e balcão) é a queixa mais recorrente em todos os canais, inclusive citada por cliente de 35 anos como motivo de dúvida sobre continuar comprando","evidence":"GMB negativo nº3 e nº9; mesma evidência usada na construção do ICP (persona Marlene)","impact":"É o principal motivo de churn identificado — nenhuma campanha de aquisição compensa isso","action":"Alinhar com a equipe de atendimento o padrão mínimo de cordialidade; considerar WhatsApp Business como canal alternativo ao telefone problemático"},{"problem":"Bio do Instagram com informação errada (horário) e zero engajamento apesar de conteúdo e audiência reais","evidence":"Bio diz '18:00 as 22:00', mas vende almoço desde 9h; 44 posts, 555 seguidores, 0 comentários","impact":"Cliente que confia na bio pode achar que não vende almoço e desistir; zero engajamento sugere que o conteúdo não gera conexão real com quem já segue","action":"Corrigir a bio imediatamente e testar CTAs de engajamento nos próximos posts"}],"communication_score":19},"competitor_benchmark":{"description":"Grupos de concorrência identificados no briefing/SWOT — sem auditoria detalhada dos canais deles ainda, porque não foram fornecidos screenshots ou dados desses perfis.","groups":[{"name":"Concorrência direta na praça de alimentação","members":["Restaurante de frango frito (vizinho na mesma praça)"],"positioning":"Concorrência por almoço, mesmo espaço físico — presença digital não auditada"},{"name":"Pizzarias locais / concorrência digital de São Vicente-Santos","members":[],"positioning":"A confirmar na ee-s2-pesquisa-mercado, com pesquisa real de concorrentes atuais"}],"strategic_read":"Sem dados reais de canal dos concorrentes ainda, não é possível cravar um benchmark canal-a-canal honesto. Recomendo levantar isso com dados reais na ee-s2-pesquisa-mercado antes de fechar o posicionamento."},"journey_friction_map":{"description":"Funil de comunicação da persona Marlene, do contato até a recompra — estimativas qualitativas, sem dados de analytics (nenhum canal tem tracking).","stages":[{"stage":"Exposição / Descoberta","current_volume":"não mensurado — negócio não rastreia impressões/alcance","leakage_pct":0,"root_cause":"Não é um problema de descoberta — GMB e Instagram já têm alcance orgânico real (113 avaliações + 555 seguidores)","fix_effort":"low","fix_impact_estimate":"Baixo — não é o gargalo principal"},{"stage":"Contato / Decisão do canal","current_volume":"não mensurado","leakage_pct":15,"root_cause":"Cliente hesita entre ligar (medo de atendimento ruim) e pedir por app — sem WhatsApp, a opção mais confortável não existe","fix_effort":"low","fix_impact_estimate":"Ativar WhatsApp pode recuperar parte desse vazamento rapidamente"},{"stage":"Pedido","current_volume":"~250 pedidos de pizza/mês (dado declarado)","leakage_pct":10,"root_cause":"Inconsistência de atendimento entre atendentes gera desistência no meio da ligação","fix_effort":"medium","fix_impact_estimate":"Padronizar atendimento reduz esse vazamento"},{"stage":"Recebimento/Consumo","current_volume":"N/A","root_cause":"Comida fria/sem tempero em parte dos pedidos (evidência recorrente nas avaliações)","fix_effort":"medium","fix_impact_estimate":"Corrigir processo de cozinha/expedição reduz reclamação pós-venda"},{"stage":"Avaliação/Feedback","current_volume":"167 avaliações acumuladas (Google+iFood)","root_cause":"Zero resposta do lojista — quem reclama não vê retorno, quem elogia não é reforçado","fix_effort":"low","fix_impact_estimate":"Responder avaliações é o quick win de menor esforço/maior sinal de cuidado"},{"stage":"Recompra","current_volume":"N/A — sem CRM pra medir","root_cause":"Sem nenhuma régua de reativação; cliente insatisfeito simplesmente some sem que ninguém saiba","fix_effort":"medium","fix_impact_estimate":"WhatsApp Business + follow-up básico pode recuperar recompra de quem sumiu"}],"biggest_leakage_summary":"O maior vazamento não é entrada (descoberta) — é entre 'Contato' e 'Recompra': a ausência de WhatsApp Business, o atendimento inconsistente e o silêncio total pós-venda (zero resposta a avaliação, zero reativação) fazem a Mina Pizza perder cliente fiel sem nenhum sinal de alerta.","projected_funnel_90d_realistic":"Se GMB for corrigido, avaliações respondidas e WhatsApp Business ativado nos primeiros 30 dias, a expectativa realista é estabilizar a taxa de recompra atual (hoje sem medição) antes de qualquer ganho de novo cliente — o ganho maior em 90 dias vem de reter quem já compra, não de atrair volume novo."},"tone_of_voice_analysis":{"description":"Auditoria de coerência entre o tom de voz aprovado no briefing (simples e direto, sem infantilização, público mais velho) e o tom real observado em cada canal.","brand_voice_target":{"pillars":["Simples e direto","Tradicional/família","Sem infantilização","Acessível pra público mais velho"],"avoid":["Gírias excessivas","Tom jovem/descolado que não combina com o público","Formalidade fria"]},"channel_drift":[{"channel":"instagram","actual_tone":"Descontraído/promocional, com emoji de foguete na bio e gancho de venda ('Promoções secretas')","target_alignment":"parcial","drift_notes":"Bio usa linguagem de venda agressiva que foge do tom simples e tradicional esperado; conteúdo visual é adequado, mas a copy soa mais genérica de delivery do que de pizzaria de bairro de 34 anos","example":"'Promoções secretas no...'","fix":"Reescrever bio focando em tradição/simplicidade em vez de gancho de venda tipo delivery genérico"},{"channel":"google_meu_negocio","actual_tone":"Inexistente — sem nenhuma resposta, não há tom de voz ativo neste canal","target_alignment":"nenhum","drift_notes":"Não há voz nenhuma da marca — só o cliente fala, a empresa nunca responde","fix":"Definir um template de resposta simples e direto (alinhado ao tom aprovado) pra usar nas respostas"},{"channel":"ifood","actual_tone":"Inexistente pelo mesmo motivo — zero resposta","target_alignment":"nenhum","drift_notes":"Mesma ausência de voz do GMB","fix":"Mesmo template de resposta pode ser adaptado pro iFood"},{"channel":"atendimento_telefonico_balcao","actual_tone":"Ríspido, segundo múltiplos relatos — o oposto do tom simples e acolhedor esperado","target_alignment":"critico","drift_notes":"Cliente relata desligarem na cara sem se despedir; balcão sem sorriso — o maior desalinhamento de tom de toda a auditoria, e o mais prejudicial porque é o canal mais usado pelos clientes fiéis","example":"'A mulher que atende é tão grossa que desliga na sua cara e nem se despede'","fix":"Treinamento básico de atendimento — fora do escopo de marketing, mas crítico pra qualquer estratégia de comunicação funcionar"}],"coherence_score":16},"url_audit":{"description":"URLs críticas a verificar antes de qualquer produção de mídia.","urls":[{"url":"instagram.com/minapizzas","purpose":"Perfil social principal","status_expected":"Bio correta, horário certo, CTA de pedido","verify_checklist":["Corrigir horário","Adicionar menção a almoço/prato do dia","Testar link do Neemo"]},{"url":"deliveryapp.neemo.com.br/delivery/12596/menu","purpose":"Cardápio/delivery próprio (achado na bio do Instagram)","status_expected":"Cardápio funcional, pedido completável, dados de pedido capturados pela Mina Pizza (não por terceiro)","verify_checklist":["Testar fluxo de pedido completo","Confirmar se captura telefone/e-mail do cliente","Verificar se tem checkout funcional ou é só vitrine"]},{"url":"iFood — Mina Pizzas & Grill","purpose":"Canal de delivery principal hoje","status_expected":"Avaliações respondidas, nome padronizado","verify_checklist":["Responder avaliações pendentes","Padronizar nome para 'Mina Pizza'"]},{"url":"Google Meu Negócio — Mina Praia Grill & Pizza","purpose":"Perfil de busca local","status_expected":"Endereço correto, avaliações respondidas, fotos atualizadas","verify_checklist":["Corrigir pino do endereço","Reivindicar conta se ainda não reivindicada","Responder as 20 avaliações"]}]},"quick_wins":[{"action":"Corrigir o endereço do Google Meu Negócio pro endereço real (Av. Prefeito José Monteiro, 1045, Loja 1 e 2)","channel":"google_meu_negocio","time_estimate":"30min","expected_impact":"Cliente novo para de ser direcionado pro lugar errado","who_does_it":"operator","steps":["Acessar Google Business Profile (reivindicar se necessário)","Editar endereço e reposicionar o pino no mapa","Confirmar horário de funcionamento (incluindo almoço desde 9h)"]},{"action":"Responder as 20 avaliações do GMB, priorizando as negativas mais graves (rispidez, higiene)","channel":"google_meu_negocio","time_estimate":"2h","expected_impact":"Sinaliza cuidado ativo; pode reduzir a percepção negativa mesmo sem mudar o passado","who_does_it":"operator","steps":["Usar tom simples e direto (alinhado à marca)","Responder reconhecendo o problema sem ser defensivo","Priorizar a avaliação da funcionária com mão suja e a do atendimento ríspido"]},{"action":"Corrigir o horário na bio do Instagram","channel":"instagram","time_estimate":"10min","expected_impact":"Elimina informação errada que pode afastar cliente de almoço","who_does_it":"client","steps":["Editar bio incluindo horário de almoço (desde 9h) e jantar (18h-22h)"]},{"action":"Responder as avaliações pendentes do iFood","channel":"ifood","time_estimate":"1h","expected_impact":"Reduz percepção de reclamação recorrente sem resposta","who_does_it":"operator","steps":["Responder reclamações de tempero/item faltando reconhecendo o problema","Agradecer avaliações positivas"]},{"action":"Ativar WhatsApp Business básico (perfil + saudação + mensagem de ausência)","channel":"whatsapp_business","time_estimate":"1h","expected_impact":"Cria alternativa ao telefone problemático, começa a capturar contatos próprios","who_does_it":"operator","steps":["Baixar WhatsApp Business","Configurar perfil com endereço, horário, descrição","Configurar saudação e mensagem de ausência"]}],"key_insight":{"headline":"A Mina Pizza não tem um problema de canais — tem um problema de silêncio: em nenhum lugar (GMB, iFood, telefone) a empresa responde ao que o cliente diz.","context":"Isso é raro e específico: a maioria dos negócios locais tem o problema oposto (falta de canal). A Mina Pizza tem GMB, iFood e Instagram com presença real — o padrão que se repete em todos é zero resposta, zero correção de erro simples (endereço, horário), zero follow-up.","numbered_reasons":["(1) 167 avaliações acumuladas sem uma única resposta do lojista, em nenhum dos dois canais.","(2) Erros simples e gratuitos de corrigir (endereço do GMB, horário do Instagram) estão ativos há tempo indeterminado sem ninguém notar.","(3) O canal mais usado pelo cliente fiel (telefone) é também o mais mal avaliado — e é o único canal sem alternativa (não existe WhatsApp Business)."],"discussion_anchor":"Antes de qualquer produção de criativo ou mídia paga (semana 2-3), Roberto precisa decidir quem, na prática, vai assumir a rotina semanal de responder avaliação e corrigir esses erros — sem isso, cada melhoria de comunicação esbarra no mesmo silêncio."},"honesty_alert":"Esta auditoria não inclui benchmark real de canais dos concorrentes (frango frito vizinho, pizzarias locais) porque não foram fornecidos screenshots ou dados desses perfis — o competitor_benchmark ficou qualitativo, sem scores comparativos reais. Recomendo levantar isso na ee-s2-pesquisa-mercado antes de finalizar posicionamento. Além disso, o problema de atendimento ríspido identificado aqui é operacional (treinamento de equipe), não de marketing — nenhuma correção de canal digital resolve isso sozinha.","summary_headline":"A Mina Pizza não fala com ninguém: 167 avaliações reais, zero resposta — e um erro de endereço no GMB que manda cliente pro lugar errado.","summary_highlights":[{"category":"maturidade","label":"Score de comunicação","value":"19/100","subtext":"Crítico — 6 canais auditados, nenhum acima de 55","tone":"red"},{"category":"risco","label":"Avaliações sem resposta","value":"167 de 167","subtext":"Google (113) + iFood (54), zero respondidas","tone":"red"},{"category":"oportunidade","label":"Quick win de maior impacto","value":"Corrigir endereço do GMB","subtext":"30min, resolve o erro mais caro","tone":"green"},{"category":"janela","label":"Maior desalinhamento de tom","value":"Atendimento telefônico","subtext":"Crítico — o oposto do tom simples/acolhedor esperado","tone":"red"},{"category":"posicao","label":"Coerência entre canais","value":"16/100","subtext":"Nome, tom e informações divergem entre GMB/iFood/Instagram","tone":"red"}],"summary_key_findings":[{"category":"vantagem","text":"Diferente da maioria dos negócios locais, a Mina Pizza já tem presença real em 3 canais (GMB, iFood, Instagram) com audiência e conteúdo — o trabalho é gestão, não construção do zero."},{"category":"contexto","text":"O padrão se repete em todos os canais: existe mais coisa construída do que a empresa sabe, e nada está sendo cuidado ativamente."},{"category":"ameaca","text":"Atendimento ríspido no telefone e balcão é o desalinhamento de tom mais grave — é o canal mais usado pelo cliente fiel e o pior avaliado, sem alternativa (sem WhatsApp Business)."},{"category":"acao","text":"5 quick wins (corrigir GMB, responder avaliações em 2 canais, corrigir bio, ativar WhatsApp) resolvem a maior parte dos problemas críticos em menos de 5 horas de trabalho, sem custo."}],"refined_in":"ee-revisao-semanal","_refinement_history":[{"ts":"2026-07-20T10:30:00Z","review":"ee-revisao-semanal","semana":2,"updates":["U1"],"evolutions_applied":[],"note":"Rating do iFood atualizado de 4,7★/47 avaliações para 4,8★/54 (total combinado com Google de 160 para 167), com base em print real mais recente enviado pelo operador."}]},"ee-s1-diagnostico-maturidade":{"summary":"Diagnóstico de maturidade digital da Mina Pizza: score geral de 14/100 (crítico), abaixo da média do setor (28), mas com uma descoberta central — a empresa já tem 167 avaliações reais no Google (113, 3,9★) e iFood (54, 4,8★), incluindo um GMB com endereço incorreto que Roberto nem sabia que existia. Presença real e não gerenciada, não ausência de presença.","client_name":"Mina Pizza","data_source":"manual","overall_score":14,"overall_classification":"critical","summary_headline":"Mina Pizza tem 14/100 de maturidade digital — mas já esconde 167 avaliações reais (Google 3,9★ + iFood 4,8★) que ninguém gerencia, incluindo um GMB com endereço errado.","summary_highlights":[{"category":"maturidade","label":"Score geral","value":"14/100","subtext":"Crítico — metade da média do setor (28)","tone":"red"},{"category":"oportunidade","label":"Reputação já existente","value":"167 avaliações","subtext":"Google 3,9★ (113) + iFood 4,8★ (54), sem gestão","tone":"green"},{"category":"risco","label":"GMB com endereço errado","value":"113 avaliações desperdiçadas","subtext":"Pino fora do shopping/Carrefour real","tone":"red"},{"category":"posicao","label":"vs. benchmark do setor","value":"-14 pontos","subtext":"Alimentação/restaurante: média 28/100","tone":"red"},{"category":"oportunidade","label":"Quick win de maior ROI","value":"Corrigir endereço do GMB","subtext":"Grátis, minutos de trabalho","tone":"green"}],"summary_key_findings":[{"category":"vantagem","text":"167 avaliações reais somadas (Google + iFood) com notas de 3,9 a 4,8 — prova social genuína que nenhum concorrente pequeno da região tem documentada."},{"category":"contexto","text":"Roberto administra a distância e desconhecia a existência do próprio GMB — reforça que o gargalo é gestão/atenção, não falta de ativo digital."},{"category":"ameaca","text":"GMB com localização errada ativamente direciona clientes pro lugar errado, e reclamações reais (sabor, itens faltando, ambiente) seguem sem resposta."},{"category":"acao","text":"Corrigir o endereço do GMB e responder avaliações pendentes são as duas ações de maior impacto imediato, com esforço e custo praticamente zero."}],"pillar_scores":[{"pillar":"midia_paga","score":8,"classification":"critical","highlight":"Zero campanha ativa hoje; único teste histórico (R$200) sem pixel, segmentação ou acompanhamento profissional.","estimated":true,"details":{"strengths":["Margem de contribuição saudável (CMV 30-35%) dá caixa para testar mídia sem pressão de curto prazo"],"weaknesses":["Nenhuma campanha ativa","Teste histórico sem pixel, segmentação ou tracking","Não sabe CPA nem ROAS"],"metrics":{"investimento_mensal_atual":"R$0","historico_investimento":"R$200 (único teste, sem resultado)"}}},{"pillar":"criativos","score":6,"classification":"critical","highlight":"Instagram praticamente abandonado; nenhuma identidade visual ou manual de marca definidos.","estimated":true,"details":{"strengths":["36 anos de marca física reconhecida localmente, ainda sem tradução visual pro digital"],"weaknesses":["Instagram sem posts recentes ('muito fraquinho')","Nenhum criativo ativo em anúncio","Sem manual de marca, cores ou fontes padronizadas"],"metrics":{}}},{"pillar":"cro","score":22,"classification":"low","highlight":"iFood funciona como funil de conversão real (54 avaliações, 4,8★), mas não há site, pixel, tracking ou tratamento de objeções em canal próprio.","estimated":true,"details":{"strengths":["Cardápio funcional e ativo no iFood, com carrinho/checkout nativo e prova social genuinamente boa (4,8★/54)"],"weaknesses":["Site próprio desligado (não gerava pedido)","Nenhum CTA ou LP fora de marketplaces","Sem tracking/analytics","Reputação no Google mais mista/negativa que no iFood (3,9★/113, com queixas de ambiente e comida)","Nenhuma avaliação (positiva ou negativa) respondida em nenhum canal"],"metrics":{"ifood_rating":"4.8 (54 avaliações)","gmb_rating":"3.9 (113 avaliações)"}}},{"pillar":"crm","score":10,"classification":"critical","highlight":"Dados de cliente existem no sistema de PDV e no iFood, mas não são acessados nem usados por Roberto — zero reativação de base.","estimated":true,"details":{"strengths":["Sistema de PDV já identifica telefone/endereço automaticamente (via Bina)"],"weaknesses":["Roberto não acessa o próprio banco de dados do sistema","iFood retém os contatos, não cede ao lojista","Nenhuma automação ou régua de comunicação","WhatsApp Business não configurado"],"metrics":{"pedidos_mes_estimado":"~250 pedidos de pizza/mês"}}},{"pillar":"seo","score":25,"classification":"low","highlight":"GMB existe com volume relevante de avaliações (113, 3,9★) mas está com localização incorreta no mapa — cliente é direcionado pro lugar errado.","estimated":true,"details":{"strengths":["GMB já existente com volume real de avaliações (113) — sinal de que o negócio já é comentado organicamente, mesmo sem gestão"],"weaknesses":["Localização do GMB está errada (pino fora do shopping/Carrefour onde a loja realmente fica)","Reputação no Google é mista/negativa (3,9★, com queixas de ambiente e comida), sem nenhuma resposta do lojista","Roberto não sabia da existência do GMB — provável falta de acesso admin/conta não reivindicada","Sem site próprio para indexar"],"metrics":{"gmb_rating":3.9,"gmb_reviews":113,"endereco_correto":"Av. Prefeito José Monteiro, 1045, Loja 1 e 2, São Vicente/SP"}}}],"executive_summary":"A Mina Pizza tem score geral de 14/100 (crítico), mas o significado mudou com a evidência trazida do kick-off: não é ausência de presença digital, é presença real e não gerenciada. A empresa soma 167 avaliações reais entre Google (113) e iFood (54), com notas de 3,9 a 4,8 estrelas — prova de que existe demanda satisfeita — só que ninguém dentro da empresa sabia disso, muito menos geria isso. Mesmo assim, o score fica bem abaixo da média do setor (28), porque nenhum desses ativos está sendo trabalhado.\n\nOs 2 maiores gaps agora são operacionais, não de criação do zero: (1) o Google Meu Negócio, que já tem 113 avaliações, está fisicamente no lugar errado no mapa — manda cliente pra porta errada e ninguém percebeu; (2) não existe nenhuma resposta a avaliações em nenhum canal, incluindo reclamações recorrentes e específicas (comida sem tempero, item faltando no delivery, incômodo de pessoas em situação de rua no salão) que o próprio Roberto desconhece.\n\n2 forças reais, reforçadas pela nova evidência: (1) o iFood prova, com nota 4,8★ em 54 avaliações e sem nenhuma gestão ativa, que o produto sustenta demanda real — o Google já é mais frágil (3,9★, com queixas de ambiente e comida) e pesa mais como fraqueza do que força; (2) 36 anos de operação com margem saudável (CMV 30-35%) dão fôlego financeiro pra corrigir e escalar sem pressão de caixa.","priorities":[{"rank":1,"action":"Reivindicar/corrigir o Google Meu Negócio — ajustar endereço para Av. Prefeito José Monteiro, 1045, Loja 1 e 2, São Vicente/SP","rationale":"O GMB já tem 113 avaliações sendo desperdiçadas por um erro de endereço; é o fix de maior impacto com menor esforço de toda a estruturação","effort":"low","pillar":"seo","dependencies":[]},{"rank":2,"action":"Responder todas as avaliações pendentes no Google e no iFood, positivas e negativas","rationale":"Sinaliza cuidado ativo, é gratuito, e reclamações específicas (comida sem tempero, item faltando) estão sem resposta há meses","effort":"low","pillar":"cro","dependencies":[]},{"rank":3,"action":"Ativar WhatsApp Business com catálogo e link de pedido","rationale":"Resolve o gargalo do atendimento por telefone (1 atendente, 2 linhas) e começa a gerar uma base de contatos própria, hoje inexistente","effort":"low","pillar":"crm","dependencies":[]},{"rank":4,"action":"Montar pixel + landing page mínima de pedido com CTA de WhatsApp","rationale":"Cria um canal de conversão fora dos marketplaces, capturando dados do cliente que hoje ficam só com o iFood","effort":"medium","pillar":"cro","dependencies":["Ativar WhatsApp Business"]},{"rank":5,"action":"Reativar Instagram com conteúdo consistente, mirando o público turista de fim de semana","rationale":"Instagram está abandonado, mas é o canal mais barato pra capturar a demanda de turista de praia que hoje vai pro concorrente","effort":"medium","pillar":"criativos","dependencies":[]},{"rank":6,"action":"Estruturar mídia paga geolocalizada (Meta Ads) mirando turistas de praia nos fins de semana, com pixel instalado","rationale":"É a alavanca de maior escala, mas só funciona depois que pixel, marca padronizada e LP estiverem prontos","effort":"medium","pillar":"midia_paga","dependencies":["Montar pixel + LP","Padronizar marca"]}],"sector_benchmark":{"sector":"Alimentação / Restaurante (PDV local)","sector_average":28,"comparison":"significantly_below","pillar_comparison":[{"pillar":"midia_paga","client_score":8,"sector_average":32,"gap":-24,"position":"critical_gap"},{"pillar":"criativos","client_score":6,"sector_average":28,"gap":-22,"position":"critical_gap"},{"pillar":"cro","client_score":22,"sector_average":38,"gap":-16,"position":"below"},{"pillar":"crm","client_score":10,"sector_average":25,"gap":-15,"position":"below"},{"pillar":"seo","client_score":25,"sector_average":38,"gap":-13,"position":"below"}],"key_insight":"O maior gap absoluto ainda é em mídia paga (8 vs 32) — mas o gap mais fácil de fechar é SEO local (25 vs 38): a Mina Pizza já tem GMB com volume de avaliações parecido com negócios bem avaliados do setor, só precisa corrigir o endereço e assumir a gestão."},"key_insight":{"headline":"Roberto não sabia que a própria pizzaria tem 167 avaliações reais (113 no Google, 54 no iFood) — e que o Google Meu Negócio está mandando cliente pro endereço errado.","context":"A Mina Pizza não é um negócio sem presença digital — é um negócio com presença real e ativa que ninguém dentro da empresa está gerenciando. Isso muda a estratégia: em vez de construir do zero, a primeira onda é assumir o controle de ativos que já geram prova social.","numbered_reasons":["(1) 113 avaliações no Google (3,9★) e 54 no iFood (4,8★) são prova social real que nenhuma mídia paga compra mais barato.","(2) O GMB está fisicamente no lugar errado do mapa — um erro de poucos minutos pra corrigir que está custando cliente todos os dias.","(3) Ninguém responde avaliação nenhuma, positiva ou negativa — o gargalo aqui é gestão, não investimento."],"discussion_anchor":"Antes de aprovar qualquer orçamento de mídia paga, Roberto precisa decidir quem vai assumir a rotina simples de corrigir o GMB e responder avaliações — é o maior ROI possível de toda a estruturação e custa zero."},"honesty_alert":"Mesmo com a correção, todos os 5 pilares continuam abaixo da média do setor, e 3 deles (mídia paga, criativos, CRM) seguem em faixa crítica de verdade — a melhora em CRO e SEO reflete ativos que já existiam e não foram criados por nós. Além disso, as avaliações reais expõem reclamações recorrentes de sabor/tempero e um problema de ambiente físico (pessoas em situação de rua no salão) que marketing não resolve — vale alinhar expectativa com o Roberto de que mais presença digital também expõe esses problemas a mais gente, então corrigir a operação em paralelo importa tanto quanto o digital.","refined_in":"ee-revisao-semanal","_refinement_history":[{"ts":"2026-07-20T10:30:00Z","review":"ee-revisao-semanal","semana":2,"updates":["U1"],"evolutions_applied":[],"note":"Rating do iFood atualizado de 4,7★/47 avaliações para 4,8★/54 (total combinado com Google de 160 para 167), com base em print real mais recente enviado pelo operador."}]},"ee-s1-persona-icp":{"summary":"ICP principal da Mina Pizza é o cliente fiel de longa data de São Vicente (persona 'Marlene', 58 anos), não o turista ainda por conhecer a marca. O maior risco não é falta de aquisição — é erosão silenciosa dessa base por atendimento inconsistente e queda de qualidade, sem nenhum follow-up pra recuperar quem se afasta. Dois segmentos secundários (trabalhador da região, família de fim de semana) têm perfis de lealdade e urgência bem diferentes e merecem tratamento distinto no posicionamento.","client_name":"Mina Pizza","icp":{"demographics":{"type":"B2C","age_range":"35-65 anos, com concentração em 45+ (população mais velha, típica de São Vicente)","income_or_revenue":"Classe C/C+ — renda familiar estimada de R$3.000-7.000/mês, perfil típico da Baixada Santista","location":"São Vicente, SP — entorno do Carrefour da Av. Prefeito José Monteiro, incluindo fluxo de Santos","decision_maker_role":"Decide sozinho(a) ou em família — compra por impulso de fome/conveniência ou hábito de décadas, não é jornada de comparação planejada","education":"Ensino médio completo, majoritariamente — perfil popular/tradicional, não é público de nicho gourmet","other":{"segmentos_secundarios":"Além de Marlene (ICP principal), dois segmentos secundários relevantes pra posicionamento futuro: (1) 'Jailson' — trabalhador da região que almoça ali durante a semana por proximidade/velocidade, zero lealdade emocional, decide por tempo de espera e preço, troca de lugar na primeira falha; (2) 'Família Andrade' — pais com filhos pequenos pedindo pizza no sábado à noite como programa de fim de semana, ticket mais alto, decisão do casal, mais carga emocional por envolver expectativa das crianças. Cada um pode exigir mensagem diferente na Semana 2 (posicionamento)."}},"behavior":{"decision_process":"Racional e por hábito — decisão rápida, pouco pesquisada, baseada em conveniência (já está no shopping) ou lealdade de longo prazo. Não é uma jornada ativa de comparação de concorrentes.","research_channels":["Recomendação boca a boca / tradição familiar","Busca dentro do iFood por 'pizza são vicente'","Google, principalmente quando é visitante/turista da região"],"main_objections":["Atendimento por telefone é ruim, já aconteceu de desligarem na cara","Preço subiu e a qualidade não acompanhou","Comida às vezes chega fria ou sem tempero"],"switching_triggers":"Uma experiência ruim específica (rispidez no telefone, comida sem tempero, item errado) some com décadas de lealdade — não é processo racional, é emocional e imediato","purchase_frequency":"Recorrente — semanal a mensal para os clientes fiéis; esporádica pra quem só passa pelo Carrefour"},"jobs":{"functional":"Quando estou com fome dentro ou perto do Carrefour de São Vicente (compras, trabalho, de passagem), quero uma refeição rápida e saborosa sem esforço de decisão, para que eu resolva a fome sem perder tempo nem gastar muito.","emotional":"Quero sentir que ainda sou reconhecida e respeitada num lugar que já faz parte da minha rotina/história — não quero virar só mais um pedido anônimo depois de tantos anos.","social":"Quero poder levar família ou amigos num lugar que todo mundo já conhece e confia, sem risco de decepcionar ninguém — é um lugar 'de sempre', não uma novidade arriscada."},"pains":[{"pain":"Atendimento ríspido no telefone — mas a dor real é se sentir desrespeitada depois de décadas como cliente fiel, como se a lealdade dela não valesse nada pra quem atende.","intensity":"critical","current_workaround":"Muitos ainda ligam por hábito de décadas, ou migram pro iFood pra evitar o atendente"},{"pain":"Comida às vezes fria, requentada ou sem tempero, principalmente no prato do dia — no fundo, é o medo de que o lugar em que ela sempre confiou esteja mudando pra pior, mexendo com a própria identidade de tradição que ela carrega.","intensity":"high","current_workaround":"Reclama na hora e às vezes não resolve; alguns simplesmente param de pedir aquele item"},{"pain":"Preço subiu mas a qualidade não acompanhou — a dor não é o valor em si, é a sensação de que a relação de confiança de décadas virou só mais uma transação comum, como se estivesse sendo levada.","intensity":"high","current_workaround":"Continua comprando por hábito/lealdade, mas com desconfiança crescente"},{"pain":"Pedido vem errado (item faltando/esquecido) — reforça a sensação de ser tratada como número, não como alguém que a casa já deveria reconhecer depois de tantos anos.","intensity":"medium","current_workaround":"Aceita o erro na maioria das vezes pra não ter que ligar de novo"},{"pain":"Ambiente da praça de alimentação incomoda (barulho, situações desconfortáveis) — quer proteger um momento simples de conforto sem ter que negociar isso com o entorno.","intensity":"medium","current_workaround":"Prefere pedir delivery/viagem em vez de comer no local, ou aceita como 'faz parte' do lugar"}],"gains":[{"gain":"Comida saborosa e feita na hora, com consistência (não fria, não sem tempero)","type":"tangible"},{"gain":"Entrega rápida, sem espera longa","type":"tangible"},{"gain":"Preço justo pelo que recebe — não sentir que está pagando caro por pouco","type":"tangible"},{"gain":"Sensação de tradição e confiança — 'é a pizzaria de sempre', sem risco de decepção","type":"intangible"},{"gain":"Ambiente prático e acessível (estacionamento do Carrefour, espaço plano)","type":"tangible"}]},"persona":{"name":"Marlene, 58 anos","photo_description":"Mulher de cerca de 55-60 anos, cabelo grisalho arrumado, vestindo roupa simples e prática (blusa e calça), com uma bolsa de compras do Carrefour na mão — expressão de quem está no meio de um dia corrido de tarefas, olhando o cardápio afixado no balcão da Mina Pizza dentro da praça de alimentação.","story":"Marlene mora perto do Carrefour de São Vicente há mais de 20 anos e conhece a Mina Pizza desde que era uma pizzaria pequena dentro da praça de alimentação. Vai ao shopping toda semana fazer compras e, quase sempre, para para almoçar ou levar um pastel pra casa — é rotina, não decisão. Nos últimos meses, porém, notou que o prato do dia às vezes vem sem gosto, e uma vez a atendente do telefone foi grossa quando ligou pra fazer um pedido pra família num domingo à noite. Ela ainda vai, porque conhece o lugar há décadas e confia na tradição, mas já comentou com as amigas que 'não é mais como antes' — e isso a deixa se perguntando se vale continuar voltando com a mesma frequência.","quote":"Eu já como aqui desde que meu filho era pequeno, mas ultimamente tá difícil — ou vem sem tempero, ou a mulher do telefone te trata mal. Eu ainda venho porque confio, mas não sei até quando."},"where_to_find":{"digital_channels":["Grupos de bairro/vizinhança de São Vicente no Facebook","Perfis de 'o que fazer em São Vicente/Santos' no Instagram","Busca no iFood por 'pizza são vicente' e 'prato feito perto de mim'","Google Maps buscando 'restaurante praça de alimentação carrefour são vicente'"],"keywords":["pizza são vicente","prato feito perto de mim","restaurante carrefour são vicente","pizzaria delivery são vicente","pastel são vicente"],"influencers":["Páginas locais de gastronomia da Baixada Santista","Perfis de turismo de praia de Santos/São Vicente"],"communities":["Grupos de bairro no Facebook/WhatsApp de moradores de São Vicente","Comunidade de frequentadores do Carrefour São Vicente"]},"anti_persona":{"description":"Perfis que consomem energia da operação sem virar recorrência real — o time deve saber dizer não pra esses.","profiles":[{"profile_name":"Turista de passagem sem tolerância a imprevisto","description":"Está na região só por um fim de semana, quer experiência perfeita e rápida; se pegar um dia de atendimento ruim, avalia mal e nunca mais volta — não tem histórico de relação pra 'perdoar' um deslize.","why_not":"Não tem paciência pra inconsistência operacional que a Mina Pizza ainda tem, e pode gerar dano de reputação desproporcional por uma experiência isolada.","signals":["Pergunta sobre tempo de espera antes de pedir","Sem histórico de pedido anterior","Avalia no Google/iFood logo após a primeira experiência"],"operational_rule":"Priorizar consistência mínima de atendimento antes de investir pesado em atrair esse público — ele não perdoa erro."},{"profile_name":"Caçador de cupom do iFood","description":"Só pede quando tem desconto agressivo, sem intenção de virar cliente recorrente.","why_not":"Ticket baixo, sem lealdade, alto custo de aquisição via cupom sem retorno de recompra.","signals":["Só aparece em promoção","Nunca repete pedido fora de cupom","Reclama de preço 'cheio' quando não tem desconto"],"operational_rule":"Não desenhar a estratégia de mídia em torno de cupom agressivo — foco deve ser recompra de quem já confia na marca."},{"profile_name":"Quem busca experiência gastronômica sofisticada","description":"Quer ambiente silencioso, atendimento de salão completo, pratos elaborados — não é o formato de balcão de praça de alimentação.","why_not":"A Mina Pizza é PDV simples dentro de shopping; tentar atender essa expectativa gera decepção e reclamação de ambiente/serviço.","signals":["Pergunta sobre reserva de mesa","Reclama do barulho/estrutura da praça de alimentação","Espera cardápio degustação"],"operational_rule":"Não comunicar como 'experiência gourmet' — deixar claro que é PDV rápido e tradicional, gerenciando expectativa antes da visita."}],"operational_rule":"Se o lead só aparece por cupom, exige experiência de salão completo, ou não tem tolerância a um deslize operacional isolado, não é prioridade de aquisição — o foco é o cliente recorrente que já confia na tradição da casa."},"buyer_journey":{"description":"Jornada da Marlene, do gatilho de fome até a decisão de recompra.","stages":[{"stage":"Gatilho","trigger":"Fome durante compras no Carrefour, ou lembrança de um hábito antigo (ligar no fim de semana)","mental_state":"Prático, sem grande deliberação","primary_channel":"Presencial (já está no shopping) ou memória/hábito","dominant_question":"O que eu como agora, rápido e sem crise?","client_intervention":"Nenhuma hoje — decisão espontânea, não influenciada por comunicação ativa","friction_today":"Nenhuma — é o ponto mais forte da jornada hoje","duration_estimate":"Minutos"},{"stage":"Escolha do canal de pedido","trigger":"Decidiu que quer Mina Pizza, agora escolhe como pedir","mental_state":"Neutro a levemente apreensivo (lembra de atendimento ruim no telefone)","primary_channel":"Telefone, balcão presencial, ou iFood","dominant_question":"Vou ligar (arriscar atendimento ruim) ou pedir pelo iFood (mais seguro, mas sem o toque pessoal de sempre)?","client_intervention":"Nenhuma — não há WhatsApp Business nem cardápio digital próprio direcionando essa escolha","friction_today":"Medo real de cair com o atendente ríspido do telefone","duration_estimate":"Segundos a minutos"},{"stage":"Pedido/Compra","trigger":"Fez a ligação, foi ao balcão, ou finalizou no iFood","mental_state":"Ansioso se por telefone; tranquilo se presencial ou iFood","primary_channel":"Telefone / balcão / iFood","dominant_question":"Será que dessa vez o atendimento vai ser bom?","client_intervention":"Nenhuma intervenção de marca — depende de quem atende no momento","friction_today":"Inconsistência entre atendentes — não há padrão de atendimento","duration_estimate":"Minutos"},{"stage":"Espera/Recebimento","trigger":"Pedido feito, aguardando entrega ou retirada","mental_state":"Expectativa — espera repetir a boa experiência de sempre","primary_channel":"N/A (espera passiva)","dominant_question":"Vai chegar quente e do jeito certo dessa vez?","client_intervention":"Nenhuma","friction_today":"Pizza às vezes chega fria; item errado ou faltando","duration_estimate":"30-45 min (delivery) ou minutos (balcão)"},{"stage":"Consumo/Avaliação","trigger":"Comeu o pedido","mental_state":"Satisfeita (maioria das vezes) ou frustrada (quando tempero/qualidade falha)","primary_channel":"N/A","dominant_question":"Valeu a pena o preço que paguei?","client_intervention":"Nenhuma — ninguém pergunta como foi a experiência","friction_today":"Sem follow-up ativo pra capturar feedback antes que vire reclamação pública","duration_estimate":"Minutos a horas"},{"stage":"Pós-compra / Recompra","trigger":"Passou um tempo, sente fome de novo ou passa pelo Carrefour de novo","mental_state":"Automático se a experiência foi boa; hesitante se teve falha recente","primary_channel":"Memória/hábito, ou avaliação que deixou no Google/iFood","dominant_question":"Vale repetir, ou dou uma chance pro concorrente dessa vez?","client_intervention":"Nenhuma — não há régua de reativação nem resposta a avaliações negativas","friction_today":"Sem tentativa de recuperar quem teve experiência ruim — cliente de décadas pode sumir sem ninguém perceber","duration_estimate":"Dias a semanas"}],"critical_leakage_point":{"stage":"Pós-compra / Recompra","evidence":"Não é problema de descoberta (a Marlene já conhece a marca há décadas) — é ausência total de follow-up, com raiz já em 'Escolha do canal' (medo de cair com atendente ríspido). Um cliente fiel de 35 anos pode parar de voltar depois de uma ligação mal atendida ou um prato sem tempero, e ninguém na empresa sabe por quê: não há pergunta de satisfação, não há resposta a avaliação, não há reativação de quem sumiu."}},"willingness_to_pay":{"description":"Faixas de preço por produto principal, com base no ticket declarado e nas avaliações reais.","services":[{"service":"Pizza (unidade/família)","current_ticket_range":"R$50-58","perceived_fair_range":"R$45-60","premium_ceiling":"R$70 com recheio/qualidade perceptivelmente superior e consistência garantida","elasticity":"baixa — cliente fiel aceita pagar mais se sentir que a qualidade voltou a ser consistente, mas está desconfiado com aumento recente sem melhora percebida","pricing_lever":"Consistência de tempero/qualidade + atendimento melhor — não é o preço que afasta, é a percepção de queda de valor"},{"service":"Prato do dia / executivo","current_ticket_range":"R$30-37","perceived_fair_range":"R$25-35","premium_ceiling":"R$40 se vier consistentemente temperado e quente","elasticity":"média — mais sensível a preço, já que tem concorrência direta (frango frito vizinho, lanchonetes)","pricing_lever":"Consistência (não vir requentado/sem tempero) e velocidade de entrega no balcão"},{"service":"Pastel","current_ticket_range":"R$9-15 (estimado)","perceived_fair_range":"R$9-15","premium_ceiling":"R$18 se vier reconhecidamente bem recheado e fresco, como descrito nas avaliações","elasticity":"baixa — é o produto mais elogiado, tem margem de aumentar preço sem perder cliente, desde que mantenha a qualidade","pricing_lever":"Já é o produto mais forte de reputação — pode virar carro-chefe de marketing"}]},"objection_library":{"description":"Objeções reais extraídas das avaliações e do comportamento observado.","objections":[{"objection":"Já liguei uma vez e fui mal atendida, não quero passar por isso de novo","subtext":"Medo real de repetir uma experiência ruim específica, não dúvida sobre o produto","bad_response":"'Desculpa, vamos melhorar' — genérico, sem ação visível","good_response":"Reconhecer o problema publicamente (responder a avaliação) e mostrar um canal alternativo mais confiável (WhatsApp com resposta padronizada) em vez de depender só do atendente do telefone","when_to_use":"Resposta a avaliações negativas de atendimento no Google/iFood, e nas primeiras mensagens do WhatsApp Business quando for ativado"},{"objection":"Antes era mais barato/melhor, agora não sei se vale o preço","subtext":"Sente que a relação de confiança de décadas está sendo testada pelo aumento de preço sem melhora percebida","bad_response":"'Nossos preços seguem a inflação como todo mundo' — justifica sem reconhecer a percepção do cliente","good_response":"Comunicar especificamente o que mudou pra melhor (ingrediente, porção, tempero padronizado) quando corrigir os problemas de qualidade — dar um motivo concreto pro preço","when_to_use":"Comunicação geral de marca após resolver os problemas de qualidade da cozinha"},{"objection":"Prefiro ligar mesmo sabendo que às vezes é ruim, não confio em pedir por app","subtext":"Resistência de hábito/idade ao digital, não rejeição real ao produto","bad_response":"'Baixa o app, é mais fácil' — ignora a barreira real","good_response":"Oferecer WhatsApp como ponte — mais familiar que um app, mas ainda mais confiável que o telefone com atendente ruim","when_to_use":"Na ativação do WhatsApp Business, especialmente com clientes antigos"},{"objection":"A praça de alimentação é barulhenta e às vezes tem gente incomodando","subtext":"Prefere não comer no local por causa do ambiente, mesmo gostando da comida","bad_response":"'Isso não é problema nosso, é do shopping' — tecnicamente verdade, mas não resolve a dor do cliente","good_response":"Reforçar o delivery/retirada como alternativa fácil pra quem gosta da comida mas não do ambiente","when_to_use":"Comunicação que destaca delivery/retirada como opção, não só consumo no local"},{"objection":"Não sei se ainda é a mesma qualidade de antes","subtext":"Cliente de longa data testando se ainda vale a lealdade","bad_response":"'Sempre fomos os melhores da região' — afirmação vazia, sem prova","good_response":"Usar prova social real e recente (avaliações específicas, ex: sobre o pastel) pra reforçar que a qualidade que ela lembra ainda existe em partes do cardápio","when_to_use":"Posts/Stories no Instagram e respostas a avaliações"}]},"key_message":{"chosen_message":"Comida de verdade.","approach":"functional","usage_context":"Headline de anúncios, bio do Instagram, base de todo material até a operação corrigir atendimento e consistência de qualidade","alternatives":[{"message":"Comida de verdade.","approach":"functional","rationale":"Foco em qualidade/autenticidade sem prometer nada que a operação ainda não entrega de forma consistente — a mais segura pra usar agora."},{"message":"Do jeito que você lembra.","approach":"emotional","rationale":"Mais forte emocionalmente pro público fiel (Marlene), mas arriscada agora: promete consistência que a cozinha e o atendimento ainda não garantem. Guardar pra depois que a operação corrigir o básico."},{"message":"O point de sempre.","approach":"social","rationale":"Aposta em pertencimento/tradição local — funciona bem como mensagem secundária ou em conteúdo de marca, mas sozinha não comunica o que diferencia o produto."}]},"key_insight":{"headline":"O cliente que a Mina Pizza mais precisa proteger não é quem ainda não conhece a marca — é a Marlene de 35 anos de casa que já está duvidando se volta.","context":"Diferente da maioria dos negócios, que precisam construir confiança do zero, a Mina Pizza já tem isso — o problema é que está deixando escapar sem perceber. Não há pergunta de satisfação, resposta a avaliação, ou tentativa de reconquistar quem sumiu.","numbered_reasons":["(1) Avaliações citam explicitamente 35 anos de relação sendo colocados em xeque por atendimento ruim recente — é erosão de um ativo raro, não falta de aquisição.","(2) O gatilho de compra (fome, hábito, passar no Carrefour) já funciona sozinho — o vazamento está depois, na experiência e no silêncio pós-venda.","(3) É mais barato reter quem já compra há décadas do que atrair turista novo — e a mídia paga (semana 2-3) só funciona de verdade se essa base parar de vazar primeiro."],"discussion_anchor":"Antes de aprovar orçamento de aquisição, Roberto precisa decidir: quem vai entender por que a atendente do telefone trata cliente mal, e quem vai responder as avaliações negativas dessa semana?"},"honesty_alert":"Existe uma tensão real que precisa ser resolvida antes da Semana 3 (produção de criativos): a mensagem emocional ('do jeito que você lembra') seria a mais forte pra esse público fiel, mas seria desonesta enquanto os problemas de atendimento e consistência de tempero não forem corrigidos de verdade — prometer isso pra depois entregar comida fria é pior do que não prometer nada. Por isso a recomendação é a mensagem funcional por enquanto.","summary_headline":"O maior risco de churn da Mina Pizza não é falta de cliente novo — é a Marlene de décadas cansando de atendimento ríspido e comida inconsistente sem que ninguém perceba.","summary_highlights":[{"category":"posicao","label":"Perfil dominante","value":"Cliente fiel 45+ de São Vicente","subtext":"Recorrência de décadas, não descoberta nova","tone":"blue"},{"category":"risco","label":"Maior vazamento na jornada","value":"Pós-atendimento sem follow-up","subtext":"Cliente de 35 anos pode sumir sem ninguém notar","tone":"red"},{"category":"oportunidade","label":"Produto com maior WTP","value":"Pastel","subtext":"Mais elogiado nas avaliações, margem pra virar carro-chefe","tone":"green"},{"category":"janela","label":"Objeção nº1 a resolver antes de mídia","value":"Atendimento por telefone","subtext":"Citada como motivo de churn mais que preço","tone":"yellow"},{"category":"competicao","label":"Anti-persona a evitar","value":"Caçador de cupom iFood","subtext":"Sem lealdade, alto custo de aquisição sem retorno","tone":"gray"}],"summary_key_findings":[{"category":"vantagem","text":"36 anos de relação de confiança com clientes locais é um ativo que nenhum concorrente novo da praça consegue replicar rápido."},{"category":"contexto","text":"O ICP principal não é o turista de fim de semana (alvo da meta de crescimento) — é o morador antigo que já confia na marca. A estratégia de posicionamento (semana 2) vai precisar equilibrar reter esse público com atrair o novo, sem falar a mesma língua pros dois."},{"category":"ameaca","text":"Atendimento ríspido no telefone é citado como motivo de abandono mais do que preço ou concorrência — é o ponto mais urgente de correção, antes de qualquer investimento em atração."},{"category":"acao","text":"Resolver a consistência de atendimento e responder avaliações antes de rodar qualquer campanha evita que a mídia paga traga gente nova pra uma experiência que já está afastando quem é fiel."}]},"ee-s1-swot":{"summary":"Análise SWOT da Mina Pizza: negócio de 36 anos com margem saudável e reputação boa no iFood (4,8★/54) nunca gerenciada, cercado de fraquezas de execução (GMB errado, reputação frágil no Google, sem CRM) que custam pouco pra corrigir. A jogada dos próximos 90 dias é corrigir a gestão básica antes de escalar mídia paga mirando o fluxo turístico de fim de semana.","client_name":"Mina Pizza","strengths":[{"title":"36 anos de operação com margem saudável","description":"CMV de 30-35% e margem líquida acima de 20%, mesmo sem nenhum investimento em marketing; Roberto usou o caixa acumulado pra comprar a parte do ex-sócio em poucos meses.","implication":"Dá fôlego financeiro real pra investir em estruturação sem pressão de resultado imediato — raro no setor de alimentação.","source":"briefing"},{"title":"iFood com reputação consolidada e genuinamente boa","description":"4,8★ em 54 avaliações no iFood, sem nenhuma gestão ativa do canal — nenhuma resposta a avaliação, nenhum investimento em destaque.","implication":"É a prova social mais barata que existe: usar prints/depoimentos reais do iFood em qualquer criativo futuro antes de gastar em produção nova.","source":"diagnostico"},{"title":"Resiliência histórica comprovada com adoção digital mínima","description":"Das 8 lojas da rede antiga, a que sobreviveu à consolidação pós-pandemia foi justamente a que tinha (mesmo que pouco) delivery via iFood.","implication":"O padrão se repete — presença digital mínima já foi decisiva pra sobrevivência antes. Vale usar essa história real na comunicação de marca.","source":"briefing"},{"title":"Delivery terceirizado sem custo fixo de frota","description":"Substituiu motoboys próprios por uma empresa terceirizada de entrega, mantendo só 1 motoboy fixo registrado. Isso ampliou o horário de atendimento (abre 9h, já vende almoço com entrega).","implication":"Estrutura operacional já preparada pra escalar volume de delivery sem precisar contratar mais motoboys imediatamente.","source":"briefing"}],"weaknesses":[{"title":"Maturidade digital crítica em 3 dos 5 pilares","description":"Score de mídia paga 8/100, criativos 8/100, CRM 10/100 — todos na faixa crítica, sem nenhuma base pra escalar.","implication":"Sem correção, continua perdendo turista/novo cliente pro concorrente que aparece no digital.","severity":"critical","source":"diagnostico"},{"title":"GMB com endereço errado e reputação mais frágil no Google","description":"113 avaliações no Google (3,9★) sob o nome 'Mina Praia Grill & Pizza' — mas o pino está fora do shopping/Carrefour onde a loja realmente fica, com queixas reais de ambiente (pessoas em situação de rua nas mesas) e comida, sem nenhuma resposta do lojista.","implication":"Cliente novo é literalmente direcionado pro lugar errado, e a reputação que aparece primeiro na busca é a mais frágil das duas plataformas. Resolver é grátis e rápido.","severity":"critical","source":"diagnostico"},{"title":"Reclamações recorrentes no iFood sem tratamento","description":"Avaliações reais no iFood citam arroz/bife sem tempero e item faltando no delivery (ex: Coca-Cola) — sem resposta do lojista.","implication":"Ampliar tráfego digital sem corrigir isso amplifica reclamação, não venda — precisa alinhar com a operação em paralelo.","severity":"high","source":"diagnostico"},{"title":"Zero base de clientes própria — CRM inexistente","description":"Pedidos entram por telefone (dados presos num sistema que Roberto não acessa) ou iFood (dados da plataforma, não cedidos ao lojista). Sem WhatsApp Business.","implication":"Nenhuma reativação de base é possível hoje; toda recompra depende de o cliente lembrar de ligar de novo.","severity":"critical","source":"briefing"}],"opportunities":[{"title":"Fluxo turístico de fim de semana sem nenhuma captura digital","description":"São Vicente é vizinha de Santos, com fluxo turístico de praia; ninguém na empresa nunca rodou campanha geolocalizada mirando esse público.","implication":"Campanha Meta Ads geolocalizada em raio de poucos km, ativa nos fins de semana, pode capturar demanda que hoje vai pro concorrente que aparece no Google/Instagram.","time_sensitivity":"urgent","source":"briefing"},{"title":"Corrigir e assumir a gestão do GMB e iFood pode reverter reputação mista em ativo de aquisição","description":"As avaliações já existem organicamente — o trabalho não é criar prova social do zero, é corrigir o endereço, responder o que está pendente e manter os dois canais cuidados.","implication":"Maior ROI possível de toda a estruturação: pouco investimento, execução rápida.","time_sensitivity":"urgent","source":"diagnostico"},{"title":"Meta de crescer pizza de 30% para 50% do faturamento, com demanda já comprovada","description":"Existem ~250 pedidos/mês de pizza por delivery telefônico — demanda recorrente validada, só falta migrar parte desse comportamento pra canais rastreáveis.","implication":"Não precisa criar demanda do zero, precisa capturar e organizar a que já existe.","time_sensitivity":"medium_term","source":"briefing"},{"title":"Upsell de ticket médio nunca testado","description":"Roberto reconhece que aumentar o ticket médio (bebida/acompanhamento) é 'muito interessante', mas nunca tentou nenhuma estratégia nesse sentido.","implication":"Um upsell simples de R$5-10 por pedido em ~250 pedidos/mês de pizza já representa R$1.250-2.500/mês adicionais sem custo de aquisição.","time_sensitivity":"medium_term","source":"briefing"},{"title":"Dono tecnicamente capacitado e aberto ao digital, ainda não empregado na prática","description":"Roberto tem formação em gastronomia E ciência da computação, e defendeu manter presença digital (iFood) no passado quando o sócio antigo queria cortar — mas essa capacidade nunca foi aplicada de forma estruturada no negócio.","implication":"Facilita a adoção de ferramentas digitais — o dono já está tecnicamente disposto e capacitado, só falta execução guiada.","time_sensitivity":"medium_term","source":"briefing"}],"threats":[{"title":"Concorrência local com presença digital capturando o fluxo","description":"O restaurante de frango frito vizinho e pizzarias locais com Instagram ativo continuam disputando o mesmo público da praça de alimentação, enquanto a Mina Pizza segue invisível digitalmente.","implication":"Cada mês sem corrigir GMB/iFood é fluxo indo pro concorrente que aparece na busca.","probability":"high","impact":"medium","source":"briefing"},{"title":"Dependência total de plataformas de terceiros para pedido","description":"iFood retém os dados do cliente; telefone depende de 1 atendente com 2 linhas. Se qualquer um desses canais falhar, a empresa perde a maior parte do volume de pedidos de uma vez.","implication":"Diversificar com WhatsApp Business e canal próprio reduz esse risco de concentração.","probability":"medium","impact":"high","source":"briefing"},{"title":"Reclamações não respondidas corroem a reputação","description":"As mesmas avaliações que hoje são um ativo podem virar prejuízo se as reclamações recorrentes de sabor/erro de pedido continuarem sem resposta e sem correção operacional.","implication":"Responder avaliações e alinhar com a operação local é defesa, não só ataque.","probability":"medium","impact":"medium","source":"diagnostico"},{"title":"Aumento histórico de comissão de apps de delivery","description":"Plataformas como iFood vêm historicamente aumentando comissão; com CMV de 30-35%, qualquer alta comprime ainda mais a rentabilidade do delivery.","implication":"Reforça a urgência de ter canal próprio (WhatsApp + pixel) com custo de aquisição mais baixo no médio prazo.","probability":"medium","impact":"medium","source":"market_trend"}],"strategic_synthesis":{"leverage":"A jogada mais forte é usar a reputação já sólida no iFood (4,8★) pra capturar o fluxo turístico de fim de semana que hoje ninguém está disputando digitalmente. A margem saudável dá caixa pra financiar isso sem pressão, e o próprio histórico do negócio mostra que presença digital mínima (mesmo que pouca) já foi decisiva pra sobrevivência antes — o padrão tende a se repetir se for feito com intenção.","protection":"A fraqueza mais perigosa é o GMB com endereço errado e a reputação mais frágil no Google (queixas de ambiente e comida sem resposta) — se não for corrigido antes de qualquer campanha, o investimento em atrair tráfego se perde num endereço errado e numa reputação que passa a impressão errada pra quem pesquisa antes de decidir. Nenhuma ação de aquisição paga deve rodar antes de resolver isso.","recommended_strategy":"Nos próximos 90 dias: (1) semanas 1-2 — corrigir GMB, responder avaliações pendentes (Google e iFood) e ativar WhatsApp Business (tudo de custo zero); (2) semanas 3-6 — testar upsell de ticket médio, montar pixel e LP mínima; (3) semanas 7-12 — só então rodar a primeira campanha geolocalizada mirando o turista de fim de semana, já com a casa em ordem."},"tows_matrix":{"description":"Cruzamento estratégico dos quadrantes da SWOT — onde a análise vira ação.","so_strategies":[{"id":"SO1","strategy":"Usar a reputação do iFood (S2) + fluxo turístico (O1) para lançar campanha geolocalizada de fim de semana com prova social real no criativo.","rationale":"Prova social remove a principal objeção de quem nunca comprou, e o timing de fim de semana de praia é quando a demanda de turista é maior.","expected_outcome":"Aumento de pedidos de pizza nos fins de semana, atacando diretamente a meta de crescer de 30% pra 50% do faturamento em pizza."},{"id":"SO2","strategy":"Usar a resiliência histórica com adoção digital mínima (S3) + a abertura técnica do dono (O5) para Roberto liderar pessoalmente a virada digital.","rationale":"Ele já defendeu manter presença digital no passado contra a vontade do sócio antigo — tem tanto o histórico quanto a formação técnica pra isso.","expected_outcome":"Execução mais rápida e alinhada, sem depender de terceiros pra decisões técnicas simples."},{"id":"SO3","strategy":"Usar o delivery terceirizado (S4) + demanda comprovada (O3) para converter os ~250 pedidos/mês existentes em canais próprios, sem novo investimento em frota.","rationale":"A estrutura de entrega já está pronta pra escalar volume.","expected_outcome":"Mais pedidos capturados em canal próprio sem custo operacional adicional."}],"wo_strategies":[{"id":"WO1","strategy":"Corrigir GMB e reputação (W2) antes de capturar o fluxo turístico (O1).","rationale":"Investir em atrair tráfego antes de corrigir o erro de endereço e a reputação mista desperdiça o próprio investimento.","expected_outcome":"Toda futura campanha de aquisição converte de verdade, sem vazamento no último passo."},{"id":"WO2","strategy":"Ativar WhatsApp Business (mitiga W4) para capturar a demanda já comprovada (O3).","rationale":"É o jeito mais rápido de começar a construir base própria a partir de um comportamento de compra que já existe.","expected_outcome":"Primeira base de contatos própria em semanas, sem depender de plataforma terceira."}],"st_strategies":[{"id":"ST1","strategy":"Usar a resiliência histórica (S3) como narrativa de marca pra diferenciar de concorrentes só-digitais sem tradição (T1).","rationale":"36 anos de operação é uma prova de confiança que concorrente novo não tem.","expected_outcome":"Diferenciação de marca que reduz a pressão de concorrentes só-digitais."},{"id":"ST2","strategy":"Usar a reputação boa do iFood (S2) como contrapeso ao risco de reputação mal gerida (T3) — cuidar primeiro do canal que já funciona bem.","rationale":"É mais fácil defender e ampliar uma reputação já positiva do que reverter uma negativa.","expected_outcome":"Reputação online mais defendida, reduzindo o risco de queda de nota."},{"id":"ST3","strategy":"Usar a margem saudável (S1) para reduzir a dependência de plataformas de terceiros (T2/T4), investindo em canal próprio.","rationale":"Rentabilidade atual permite bancar essa transição sem pressão.","expected_outcome":"Menor exposição a aumento futuro de comissão de plataformas."}],"wt_strategies":[{"id":"WT1","strategy":"Priorizar a correção do GMB e resposta a avaliações (W2/W3) antes de qualquer escala de mídia — mitiga T1 e T3 ao mesmo tempo.","rationale":"É o pior cenário se não for feito: gastar em atração de tráfego pra um endereço errado com reputação não gerenciada.","expected_outcome":"Reduz o risco de desperdiçar investimento futuro em mídia."},{"id":"WT2","strategy":"Alinhar com a operação local a correção dos problemas recorrentes de tempero/erro de pedido (W3) antes de aumentar volume via novos canais — mitiga T2 e T3.","rationale":"Aumentar volume sem corrigir a causa raiz da reclamação só amplifica o problema em escala.","expected_outcome":"Reduz taxa de reclamação à medida que o volume cresce, em vez de aumentar."}]},"priority_actions":[{"action":"Corrigir endereço do GMB e assumir a gestão do canal (reivindicar conta, responder avaliações)","swot_basis":"Mitiga W2, protege O1/O2, executa WO1/WT1","impact":"high","suggested_timeline":"Semana 1","dependencies":[],"financial_impact":{"investment":0,"note":"Custo zero, esforço de horas"},"risk_adjusted_score":{"impact":10,"probability_of_success":9,"reversibility":10,"score":9.5}},{"action":"Responder as avaliações pendentes no iFood e no Google","swot_basis":"Mitiga W3, protege S2 de virar T3, executa ST2/WT2","impact":"high","suggested_timeline":"Semana 1","dependencies":[],"financial_impact":{"investment":0,"note":"Custo zero"},"risk_adjusted_score":{"impact":8,"probability_of_success":9,"reversibility":10,"score":9}},{"action":"Ativar WhatsApp Business com catálogo e cardápio único","swot_basis":"Mitiga W4, captura O3, executa WO2","impact":"high","suggested_timeline":"Semana 1-2","dependencies":[],"financial_impact":{"investment":0,"note":"Ferramenta gratuita"},"risk_adjusted_score":{"impact":9,"probability_of_success":8,"reversibility":9,"score":8.5}},{"action":"Montar pixel + landing page mínima com CTA de WhatsApp","swot_basis":"Mitiga T2/T4, executa ST3","impact":"high","suggested_timeline":"Semana 3-4","dependencies":["WhatsApp Business ativo"],"financial_impact":{"investment":800,"note":"Custo estimado de LP simples"},"risk_adjusted_score":{"impact":8,"probability_of_success":7,"reversibility":8,"score":7.5}},{"action":"Rodar primeira campanha geolocalizada de Meta Ads mirando turista de fim de semana","swot_basis":"Captura O1, alavanca S2/S3/O5, executa SO1","impact":"high","suggested_timeline":"Semana 7-12 (após correções)","dependencies":["GMB corrigido","Marca padronizada","Pixel instalado"],"financial_impact":{"investment":1500,"monthly_return_brl":5000,"note":"Estimativa conservadora baseada em ticket médio R$50 e conversão inicial baixa"},"risk_adjusted_score":{"impact":9,"probability_of_success":6,"reversibility":7,"score":7.2}},{"action":"Testar upsell de ticket médio (bebida/acompanhamento) no balcão, telefone e delivery"," ilidade digital pode expor esses problemas a mais gente em vez de só trazer mais venda.","summary_headline":"GMB com endereço errado e reputação mista sem resposta travam a Mina Pizza antes mesmo de qualquer investimento em mídia entrar em cena.","summary_highlights":[{"category":"posicao","label":"Forças vs Fraquezas","value":"4 x 4","subtext":"Fraquezas concentradas em gestão de canais, não em produto","tone":"yellow"},{"category":"oportunidade","label":"Ação SO de maior ROI","value":"Campanha geo turista + iFood","subtext":"Payback estimado dentro de 90 dias","tone":"green"},{"category":"risco","label":"Maior ameaça","value":"Reputação Google não gerenciada","subtext":"Queixas de ambiente e comida sem resposta do lojista","tone":"red"},{"category":"janela","label":"Janela de oportunidade","value":"Fins de semana de praia","subtext":"Fluxo turístico ainda sem captura digital de nenhum concorrente local","tone":"yellow"},{"category":"maturidade","label":"Custo pra destravar as 3 primeiras ações","value":"R$0","subtext":"GMB, avaliações e WhatsApp Business são gratuitos","tone":"green"}],"summary_key_findings":[{"category":"vantagem","text":"36 anos de operação com margem saudável e reputação boa no iFood (4,8★/54) mostram que o produto sustenta demanda mesmo sem nenhuma gestão de canal."},{"category":"contexto","text":"As fraquezas identificadas são majoritariamente de gestão/atenção (GMB errado, avaliações sem resposta) — o conserto é rápido e barato, não exige reformular o produto."},{"category":"ameaca","text":"A reputação no Google é mais mista/negativa que no iFood — queixas de ambiente e comida sem nenhuma resposta do lojista podem se agravar assim que mais gente notar."},{"category":"acao","text":"As 3 primeiras ações prioritárias (corrigir GMB, responder avaliações, ativar WhatsApp Business) custam R$0 e resolvem metade do gap de maturidade digital."}],"refined_in":"ee-revisao-semanal","_refinement_history":[{"ts":"2026-07-20T10:30:00Z","review":"ee-revisao usca ativa de alta intenção, campanha de pesquisa"}],"expected_leads_monthly":280,"expected_cpl":8,"expected_roas":5.5,"delta_leads":"+280 vs 0 hoje","effort_weeks":3,"confidence":"medium","risk_assessment":"Estrutura já validada internamente pelo próprio time via benchmark de concorrentes — o risco principal é operacional (atendimento por telefone ainda inconsistente comprometer a conversão do tráfego pago), não a estrutura de mídia em si."},"scenario_c_aggressive":{"name":"Agressivo — Escala","total_budget_monthly":5000,"google_split":1000,"meta_split":4000,"campaigns_structure":[{"campaign":"Todas as campanhas do Cenário B, com budget dobrado","platform":"Meta + Google","budget_monthly":4600,"objective":"Escala da estrutura validada"},{"campaign":"Conquista de concorrente + cluster de Produto/Categoria (marmita)","platform":"Google","budget_monthly":400,"objective":"Expansão pra categoria mais disputada, só após categorização do iFood"}],"expected_leads_monthly":550,"expected_cpl":9,"expected_roas":4.5,"delta_leads":"+550 vs 0 hoje","effort_weeks":4,"confidence":"low","risk_assessment":"Escalar budget antes de ter 30 dias de dado próprio é arriscado — CPL pode subir por saturação de público dentro do raio de entrega pequeno (3-5km)."},"recommendation":"Cenário B é o ponto de partida ideal: usa quase exatamente a estrutura de campanhas que o próprio time já desenhou com base no benchmark de concorrentes, dentro do range de investimento (R$2.000-5.000/mês) que o Roberto já sinalizou como aceitável. Validar 60-90 dias nesse patamar antes de considerar o Cenário C."},"creative_testing_hypotheses":{"description":"5 hipóteses de teste pra semana 1, inspiradas em padrões que já funcionam pros concorrentes pesquisados (benchmark de mídia paga) — cada uma vira briefing real pra Semana 3 (produção).","hypotheses":[{"id":"H1","hypothesis":"Se usarmos prova social real (print de avaliação do iFood sobreposto numa foto de pizza), então o CTR sobe acima da média do setor (2-3,5%), porque reduz o risco percebido de experimentar um lugar novo — mesma tática que o Qbara já usa com sucesso no benchmark de concorrentes.","angle":"Prova social + tradição","format":"single image","hook":"Print real de avaliação 4,7★ + foto da pizza","body":"36 anos, comida de verdade — veja o que quem já veio tem a dizer","cta":"Peça agora pelo iFood/WhatsApp","target_audience":"Moradores 35-65 anos, raio de 5km","success_criteria":"CTR > 2,5% E CPL < R$8","testing_budget":150,"testing_duration_days":7},{"id":"H2","hypothesis":"Se testarmos vídeo de bastidor (massa sendo feita, forno) no lugar de foto estática, então o custo por resultado cai, porque concorrentes como Big Família e La Braciera já validam esse formato como o de melhor engajamento no benchmark.","angle":"Bastidor / processo","format":"reels","hook":"Mão fazendo a massa + texto '36 anos assim'","body":"Sem pressa, sem receita nova — só tradição","cta":"Saiba mais no link","target_audience":"Público amplo + interesse em pizza/comida italiana","success_criteria":"CPM abaixo do benchmark do setor E CTR > 2%","testing_budget":150,"testing_duration_days":7},{"id":"H3","hypothesis":"Se a copy do anúncio de fim de semana focar no turista/visitante da praia (geolocalização), então a taxa de conversão sobe, porque nenhum concorrente pesquisado está disputando esse público digitalmente hoje (oportunidade já mapeada na SWOT).","angle":"Turista de fim de semana","format":"carousel","hook":"Você não sabia que a Mina Pizza está aqui há 36 anos?","body":"Perto da praia, dentro do Carrefour — sem procurar muito","cta":"Ver cardápio","target_audience":"Geolocalização raio 10km, sexta a domingo","success_criteria":"Conv. LP > 15%","testing_budget":200,"testing_duration_days":7},{"id":"H4","hypothesis":"Se testarmos oferta de entrada tipo 'cupom de primeira compra' (como o Big Família faz, R$10 off), então o custo de aquisição do primeiro pedido cai, porque reduz a fricção de experimentar algo novo.","angle":"Oferta ca de 'todo mundo devia anunciar' — é um levantamento real feito na Meta Ads Library e no Google Ads Transparency Center dos concorrentes diretos e de referência nacional. Enquanto eles disputam ativamente a atenção do mesmo cliente que passa pelo Carrefour ou navega no Instagram, a Mina Pizza depende 100% do fluxo espontâneo.","numbered_reasons":["(1) Big Família — mesmo modelo de negócio da Mina Pizza (almoço + pizza à noite, loja única) — sustenta 63 anúncios ativos no Meta, incluindo ofertas recorrentes (borda recheada grátis toda quarta) e cupom de primeira compra.","(2) Café Com Pizza Santos e Qbara também investem, mesmo com estrutura menor — Qbara usa prova social real (comentário de cliente sobreposto na foto) com apenas 3 anúncios ativos, mostrando que não precisa de budget alto pra competir.","(3) O benchmark nacional (La Braciera, 48 anúncios ativos; Gigantesca, campanha ativa de Display + Google Search) mostra o padrão de maturidade que o setor já opera — a Mina Pizza está competindo digitalmente contra um nível que já é padrão, não experimental."],"discussion_anchor":"A pergunta pro Roberto não é 'devo investir em mídia paga' — ele já respondeu isso na prática ao configurar o Impulso do iFood. A pergunta real é 'por que esse aprendizado ficou preso dentro do iFood, enquanto os concorrentes da mesma região já disputam Meta e Google também?'"},"honesty_alert":"Este é um plano de lançamento, não um diagnóstico de conta ativa — fora do iFood, a Mina Pizza nunca teve investimento estruturado em mídia paga (único teste no Instagram foi R$200 sem pixel/segmentação). Todas as projeções de CPL/CTR/leads são estimativas baseadas em benchmark setorial (Restaurantes/Delivery) e no comparativo de concorrentes, não em dado próprio — ficam marcadas como [E]. Além disso, o GMB errado e o atendimento inconsistente (achados da SWOT/S1) precisam ser corrigidos ANTES do lançamento — investir em tráfego pago pra uma reputação não gerenciada ou pra um WhatsApp que ainda não existe desperdiça o próprio orçamento que este plano defende.","completed_at":"2026-07-18T21:30:00Z"},"ee-s2-diagnostico-organico-ig":{"client_name":"Mina Pizza","summary":"Diagnóstico orgânico de Instagram: @minapizzas está parado desde maio de 2023 (0 posts nos últimos 90 dias, 556 seguidores) enquanto os 2 concorrentes-top da pesquisa de mercado postam ativamente — Império da Pizza (49,5 mil seguidores) quase todo dia, Big Família (10,7 mil) semanalmente. Gap principal: nenhum comentário recebe resposta, nenhuma mecânica de engajamento é usada, e o conteúdo mais recente tem mais de 3 anos.","summary_headline":"@minapizzas não posta desde maio de 2023 — 0 posts em 90 dias — enquanto Império da Pizza (49,5 mil seguidores) posta quase todo dia e Big Família toda semana.","summary_highlights":[{"category":"posicao","label":"Posts nos últimos 90 dias","value":"0","subtext":"Último post real: 25/mai/2023","tone":"red"},{"category":"competicao","label":"Cadência dos concorrentes","value":"Império ~3/sem · Big Família ~1,9/sem","subtext":"Ambos ativos nas últimas 2 semanas","tone":"red"},{"category":"maturidade","label":"Seguidores","value":"556 vs 49,5 mil (Império)","subtext":"89x menos seguidores que o líder digital da praça","tone":"red"},{"category":"oportunidade","label":"Padrão de maior potencial","value":"Conteúdo de bastidor/processo","subtext":"Maior sinal de comentário real nos 3 perfis analisados","tone":"green"},{"category":"risco","label":"Comentários sem resposta","value":"0 de 0 recebidos respondidos","subtext":"Mesmo padrão de silêncio já mapeado na auditoria de S1","tone":"red"}],"summary_key_findings":[{"category":"vantagem","text":"A fotografia de produto tem qualidade aproveitável (mesma leitura do diagnóstico de criativos) — a base visual não é o problema, é a ausência de atividade."},{"category":"contexto","text":"Coleta manual via screenshots (sem acesso à Graph API) — comments_count é contagem real; like_count é estimativa de ordem de grandeza [
