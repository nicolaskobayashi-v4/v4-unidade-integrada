        + (ev.evidencia_diagnostico?.conteudo ? '<p style="font-size:.75rem;margin:.25rem 0"><strong>Evidência '+(ev.evidencia_diagnostico.camada?'('+E(ev.evidencia_diagnostico.camada)+')':'')+':</strong> '+E(ev.evidencia_diagnostico.conteudo)+'</p>' : '')
        + (ev.decisao_atual?.conteudo ? '<p style="font-size:.75rem;margin:.25rem 0"><strong>Decisão atual:</strong> '+E(ev.decisao_atual.conteudo)+'</p>' : '')
        + (ev.impacto_estrategico ? '<p style="font-size:.75rem;margin:.5rem 0;color:var(--accent)"><strong>Impacto:</strong> '+E(ev.impacto_estrategico)+'</p>' : '')
        + (ev.narrativa_sugerida ? '<details style="margin-top:.375rem"><summary style="cursor:pointer;font-size:.6875rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted)">Narrativa sugerida</summary><p style="font-size:.75rem;margin:.375rem 0;color:var(--text-secondary)">'+E(ev.narrativa_sugerida)+'</p></details>' : '')
      )
    ).join(''));
  }

  // 5 Divergências factuais (tabela)
  if (d.divergencias_factuais?.length) {
    const sevColor = {critica:'red', alta:'red', media:'yellow', média:'yellow', baixa:'gray'};
    h += sc('Divergências Factuais ('+d.divergencias_factuais.length+')',
      tb(['ID','Categoria','Campo afetado','Valor atual','Valor recomendado','Severidade'],
        d.divergencias_factuais.map(f => [
          '<span style="font-family:Menlo,monospace;font-size:.7rem;color:var(--accent)">'+E(f.id||'')+'</span>',
          E(f.categoria||'—'),
          '<code style="font-size:.7rem">'+E(f.campo||'—')+'</code>',
          E(f.valor_atual||'—'),
          E(f.valor_recomendado||'—'),
          tg(f.severidade||'—', sevColor[(f.severidade||'').toLowerCase()] || 'gray'),
        ])));
  }

  // 9 Gaps narrativos (cards)
  if (d.gaps_narrativos?.length) {
    h += sc('Gaps Narrativos ('+d.gaps_narrativos.length+')', d.gaps_narrativos.map(g =>
      cd(
        g.tipo || 'gap',
        (g.id ? '<div style="margin-bottom:.5rem">'+tg(g.id, 'yellow')+'</div>' : '')
        + (g.localizacao ? '<p style="font-size:.7rem;color:var(--text-muted);margin:.125rem 0"><strong>Localização:</strong> <code>'+E(g.localizacao)+'</code></p>' : '')
        + (g.descricao ? '<p style="font-size:.75rem;margin:.25rem 0">'+E(g.descricao)+'</p>' : '')
        + (g.ajuste_proposto ? '<p style="font-size:.75rem;margin:.25rem 0;color:var(--text-secondary);background:rgba(22,163,74,0.06);padding:.5rem .625rem;border-left:3px solid var(--success);border-radius:3px"><strong>Ajuste proposto:</strong> '+E(g.ajuste_proposto)+'</p>' : '')
        + (g.arquivo_afetado ? '<p style="font-size:.6875rem;color:var(--text-muted);margin:.125rem 0"><strong>Arquivo:</strong> <code>'+E(g.arquivo_afetado)+'</code></p>' : '')
      )
    ).join(''));
  }

  // 24 Atualizações propostas (tabela com status)
  if (d.atualizacoes_propostas?.length) {
    const decisaoColor = {aceita:'green', aplicada:'green', rejeitada:'red', pendente:'yellow', adiada:'gray'};
    const sevColor = {critica:'red', alta:'red', media:'yellow', média:'yellow', baixa:'gray'};
    const aplicadasCount = d.atualizacoes_propostas.filter(u => u.decisao_operador === 'aceita' || u.decisao_operador === 'aplicada').length;
    const pendenteCount = d.atualizacoes_propostas.filter(u => !u.decisao_operador || u.decisao_operador === 'pendente').length;

    h += sc('Atualizações Propostas ('+d.atualizacoes_propostas.length+')',
      '<div class="gr gr--3" style="margin-bottom:.75rem">'
      + mt(d.atualizacoes_propostas.length, 'Total', 'blue')
      + mt(aplicadasCount, 'Aceitas/aplicadas', aplicadasCount===d.atualizacoes_propostas.length?'green':'yellow')
      + mt(pendenteCount, 'Pendentes', pendenteCount===0?'green':'red')
      + '</div>'
      + tb(['ID','Arquivo','Ação','Valor antigo','Valor novo','Severidade','Decisão'],
        d.atualizacoes_propostas.map(u => [
          '<span style="font-family:Menlo,monospace;font-size:.7rem;color:var(--accent)">'+E(u.id||'')+'</span>',
          '<code style="font-size:.7rem">'+E(u.arquivo||'—')+'</code>',
          E(u.acao||'—'),
          E((u.valor_antigo||'—')).slice(0,90)+(String(u.valor_antigo||'').length>90?'…':''),
          E((u.valor_final_aplicado || u.valor_novo || '—')).slice(0,90)+(String(u.valor_final_aplicado || u.valor_novo || '').length>90?'…':''),
          tg(u.severidade||'—', sevColor[(u.severidade||'').toLowerCase()] || 'gray'),
          tg(u.decisao_operador||'pendente', decisaoColor[(u.decisao_operador||'pendente').toLowerCase()] || 'gray'),
        ])));
  }

  return h;
},

'ee-s5-scripts-sdr'(d) {
  let h = '';
  if (d.summary) h += sm(d.summary);

  // Highlights em cards
  if (d.summary_highlights?.length) {
    h += sc('Visão Geral', '<div class="gr gr--3">'+d.summary_highlights.map(hl=>
      mt(hl.value||'—', hl.label||'', hl.tone||'gray', hl.subtext||'')
    ).join('')+'</div>');
  }

  // Key findings como cards categorizados
  if (d.summary_key_findings?.length) {
    const catColor = {vantagem:'green', contexto:'blue', ameaca:'red', acao:'yellow'};
    const catLabel = {vantagem:'Vantagem', contexto:'Contexto', ameaca:'Atenção', acao:'Ação'};
    h += sc('Achados-Chave', d.summary_key_findings.map(f=>
      cd(catLabel[f.category]||f.category||'Achado', E(f.text), catColor[f.category]||'gray')
    ).join(''));
  }

  // Identidade do agente
  if (d.agent_name || d.tone_of_voice) {
    h += sc('Identidade do Agente', '<div class="gr gr--1">'
      + mt(d.agent_name||'—', 'Nome do Agente', 'blue')
      + (d.tone_of_voice ? '<div class="cd"><div class="cd__title">Tom de Voz</div><div class="cd__body" style="font-size:.8125rem;line-height:1.55">'+E(d.tone_of_voice)+'</div></div>' : '')
      + '</div>');
  }

  // Botão de acesso às diretrizes operacionais completas (system prompt Kommo IA)
  h += '<div style="margin:1rem 0;padding:1rem 1.25rem;background:linear-gradient(135deg,#4B1C7D 0%,#A8358C 100%);border-radius:8px;color:#fff;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.75rem">'
    + '<div style="flex:1;min-width:240px">'
    +   '<div style="font-size:.6875rem;letter-spacing:.15em;text-transform:uppercase;opacity:.75;margin-bottom:.25rem">Documento Operacional</div>'
    +   '<div style="font-size:.9375rem;font-weight:600;line-height:1.35">Diretrizes completas do agente para a Kommo IA</div>'
    +   '<div style="font-size:.75rem;opacity:.85;margin-top:.25rem">System prompt + custom fields + pipeline + triggers + FAQ + exemplos de conversa</div>'
    + '</div>'
    + '<a href="diretrizes-sdr.html" target="_blank" rel="noopener" style="background:#fff;color:#4B1C7D;padding:.625rem 1.125rem;border-radius:6px;font-weight:600;font-size:.8125rem;text-decoration:none;display:inline-flex;align-items:center;gap:.375rem;white-space:nowrap">'
    +   'Abrir diretrizes <span style="font-size:1rem">→</span>'
    + '</a>'
    + '</div>';

  // ESCOPO: o que o agente agenda direto vs handoff humano
  if (d.service_scope) {
    const ss = d.service_scope;
    let scopeHtml = '';
    if (ss.description) scopeHtml += '<p style="font-size:.8125rem;color:var(--text-muted);margin-bottom:.75rem">'+E(ss.description)+'</p>';
    if (ss.direct_booking?.length) {
      scopeHtml += '<h4 style="margin:.75rem 0 .5rem;color:var(--text);font-size:.875rem;display:flex;align-items:center;gap:.5rem">'+tg('Agente agenda direto','green')+'<span>Agendamento direto</span></h4>';
      scopeHtml += ss.direct_booking.map(s=>cd(
        s.service,
        ((s.value||s.duration)?'<div style="margin-bottom:.5rem;display:flex;gap:.375rem;flex-wrap:wrap">'
          +(s.value?tg(s.value,'green'):'')
          +(s.duration?tg(s.duration,'blue'):'')
          +'</div>':'')
        +(s.includes?'<p style="font-size:.8125rem"><strong>Inclui:</strong> '+E(s.includes)+'</p>':'')
        +(s.bia_action?'<p style="font-size:.8125rem;color:var(--text-muted)"><strong>Ação do agente:</strong> '+E(s.bia_action)+'</p>':''),
        'green'
      )).join('');
    }
    if (ss.human_handoff?.length) {
      scopeHtml += '<h4 style="margin:1rem 0 .5rem;color:var(--text);font-size:.875rem;display:flex;align-items:center;gap:.5rem">'+tg('Handoff humano','yellow')+'<span>Direcionamento pra atendimento humano</span></h4>';
      scopeHtml += ss.human_handoff.map(s=>cd(
        s.service,
        (s.bia_action?'<p style="font-size:.8125rem"><strong>Ação do agente:</strong> '+E(s.bia_action)+'</p>':'')
        +(s.reason?'<p style="font-size:.8125rem;color:var(--text-muted)"><strong>Razão:</strong> '+E(s.reason)+'</p>':''),
        'yellow'
      )).join('');
    }
    h += sc('Escopo de Atendimento do Agente', scopeHtml);
  }

  // Mensagem de boas-vindas (escolhida + alternativas)
  if (d.welcome_message) {
    let welcomeHtml = chatBubbles([{from:'sdr',name:d.agent_name||'SDR IA',text:d.welcome_message}]);
    if (d.welcome_alternatives?.length) {
      welcomeHtml += '<div style="margin-top:.75rem">';
      welcomeHtml += '<h4 style="font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);margin:.5rem 0">Alternativas</h4>';
      welcomeHtml += d.welcome_alternatives.filter(a=>a.message!==d.welcome_message).map(a=>
        cd(E(a.approach||'').toUpperCase(), E(a.message), 'gray')
      ).join('');
      welcomeHtml += '</div>';
    }
    h += sc('Mensagem de Boas-Vindas', welcomeHtml);
  }

  // 5 perguntas de qualificação com scoring inline
  if (d.qualification_questions?.length) {
    h += sc('Perguntas de Qualificação (com scoring)', d.qualification_questions.map(q=>{
      let body = '<p style="font-size:.8125rem;margin:.25rem 0"><strong>Revela:</strong> '+E(q.reveals)+'</p>';
      if (q.dimension) body += '<p style="margin:.25rem 0">'+tg(q.dimension,'blue')+'</p>';
      if (q.score_influence) {
        const si = q.score_influence;
        body += '<table class="tw" style="margin-top:.5rem;font-size:.75rem;width:100%"><thead><tr>'
          +'<th style="background:#dcfce7;color:#15803d">+2</th>'
          +'<th style="background:#fef9c3;color:#854d0e">+1</th>'
          +'<th style="background:#f1f5f9;color:#475569">0</th>'
          +'<th style="background:#fee2e2;color:#991b1b">-1</th>'
          +'</tr></thead><tbody><tr>'
          +'<td style="vertical-align:top">'+E(si.plus_2||'—')+'</td>'
          +'<td style="vertical-align:top">'+E(si.plus_1||'—')+'</td>'
          +'<td style="vertical-align:top">'+E(si.zero||'—')+'</td>'
          +'<td style="vertical-align:top">'+E(si.minus_1||'—')+'</td>'
          +'</tr></tbody></table>';
      }
      if (q.transition_phrase) body += '<p style="font-size:.75rem;font-style:italic;color:var(--text-muted);margin-top:.5rem"><strong>Transição:</strong> '+E(q.transition_phrase)+'</p>';
      return cd((q.order?'P'+q.order+'. ':'')+q.question, body);
    }).join(''));
  }

  // CRITÉRIOS QUALITATIVOS por estrela (validados pelo especialista do cliente)
  if (d.qualification_criteria) {
    const qc = d.qualification_criteria;
    let qcHtml = '';
    if (qc.description) qcHtml += '<p style="font-size:.8125rem;color:var(--text-muted);margin-bottom:.75rem">'+E(qc.description)+'</p>';
    const stars = [
      {key:'five_star', stars:'★★★★★'},
      {key:'four_star', stars:'★★★★'},
      {key:'three_star', stars:'★★★'},
      {key:'two_star', stars:'★★'},
      {key:'one_star', stars:'★'},
    ];
    qcHtml += stars.map(s=>{
      const c = qc[s.key]; if (!c) return '';
      let body = '';
      if (c.definition_expert) body += '<p style="font-style:italic;border-left:3px solid var(--accent,#A8358C);padding-left:.625rem;margin:.25rem 0;font-size:.8125rem">"'+E(c.definition_expert)+'" <span style="color:var(--text-muted);font-size:.6875rem">— '+E(c.validated_by||'especialista do cliente')+'</span></p>';
      else if (c.definition) body += '<p style="font-size:.8125rem;margin:.25rem 0">'+E(c.definition)+'</p>';
      if (c.profile) body += '<p style="font-size:.8125rem;margin:.5rem 0"><strong>Perfil:</strong> '+E(c.profile)+'</p>';
      if (c.mandatory_signals?.length) body += '<p style="font-size:.75rem;margin:.5rem 0 .25rem"><strong>Sinais'+(c.min_signals?' (mín. '+c.min_signals+')':'')+':</strong></p><ul style="font-size:.75rem;margin:0;padding-left:1.25rem">'+c.mandatory_signals.map(sig=>'<li>'+E(sig)+'</li>').join('')+'</ul>';
      if (c.canonical_example) body += '<p style="font-size:.75rem;margin:.5rem 0;background:var(--bg-soft,#f8fafc);padding:.5rem;border-radius:4px"><strong>Exemplo canônico:</strong> "'+E(c.canonical_example)+'"</p>';
      if (c.operational_action) body += '<p style="font-size:.75rem;color:var(--text-muted);margin:.25rem 0"><strong>Ação:</strong> '+E(c.operational_action)+'</p>';
      if (c.sla && c.sla !== '—') body += '<p style="margin:.25rem 0">'+tg('SLA: '+c.sla, c.tone||'gray')+'</p>';
      return cd(s.stars+' '+(c.label||s.key), body, c.tone||'gray');
    }).join('');
    if (qc.tiebreaker_rules?.length) {
      qcHtml += '<h4 style="margin-top:1rem;font-size:.875rem;color:var(--text)">Regras de desempate</h4>';
      qcHtml += '<ul style="font-size:.8125rem;margin:.25rem 0;padding-left:1.25rem">'+qc.tiebreaker_rules.map(r=>'<li>'+E(r)+'</li>').join('')+'</ul>';
    }
    h += sc('Critérios de Qualificação do Lead (1-5★)', qcHtml);
  }

  // Tabela de scoring
  if (d.scoring_table) {
    const st = d.scoring_table;
    let stHtml = tb(['Estrela','Faixa de pontos','Ação predominante'],[
      ['★★★★★ 5★', E(st.five_star_range||'—'), E(st.five_star_action||'Handoff imediato para responsável · escala especialista se red flag')],
      ['★★★★ 4★', E(st.four_star_range||'—'), E(st.four_star_action||'Handoff para responsável')],
      ['★★★ 3★', E(st.three_star_range||'—'), E(st.three_star_action||'Agente conduz + régua warm 24h/72h/7d')],
      ['★★ 2★', E(st.two_star_range||'—'), E(st.two_star_action||'Resposta cordial, base passiva e-mail')],
      ['★ 1★', E(st.one_star_range||'—'), E(st.one_star_action||'Posiciona uma vez, descarta, tag AP')],
    ]);
    if (st._rules?.length) {
      stHtml += '<h4 style="margin-top:.75rem;font-size:.8125rem;color:var(--text)">Regras gerais</h4>';
      stHtml += '<ul style="font-size:.8125rem;margin:.25rem 0;padding-left:1.25rem">'+st._rules.map(r=>'<li>'+E(r)+'</li>').join('')+'</ul>';
    }
    h += sc('Sistema de Pontos', stHtml);
  }

  // Anti-persona
  if (d.anti_persona_profiles?.length) {
    h += sc('Anti-persona — Perfis a Desqualificar', d.anti_persona_profiles.map(ap=>{
      let body = '';
      if (ap.signals?.length) body += '<p style="font-size:.75rem;margin:.25rem 0"><strong>Sinais:</strong></p><ul style="font-size:.75rem;margin:0;padding-left:1.25rem">'+ap.signals.map(s=>'<li>'+E(s)+'</li>').join('')+'</ul>';
      if (ap.why_disqualify) body += '<p style="font-size:.75rem;margin:.5rem 0;color:var(--text-muted)"><strong>Por que desqualificar:</strong> '+E(ap.why_disqualify)+'</p>';
      if (ap.bia_response) body += '<div style="margin-top:.5rem">'+chatBubbles([{from:'sdr',name:d.agent_name||'SDR IA',text:ap.bia_response}])+'</div>';
      if (ap.kommo_action) body += '<p style="font-size:.75rem;color:var(--text-muted);margin:.25rem 0"><strong>Kommo:</strong> '+E(ap.kommo_action)+'</p>';
      return cd(E(ap.label||'—'), body, 'red');
    }).join(''));
  }

  // Distribuição alvo
  if (d.distribution_target) {
    const dt = d.distribution_target;
    let dtHtml = '';
    if (dt.description) dtHtml += '<p style="font-size:.8125rem;color:var(--text-muted);margin-bottom:.5rem">'+E(dt.description)+'</p>';
    if (dt.monthly_volume_total) dtHtml += '<p style="font-size:.8125rem;margin:.5rem 0">Volume mensal de referência: <strong>'+E(dt.monthly_volume_total)+' leads</strong></p>';
    if (dt.buckets?.length) {
      dtHtml += tb(['Estrela','% alvo','Volume estimado','Ação predominante'],
        dt.buckets.map(b=>[
          tg(E(b.star||''), b.tone||'gray'),
          E(b.pct)+'%',
          E(b.estimated_volume||'—'),
          E(b.predominant_action||''),
        ]));
    }
    if (dt.imbalance_signals?.length) {
      dtHtml += '<h4 style="margin-top:.75rem;font-size:.8125rem;color:var(--text)">Sinais de desbalanceamento (ajustar mídia)</h4>';
      dtHtml += '<ul style="font-size:.8125rem;margin:.25rem 0;padding-left:1.25rem">'+dt.imbalance_signals.map(s=>'<li>'+E(s)+'</li>').join('')+'</ul>';
    }
    h += sc('Distribuição Alvo de Leads', dtHtml);
  }

  // Score flows (chat bubbles)
  if (d.score_flows) {
    const sf = d.score_flows;
    const renderFlow = (label, flow) => flow ? sc(label,
      chatBubbles((flow.script||[]).map(msg=>({from:'sdr',name:d.agent_name||'SDR IA',text:msg})))
      +(flow.score_range?'<p style="font-size:.75rem;color:var(--text-muted);margin:.25rem 0"><strong>Faixa:</strong> '+E(flow.score_range)+'</p>':'')
      +(flow.next_step?'<p style="font-size:.8125rem;color:var(--text-muted);margin:.25rem 0"><strong>Próximo passo:</strong> '+E(flow.next_step)+'</p>':'')
      +(flow.nurture_action?'<p style="font-size:.8125rem;color:var(--text-muted);margin:.25rem 0"><strong>Nutrição:</strong> '+E(flow.nurture_action)+'</p>':'')
    ) : '';
    h += renderFlow('Fluxo — Lead Qualificado (4-5★)', sf.qualified)
      + renderFlow('Fluxo — Lead Morno (3★)', sf.warm)
      + renderFlow('Fluxo — Lead Frio (1-2★)', sf.cold);
  }

  // Objeções
  if (d.objection_responses?.length) {
    h += sc('Respostas a Objeções', d.objection_responses.map(o=>{
      const typeColor = {price:'red',trust:'yellow',need:'blue',authority:'gray',urgency:'green',competitor:'red'};
      const typeLabel = {price:'Preço',trust:'Confiança',need:'Necessidade',authority:'Autoridade',urgency:'Urgência',competitor:'Concorrente'};
      let body = '';
      if (o.type) body += '<div style="margin-bottom:.5rem">'+tg(typeLabel[o.type]||o.type, typeColor[o.type]||'gray')+'</div>';
      body += chatBubbles([
        {from:'lead',name:'Lead',text:o.objection},
        {from:'sdr',name:d.agent_name||'SDR IA',text:o.response}
      ]);
      if (o.escalation_response) body += '<p style="font-size:.75rem;color:var(--text-muted);margin:.5rem 0 .25rem"><strong>Se insistir:</strong></p>'
        + chatBubbles([{from:'sdr',name:(d.agent_name||'SDR IA')+' (2ª resposta)',text:o.escalation_response}]);
      return cd(o.objection, body);
    }).join(''));
  }

  // Objeção não mapeada
  if (d.unmapped_objection_response) {
    h += sc('Objeção Não Mapeada (resposta padrão)',
      chatBubbles([{from:'sdr',name:d.agent_name||'SDR IA',text:d.unmapped_objection_response}]));
  }

  // Regras de escalonamento
  if (d.escalation_rules) {
    const er = d.escalation_rules;
    const buildRule = (badge, badgeColor, title, text, variant) => cd(
      title,
      '<div style="margin-bottom:.5rem">'+tg(badge, badgeColor)+'</div>'+'<p style="font-size:.8125rem;line-height:1.55;margin:0">'+E(text)+'</p>',
      variant
    );
    const ruleCards = [];
    if (er.on_clinical_red_flag) ruleCards.push(buildRule('RED FLAG','red','Sinal de urgência / risco detectado',er.on_clinical_red_flag,'red'));
    if (er.on_frustration) ruleCards.push(buildRule('IRRITAÇÃO','red','Lead irritado',er.on_frustration,'red'));
    if (er.on_human_request) ruleCards.push(buildRule('PEDIU HUMANO','yellow','Lead solicita atendimento humano',er.on_human_request,'yellow'));
    if (er.after_2_insistences) ruleCards.push(buildRule('2× INSISTÊNCIA','yellow','Lead repete a mesma objeção 2 vezes',er.after_2_insistences,'yellow'));
    if (er.on_non_consultation_service) ruleCards.push(buildRule('OUTRO SERVIÇO','blue','Pediu serviço fora do escopo principal',er.on_non_consultation_service,'blue'));
    h += sc('Regras de Escalonamento', ruleCards.join(''));
  }

  // Follow-ups (mensagens + regras)
  if (d.followup_messages) {
    const f = d.followup_messages;
    let fHtml = chatBubbles([
      ...(f.after_1h?[{from:'sdr',name:'Após 1h',text:f.after_1h}]:[]),
      ...(f.after_24h?[{from:'sdr',name:'Após 24h',text:f.after_24h}]:[]),
      ...(f.after_3d?[{from:'sdr',name:'Após 3 dias',text:f.after_3d}]:[]),
    ]);
    if (f.rules?.length) {
      fHtml += '<h4 style="margin-top:.75rem;font-size:.8125rem;color:var(--text)">Regras da régua</h4>';
      fHtml += '<ul style="font-size:.8125rem;margin:.25rem 0;padding-left:1.25rem">'+f.rules.map(r=>'<li>'+E(r)+'</li>').join('')+'</ul>';
    }
    h += sc('Acompanhamento (Follow-ups)', fHtml);
  }

  // Handoff messages
  if (d.human_handoff_message) {
    const hh = d.human_handoff_message;
    const handoffs = [
      {label:'Lead qualificado → responsável', text:hh.qualified_handoff},
      {label:'Lead pediu humano', text:hh.requested_handoff},
      {label:'Agente não sabe responder', text:hh.limitation_handoff},
      {label:'Serviço fora do escopo', text:hh.non_consultation_service_handoff},
    ].filter(x=>x.text);
    h += sc('Mensagens de Handoff pra Humano', handoffs.map(x=>
      cd(E(x.label), chatBubbles([{from:'sdr',name:d.agent_name||'SDR IA',text:x.text}]))
    ).join(''));
  }

  return h;
},

'ee-s5-sdr-ia-config'(d) {

  if (d.summary_highlights?.length) {
    h += sc('Visão Geral', '<div class="gr gr--3">'+d.summary_highlights.map(hl=>
      mt(hl.value||'—', hl.label||'', hl.tone||'gray', hl.subtext||'')
    ).join('')+'</div>');
  }

  // Key findings categorizados
  if (d.summary_key_findings?.length) {
    const catColor = {vantagem:'green', contexto:'blue', ameaca:'red', acao:'yellow'};
    const catLabel = {vantagem:'Vantagem', contexto:'Contexto', ameaca:'Atenção', acao:'Ação'};
    h += sc('Achados-Chave', d.summary_key_findings.map(f=>
      cd(catLabel[f.category]||f.category||'Achado', E(f.text), catColor[f.category]||'gray')
    ).join(''));
  }

  // BOTÃO DESTACADO PARA AS DIRETRIZES OPERACIONAIS
  h += '<div style="margin:1rem 0;padding:1.25rem 1.5rem;background:linear-gradient(135deg,#4B1C7D 0%,#A8358C 100%);border-radius:8px;color:#fff;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.75rem">'
    + '<div style="flex:1;min-width:240px">'
    +   '<div style="font-size:.6875rem;letter-spacing:.15em;text-transform:uppercase;opacity:.75;margin-bottom:.25rem">📘 Documento Operacional Completo</div>'
    +   '<div style="font-size:1rem;font-weight:600;line-height:1.35">Diretrizes do agente para Kommo IA</div>'
    +   '<div style="font-size:.8125rem;opacity:.9;margin-top:.375rem">System prompt + custom fields + estágios de pipeline + triggers + FAQ + exemplos de conversa por estrela</div>'
    + '</div>'
    + '<a href="diretrizes-sdr.html" target="_blank" rel="noopener" style="background:#fff;color:#4B1C7D;padding:.75rem 1.25rem;border-radius:6px;font-weight:600;font-size:.875rem;text-decoration:none;display:inline-flex;align-items:center;gap:.375rem;white-space:nowrap">'
    +   'Abrir diretrizes <span style="font-size:1.1rem">→</span>'
    + '</a>'
    + '</div>';

  // Header com plataforma + status do agente
  if (d.patagon_config) {
    const p = d.patagon_config;
    const platformLabel = d.platform ? d.platform : 'Kommo IA nativa';
    h += '<div class="gr gr--3">'
      + mt(p.agent_name||'—', 'Agente SDR IA', 'blue')
      + mt('Kommo IA', 'Plataforma', 'blue', platformLabel)
      + (d.overall_test_result?mt(
          d.overall_test_result==='approved'?'Aprovado':d.overall_test_result==='needs_adjustments'?'Ajustes pendentes':'Falhou',
          'Resultado dos Testes',
          {approved:'green',needs_adjustments:'yellow',failed:'red'}[d.overall_test_result]):'')
      + '</div>';
    if (p.agent_description) {
      h += '<div class="cd"><div class="cd__title">Descrição do Agente</div><div class="cd__body" style="font-size:.8125rem;line-height:1.55">'+E(p.agent_description)+'</div></div>';
    }
    if (p.persona_instructions) {
      h += '<div class="cd"><div class="cd__title">Instruções de Persona (system prompt)</div><div class="cd__body" style="font-size:.8125rem;line-height:1.55">'+E(p.persona_instructions)+'</div></div>';
    }
  }

  // CHECKLIST DE CONFIGURAÇÃO (status visual de cada item)
  if (d.configuration_checklist?.length) {
    const cats = {};
    d.configuration_checklist.forEach(item=>{
      if (!cats[item.category]) cats[item.category] = [];
      cats[item.category].push(item);
    });
    const statusIcon = {done:'✅', in_progress:'🔄', pending:'⏳', blocked:'❌'};
    const statusColor = {done:'green', in_progress:'blue', pending:'yellow', blocked:'red'};
    const statusLabel = {done:'Concluído', in_progress:'Em andamento', pending:'Pendente', blocked:'Bloqueado'};
    let checkHtml = '';
    Object.keys(cats).forEach(cat=>{
      checkHtml += '<h4 style="margin:1rem 0 .5rem;font-size:.875rem;color:var(--text)">'+E(cat)+'</h4>';
      checkHtml += '<div style="display:flex;flex-direction:column;gap:.375rem">';
      cats[cat].forEach(item=>{
        const st = item.status||'pending';
        const blockBadge = item.blocking ? tg('BLOQUEANTE','red') : '';
        checkHtml += '<div style="display:flex;align-items:flex-start;gap:.625rem;padding:.625rem;background:var(--surface,#f8fafc);border-radius:6px;border-left:3px solid var(--'+(statusColor[st]==='green'?'success':statusColor[st]==='red'?'danger':statusColor[st]==='yellow'?'warning':'primary')+',#94a3b8)">'
          + '<span style="font-size:1rem;flex-shrink:0">'+statusIcon[st]+'</span>'
          + '<div style="flex:1;min-width:0">'
          +   '<div style="font-size:.8125rem;line-height:1.4">'+E(item.item)+'</div>'
          +   '<div style="font-size:.6875rem;color:var(--text-muted);margin-top:.125rem">Responsável: '+E(item.owner||'—')+' '+blockBadge+' '+tg(statusLabel[st],statusColor[st])+'</div>'
          + '</div>'
          + '</div>';
      });
      checkHtml += '</div>';
    });
    const totalItems = d.configuration_checklist.length;
    const doneCount = d.configuration_checklist.filter(i=>i.status==='done').length;
    const blockingPending = d.configuration_checklist.filter(i=>i.status==='pending' && i.blocking).length;
    let summary = '<div class="gr gr--3" style="margin-bottom:.75rem">'
      + mt(doneCount+'/'+totalItems, 'Concluídos', doneCount===totalItems?'green':'yellow')
      + mt(blockingPending, 'Bloqueantes pendentes', blockingPending===0?'green':'red')
      + mt(d.configuration_checklist.filter(i=>i.status==='pending'&&!i.blocking).length, 'Não-bloqueantes pendentes', 'gray')
      + '</div>';
    h += sc('Checklist de Configuração', summary+checkHtml);
  }

  // Perguntas configuradas
  if (d.patagon_config?.qualification_questions?.length) {
    h += sc('Perguntas Configuradas no Fluxo', d.patagon_config.qualification_questions.map(q=>
      cd('P'+(q.order||'?')+'. '+E(q.question), q.required?tg('Obrigatória','red'):tg('Opcional','gray'))
    ).join(''));
  }

  // Scoring rules
  if (d.patagon_config?.scoring_rules) {
    const sr = d.patagon_config.scoring_rules;
    const stars = [
      {key:'five_star', stars:'★★★★★', tone:'green'},
      {key:'four_star', stars:'★★★★', tone:'green'},
      {key:'three_star', stars:'★★★', tone:'yellow'},
      {key:'two_star', stars:'★★', tone:'gray'},
      {key:'one_star', stars:'★', tone:'red'},
    ];
    h += sc('Regras de Scoring Configuradas', stars.map(s=>{
      const r = sr[s.key]; if (!r) return '';
      return cd(s.stars+' — '+s.key.replace('_',' '),
        '<p style="font-size:.8125rem;margin:.25rem 0"><strong>Critérios:</strong> '+E(r.criteria||'—')+'</p>'
        +'<p style="font-size:.8125rem;margin:.25rem 0;color:var(--text-muted)"><strong>Ação automática:</strong> '+E(r.action||'—')+'</p>',
        s.tone);
    }).join(''));
  }

  // Integração Kommo
  if (d.kommo_integration) {
    const k = d.kommo_integration;
    let kHtml = '<div class="gr gr--3">'
      + mt(k.api_configured?'Conectado':'Pendente', 'API Kommo', k.api_configured?'green':'yellow')
      + mt(E(k.pipeline_name||'—'), 'Pipeline', '')
      + mt((k.field_mapping?.length||0)+' campos', 'Field Mapping', 'blue')
      + '</div>';
    if (k.stage_mapping) {
      const sm = k.stage_mapping;
      kHtml += '<h4 style="margin:1rem 0 .5rem;font-size:.875rem">Mapeamento de Estágios</h4>';
      kHtml += tb(['Score','Estágio do Pipeline'],[
        ['4-5★ qualificado', E(sm.qualified_stage||'—')],
        ['3★ morno', E(sm.nurture_stage||'—')],
        ['1-2★ frio', E(sm.cold_stage||'—')],
      ]);
    }
    if (k.field_mapping?.length) {
      kHtml += '<h4 style="margin:1rem 0 .5rem;font-size:.875rem">Custom Fields a Criar no Kommo ('+k.field_mapping.length+')</h4>';
      kHtml += tb(['Campo (lógico)','Nome no Kommo','Tipo','Custom?'],
        k.field_mapping.map(f=>[
          E(f.patagon_field),
          E(f.kommo_field),
          E(f.field_type),
          f.is_custom_field?tg('Custom','blue'):tg('Nativo','gray')
        ]));
    }
    if (k.auto_tags?.by_score) {
      kHtml += '<h4 style="margin:1rem 0 .5rem;font-size:.875rem">Tags Automáticas por Score</h4>';
      kHtml += tb(['Score','Tags'],
        Object.entries(k.auto_tags.by_score).map(([score,tags])=>[
          E(score),
          (tags||[]).map(t=>tg(t,'blue')).join(' ')
        ]));
    }
    h += sc('Integração Kommo', kHtml);
  }

  // Alertas
  if (d.alerts_config) {
    const a = d.alerts_config;
    let aHtml = '<div class="gr gr--3">'
      + mt(a.sla_minutes?a.sla_minutes+'min':'—', 'SLA Resposta', 'red')
      + mt(E(a.seller_name||'—'), 'Destinatário Principal', '')
      + (a.business_hours?mt(E((a.business_hours.start||'?')+' – '+(a.business_hours.end||'?')), 'Horário', ''):'')
      + '</div>';
    if (a.template) {
      aHtml += '<h4 style="margin:1rem 0 .5rem;font-size:.875rem">Template do Alerta</h4>';
      aHtml += '<pre style="background:var(--surface,#f8fafc);padding:.75rem;border-radius:6px;font-size:.75rem;line-height:1.5;white-space:pre-wrap;font-family:Menlo,Monaco,monospace">'+E(a.template)+'</pre>';
    }
    if (a.trigger_conditions?.length) {
      aHtml += '<h4 style="margin:1rem 0 .5rem;font-size:.875rem">Condições de Disparo</h4>';
      aHtml += '<ul style="font-size:.8125rem;margin:.25rem 0;padding-left:1.25rem">'+a.trigger_conditions.map(t=>'<li>'+E(t)+'</li>').join('')+'</ul>';
    }
    h += sc('Alertas pra Vendedor', aHtml);
  }

  // Resultados dos testes
  if (d.test_results?.length) {
    const sc2 = {pass:'green',fail:'danger',partial:'yellow'};
    const statusLabel2 = {pass:'Passou',partial:'Pendente',fail:'Falhou'};
    h += sc('Resultados dos Testes Simulados',
      tb(['#','Perfil','Score Esperado','Score Real','Kommo','Alerta','Tempo','Status','Observações'],
      d.test_results.map(t=>[
        E(t.lead_number),
        E(t.profile_description||''),
        E(t.expected_score||'—'),
        E(t.score||'—'),
        t.kommo_entry?tg('OK','green'):tg('—','gray'),
        t.alert_sent?tg('OK','green'):tg('—','gray'),
        E(t.response_time||'—'),
        tg(statusLabel2[t.status]||t.status, sc2[t.status]),
        E((t.issues||[]).join(' · '))
      ])));
  }

  // Plano de monitoramento pós go-live
  if (d.go_live?.monitoring_plan?.length) {
    let glHtml = '<div class="gr gr--2">'
      + mt(d.go_live.approved?'Aprovado':'Pendente', 'Aprovação Go-live', d.go_live.approved?'green':'yellow')
      + mt(d.go_live.activated_at||'—', 'Ativação', '')
      + '</div>'
      + '<h4 style="margin:1rem 0 .5rem;font-size:.875rem">Plano de Monitoramento Pós Go-live</h4>'
      + '<ul style="font-size:.8125rem;margin:.25rem 0;padding-left:1.25rem">'+d.go_live.monitoring_plan.map(p=>'<li>'+E(p)+'</li>').join('')+'</ul>';
    h += sc('Go-live e Monitoramento', glHtml);
  }

  // Problemas encontrados (pré-go-live)
  if (d.issues_found?.length) {
    h += sc('Pendências Bloqueantes Antes do Go-live',
      '<ul class="cl">'+d.issues_found.map(i=>'<li><span class="cl__icon cl__icon--blocked">&#10007;</span><span>'+E(i)+'</span></li>').join('')+'</ul>');
  }

  return h;
},

}; // end RENDERERS

// ===== ENGINE =====
function init() {
  const data = PORTAL_DATA;
  if (!data || !data.client) {
    const container = document.getElementById('presSlides');
    if (container) container.innerHTML = '<div class="pres-empty" style="height:100vh"><div class="pres-empty__icon">&#128203;</div><div class="pres-empty__text">Nenhum dado de portal encontrado. Execute render_portal.sh para gerar.</div></div>';
    return;
  }

  const client = data.client;
  const progress = data.progress || {};
  const outputs = data.outputs || {};
  const hasSales = client.modelo_venda ? true : (client.modulo_vendas !== false);
  const escopoVendas = Array.isArray(client.modulo_vendas_escopo) ? client.modulo_vendas_escopo : null;

  document.title = 'Portal V4 | ' + (client.name || 'Cliente') + ' | EE AI Powered';

  // Mapa id→nome amigável: reaproveita os nomes do WEEKS legado + nomes das skills do modelo de venda.
  const SKILL_NAMES = {};
  WEEKS.forEach(w => (w.skills||[]).forEach(s => { SKILL_NAMES[s.id] = s.name; }));
  Object.assign(SKILL_NAMES, {
    'ee-s1-arquitetura-presenca': 'Arquitetura de Presença Digital',
    'ee-s3-ecom-cro': 'Diagnóstico de CRO de E-commerce',
    'ee-s3-ecom-funil': 'Diagnóstico do Funil de E-commerce',
    'ee-s3-ecom-marketplace': 'Diagnóstico de Marketplace',
    'ee-s3-ecom-crm-regua': 'Régua de Relacionamento e CRM',
    'ee-s3-ecom-recuperacao-carrinho': 'Recuperação de Carrinho e Pós-Venda',
    'ee-s3-is-metricas-funil': 'Métricas e Critérios do Funil',
    'ee-s3-is-pipeline': 'Pipeline Comercial + Script Consultivo',
    'ee-s3-pdv-base-ativa': 'Diagnóstico da Base Ativa',
    'ee-s3-pdv-gmn': 'Diagnóstico de GMN',
    'ee-s3-pdv-experiencia': 'Experiência do PDV (Remoto)',
    'ee-s3-pdv-regua-whatsapp': 'Régua de WhatsApp para Loja',
  });

  // Estrutura de semanas: usa a injetada pelo render (model-aware via delivery-map) ou cai no WEEKS legado.
  let activeWeeks;
  if (Array.isArray(data.weeks) && data.weeks.length) {
    activeWeeks = data.weeks
      .map(w => ({ n:w.n, title:w.title, desc:w.desc||'', skills:(w.skills||[]).map(id => ({ id, name: SKILL_NAMES[id] || id })) }))
      .map(w => ({ ...w, skills: w.skills.filter(s => (progress.skills?.[s.id]?.status) !== 'skipped') }))
      .filter(w => w.skills.length > 0);
  } else {
    activeWeeks = WEEKS
      .map(w => (w.sales && escopoVendas) ? { ...w, skills: w.skills.filter(s => escopoVendas.includes(s.id)) } : w)
      .map(w => ({ ...w, skills: w.skills.filter(s => (progress.skills?.[s.id]?.status) !== 'skipped') }))
      .filter(w => (!w.sales || hasSales) && w.skills.length > 0);
  }

  requestAnimationFrame(() => {
    PRES.build(activeWeeks, progress, outputs);
    PRES.enter();
  });
}

function renderSkill(skill, progress, outputs) {
  const st = progress.skills?.[skill.id]?.status || 'pending';
  if (st === 'skipped') return '';
  const data = outputs[skill.id];

  const dots = { completed: 'done', in_progress: 'wip', pending: 'wait' };
  const badges = { completed: ['done','Concluído'], in_progress: ['wip','Em andamento'], pending: ['wait','Pendente'] };
  const [bc, bl] = badges[st] || badges.pending;

  let content = '';
  if (st === 'completed' && data && R[skill.id]) {
    try { content = '<div class="skill__body">' + R[skill.id](data) + '</div>'; }
    catch(e) { content = '<div class="skill__body"><p style="color:var(--danger)">Erro ao renderizar: ' + E(e.message) + '</p></div>'; }
  } else if (st === 'in_progress') {
    content = '<div class="skill__empty">Entrega em desenvolvimento...</div>';
  }

  return '<div class="skill skill--' + st + '">'
    + '<div class="skill__head">'
    +   '<span class="skill__dot skill__dot--' + (dots[st]||'wait') + '"></span>'
    +   '<span class="skill__name">' + E(skill.name) + '</span>'
    +   '<span class="skill__badge skill__badge--' + bc + '">' + E(bl) + '</span>'
    + '</div>'
    + content
    + '</div>';
}

function toggleWeek(n, forceOpen) {
  const body = document.getElementById('body-' + n);
  const chev = document.getElementById('chev-' + n);
  if (!body) return;

  if (body.style.maxHeight && !forceOpen) {
    body.style.maxHeight = null;
    if (chev) chev.classList.remove('week__chev--open');
  } else {
    body.style.maxHeight = body.scrollHeight + 'px';
    if (chev) chev.classList.add('week__chev--open');
  }
}

// ===== PRESENTATION MODE =====
const PRES = {
  slides: [], current: 0, active: false,

  build(weeks, progress, outputs) {
    const container = document.getElementById('presSlides');
    if (!container) return;
    container.innerHTML = '';
    this.slides = [];

    const badges = { completed: ['done','Concluído'], in_progress: ['wip','Em andamento'], pending: ['wait','Pendente'] };

    // ── Slide 0: Resumo Executivo (único slide scrollável) ──
    const allSkills = weeks.flatMap(w => w.skills)
      .filter(s => (progress.skills?.[s.id]?.status) !== 'skipped');
    const completedCount = allSkills.filter(s => (progress.skills?.[s.id]?.status) === 'completed').length;
    const totalCount = allSkills.length;
    const pctTotal = totalCount > 0 ? Math.round(completedCount / totalCount * 100) : 0;

    const summarySlide = document.createElement('div');
    summarySlide.className = 'pres-slide pres-slide--summary';

    const heroDiv = document.createElement('div');
    heroDiv.className = 'pres-summary-hero';
    heroDiv.innerHTML =
      '<div class="pres-summary-client">' + E(PORTAL_DATA.client?.name || 'Cliente') + '</div>'
      + '<p class="pres-summary-subtitle">Estruturação Estratégica com IA</p>'
      + '<div class="pres-summary-stat">'
      +   '<div class="pres-summary-stat-bar"><div class="pres-summary-stat-fill" style="width:' + pctTotal + '%"></div></div>'
      +   '<div class="pres-summary-stat-label">' + completedCount + ' de ' + totalCount + ' entregas &mdash; ' + pctTotal + '% concluído</div>'
      + '</div>'
      + '<button class="pres-summary-cta" onclick="PRES.next()">Ver Entregas &#8594;</button>';

    const weeksGrid = document.createElement('div');
    weeksGrid.className = 'pres-summary-weeks';

    weeks.forEach(week => {
      const done = week.skills.filter(s => (progress.skills?.[s.id]?.status) === 'completed').length;
      const wip  = week.skills.filter(s => (progress.skills?.[s.id]?.status) === 'in_progress').length;
      const pctW = week.skills.length > 0 ? Math.round(done / week.skills.length * 100) : 0;
      const isCurrent = progress.current_week === week.n;
      // Each week contributes 1 intro slide + N skill slides; slide 0 is the executive summary
      const weekFirstIdx = weeks.slice(0, weeks.indexOf(week)).reduce((acc, w) => acc + w.skills.length + 1, 0) + 1;

      const card = document.createElement('div');
      card.className = 'pres-summary-week-card' + (isCurrent ? ' pres-summary-week-card--current' : '');
      card.innerHTML =
        '<div class="pres-summary-week-tag">Semana ' + week.n + '</div>'
        + '<div class="pres-summary-week-title">' + E(week.title) + '</div>'
        + '<div class="pres-summary-week-bar"><div class="pres-summary-week-fill" style="width:' + pctW + '%"></div></div>'
        + '<div class="pres-summary-week-count">' + done + '/' + week.skills.length
        + (wip > 0 ? ' &nbsp;&middot;&nbsp; <span style="color:var(--warning)">' + wip + ' em andamento</span>' : '')
        + '</div>';
      card.onclick = () => PRES.go(weekFirstIdx);
      weeksGrid.appendChild(card);
    });

    // Cards de diagnósticos concluídos
    const diagItems = [];
    weeks.forEach(week => {
      week.skills.forEach(skill => {
        if ((progress.skills?.[skill.id]?.status) !== 'completed') return;
        const data = outputs[skill.id];
        if (!data) return;
        const summaryText = typeof data.summary === 'string' ? data.summary
          : typeof data.executive_summary === 'string' ? data.executive_summary : null;
        if (!summaryText) return;
        diagItems.push({ week, skill, data, summaryText });
      });
    });

    if (diagItems.length > 0) {
      const diagSection = document.createElement('div');
      diagSection.className = 'pres-summary-diag';
      diagSection.innerHTML = '<div class="pres-summary-diag-heading">Resumo dos Diagnósticos</div>';

      const clsMap = { critical:'red', low:'red', medium:'yellow', good:'green', excellent:'green' };

      diagItems.forEach(({ week, skill, data, summaryText }) => {
        const card = document.createElement('div');
        card.className = 'pres-summary-diag-card';

        // Metric block (score or benchmark)
        let metricHtml = '';
        if (data.overall_score != null) {
          const cls = clsMap[data.overall_classification] || 'gray';
          const label = { critical:'Crítico', low:'Baixo', medium:'Médio', good:'Bom', excellent:'Excelente' }[data.overall_classification] || '';
          metricHtml = '<div class="pres-summary-diag-metric">'
            + '<div class="pres-summary-diag-metric-val pres-summary-diag-metric-val--' + cls + '">' + data.overall_score + '</div>'
            + '<div class="pres-summary-diag-metric-lbl">' + (label || '/100') + '</div>'
            + '</div>';
        } else if (data.score != null) {
          metricHtml = '<div class="pres-summary-diag-metric">'
            + '<div class="pres-summary-diag-metric-val">' + data.score + '</div>'
            + '<div class="pres-summary-diag-metric-lbl">Score</div>'
            + '</div>';
        }

        card.innerHTML =
          '<div class="pres-summary-diag-tag">Semana ' + week.n + ' &mdash; ' + E(week.title) + '</div>'
          + '<div class="pres-summary-diag-name">' + E(skill.name) + '</div>'
          + '<div class="pres-summary-diag-text">' + E(summaryText) + '</div>'
          + metricHtml;

        diagSection.appendChild(card);
      });

      summarySlide.appendChild(heroDiv);
      summarySlide.appendChild(weeksGrid);
      summarySlide.appendChild(diagSection);
    } else {
      summarySlide.appendChild(heroDiv);
      summarySlide.appendChild(weeksGrid);
    }

    container.appendChild(summarySlide);
    this.slides.push({ el: summarySlide, n: 0, title: 'Resumo', skillName: 'Resumo Executivo', isSummary: true });

    // ── Slides 1..N: intro de cada semana + skills + conclusão ──
    weeks.forEach((week, wi) => {
      // Intro slide da semana: na semana 1 mostra só "A seguir"; nas demais, "Já concluímos" + "A seguir"
      const priorWeeks = weeks.slice(0, wi);
      const introEl = document.createElement('div');
      introEl.className = 'pres-slide pres-slide--transition';

      let introHtml = '<div class="pres-trans-inner">';

      if (priorWeeks.length > 0) {
        introHtml +=
          '<div>'
          + '<div class="pres-trans-label">Já concluímos</div>'
          + '<div class="pres-trans-heading">Entregas anteriores</div>'
          + '<ul class="pres-trans-list">'
          + priorWeeks.map(pw =>
              pw.skills.map(s => {
                const pst = (progress.skills?.[s.id]?.status) || 'pending';
                const pdone = pst === 'completed';
                return '<li class="pres-trans-item pres-trans-item--' + (pdone ? 'done' : 'pending') + '">'
                  + '<span class="pres-trans-icon pres-trans-icon--' + (pdone ? 'done' : 'pending') + '">' + (pdone ? '&#10003;' : '&#9675;') + '</span>'
                  + E(s.name)
                  + ' <span style="opacity:.6;font-size:.75rem;margin-left:.25rem">&middot; S' + pw.n + '</span>'
                  + '</li>';
              }).join('')
            ).join('')
          + '</ul>'
          + '</div>'
          + '<div class="pres-trans-divider"></div>';
      }

      introHtml +=
        '<div>'
        + '<div class="pres-trans-label">A seguir &middot; Semana ' + week.n + '</div>'
        + '<div class="pres-trans-heading">' + E(week.title) + '</div>'
        + '<ul class="pres-trans-list">'
        + week.skills.map(s =>
            '<li class="pres-trans-item">'
            + '<span class="pres-trans-icon pres-trans-icon--next">&#8594;</span>'
            + E(s.name) + '</li>'
          ).join('')
        + '</ul>'
        + '</div>'
        + '</div>';

      introEl.innerHTML = introHtml;
      container.appendChild(introEl);
      this.slides.push({ el: introEl, n: week.n, title: week.title, skillName: 'Abertura da Semana', isTransition: true });

      week.skills.forEach(skill => {
        const st = (progress.skills?.[skill.id]?.status) || 'pending';
        const data = outputs[skill.id];
        const [bc, bl] = badges[st] || badges.pending;

        const slide = document.createElement('div');
        slide.className = 'pres-slide';

        // Inner wrapper (flex column, fills slide)
        const inner = document.createElement('div');
        inner.className = 'pres-slide-inner';

        // Fixed header
        const header = document.createElement('div');
        header.className = 'pres-slide-header';
        const headerInner = document.createElement('div');
        headerInner.className = 'pres-slide-header-inner';
        headerInner.innerHTML =
          '<div class="pres-slide-breadcrumb">Semana ' + week.n + ' &mdash; ' + E(week.title) + '</div>'
          + '<div class="pres-skill-head">'
          +   '<span class="pres-skill-name">' + E(skill.name) + '</span>'
          +   '<span class="skill__badge skill__badge--' + bc + '">' + E(bl) + '</span>'
          + '</div>';
        header.appendChild(headerInner);

        // Scrollable content area (bounded to viewport)
        const contentWrap = document.createElement('div');
        contentWrap.className = 'pres-slide-content';
        const contentInner = document.createElement('div');
        contentInner.className = 'pres-slide-content-inner';

        if (st === 'completed' && data && R[skill.id]) {
          try { contentInner.innerHTML = R[skill.id](data); }
          catch(e) { contentInner.innerHTML = '<p style="color:var(--danger)">Erro ao renderizar: ' + E(e.message) + '</p>'; }
        } else if (st === 'in_progress') {
          contentInner.innerHTML = '<div class="pres-empty"><div class="pres-empty__icon">&#9203;</div><div class="pres-empty__text">Entrega em desenvolvimento...</div></div>';
        } else {
          contentInner.innerHTML = '<div class="pres-empty"><div class="pres-empty__icon">&#128203;</div><div class="pres-empty__text">Esta entrega ainda não foi iniciada.</div></div>';
        }

        contentWrap.appendChild(contentInner);
        inner.appendChild(header);
        inner.appendChild(contentWrap);
        slide.appendChild(inner);
        container.appendChild(slide);

        this.slides.push({ el: slide, n: week.n, title: week.title, skillName: skill.name });
      });

      // ── Slide final de conclusão (apenas na última semana) ──
      const isLast = wi === weeks.length - 1;
      if (isLast) {
        const finalEl = document.createElement('div');
        finalEl.className = 'pres-slide pres-slide--final';
        finalEl.innerHTML =
          '<div class="pres-final-inner">'
          + '<div class="pres-final-badge">Estruturação Estratégica com IA</div>'
          + '<div class="pres-final-congrats">Parabéns!</div>'
          + '<div class="pres-final-sub">Você encerrou a</div>'
          + '<div class="pres-final-title">Estruturação Estratégica</div>'
          + '<div class="pres-final-powered">AI Powered</div>'
          + '<div class="pres-final-vaas">Está pronto para atuar no modelo <strong>VAAS</strong></div>'
          + '</div>';
        container.appendChild(finalEl);
        this.slides.push({ el: finalEl, n: week.n, title: 'Fim', skillName: 'Conclusão', isFinal: true });
      }
    });

    this._updateUI();
  },

  enter() {
    if (!this.slides.length) return;
    this.active = true;
    this.current = 0;
    this.slides.forEach(s => s.el.classList.remove('pres-slide--active', 'pres-slide--prev'));
    this.slides[0].el.classList.add('pres-slide--active');
    this._updateUI();
  },

  exit() {
    this.go(0);
  },

  go(n) {
    const total = this.slides.length;
    if (n < 0 || n >= total || n === this.current) return;
    const forward = n > this.current;
    const oldEl = this.slides[this.current].el;
    const newEl = this.slides[n].el;

    oldEl.classList.remove('pres-slide--active');
    oldEl.classList.toggle('pres-slide--prev', forward);

    newEl.classList.remove('pres-slide--prev');
    newEl.classList.add('pres-slide--active');
    newEl.scrollTop = 0;

    this.current = n;
    this._updateUI();
  },

  next() { this.go(this.current + 1); },
  prev() { this.go(this.current - 1); },

  _updateUI() {
    const n = this.current, total = this.slides.length;
    const info = document.getElementById('presInfo');
    if (info) {
      const s = this.slides[n];
      info.textContent = s?.isSummary ? 'Resumo Executivo' : (n) + ' / ' + (total - 1);
    }
    const prevBtn = document.getElementById('presPrev');
    const nextBtn = document.getElementById('presNext');
    if (prevBtn) prevBtn.disabled = n === 0;
    if (nextBtn) nextBtn.disabled = n === total - 1;
    const dotsEl = document.getElementById('presDots');
    if (dotsEl) {
      const parts = [];
      // Dot 0: resumo executivo
      parts.push('<button class="pres-dot pres-dot--summary' + (n === 0 ? ' pres-dot--active' : '') + '" onclick="PRES.go(0)" title="Resumo Executivo"></button>');
      // Separator
      parts.push('<span style="width:8px;display:inline-block"></span>');
      // One dot per week
      const seen = new Set();
      const currentWeekN = this.slides[n]?.n;
      this.slides.forEach((s, i) => {
        if (s.isSummary || seen.has(s.n)) return;
        seen.add(s.n);
        const active = !this.slides[n]?.isSummary && s.n === currentWeekN;
        parts.push('<button class="pres-dot' + (active ? ' pres-dot--active' : '') + '" onclick="PRES.go(' + i + ')" title="Semana ' + s.n + '"></button>');
      });
      dotsEl.innerHTML = parts.join('');
    }
  }
};

document.addEventListener('keydown', function(e) {
  if (!PRES.active) return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') { e.preventDefault(); PRES.next(); }
  else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); PRES.prev(); }
});


document.addEventListener('DOMContentLoaded', init);

// ============================================================================
// Password Gate handler
// ============================================================================
(function(){
  var HASH = 'd144ea9265eff61e5d02b5da46d694f5f922474366734e53db7b4698c7fc954c';
  var KEY  = 'v4-portal-auth';

  async function sha256(text) {
    var buf = new TextEncoder().encode(text);
    var digest = await crypto.subtle.digest('SHA-256', buf);
    return Array.from(new Uint8Array(digest)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
  }

  function unlock() {
    document.body.classList.remove('gate-locked');
    try { sessionStorage.setItem(KEY, HASH); } catch(e) {}
  }

  document.addEventListener('DOMContentLoaded', function(){
    var logo = document.getElementById('gateLogo');
    var fav = document.querySelector('link[rel="icon"]');
    if (logo && fav) logo.src = fav.href;

    var logoutBtn = document.getElementById('logoutBtn');
    if (logoutBtn) {
      logoutBtn.addEventListener('click', function(){
        try { sessionStorage.removeItem(KEY); } catch(e) {}
        location.reload();
      });
    }

    var form = document.getElementById('gateForm');
    if (!form) return;
    if (!document.body.classList.contains('gate-locked')) return;

    var input = document.getElementById('gateInput');
    var error = document.getElementById('gateError');
    var btn = form.querySelector('.gate__btn');
    var card = form.closest('.gate__card');

    form.addEventListener('submit', async function(e){
      e.preventDefault();
      error.textContent = '';
      btn.disabled = true;
      try {
        var hash = await sha256(input.value);
        if (hash === HASH) {
          unlock();
        } else {
          error.textContent = 'Senha incorreta.';
          card.classList.remove('gate__card--shake');
          void card.offsetWidth;
          card.classList.add('gate__card--shake');
          input.value = '';
          input.focus();
        }
      } catch(err) {
        error.textContent = 'Erro ao validar. Tente novamente.';
      } finally {
        btn.disabled = false;
      }
    });
  });
})();
