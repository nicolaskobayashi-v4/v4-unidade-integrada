icing":"R$19,20-33,00 por marmita (observado)","digital_score":6}],"competitive_map":{"axis_x":"Maturidade digital (baixa → alta)","axis_y":"Porte/escala (loja única, local → múltiplas unidades/regional)","positions":[{"name":"Mina Pizza (hoje)","quadrant":"Loja única, digital baixíssimo — canto inferior esquerdo"},{"name":"Big Família / Marmita Fit Fat","quadrant":"Loja única, digital médio-alto"},{"name":"Café Com Pizza de Santos / Caseirinha da Mãe / O Marmiteiro / Alecrim","quadrant":"Operação madura em delivery, digital alto, mas dependente de plataforma única (sem site/Instagram identificado)"},{"name":"Império da Pizza","quadrant":"Múltiplas unidades, digital alto e diversificado — canto superior direito"},{"name":"Mina Pizza (posição sugerida pós-programa)","quadrant":"Loja única, digital alto, com narrativa de tradição de 36 anos que nenhum concorrente desse quadrante comunica"}],"empty_spaces":"Nenhum concorrente pesquisado — pizza ou marmita — combina tradição de décadas com maturidade digital alta. No segmento de marmita especificamente, todos os líderes (Caseirinha da Mãe, O Marmiteiro, Alecrim) são operações 'nascidas no iFood', sem contar história de tradição — abrindo espaço pra Mina Pizza se posicionar como 'a marmita/pizza de quem já é da região há 36 anos', algo que nenhum grande player de marmita comunica.","crowded_spaces":"Marmita/comida caseira via iFood é o quadrante mais disputado de toda a pesquisa — 4+ concorrentes com centenas/milhares de avaliações competem pelo mesmo termo de busca ('Marmita'). A Mina Pizza hoje nem aparece nessa busca, porque seu cardápio não está categorizado como marmita."},"trends":[{"trend":"WhatsApp Business consolidado como ferramenta essencial pra restaurantes reduzirem dependência de comissão de apps de delivery em 2026","evidence":"SocialHub (2026): 'Em 2026, o WhatsApp Business é a ferramenta essencial para restaurantes e delivery que buscam maximizar lucros... sem pagar comissões abusivas de aplicativos'"},{"trend":"Decisão de onde comer cada vez mais baseada em avaliações do Google — mais de 60% dos consumidores em 2025 escolheram restaurante com base nisso","evidence":"Pesquisa citada por SocialHub/Colinatech (2025): 'mais de 60% das pessoas escolheram onde comer com base em avaliações no Google'"},{"trend":"Mercado de pizzarias delivery no Brasil em expansão estrutural, crescendo 10,29% ao ano","evidence":"Apubra (2025): 40.332 estabelecimentos ativos, crescimento de 10,29% em 2025, consumo de 1,3 milhão de pizzas/dia no país"},{"trend":"Mercado de marmitex/prato feito é um dos que mais cresceu no Brasil na última década, com preços subindo acima da inflação em 2025","evidence":"Crescimento de ~134% em 5 anos (pós-pandemia); preço médio do marmitex grande subiu 11% (R$23,70→R$26,31) e do prato feito 7,69% (R$26,50→R$31,19) entre 2024 e 2025"}],"threats":[{"threat":"Comissões de plataformas de delivery (iFood) consomem até 26,5% do valor de cada pedido (12-23% de comissão + 3,2-3,5% de taxa de pagamento)","potential_impact":"Se a dependência do iFood crescer sem um canal próprio robusto (WhatsApp, site) pra equilibrar, a margem da Mina Pizza no delivery fica cada vez mais espremida — especialmente considerando que o CMV já está em 30-35%"},{"threat":"O segmento de marmita/comida caseira na região já tem 4+ concorrentes estabelecidos com centenas/milhares de avaliações no iFood, otimizados especificamente pra esse termo de busca","potential_impact":"Enquanto a Mina Pizza corrige o básico de comunicação, esses concorrentes continuam capturando 100% da demanda de quem busca 'Marmita' no app — a Mina Pizza nem entra na disputa hoje, porque seu cardápio não está categorizado assim"}],"unexploited_opportunity":{"description":"Ocupar o território 'A pizzaria (e marmitaria) de bairro mais tradicional da praça — 36 anos, redescoberta.' Nenhum concorrente pesquisado, em pizza ou marmita, combina tradição de décadas com execução digital madura.","why_nobody_does_it":"(1) Os concorrentes com tradição comparável (Bella Romanesca em pizza) não têm a localização de tráfego cativo dentro de um hipermercado que a Mina Pizza tem. (2) Os líderes de marmita (Caseirinha da Mãe, O Marmiteiro, Alecrim) são operações 'nascidas no iFood', otimizadas pra delivery mas sem nenhuma história de tradição pra contar. (3) A própria Mina Pizza nunca comunicou essa tradição digitalmente — a bio do Instagram nem menciona os 34-36 anos de forma central, o GMB nem estava sendo gerido, e o cardápio do iFood não está nem categorizado como 'marmita'.","feasibility":"alta"},"market_jtbd":{"current_solutions":"A maioria resolve a fome/ocasião de pizza ou marmita pedindo pelo iFood (delivery já responde por mais de 60% das vendas do segmento de pizza no Brasil, segundo a Apubra) ou ligando/indo direto numa pizzaria/marmitaria de bairro de confiança","alternatives":[{"type":"direct","description":"Outras pizzarias e marmitarias de São Vicente/Baixada Santista (Café Com Pizza de Santos, Império da Pizza, Big Família, Caseirinha da Mãe, O Marmiteiro, Alecrim, Marmitaria Fit Fat)"},{"type":"indirect","description":"Outros restaurantes da mesma praça de alimentação (ex: o restaurante de frango frito vizinho) ou lanchonetes da região"},{"type":"diy","description":"Cozinhar em casa ou comprar pizza/marmita congelada no mercado"},{"type":"inaction","description":"Não comer pizza/prato feito naquele momento — comer algo já disponível em casa"}],"cost_of_inaction":"Se a Mina Pizza não corrigir sua presença digital nem categorizar corretamente seu cardápio, continua invisível justamente nas buscas onde a concorrência (pizza e principalmente marmita) já é forte e crescente — esse espaço pode ser capturado por concorrentes mais preparados digitalmente, não pela Mina Pizza"},"real_differentials":[{"differential":"36 anos de tradição no mesmo bairro — mais longo que a maioria dos concorrentes pesquisados em pizza e todos os líderes de marmita (que são operações recentes, nascidas no iFood)","status":"confirmed","icp_relevance":"É exatamente o que sustenta a persona Marlene (cliente fiel de décadas) — tradição é o pilar emocional do ICP principal","action_needed":null},{"differential":"Localização dentro de uma praça de alimentação de hipermercado (Carrefour), com tráfego cativo e estacionamento — nenhum concorrente pesquisado tem esse tipo de localização","status":"confirmed","icp_relevance":"Facilita a conveniência que sustenta o job funcional da persona (resolver fome rápido, sem sair do lugar onde já está fazendo compras)","action_needed":null},{"differential":"Pastel feito na hora, bem recheado — produto de nicho elogiado nas avaliações, com concorrência local muito menor (12-69 avaliações) que pizza ou marmita","status":"confirmed","icp_relevance":"Diferencial de produto já validado por clientes reais, pode virar carro-chefe de comunicação de baixo esforço competitivo","action_needed":null},{"differential":"Canal de pedido próprio (delivery via Neemo) — reduz dependência de comissão do iFood, como o Big Família já faz com site próprio","status":"potential","icp_relevance":"Reduz custo de aquisição no médio prazo e captura dados do cliente que hoje ficam só com o iFood","action_needed":"Auditar/ativar/divulgar o canal Neemo, seguindo o quick win já mapeado na auditoria de comunicação"},{"differential":"Presença digital no nível do Big Família (mesmo modelo de negócio, execução muito mais madura)","status":"aspirational","icp_relevance":"Prova que o modelo híbrido almoço+pizza da Mina Pizza é escalável digitalmente quando bem executado","action_needed":"Executar os quick wins da auditoria de comunicação (GMB, WhatsApp, Instagram) e o posicionamento da Semana 2"},{"differential":"Cardápio do iFood categorizado corretamente como 'Marmita'/'Quentinha', não só por nome de prato ('Filé à Parmegiana')","status":"potential","icp_relevance":"Afeta diretamente a descoberta pela persona secundária Jailson (trabalhador que busca almoço rápido por proximidade) e por qualquer cliente novo que procure 'marmita' em vez do nome da loja — hoje a Mina Pizza provavelmente nem aparece nessa busca, onde 4+ concorrentes fortes competem","action_needed":"Adicionar categoria/itens nomeados 'Marmita' ou 'Quentinha' no cardápio do iFood — ação de baixo esforço, alto potencial de descoberta imediata"}],"honesty_alert":"Esta pesquisa combina 3 níveis de confiança diferentes por produto: pizza tem fonte setorial sólida (Apubra) e foi validada com dados reais de busca no iFood — confiança alta. Prato feito/marmita foi recalibrado com evidência real (prints de busca fornecidos pelo operador) mas ainda usa proxy de mercado nacional, sem associação equivalente à Apubra — confiança média. Pastel usa estimativa bottom-up com poucos dados de mercado, mas a competição local pesquisada é baixa (concorrentes com 12-69 avaliações), então o risco prático de erro é menor — confiança baixa mas de baixo impacto. Não fizemos análise aprofundada de concorrentes de pastelaria, já que o próprio Roberto validou que o produto é pouco significativo pro faturamento (~6%, também estimado). Achado acionável que vale destacar separadamente da estratégia de médio prazo: o cardápio da Mina Pizza no iFood não está categorizado como 'marmita', o que provavelmente a torna invisível pra essa busca específica onde a concorrência é mais forte — isso é uma correção rápida e de baixo esforço, não um problema estrutural.","summary_headline":"SOM combinado (pizza + marmita + pastel) é R$2,95M/ano — quase igual à meta da V4, mas a Mina Pizza nem aparece quando alguém busca 'Marmita' no iFood, onde 4 concorrentes já têm de 134 a 3.702 avaliações.","summary_highlights":[{"category":"posicao","label":"Participação atual no SAM combinado","value":"0,99%","subtext":"R$1,72M de R$173,5M/ano (pizza+marmita+pastel)","tone":"red"},{"category":"oportunidade","label":"SOM combinado","value":"R$2,95M/ano","subtext":"Quase igual à meta fechada com a V4 (R$2,4-3M)","tone":"yellow"},{"category":"competicao","label":"Maior concorrente da pesquisa","value":"Caseirinha da Mãe — 3.702 avaliações","subtext":"vs. 47 da Mina Pizza no iFood","tone":"red"},{"category":"risco","label":"Gap de categorização","value":"Mina Pizza não aparece em 'Marmita'","subtext":"Cardápio nomeado por prato, não por categoria","tone":"red"},{"category":"janela","label":"Território ainda vazio","value":"Tradição + digital maduro","subtext":"Nenhum líder de marmita comunica história de décadas","tone":"green"}],"summary_key_findings":[{"category":"vantagem","text":"36 anos de tradição segue sendo um diferencial que nenhum líder de marmita (todos 'nascidos no iFood') ou a maioria dos de pizza conseguem replicar."},{"category":"contexto","text":"O SOM combinado recalibrado (R$2,95M/ano) ficou quase idêntico à meta que a V4 fechou (R$2,4-3M) — a meta não tem folga, está no teto realista, especialmente porque o segmento de marmita é muito mais disputado que o de pizza."},{"category":"ameaca","text":"O mercado de marmita local tem pelo menos 4 concorrentes com centenas/milhares de avaliações no iFood — a Mina Pizza, com 47, está numa posição de desvantagem competitiva real e imediata nesse segmento específico."},{"category":"acao","text":"Categorizar o cardápio do iFood com o termo 'Marmita'/'Quentinha' é uma ação de baixíssimo esforço que pode destravar descoberta num mercado onde a loja hoje é invisível pra essa busca específica."}]},"ee-s2-posicionamento":{"client_name":"Mina Pizza","summary":"Posicionamento da Mina Pizza: PUV ancorada em 36 anos no mesmo local do Carrefour de São Vicente, ocupando o território 'Resistência + Bairro + Redescoberta' — único cruzamento de tradição e potencial digital maduro entre os concorrentes pesquisados. Tagline recomendada: 'Comida de verdade, no mesmo lugar de sempre.'","summary_headline":"Mina Pizza pode ocupar 'Tradição Redescoberta' — território vago entre os concorrentes pesquisados, mas a janela fecha se o atendimento não for corrigido antes de comunicar.","summary_highlights":[{"category":"posicao","label":"Território escolhido","value":"Resistência + Bairro + Redescoberta","subtext":"36 anos no mesmo lugar do Carrefour","tone":"blue"},{"category":"competicao","label":"Território do líder digital","value":"Império da Pizza: Escala + Realeza","subtext":"43K seguidores, sem narrativa de tradição","tone":"gray"},{"category":"janela","label":"Tempo até concorrência ocupar","value":"12-18 meses estimado","subtext":"Império/Big Família têm budget pra copiar a narrativa","tone":"yellow"},{"category":"oportunidade","label":"ICP principal + ticket","value":"Marlene, 45+, R$30-58/pedido","subtext":"Cliente fiel de décadas, não turista novo","tone":"green"},{"category":"risco","label":"Pior cenário","value":"Comunicar tradição sem corrigir atendimento","subtext":"Amplifica percepção de queda de qualidade","tone":"red"}],"summary_key_findings":[{"category":"vantagem","text":"36 anos no mesmo lugar, com clientes que citam décadas de relação nas próprias avaliações, é prova concreta que nenhum concorrente pesquisado consegue replicar rápido."},{"category":"contexto","text":"Nenhum concorrente de pizza ou marmita pesquisado combina tradição de décadas com execução digital madura — é a única combinação vaga identificada na pesquisa de mercado da Semana 2."},{"category":"ameaca","text":"Atendimento ríspido e inconsistência no prato do dia são a razão nº1 de churn segundo as próprias avaliações — comunicar tradição sem corrigir isso primeiro arrisca amplificar a queda de confiança em vez de reverter."},{"category":"acao","text":"A mensagem funcional 'Comida de verdade' (já validada na Semana 1) segue como base até os quick wins operacionais (GMB, avaliações, WhatsApp) da SWOT serem executados — só depois liberar a mensagem emocional mais forte."}],"positioning_map":{"axis_x":"Digital baixo → Digital maduro","axis_y":"Tradição recente → Tradição décadas","client_position":"NE","justification":"A Mina Pizza está migrando do quadrante NO (tradição alta, digital baixíssimo — onde está hoje de fato) para ocupar o NE (tradição alta + digital maduro) — o único cruzamento identificado na pesquisa de mercado (Semana 2) onde nenhum concorrente pesquisado, em pizza ou marmita, está presente. Império da Pizza, Big Família e os líderes de marmita ocupam o SE (digital maduro, mas tradição recente ou inexistente).","competitor_positions":[{"name":"Império da Pizza","quadrant":"SE"},{"name":"Big Família","quadrant":"SE"},{"name":"Caseirinha da Mãe / O Marmiteiro / Alecrim","quadrant":"SE"}]},"positioning_statements":[{"label":"A Tradição Local","statement":"Para clientes que já conhecem o Carrefour de São Vicente, a Mina Pizza é a pizzaria e marmitaria de bairro que está no mesmo lugar há 36 anos, porque gerações inteiras de moradores já cresceram pedindo daqui.","justification":"Reforça a base fiel existente (Marlene) com o diferencial mais defensável — tempo de casa real, comprovado pelas próprias avaliações que citam décadas de relação.","bet":"Prioriza retenção e prova social sobre aquisição agressiva de público novo.","risk":"Pode soar 'parado no tempo' se a comunicação não mostrar também presença digital viva."},{"label":"A Redescoberta","statement":"Para moradores de São Vicente e visitantes de fim de semana da Baixada Santista, a Mina Pizza é a pizzaria (e marmitaria) mais tradicional da praça de alimentação do Carrefour, porque está no mesmo lugar há 36 anos, com clientes que já pedem daqui há mais de três décadas.","justification":"Ocupa diretamente o único território vago identificado na pesquisa de mercado — tradição de décadas + potencial digital maduro — usando prova social real (avaliações que citam '35 anos frequentando') como evidência. Serve tanto a retenção (Marlene reconhece a história) quanto a aquisição (turista descobre algo que já existia).","bet":"Aposta em contar a história de tradição de forma ativa pela primeira vez, via canais digitais que hoje estão praticamente mudos.","risk":"Exige execução rápida e consistente (GMB, Instagram, avaliações) pra não virar discurso vazio — se a presença digital continuar fraca, a promessa de 'redescoberta' não se sustenta."},{"label":"O Point Prático do Carrefour","statement":"Para quem está com fome dentro ou perto do Carrefour de São Vicente, a Mina Pizza é o point rápido e de confiança pra resolver a refeição sem crise, porque já faz parte da rotina de quem mora ou trabalha ali há décadas.","justification":"Foca no job funcional mais imediato (resolver fome rápido) e serve bem o segmento secundário Jailson (trabalhador, baixa lealdade, decide por conveniência).","bet":"Prioriza conversão rápida e conveniência sobre construção de marca diferenciada.","risk":"É o território mais genérico dos três — qualquer concorrente de praça de alimentação pode reivindicar 'rápido e prático', reduzindo a defensabilidade a médio prazo."}],"chosen_statement":"Para moradores de São Vicente e visitantes de fim de semana da Baixada Santista, a Mina Pizza é a pizzaria (e marmitaria) mais tradicional da praça de alimentação do Carrefour, porque está no mesmo lugar há 36 anos, com clientes que já pedem daqui há mais de três décadas.","puv":"A Mina Pizza serve o mesmo point do Carrefour de São Vicente há 36 anos — o tipo de lugar que cliente já frequenta há décadas e recomenda sem pensar duas vezes.","bio_slogan":{"recommended":"36 anos. Comida de verdade.","alternative":"O point de sempre, há 36 anos.","justification":"Versão curta pra bio do Instagram e assinatura — reaproveita o número (prova concreta) e a mensagem-chave 'Comida de verdade' já validada na Semana 1, sem repetir a PUV completa."},"canvas_4p":{"product":{"delivers":"Não vendemos só pizza, marmita ou pastel — vendemos o point de confiança de quem já não precisa decidir onde comer perto do Carrefour, porque a resposta já existe há 36 anos.","transformation":"ANTES: cliente com fome no meio das compras do Carrefour, sem querer arriscar em lugar novo ou repetir má experiência recente. DEPOIS: pede de um lugar que ele (ou a região) já confia há décadas, com comida consistente e atendimento que reconhece quem ele é.","doesnt_deliver":"Não somos um restaurante de ambiente silencioso e sofisticado — somos PDV de praça de alimentação, rápido e sem luxo. E não vamos prometer 'do jeito que você lembra' até corrigir o atendimento por telefone e a consistência do prato do dia — isso vem antes de qualquer promessa emocional."},"price":{"positioning":"mid-market","justification":"Preço alinhado ao bairro e ao público fiel — não é o preço que afasta hoje (elasticidade baixa no cliente fiel), é a percepção de queda de qualidade sem contrapartida. Comunicar preço só depois de garantir consistência, nunca isolado.","anchoring":"Ancorar pelo tempo de casa, não pelo desconto: '36 anos cobrando o preço justo de sempre' em vez de comparação direta com concorrente."},"place":{"main_channel":"iFood + Google Meu Negócio corrigido","main_channel_justification":"É onde o ICP principal (Marlene) já busca e onde a prova social já existe organicamente (4,8★/54 no iFood); antes de qualquer mídia paga, o básico desses dois canais precisa estar impecável (SWOT: prioridade WT1).","support_channel":"WhatsApp Business (ainda não ativado) — ponte entre o hábito do telefone e a confiabilidade que falta hoje.","avoid_channels":[{"channel":"TikTok Ads","reason":"ICP principal tem 45+ anos e não é o público do formato; produção de vídeo não é prioridade quando o básico (GMB, avaliações) ainda está quebrado."},{"channel":"LinkedIn Ads","reason":"Produto é B2C local de baixo ticket — canal irrelevante para o modelo de negócio."}]},"promotion":{"tone":"Simples e direto, sem infantilização — tom de pizzaria de bairro, maduro, adequado ao público de São Vicente (conforme brand.voice_tone do briefing).","top_funnel_message":"Ainda tem gente que não sabe que a Mina Pizza está aqui há 36 anos, no mesmo lugar dentro do Carrefour.","bottom_funnel_message":"Comida de verdade, do jeito que sempre foi — peça agora pelo iFood ou WhatsApp."}},"brand_territory":{"three_words":["Resistência","Bairro","Redescoberta"],"description":"Mina Pizza não é 'mais uma pizzaria nova tentando conquistar espaço' — é quem já está no mesmo lugar há 36 anos, com clientes que citam décadas de relação nas próprias avaliações. Não é nostalgia parada no tempo: é tradição real sendo redescoberta agora, por canais digitais que a marca nunca usou de verdade até hoje.","competitor_territories":[{"competitor":"Império da Pizza","territory":"Escala + Realeza + Diversão"},{"competitor":"Big Família","territory":"Praticidade + Família + Execução"},{"competitor":"Líderes de marmita (Caseirinha da Mãe, O Marmiteiro, Alecrim)","territory":"Caseiro + Conveniência + Volume"}],"availability_justification":"Nenhum concorrente pesquisado, em pizza ou marmita, combina os 3 ao mesmo tempo — o diferencial é documentado (avaliações reais citando décadas de relação, fundação em 1989), não aspiracional."},"taglines":[{"tagline":"36 anos no mesmo lugar. Ainda tem gente descobrindo.","tone":"Redescoberta / orgulho discreto","justification":"Comunica o território de forma factual e verificável, sem prometer nada emocional — funciona como convite pra quem ainda não conhece.","best_use":"Site, capa do Instagram, anúncios de awareness"},{"tagline":"Comida de verdade, no mesmo lugar de sempre.","tone":"Funcional + tradição","justification":"Reaproveita a mensagem-chave já validada na Semana 1 ('Comida de verdade.') — mantém consistência entre entregas e não faz nenhuma promessa emocional arriscada enquanto o atendimento não estiver corrigido.","best_use":"Assinatura, bio, anúncios de conversão"},{"tagline":"36 anos. O point de sempre.","tone":"Direto / prova de tempo","justification":"Combina o número (prova concreta) com a mensagem alternativa 'O point de sempre' já mapeada no ICP da Semana 1 — boa opção pra reforço institucional sem depender de comparação com concorrente.","best_use":"Anúncios institucionais, posts de aniversário/data comemorativa"}],"recommended_tagline":"Comida de verdade, no mesmo lugar de sempre.","operator_direction":{"strongest_differential":"36 anos no mesmo local, comprovado por avaliações reais que citam décadas de relação — a confirmar com o Roberto se esse é o diferencial que ele sente mais forte no dia a dia, ou se é a comida (pastel) que ele destacaria primeiro.","desired_position":"Ocupar o quadrante 'Tradição alta + Maturidade digital alta' — vago entre os concorrentes pesquisados.","positioning_restrictions":["Não comunicar como experiência gourmet/sofisticada (anti-persona já mapeada)","Não prometer 'do jeito que você lembra' até atendimento e consistência de tempero serem corrigidos","Não usar comparação com fechamento de concorrentes como argumento de venda"],"desired_tone":"Simples e direto, sem infantilização — conforme brand.voice_tone do briefing"},"key_insight":{"headline":"O território 'Tradição Redescoberta' está vago — mas fecha assim que Império da Pizza ou Big Família decidirem contar uma história de décadas que elas não têm.","context":"Nenhum concorrente pesquisado combina tradição de 36+ anos com execução digital madura. A vantagem da Mina Pizza é real e documentada (avaliações reais citando décadas de relação, fundação em 1989), mas hoje está invisível digitalmente — ninguém conta essa história.","numbered_reasons":["(1) Nenhum concorrente em pizza ou marmita pesquisado comunica história de décadas — é lacuna de narrativa, não de produto.","(2) A prova já existe e é gratuita de usar: 113 avaliações no Google e 47 no iFood, muitas citando explicitamente décadas de relação com a casa.","(3) A janela fecha rápido se um concorrente com mais budget perceber o mesmo vácuo — o Império já tem escala pra 'comprar' uma narrativa de tradição via storytelling, mesmo sem ter os 36 anos reais."],"discussion_anchor":"Antes de aprovar qualquer criativo ou campanha, Roberto precisa decidir: vamos comunicar os 36 anos AGORA (mesmo com atendimento ainda inconsistente) ou esperar corrigir a operação primeiro? Esperar demais entrega esse território de graça pro Império ou pro Big Família.","feasibility":"alta — diferencial é verdadeiro, documentado, e de baixo custo pra comunicar (não exige investimento em produto, só em narrativa e canais)."},"honesty_alert":"O território é verdadeiro e sustentável, mas a mensagem emocional mais forte ('do jeito que você lembra') continua arriscada enquanto atendimento por telefone e consistência do prato do dia não forem corrigidos — comunicar tradição sem isso pode amplificar a percepção de queda de qualidade em vez de reforçar confiança. A PUV e o território aqui focam em localização/resistência (sustentáveis mesmo hoje), não em prometer experiência perfeita — mas a Semana 3 (produção) não deve usar a mensagem emocional até a operação confirmar a correção.","completed_at":"2026-07-18T21:00:00Z","refined_in":"ee-revisao-semanal","_refinement_history":[{"ts":"2026-07-20T10:30:00Z","review":"ee-revisao-semanal","semana":2,"updates":["U1"],"evolutions_applied":[],"note":"Rating do iFood atualizado de 4,7★/47 avaliações para 4,8★/54 (total combinado com Google de 160 para 167), com base em print real mais recente enviado pelo operador."}]},"ee-s3-manual-marca":{"client_name":"Mina Pizza","scope":"established","summary":"Manual de Marca da Mina Pizza: formaliza a identidade visual já existente (script vermelho 'Mina' + bloco 'PIZZA') em vez de recriar do zero, aplicando o território 'Resistência + Bairro + Redescoberta' definido no posicionamento (S2). Arquétipo Cara Comum + Cuidador, tipografia Oswald + Nunito Sans, e Bloco 4 mantido pragmaticamente digital-first (sem fachada/uniforme/embalagem, dado o formato de PDV dentro de praça de alimentação do Carrefour).","summary_headline":"Manual de marca formaliza o logo e o tom que a Mina Pizza já tem — arquétipo Cara Comum + Cuidador, tipografia Oswald + Nunito Sans, aplicações focadas em digital.","summary_highlights":[{"category":"posicao","label":"Arquétipo definido","value":"Cara Comum + Cuidador","subtext":"Pertencimento e confiança, não status","tone":"blue"},{"category":"maturidade","label":"Escopo do manual","value":"Established (B1-3) + B4 reduzido","subtext":"Fachada/uniforme fora — PDV dentro de praça de alimentação","tone":"yellow"},{"category":"oportunidade","label":"Logo","value":"Formalizado, não recriado","subtext":"Script vermelho 'Mina' + bloco 'PIZZA' já em uso","tone":"green"},{"category":"risco","label":"Nome inconsistente entre canais","value":"3 variações hoje","subtext":"iFood, GMB e Instagram usam nomes diferentes","tone":"red"},{"category":"janela","label":"3 direções de logo geradas","value":"Refinamento · símbolo sutil · selo/carimbo","subtext":"Aguardando escolha do Roberto pra gerar no Midjourney","tone":"blue"}],"summary_key_findings":[{"category":"vantagem","text":"A marca já tem identidade visual com personalidade real (script vermelho manuscrito) — não é preciso começar do zero, só formalizar e aplicar com consistência."},{"category":"contexto","text":"Formato de PDV dentro de praça de alimentação do Carrefour limita aplicações de fachada/sinalização própria — o escopo do manual prioriza digital, onde a marca realmente aparece hoje."},{"category":"ameaca","text":"O nome da marca varia entre 3 grafias diferentes nos canais digitais ('Mina Pizzas & Grill' no iFood, 'Mina Praia Grill & Pizza' no GMB, 'minapizzas' no Instagram) — prejudica reconhecimento, não é questão legal/de razão social."},{"category":"acao","text":"Padronizar 'Mina Pizza' como nome único em todos os canais e aplicar a paleta vermelho/preto + tipografia Oswald/Nunito Sans consistentemente a partir da próxima peça produzida."}],"block1_strategic_foundations":{"presentation":{"opening_letter":"Este manual não inventa uma marca nova pra Mina Pizza — formaliza o que 36 anos de operação já construíram, e dá a quem for produzir qualquer peça (nós, um designer, o próprio Roberto) uma régua clara de como usar isso com consistência.","manifesto_short":"Trinta e seis anos no mesmo lugar. Comida de verdade, sem enrolação.","manifesto_narrative":"Antes de existir aplicativo de comida, antes do Carrefour virar point de bairro, já tinha gente pedindo pizza na Mina. Trinta e seis anos depois, a receita não mudou e o endereço também não — mas o mundo ao redor mudou várias vezes. A Mina Pizza nunca investiu um real em comunicação, e mesmo assim segue ali, servindo quem já é cliente há décadas. Não vendemos experiência gourmet nem promessa vazia — vendemos comida de verdade, feita como sempre foi, pro cliente que já sabe o que quer e não tem paciência pra decepção. Agora é hora de contar essa história pra quem ainda não a conhece.","navigation_instructions":"Bloco 1 explica o porquê (estratégia). Bloco 2 define como a marca fala. Bloco 3 define como a marca se parece visualmente. Bloco 4 mostra onde isso tudo se aplica na prática. Bloco 5 define quem aprova o quê. Quem for produzir uma peça nova deve consultar Blocos 2 e 3 antes de começar, e Bloco 4 para ver se já existe um padrão pronto pra aquele tipo de aplicação."},"essence":{"purpose":"Ser o lugar de comida de verdade que a região de São Vicente pode confiar de olhos fechados, geração após geração.","vision":"Ser reconhecida como a pizzaria e marmitaria mais tradicional e confiável da Baixada Santista — redescoberta por quem nunca soube que ela existia.","mission":"Servir comida consistente, feita com o mesmo cuidado de sempre, num ambiente prático e acessível dentro do Carrefour de São Vicente.","values":[{"name":"Consistência","behavior_yes":"Mesmo tempero, mesmo cuidado, todo santo dia","behavior_no":"Variar receita ou porção conforme o movimento do dia"},{"name":"Proximidade sem exagero","behavior_yes":"Tratar cliente antigo com atenção direta e reconhecimento","behavior_no":"Ser frio/ríspido OU forçar intimidade e gírias que não combinam com o público"},{"name":"Transparência","behavior_yes":"Assumir erro publicamente e corrigir (responder avaliação negativa com contexto)","behavior_no":"Ignorar reclamação ou apagar comentário incômodo"},{"name":"Praticidade","behavior_yes":"Resolver a fome do cliente rápido, sem fricção nem informação errada","behavior_no":"Complicar o pedido com processos longos ou horário/endereço desatualizados"}],"promise":"Você sempre sabe o que vai encontrar na Mina Pizza — nem sempre perfeito, mas sempre de verdade.","big_idea":"Trinta e seis anos de tradição que a maioria da cidade ainda não conhece.","brand_pillars":[{"name":"Tradição Viva","description":"36 anos não é nostalgia parada — é prova de que a fórmula funciona, todos os dias."},{"name":"Bairro de Verdade","description":"Faz parte da rotina de quem mora, trabalha ou passa por São Vicente — não é destino, é hábito."},{"name":"Comida sem Enrolação","description":"Sabor caseiro, sem discurso gourmet, sem promessa vazia."},{"name":"Redescoberta","description":"Existe há décadas, mas ainda tem muita gente que nunca soube — a comunicação existe pra mudar isso, não pra reinventar o produto."}]},"positioning":{"statement":"Para moradores de São Vicente e visitantes de fim de semana da Baixada Santista, a Mina Pizza é a pizzaria (e marmitaria) mais tradicional da praça de alimentação do Carrefour, porque está no mesmo lugar há 36 anos, com clientes que já pedem daqui há mais de três décadas.","territory":"Resistência + Bairro + Redescoberta","archetype_dominant":{"name":"O Cara Comum (Everyman)","justification":"A marca não vende status, exclusividade ou aspiração — vende pertencimento e confiança. É 'a pizzaria que já é de todo mundo', acessível, sem pretensão, o oposto do discurso gourmet que afastaria o próprio ICP (anti-persona já mapeada rejeita explicitamente experiência sofisticada)."},"archetype_secondary":{"name":"O Cuidador","justification":"O cuidado através da consistência e do tempo (36 anos servindo a mesma comunidade) sustenta a lealdade da Marlene — não é indulgência efusiva, é constância que cuida sem alarde."},"competitive_matrix":{"axis_x":"Digital baixo → Digital maduro","axis_y":"Tradição recente → Tradição décadas","client_position":"NE","competitors":[{"name":"Mina Pizza","quadrant":"NE","is_client":true},{"name":"Império da Pizza","quadrant":"SE"},{"name":"Big Família","quadrant":"SE"},{"name":"Caseirinha da Mãe / O Marmiteiro / Alecrim","quadrant":"SE"}]},"puv":"A Mina Pizza serve o mesmo point do Carrefour de São Vicente há 36 anos — o tipo de lugar que cliente já frequenta há décadas e recomenda sem pensar duas vezes."},"audience_persona":{"primary_persona":{"name":"Marlene, 58 anos","photo_description":"Mulher de cerca de 55-60 anos, cabelo grisalho arrumado, vestindo roupa simples e prática, com uma bolsa de compras do Carrefour na mão — expressão de quem está no meio de um dia corrido de tarefas, olhando o cardápio afixado no balcão da Mina Pizza dentro da praça de alimentação.","age":"58 anos (faixa do ICP: 35-65, concentração em 45+)","income":"Classe C/C+ — renda familiar estimada de R$3.000-7.000/mês, perfil típico da Baixada Santista","occupation":"Não declarada formalmente — perfil de quem faz compras semanais no Carrefour, ensino médio completo, público popular/tradicional","main_pain":"Atendimento ríspido no telefone e comida às vezes fria/sem tempero — no fundo, medo de que o lugar em que confiou por décadas esteja mudando pra pior","purchase_motivators":"Hábito de décadas, conveniência (já está no Carrefour fazendo compras), tradição e confiança sem risco de decepção"},"secondary_persona":{"name":"Jailson","description":"Trabalhador da região que almoça ali durante a semana por proximidade e velocidade, zero lealdade emocional — decide por tempo de espera e preço, troca de lugar na primeira falha."},"anti_persona":{"description":"Perfis que consomem energia da operação sem virar recorrência real.","profiles":[{"name":"Quem busca experiência gastronômica sofisticada","why_not":"A Mina Pizza é PDV simples dentro de shopping; comunicar como 'experiência gourmet' gera decepção e reclamação de ambiente/serviço."},{"name":"Caçador de cupom do iFood","why_not":"Ticket baixo, sem lealdade, alto custo de aquisição sem retorno de recompra."}]},"buyer_journey_summary":"Da fome/hábito (gatilho forte, sem fricção) até a escolha do canal de pedido (fricção real: medo de atendimento ruim no telefone) e o pós-compra (vazamento crítico: zero follow-up, cliente de décadas pode sumir sem ninguém perceber)."},"history_culture":{"origin":"Fundada em 1989 dentro da praça de alimentação do Carrefour de São Vicente, SP — a mesma loja (Loja 1 e 2) até hoje.","milestones":["1989 — Fundação da Mina Pizza dentro do Carrefour de São Vicente","Roberto assume a administração e usa caixa acumulado para comprar a parte do ex-sócio","Adoção de delivery via iFood — presença digital mínima, mas decisiva pra sobrevivência do negócio","2026 — Início da estruturação estratégica com a V4 Company, primeira vez que a marca investe em comunicação de forma intencional"],"culture":"Operação gerida remotamente por Roberto (sócio-administrador), com equipe de balcão/cozinha no dia a dia. Cultura formada muito mais pela rotina operacional do que por processos formais de marca — este manual é o primeiro documento desse tipo na história da empresa.","legacy":"36 anos de relação direta com a comunidade de São Vicente — clientes que citam décadas de frequência nas próprias avaliações. O legado a preservar é a confiança construída, não qualquer elemento visual específico (que nunca foi formalizado antes)."}},"block2_verbal_identity":{"personality":{"scales":[{"trait_low":"Formal","trait_high":"Informal","position":6},{"trait_low":"Sério","trait_high":"Divertido","position":4},{"trait_low":"Jovem","trait_high":"Maduro","position":8},{"trait_low":"Luxuoso","trait_high":"Acessível","position":9},{"trait_low":"Reservado","trait_high":"Caloroso","position":6},{"trait_low":"Moderno","trait_high":"Tradicional","position":7}],"archetype_applied":"Cara Comum (base) + Cuidador (calor): a marca fala como um vizinho de décadas — direto, sem pose, mas que demonstra cuidado através da constância, não de efusividade.","as_a_person":"A Mina Pizza é como aquele vizinho de décadas que você cumprimenta sem precisar pensar — não é o mais descolado da rua, mas é o mais confiável. Fala pouco e direto, não tenta ser engraçadinho, trata todo mundo com o mesmo respeito simples, e você sabe que pode contar com ele porque ele nunca saiu do lugar."},"tone_of_voice":{"pillars":[{"name":"Direto sem ser seco","definition":"Vai direto ao ponto, sem economizar respeito.","manifestation":"Frases curtas, sem gírias forçadas, sem explicação excessiva antes do CTA."},{"name":"Maduro, não careta","definition":"Fala com adulto, não com criança nem com adolescente.","manifestation":"Evita emoji em excesso, gírias de internet e linguagem 'descolada' que soa artificial pro público 45+."},{"name":"Acolhedor com constância","definition":"O calor vem da consistência, não da efusividade.","manifestation":"Reconhece o cliente antigo, agradece com simplicidade, nunca exagera no entusiasmo."},{"name":"Honesto mesmo quando dói","definition":"Reconhece erro em vez de justificar.","manifestation":"Responde avaliação negativa admitindo o problema antes de explicar o contexto."}],"channel_variations":[{"channel":"Instagram (posts/bio)","adaptation":"Tom direto, hashtags locais (não genéricas de banco de imagem), fotos reais do produto e do bairro."},{"channel":"WhatsApp","adaptation":"Respostas rápidas, sem forçar intimidade, catálogo claro, sem gírias de vendedor."},{"channel":"Respostas a avaliação (Google/iFood)","adaptation":"Reconhece o problema primeiro, sem se defender; agradece elogio sem exagero."},{"channel":"Atendimento telefônico/balcão","adaptation":"Tom simples e cordial — é o canal mais crítico (maior causa de churn identificada na S1), precisa de treinamento alinhado a este manual, não só comunicação digital."}],"say_dont_say":[{"situation":"Cliente reclama que já foi mal atendido ao telefone","say":"Reconhecer o problema publicamente e mostrar canal alternativo mais confiável (ex: WhatsApp)","dont_say":"'Desculpa, vamos melhorar' sem ação visível","reason":"Genérico sem ação visível não reconstrói confiança."},{"situation":"Cliente questiona se o preço ainda vale a pena","say":"Comunicar o que mudou pra melhor (ingrediente, tempero padronizado) quando corrigido","dont_say":"'Nossos preços seguem a inflação como todo mundo'","reason":"Justificar sem reconhecer a percepção do cliente soa defensivo."},{"situation":"Cliente prefere ligar mesmo sabendo que é arriscado","say":"Oferecer WhatsApp como ponte mais confiável, sem forçar","dont_say":"'Baixa o app, é mais fácil'","reason":"Ignora a barreira real de hábito/idade do público."},{"situation":"Cliente reclama do ambiente da praça de alimentação","say":"Reforçar delivery/retirada como alternativa fácil","dont_say":"'Isso não é problema nosso, é do shopping'","reason":"Tecnicamente verdade, mas não resolve a dor do cliente."},{"situation":"Cliente de longa data testando se a qualidade ainda é a mesma","say":"Usar prova social real e recente (avaliação específica)","dont_say":"'Sempre fomos os melhores da região'","reason":"Afirmação vazia sem prova é irrelevante pro cliente cético."},{"situation":"Responder avaliação de 1 estrela injusta/exagerada","say":"Responder com contexto e educação, sem apagar","dont_say":"Apagar o comentário ou ignorar","reason":"Apagar parece esconder; quem lê a resposta educada confia mais na marca."},{"situation":"Post no Instagram anunciando novidade","say":"'Pastel novo — mesmo jeito de sempre de fazer, sabor novo' (ancorar no que já é confiável)","dont_say":"'Descubra a revolução do nosso cardápio!!!'","reason":"Exagero de linguagem quebra o tom maduro e direto da marca."},{"situation":"Cliente pergunta sobre horário de funcionamento","say":"Responder com horário certo (almoço desde 9h, jantar até 22h) e atualizar todos os canais","dont_say":"Deixar bio/GMB desatualizados","reason":"Informação errada gera frustração antes mesmo do primeiro contato."}]},"editorial_guidelines":{"vocabulary_categorized":{"essence_words":["tradição","de verdade","bairro","confiança","consistência"],"valued_repeated":["36 anos","comida de verdade","point de sempre","feito na hora","São Vicente"],"audience_connection":["Carrefour","praça de alimentação","prato do dia","pastel","delivery"]},"official_glossary":[{"term":"Point","definition":"Termo usado na comunicação pra se referir à Mina Pizza como lugar de referência/rotina, não como estabelecimento formal."}],"forbidden_terms":[{"term":"Gourmet","use_instead":"Comida de verdade / feito com cuidado"},{"term":"Revolucionário / revolução","use_instead":"Novidade / do jeito de sempre, com uma novidade"},{"term":"Sofisticado","use_instead":"Simples e bem feito"}],"form_of_address":"Você — tratamento direto e respeitoso, nunca 'tu' informal demais nem 'senhor(a)' excessivamente formal. A idade do público (45+) pede respeito sem distanciamento.","emoji_punctuation":"Uso moderado — no máximo 1 emoji relevante por post/mensagem (🍕 ou similar), nunca fileira de emojis. Sem excesso de exclamação (máx. 1 por frase).","grammar_rules":"Frases curtas. Português correto sem ser rebuscado. Evitar gírias de internet/juvenis. Números institucionais por extenso ('trinta e seis anos'); numerais em contexto de preço/promoção."},"naming_taxonomy":{"master_brand_name":"Mina Pizza","guidance":"Padronizar 'Mina Pizza' em todos os canais digitais (Instagram, iFood, GMB, WhatsApp). Hoje o nome varia entre 'Mina Pizzas & Grill' (iFood), 'Mina Praia Grill & Pizza' (GMB) e 'minapizzas' (Instagram). Não é uma questão legal — a razão social pode seguir diferente do nome de fachada, como em qualquer empresa — é questão de reconhecimento: o cliente precisa encontrar o mesmo nome em qualquer canal que buscar."},"storytelling":{"story_arc":{"act1_before":"Uma pequena pizzaria dentro de uma praça de alimentação, como tantas outras, tentando se firmar em 1989.","act2_different":"36 anos depois, ainda no mesmo lugar — mantendo a receita e a relação com quem já é cliente há décadas, mesmo sem nunca ter investido em comunicação.","act3_after":"Agora redescoberta: a mesma tradição, mas visível pra quem nunca soube que ela existia."},"frameworks":["Antes/depois da redescoberta digital","Cliente de décadas como prova viva"],"opening_hooks":["Trinta e seis anos e ainda tem gente que não sabe que a gente existe.","Desde 1989 no mesmo lugar — a massa não mudou, o forno também não."]},"slogan_tagline_signatures":{"slogan":"36 anos. Comida de verdade.","tagline":"Comida de verdade, no mesmo lugar de sempre.","verbal_signatures":["Mina Pizza — desde 1989, no mesmo lugar.","O point de sempre.","Comida de verdade."]}},"block3_visual_identity_core":{"logo":{"concept":"O logo atual já contém boa parte do DNA que a marca precisa: 'Mina' em script vermelho transmite calor humano e tradição manuscrita/artesanal, 'PIZZA' em bloco condensado ancora a categoria com clareza imediata. Este manual não desenha um logo novo do zero — formaliza e refina o que já existe, garantindo consistência de uso daqui pra frente.","style_description":"Lockup misto: wordmark script/cursivo em vermelho para 'Mina' (calor, tradição, toque manuscrito/artesanal) combinado com wordmark em caixa alta condensada/bold para 'PIZZA' (ancora categoria com clareza imediata, típico de sinalização de pizzaria). O contraste de peso e registro entre os dois elementos cria hierarquia visual sem precisar de símbolo/ícone adicional. Fundo circular preto opcional para aplicações compactas (avatar de redes sociais, favicon).","visual_attributes":{"form_language":"Misto — script orgânico ('Mina') + bloco geométrico condensado ('PIZZA'), contraste intencional entre os dois registros","weight":"Médio a bold — 'PIZZA' em peso mais pesado que 'Mina' pra criar hierarquia","balance":"Assimétrico controlado — os dois elementos empilhados verticalmente, não lado a lado","negative_space":"Equilibrado — funciona tanto em versão com fundo circular quanto solto","color_application":"Duotone — vermelho ('Mina') + preto/branco ('PIZZA'), sem gradientes","personality_in_form":"O script vermelho traduz o pilar 'Acolhedor com constância' (calor humano, toque manuscrito remete a algo feito à mão); o bloco condensado preto/branco traduz 'Direto sem ser seco' (clareza imediata, sem enfeite).","scalability":"Versão com círculo preto funciona bem em tamanhos pequenos (avatar, favicon); versão solta (só o wordmark) funciona melhor em aplicações largas (banner, cardápio).","differentiation_from_competitors":"Império da Pizza usa coroa/dourado (registro de realeza/luxo aspiracional) e Big Família usa amarelo/preto mais genérico — o script vermelho manuscrito da Mina é o único registro 'feito à mão' entre os concorrentes pesquisados, reforçando o território de tradição/artesanal sem precisar dizer isso em palavras."},"design_principles":["Clareza acima de enfeite — 'PIZZA' sempre legível à distância, mesmo em tamanho pequeno","O script 'Mina' nunca perde legibilidade por estilização excessiva","Vermelho é a cor de reconhecimento — nunca substituir por outra cor de destaque","Simplicidade que envelhece bem — evitar elementos que datam o logo (gradientes, sombras 3D, efeitos de tendência)"],"anatomy":{"symbol":"Nenhum símbolo/ícone separado — a força está no wordmark duplo","wordmark":"'Mina' (script vermelho) + 'PIZZA' (bloco condensado preto/branco)","lockup":"Empilhado verticalmente, 'Mina' acima de 'PIZZA', opcionalmente dentro de círculo preto"},"construction_grid":"Grid não formalizado no logo atual — recomenda-se que o designer desenhe um grid de construção na próxima rodada de refinamento, mantendo a proporção atual entre os dois elementos como referência.","clear_space":"Espaço de respiro mínimo equivalente à altura da letra 'P' de PIZZA ao redor de todo o lockup.","min_max_size":{"min_digital_px":"120px de largura (versão círculo) / 80px de altura (versão solta)","min_print_mm":"25mm de largura","max_recommended":"Sem limite máximo definido — testar legibilidade em aplicações grandes na próxima rodada"},"official_versions":[{"name":"Círculo completo (Mina + Pizza + fundo preto)","use_case":"Avatar de redes sociais, favicon, aplicações compactas"},{"name":"Wordmark solto (sem círculo)","use_case":"Cabeçalhos, banners largos, materiais impressos"},{"name":"Monocromática (preto ou branco sólido)","use_case":"Aplicações de baixo contraste, carimbos, gravação"}],"logo_directions":[{"direction":"Refinamento do atual","concept":"Mantém a estrutura script + bloco existente, só refina proporção e kerning","prompt":"Minimalist wordmark logo, cursive red script text 'Mina' above bold condensed black sans-serif text 'PIZZA', clean vector style, white background, Italian pizzeria branding, no additional icons, refined typography, high contrast"},{"direction":"Com símbolo sutil","concept":"Adiciona um elemento gráfico discreto (ex: fatia estilizada) sem poluir o wordmark","prompt":"Wordmark logo for traditional pizzeria 'Mina Pizza', cursive red script for 'Mina', bold black condensed sans-serif for 'PIZZA', subtle minimal pizza slice icon integrated above or beside text, vector flat design, warm but simple, no gradients"},{"direction":"Versão selo/carimbo","concept":"Formato circular tipo selo, reforça tradição e ano de fundação (1989), boa pra embalagem/carimbo","prompt":"Circular badge/stamp logo, 'Mina Pizza' text arranged in circle, small text 'desde 1989' at bottom, red and black color scheme, vintage bakery/pizzeria stamp style, clean vector, traditional but not old-fashioned"}],"chosen_direction":null},"incorrect_uses":[{"rule":"Não distorcer o wordmark (esticar ou comprimir)","visual_demo":"distort_x","reason":"Quebra a proporção entre o script e o bloco, perdendo a hierarquia visual"},{"rule":"Não trocar a cor vermelha por outra cor de destaque","visual_demo":"recolor_red","reason":"Vermelho é o principal elemento de reconhecimento da marca"},{"rule":"Não aplicar sombra ou efeito 3D","visual_demo":"drop_shadow","reason":"Contradiz o princípio de simplicidade que envelhece bem"},{"rule":"Não usar sobre fundo de baixo contraste","visual_demo":"low_contrast","reason":"Compromete a legibilidade, especialmente do script vermelho"},{"rule":"Não rotacionar o logo","visual_demo":"rotated","reason":"A hierarquia vertical (Mina acima de Pizza) é intencional e não deve ser alterada"},{"rule":"Não adicionar contorno/outline ao redor do texto","visual_demo":"outlined","reason":"Contornos artificiais quebram a leveza do script manuscrito"}],"color_system":{"primary":[{"name":"Vermelho Mina","hex":"#C8102E","rgb":"rgb(200, 16, 46)","cmyk":"0, 92, 77, 22","role":"Cor primária de marca — usada no wordmark 'Mina' e em CTAs","justification":"Cor já em uso no logo atual — remete a apetite/comida sem ser genérica como o vermelho de fast-food corporativo, mantendo o tom quente do script manuscrito."}],"secondary":[{"name":"Preto Pizza","hex":"#1A1A1A","rgb":"rgb(26, 26, 26)","cmyk":"0, 0, 0, 90","role":"Wordmark 'PIZZA', textos institucionais, fundo do avatar circular","justification":"Já em uso no logo atual — contraste forte com o vermelho e com fundo branco."}],"neutrals":[{"name":"Branco","hex":"#FFFFFF","role":"Fundo padrão, texto sobre preto/vermelho"},{"name":"Cinza Quente","hex":"#F5F1EC","role":"Fundo alternativo (cardápio digital, LP), mais quente que branco puro"}],"functional":[{"name":"Sucesso","hex":"#2E7D32","role":"Confirmação de pedido/ação"},{"name":"Atenção","hex":"#F9A825","role":"Avisos, promoções por tempo limitado"}],"proportions":{"dominant_pct":60,"support_pct":30,"accent_pct":10,"dominant_color":"Branco/Cinza Quente","support_color":"Preto Pizza","accent_color":"Vermelho Mina"},"wcag_contrast_matrix":[{"foreground":"#1A1A1A","background":"#FFFFFF","label":"Preto sobre branco (texto padrão)","ratio":18.1,"level":"AAA"},{"foreground":"#C8102E","background":"#FFFFFF","label":"Vermelho sobre branco (CTA/destaque)","ratio":5.4,"level":"AA"},{"foreground":"#FFFFFF","background":"#C8102E","label":"Branco sobre vermelho (botão CTA)","ratio":5.4,"level":"AA"},{"foreground":"#FFFFFF","background":"#1A1A1A","label":"Branco sobre preto (avatar/fundo escuro)","ratio":18.1,"level":"AAA"}]},"typography":{"primary_family":{"name":"Oswald","source":"Google Fonts","google_fonts_url":"https://fonts.google.com/specimen/Oswald","embed_url":"https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap","weights_permitted":["400","500","600","700"],"license":"Open Font License"},"secondary_family":{"name":"Nunito Sans","source":"Google Fonts","google_fonts_url":"https://fonts.google.com/specimen/Nunito+Sans","embed_url":"https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&display=swap","weights_permitted":["400","600","700"],"license":"Open Font License"},"hierarchy":[{"level":"H1","font":"Oswald","weight":"700","size_px":48,"line_height":"1.1","use_case":"Headline principal (LP hero, capa de posts institucionais)"},{"level":"H2","font":"Oswald","weight":"600","size_px":32,"line_height":"1.2","use_case":"Subtítulos de seção"},{"level":"H3","font":"Oswald","weight":"500","size_px":22,"line_height":"1.3","use_case":"Títulos de card/destaque (ex: nome de prato em destaque)"},{"level":"Body","font":"Nunito Sans","weight":"400","size_px":16,"line_height":"1.5","use_case":"Texto corrido, descrição de produto, legendas de post"},{"level":"Caption/CTA","font":"Nunito Sans","weight":"700","size_px":14,"line_height":"1.4","use_case":"Botões de CTA, rótulos pequenos, texto de rodapé"}],"fallbacks":"Oswald → Arial Narrow, sans-serif / Nunito Sans → Helvetica, Arial, sans-serif","justification":"Oswald traduz o pilar 'Direto sem ser seco' — condensada e bold, remete a sinalização de pizzaria clássica sem ser genérica. Nunito Sans equilibra com um corpo de texto mais macio/humanista, evitando que a comunicação fique fria demais para o tom 'Acolhedor com constância'."},"iconography":{"style":"Outline simples, sem preenchimento","stroke_weight_px":2,"corner_style":"Levemente arredondado","grid":"24x24px","color_default":"Preto Pizza (#1A1A1A); vermelho só para ícone de destaque único por tela"},"photography":{"art_direction":"Fotografia real do produto e do balcão — nunca banco de imagem. Luz natural ou quente, close-up mostrando textura (queijo derretendo, massa crocante, recheio do pastel). Pessoas reais (equipe, clientes com autorização) em vez de modelos.","mood_keywords":["caseiro","quente","real","sem pose","apetitoso"],"do_dont":[{"type":"do","rule":"Fotografar comida recém-feita, com vapor/textura visível"},{"type":"do","rule":"Usar avaliações reais como prova social visual"},{"type":"dont","rule":"Usar banco de imagem genérico de pizza"},{"type":"dont","rule":"Composições muito estilizadas/editoriais que destoam do tom acessível"}]}},"block4_applications":{"principle":"Toda aplicação prioriza consistência de nome ('Mina Pizza' em todos os canais), cor vermelho/preto e o tom 'direto sem ser seco'. Dado o formato de PDV dentro de praça de alimentação (sem fachada própria controlável) e a operação enxuta (sem equipe de marketing dedicada), o escopo deste bloco foca em digital + redes sociais + papelaria essencial — fachada, uniforme e embalagem ficam fora por ora, sem ROI claro dado o formato do negócio.","applications":[{"category":"social_media","name":"Avatar e bio do Instagram","specs":"Avatar: versão círculo do logo, 320x320px mínimo. Bio: até 150 caracteres, incluindo '36 anos', horário correto e o slogan.","mockup":{"type":"ig_avatar_bio","description":"Avatar com logo círculo vermelho/preto; bio com emoji único (🍕), horário 9h-22h corrigido, slogan 'Comida de verdade, no mesmo lugar de sempre.'","data":{}}},{"category":"social_media","name":"Template de post de feed","specs":"1080x1080px, foto real ocupando 70%+ do quadro, headline em Oswald bold quando houver texto sobreposto (<20% da área, regra Meta)","mockup":{"type":"ig_feed_post","description":"Foto de produto real (ex: pastel sendo aberto) com tarja preta inferior contendo nome do produto em Oswald + preço opcional em Nunito Sans","data":{}}},{"category":"social_media","name":"Template de Stories/Reels","specs":"1080x1920px, hook em texto grande nos primeiros 3s, logo círculo no canto","mockup":{"type":"ig_story","description":"Vídeo vertical de bastidor (massa sendo feita) com texto 'Mesmo jeito de sempre' em Oswald branco sobre fundo escuro semitransparente","data":{}}},{"category":"digital_ui","name":"Perfil do WhatsApp Business","specs":"Foto de perfil = logo círculo; descrição com horário e site; catálogo com fotos reais padronizadas","mockup":{"type":"whatsapp_business","description":"Perfil com nome 'Mina Pizza', descrição institucional curta, catálogo organizado por categoria (Pizzas, Pratos Executivos, Pastéis)","data":{}}},{"category":"digital_ui","name":"Perfil do Google Meu Negócio","specs":"Nome padronizado 'Mina Pizza', endereço corrigido, categoria principal + secundárias, fotos reais em alta resolução","mockup":{"type":"gmb_card","description":"Card de perfil com nome único 'Mina Pizza' (substituindo 'Mina Praia Grill & Pizza'), horário correto, álbum de fotos categorizado","data":{}}},{"category":"digital_ui","name":"Favicon / ícone de app","specs":"Versão simplificada do logo círculo, legível em 16x16px","mockup":{"type":"favicon_scaling","description":"Logo círculo reduzido a elemento mínimo legível, mantendo o contraste vermelho sobre preto","data":{}}},{"category":"sales_marketing","name":"Cardápio digital (Neemo/PDF)","specs":"Categorias claras incluindo 'Marmita/Quentinha' (gap já mapeado na pesquisa de mercado), fotos padronizadas, preços visíveis","mockup":{"type":"one_pager","description":"Cardápio organizado por categoria com fotos reais uniformes, tipografia Oswald para nomes de prato e Nunito Sans para descrição","data":{}}},{"category":"stationery","name":"Assinatura de e-mail/WhatsApp institucional","specs":"Nome + 'Mina Pizza — desde 1989' + telefone/WhatsApp + endereço","mockup":{"type":"email_signature","description":"Assinatura simples texto + logo pequeno, usada em comunicação institucional (ex: com fornecedores, V4)","data":{}}}]},"block5_governance":{"brand_owner":"Roberto Calafiori (sócio-administrador) — decisor final sobre qualquer aplicação da marca, mesmo operando remotamente.","approval_process":[{"step":"Produção do material (post, criativo, peça impressa) seguindo este manual","responsible":"Equipe V4 (designer/social media)","estimated_time":"1-3 dias úteis"},{"step":"Revisão de aderência ao manual (cor, tipografia, tom de voz)","responsible":"V4 (checklist interno)","estimated_time":"Poucas horas"},{"step":"Aprovação final antes de publicar","responsible":"Roberto Calafiori","estimated_time":"24-48h (opera remotamente)"}],"review_cadence":"Revisão leve a cada 6 meses, ou sempre que um novo canal/aplicação for adicionado. Dado o porte da operação (loja única, sem equipe de marketing interna), não há necessidade de revisão trimestral formal nem de comitê de marca formal — a governança fica concentrada no próprio Roberto + squad V4.","committee":null},"completed_at":"2026-07-18T23:30:00Z"}},"briefing":{"identification":{"name":"Mina Pizza","contact_name":"Roberto Calafiori","contact_role":"Sócio-administrador","segment":"Alimentação — restaurante à la carte (almoço) e pizzaria (jantar)","annual_revenue":"R$ 1.720.000 (aprox., soma dos últimos 12 meses informados)","years_in_market":"36 anos (fundada em 1989)","location":"São Vicente, SP — Av. Prefeito José Monteiro, 1045, Loja 1 e 2 (dentro de praça de alimentação)","website":null,"instagram":"@minapizzas","whatsapp":null,"gmb":false},"product":{"main_product":"Pratos executivos/marmita no almoço (carro-chefe atual), pizzas à noite e pastéis","ticket":"Pizza R$50-58 | Prato feito/marmita R$30-37 | Pastel R$9-15 (estimado)","billing_model":"unico","sales_cycle":"imediato (compra por impulso/necessidade, modelo PDV)","active_customers":"Base antiga e fiel; média de 250 pedidos de pizza/mês","most_profitable":"Prato feito/marmita à la carte (~64% do faturamento)","growth_potential":"Pizza — meta é sair de 30% para 50% do faturamento total","revenue_breakdown":{"pizza":{"pct":30,"annual_brl":516000,"source":"declarado por Roberto em múltiplas fontes (kick-off, call de qualificação)","confidence":"alta"},"prato_feito_marmita":{"pct":64,"annual_brl":1100800,"source":"declarado (Roberto: 'refeições' = maior fatia; kick-off), com pastel deduzido dessa fatia","confidence":"média — não separado explicitamente de pastel pelo Roberto"},"pastel":{"pct":6,"annual_brl":103200,"source":"ESTIMADO [E] — Roberto não trouxe % específico; pastel é elogiado nas avaliações mas nunca foi tratado como linha de faturamento separada. Estimativa conservadora carve-out da fatia de 'refeições', baseada em ticket menor (R$9-15) e natureza de item de acompanhamento/impulso, não refeição principal","confidence":"baixa — estimativa, não declarado"},"total_annual_brl":1720000,"note":"Pizza (30%) é o único número que Roberto confirmou com precisão e consistência em várias conversas. Prato feito/marmita e pastel foram inferidos a partir de 'refeições = maior fatia' (kick-off) + estimativa de carve-out para pastel — vale confirmar os dois com o Roberto quando possível."}},"icp":{"best_customers":"Roberto não convive com o público (gestão remota), mas as avaliações reais do Google (10 positivas revisadas) dão um perfil bem mais claro do que ele descreve: (1) clientes de décadas — pelo menos uma avaliação cita 35 anos de frequência, sinal de lealdade real e não só conveniência; (2) fluxo de quem já está no Carrefour (compras, estacionamento) e aproveita a praça de alimentação; (3) fãs específicos dos pastéis fritos na hora, citados repetidamente como diferencial; (4) grupos/famílias fazendo refeição no local (ex.: grupo de 8 pessoas almoçando); (5) pessoas com mobilidade reduzida/idosos/gestantes — avaliam o espaço plano e acessível como ponto positivo. Fonte: avaliações reais do Google, não confirmado verbalmente pelo Roberto — apresentar a ele como leitura, não como fato que ele validou.","not_customers":"Roberto não define isso e não há dado direto — mas as avaliações sugerem que quem busca ambiente silencioso/sofisticado tende a não voltar (é praça de alimentação, com barulho e \"desconforto do ambiente\" citados como algo que \"faz parte\"), e quem tem baixa tolerância a atendimento inconsistente por telefone/balcão também não fideliza. Inferência a partir de avaliações, não confirmada pelo operador — validar.","problems_before":"Sem resposta específica do Roberto, mas as avaliações positivas revelam 3 dores reais antes da compra: (1) fome dentro da praça de alimentação do Carrefour, quer algo rápido sem sair do shopping; (2) quer comida caseira/prato do dia decente sem pagar preço de restaurante chique; (3) já é cliente antigo mantendo um ritual de décadas (pastel, pizza) — não está comparando concorrentes ativamente, está sustentando um hábito. Fonte: avaliações reais, não confirmado pelo operador.","results_after":"Sem resposta específica do Roberto, mas as avaliações positivas mostram 3 ganhos reais quando dá certo: (1) entrega rápida e comida saborosa (pizza de massa fina e crocante, pastel bem recheado, feito na hora); (2) ambiente prático e acessível (estacionamento do Carrefour, espaço plano, bom pra cadeira de rodas/idosos/gestantes); (3) sensação de tradição e confiança — \"trinta e cinco anos frequentando, não precisa nem dizer que é bom\". Fonte: avaliações reais, não confirmado pelo operador.","churn_reasons":"As 10 avaliações negativas do Google dão motivos concretos e recorrentes, bem além do \"é uma pizzaria\" do Roberto: (1) ATENDIMENTO RÍSPIDO é a queixa mais repetida — function renderGantt(actions) {
  if (!actions || !actions.length) return '';
  const maxWeek = Math.max(...actions.map(a => a.week_end || a.week_start || 1), 5);
  const LW = 33;
  const BW = ((100 - LW) / maxWeek).toFixed(2);
  const cols = LW + '% ' + Array(maxWeek).fill(BW + '%').join(' ');
  const IC = {alto:'var(--danger)',alto2:'var(--danger)','médio':'var(--warning)',medio:'var(--warning)',baixo:'#94a3b8'};
  const getColor = imp => IC[(imp||'baixo').toLowerCase().replace(/\u00e9/g,'e')] || '#94a3b8';

  let h = '<div style="margin-top:.25rem">';
  // Header row
  h += '<div style="display:grid;grid-template-columns:'+cols+';gap:2px;margin-bottom:.375rem">';
  h += '<div></div>';
  for (let w = 1; w <= maxWeek; w++) h += '<div style="font-size:.625rem;font-weight:700;text-align:center;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em">S'+w+'</div>';
  h += '</div>';

  // Group by track
  const tracks = [];
  actions.forEach(a => { const t = a.track || 'Geral'; if (!tracks.includes(t)) tracks.push(t); });

  tracks.forEach(track => {
    h += '<div style="font-size:.5625rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--text-muted);padding:.5rem 0 .25rem;border-top:1px solid var(--border)">'+E(track)+'</div>';
    actions.filter(a => (a.track || 'Geral') === track).forEach(a => {
      const s = Math.max(1, a.week_start || 1);
      const e = Math.min(maxWeek, a.week_end || s);
      const color = getColor(a.impact);
      h += '<div style="display:grid;grid-template-columns:'+cols+';gap:2px;margin-bottom:3px;align-items:center">';
      h += '<div style="font-size:.7rem;color:var(--text-secondary);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding-right:.375rem" title="'+E(a.action)+'">'+E(a.action)+'</div>';
      for (let w = 1; w <= maxWeek; w++) {
        if (w >= s && w <= e) {
          const br = (s===e) ? '3px' : (w===s) ? '3px 0 0 3px' : (w===e) ? '0 3px 3px 0' : '0';
          h += '<div style="height:20px;background:'+color+';border-radius:'+br+';opacity:.82" title="'+E(a.action)+' (S'+s+'–S'+e+')"></div>';
        } else {
          h += '<div style="height:20px;background:var(--surface);border-radius:3px"></div>';
        }
      }
      h += '</div>';
    });
  });

  // Legend
  h += '<div style="display:flex;gap:.75rem;align-items:center;margin-top:.625rem;padding-top:.5rem;border-top:1px solid var(--border)">';
  h += '<span style="font-size:.6875rem;color:var(--text-muted)">Impacto:</span>';
  [['Alto','var(--danger)'],['Médio','var(--warning)'],['Baixo','#94a3b8']].forEach(function(pair) {
    h += '<div style="display:flex;align-items:center;gap:.25rem"><div style="width:10px;height:10px;background:'+pair[1]+';border-radius:2px;opacity:.82"></div><span style="font-size:.6875rem;color:var(--text-secondary)">'+pair[0]+'</span></div>';
  });
  h += '</div>';

  h += '</div>';
  return h;
}

const CX = {

// insight(): wraps a chart with an auto-insight bullet (leitura estratégica do gráfico)
function insight(chartHtml, insightText, tone) {

  return '<div class="chart-wrap" style="margin-bottom:.75rem">'
    +'<div style="padding:.25rem 0 .5rem">'+chartHtml+'</div>'
    +(insightText ? '<div style="margin-top:.25rem;padding:.5rem .75rem;border-left:3px solid '+borderColor+';background:var(--surface);border-radius:3px;font-size:.75rem;color:var(--text-secondary);line-height:1.45"><strong style="color:'+borderColor+';font-size:.6875rem;text-transform:uppercase;letter-spacing:.08em;display:block;margin-bottom:.15rem">Leitura</strong>'+E(insightText)+'</div>' : '')
    +'</div>';

// chartTitle: subtítulo de gráfico
function chartTitle(t) {
  return '<div style="font-size:.6875rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);margin-bottom:.375rem">'+E(t)+'</div>';
}

// BAR HORIZONTAL: comparar valores lado a lado
// items: [{label, value, tone, subtext}]
function chartHBar(items, opts) {
  opts = opts || {};
  if (!items?.length) return '';
  const max = opts.max || Math.max(...items.map(i=>i.value||0));
  if (!max) return '';
  const fmt = opts.fmt || (v=>v);
  const lw = opts.labelWidth || 120;
  return (opts.title?chartTitle(opts.title):'')
    +'<div style="display:flex;flex-direction:column;gap:.375rem">'+items.map(it=>{
      const pct = ((it.value||0)/max*100).toFixed(1);
      const col = chartColor(it.tone||'blue');
      return '<div style="display:grid;grid-template-columns:'+lw+'px 1fr 70px;gap:.5rem;align-items:center">'
        +'<div style="font-size:.75rem;color:var(--text-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+E(it.label)+'">'+E(it.label)+'</div>'
        +'<div style="height:18px;background:var(--surface);border-radius:3px;overflow:hidden;position:relative">'
        +'<div style="height:100%;width:'+pct+'%;background:'+col+';border-radius:3px;opacity:.85"></div>'
        +(it.subtext?'<div style="position:absolute;top:50%;transform:translateY(-50%);left:8px;font-size:.6875rem;color:white;font-weight:600;text-shadow:0 1px 2px rgba(0,0,0,.4)">'+E(it.subtext)+'</div>':'')
        +'</div>'
        +'<div style="font-size:.75rem;font-weight:700;color:'+col+';text-align:right">'+E(String(fmt(it.value)))+'</div>'
        +'</div>';
    }).join('')+'</div>';
}

// DONUT: distribuição percentual
// slices: [{label, value, tone}]
function chartDonut(slices, opts) {
  opts = opts || {};
  if (!slices?.length) return '';
  const total = slices.reduce((s,x)=>s+(x.value||0),0);
  if (!total) return '';
  const size = opts.size || 160;
  const cx = size/2, cy = size/2, r = size*0.4, ir = size*0.26;
  let angle = -Math.PI/2;
  const paths = slices.map(s=>{
    const frac = (s.value||0)/total;
    const a2 = angle + frac*Math.PI*2;
    const large = frac > 0.5 ? 1 : 0;
    const x1 = cx+r*Math.cos(angle), y1 = cy+r*Math.sin(angle);
    const x2 = cx+r*Math.cos(a2),   y2 = cy+r*Math.sin(a2);
    const x3 = cx+ir*Math.cos(a2),  y3 = cy+ir*Math.sin(a2);
    const x4 = cx+ir*Math.cos(angle), y4 = cy+ir*Math.sin(angle);
    const d = 'M '+x1+' '+y1+' A '+r+' '+r+' 0 '+large+' 1 '+x2+' '+y2+' L '+x3+' '+y3+' A '+ir+' '+ir+' 0 '+large+' 0 '+x4+' '+y4+' Z';
    angle = a2;
    return '<path d="'+d+'" fill="'+chartColor(s.tone||'blue')+'" opacity=".85"><title>'+E(s.label)+': '+(frac*100).toFixed(1)+'%</title></path>';
  }).join('');
  const legend = slices.map(s=>{
    const pct = ((s.value||0)/total*100).toFixed(1);
    return '<div style="display:flex;align-items:center;gap:.375rem;font-size:.75rem;margin-bottom:.2rem">'
      +'<div style="width:10px;height:10px;background:'+chartColor(s.tone||'blue')+';border-radius:2px;flex-shrink:0"></div>'
      +'<div style="flex:1;color:var(--text-secondary)">'+E(s.label)+'</div>'
      +'<div style="font-weight:700;color:var(--text-primary)">'+pct+'%</div>'
      +'</div>';
  }).join('');
  const centerLabel = opts.center || '';
  return (opts.title?chartTitle(opts.title):'')
    +'<div style="display:grid;grid-template-columns:'+size+'px 1fr;gap:1rem;align-items:center">'
    +'<svg viewBox="0 0 '+size+' '+size+'" width="'+size+'" height="'+size+'">'+paths
    +(centerLabel?'<text x="'+cx+'" y="'+(cy-4)+'" text-anchor="middle" font-size="14" font-weight="700" fill="'+CX.text+'">'+E(centerLabel.split('|')[0])+'</text>'
      +'<text x="'+cx+'" y="'+(cy+12)+'" text-anchor="middle" font-size="9" fill="'+CX.muted+'" text-transform="uppercase">'+E(centerLabel.split('|')[1]||'')+'</text>':'')
    +'</svg>'
    +'<div>'+legend+'</div>'
    +'</div>';
}

// GAUGE: métrica vs benchmark (semicírculo)
// value: atual, benchmark: meta/média, max: teto da escala
function chartGauge(value, benchmark, max, opts) {
  opts = opts || {};
  if (value == null || max == null) return '';
  const w = opts.size || 220, h = w*0.72;
  const cx = w/2, cy = h*0.78, r = w*0.40;
  const pct = Math.min(1, Math.max(0, value/max));
  const benchPct = benchmark!=null ? Math.min(1, Math.max(0, benchmark/max)) : null;
  // SVG Y-down: ângulo cresce no sentido horário visual.
  // Para gauge superior, vamos de π (LEFT, 9h) até 2π (RIGHT, 3h), passando por 3π/2 (TOP, 12h).
  const angleStart = Math.PI, angleEnd = 2 * Math.PI;
  const valAngle = angleStart + (angleEnd-angleStart)*pct;
  // Inverted logic: for CPL/CPA lower is better
  const invert = opts.invert;
  const isGood = invert ? (benchmark!=null && value <= benchmark) : (benchmark!=null && value >= benchmark);
  const tone = isGood ? 'green' : (benchmark!=null ? 'red' : 'blue');
  const col = chartColor(tone);

  const arcPath = (a1, a2, rad) => {
    const x1 = cx+rad*Math.cos(a1), y1 = cy+rad*Math.sin(a1);
    const x2 = cx+rad*Math.cos(a2), y2 = cy+rad*Math.sin(a2);
    const delta = Math.abs(a2-a1);
    const large = delta >= Math.PI - 0.0001 ? 1 : 0;
    // a2 > a1 = ângulo crescente = horário visual em SVG = sweep=1 (passa pelo TOP indo de LEFT a RIGHT via 3π/2)
    const sweep = a2 > a1 ? 1 : 0;
    return 'M '+x1+' '+y1+' A '+rad+' '+rad+' 0 '+large+' '+sweep+' '+x2+' '+y2;
  };
  const bench = benchPct != null ? angleStart + (angleEnd-angleStart)*benchPct : null;
  const benchX = bench != null ? cx+r*Math.cos(bench) : null;
  const benchY = bench != null ? cy+r*Math.sin(bench) : null;
  const benchXi = bench != null ? cx+(r-10)*Math.cos(bench) : null;
  const benchYi = bench != null ? cy+(r-10)*Math.sin(bench) : null;

  const fmt = opts.fmt || (v=>v);
  return (opts.title?chartTitle(opts.title):'')
    +'<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'" style="max-width:'+w+'px">'
    +'<path d="'+arcPath(angleStart, angleEnd, r)+'" fill="none" stroke="'+CX.line+'" stroke-width="10" stroke-linecap="round"/>'
    +'<path d="'+arcPath(angleStart, valAngle, r)+'" fill="none" stroke="'+col+'" stroke-width="10" stroke-linecap="round" opacity=".9"/>'
    +(bench != null ? '<line x1="'+benchXi+'" y1="'+benchYi+'" x2="'+benchX+'" y2="'+benchY+'" stroke="'+CX.text+'" stroke-width="2"/><circle cx="'+benchX+'" cy="'+benchY+'" r="4" fill="'+CX.text+'"/>' : '')
    +'<text x="'+cx+'" y="'+(cy-28)+'" text-anchor="middle" font-size="9" fill="'+CX.muted+'" text-transform="uppercase" letter-spacing=".05em">'+E(opts.metricLabel||'Atual')+'</text>'
    +'<text x="'+cx+'" y="'+(cy-8)+'" text-anchor="middle" font-size="22" font-weight="800" fill="'+col+'">'+E(String(fmt(value)))+'</text>'
    +'<text x="'+(cx-r+4)+'" y="'+(cy+12)+'" text-anchor="start" font-size="8" fill="'+CX.muted+'">0</text>'
    +'<text x="'+(cx+r-4)+'" y="'+(cy+12)+'" text-anchor="end" font-size="8" fill="'+CX.muted+'">'+E(String(fmt(max)))+'</text>'
    +(benchmark != null ? '<text x="'+cx+'" y="'+(cy+28)+'" text-anchor="middle" font-size="10" fill="'+CX.muted+'">Benchmark setor: '+E(String(fmt(benchmark)))+'</text>':'')
    +'</svg>';
}

// FUNNEL: estágios com conversão entre níveis
// stages: [{label, value, tone, subtext}]
function chartFunnel(stages) {
  if (!stages?.length) return '';
  const max = stages[0].value || Math.max(...stages.map(s=>s.value||0));
  if (!max) return '';
  return '<div style="display:flex;flex-direction:column;gap:.25rem">'+stages.map((s,i)=>{
    const pct = ((s.value||0)/max*100);
    const col = chartColor(s.tone||'blue');
    const prev = i>0 ? stages[i-1].value : null;
    const drop = prev && prev > 0 ? (((prev - (s.value||0))/prev)*100).toFixed(0) : null;
    return (drop!==null ? '<div style="text-align:center;font-size:.625rem;color:'+CX.red+';margin:-.1rem 0;font-weight:700">↓ vaza '+drop+'%</div>' : '')
      +'<div style="display:grid;grid-template-columns:140px 1fr 80px;gap:.5rem;align-items:center">'
      +'<div style="font-size:.75rem;font-weight:600;color:var(--text-primary)" title="'+E(s.label)+'">'+E(s.label)+'</div>'
      +'<div style="height:28px;background:var(--surface);border-radius:3px;overflow:hidden;position:relative">'
      +'<div style="height:100%;width:'+pct.toFixed(1)+'%;background:'+col+';border-radius:3px;opacity:.85;min-width:20px"></div>'
      +'<div style="position:absolute;inset:0;display:flex;align-items:center;padding:0 .5rem;font-size:.6875rem;color:'+(pct>40?'white':'var(--text-primary)')+';font-weight:700;text-shadow:'+(pct>40?'0 1px 2px rgba(0,0,0,.4)':'none')+'">'+E(s.subtext||'')+'</div>'
      +'</div>'
      +'<div style="font-size:.8125rem;font-weight:700;text-align:right;color:'+col+'">'+(typeof s.value==='number'?N(s.value):E(String(s.value||'—')))+'</div>'
      +'</div>';
  }).join('')+'</div>';
}
